<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" lang="ja"><title id="title">Shiftでダッシュ！ 同じ1回でも遠くへ</title><desc id="desc">Shiftでダッシュ！ 同じ1回でも遠くへ。右キーで進む例：通常は4、ダッシュは6。左へ進むときも同じ速さ。破線が動く前。移動距離4と6は同じ縮尺で、6は4の1.5倍です。左Shift・右Shiftのどちらかが押されていればダッシュ。両方でも速さ6です。模式図：人物の大きさと移動距離は、別々に拡大しています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="850" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">Shiftでダッシュ！ 同じ1回でも遠くへ</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">右キーで進む例：通常は4、ダッシュは6。左へ進むときも同じ速さ。</text><rect id="normal" x="40" y="150" width="1120" height="240" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="dash" x="40" y="420" width="1120" height="240" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="75" y="200" font-size="29" text-anchor="start" fill="#20364b">Shiftを押さない</text><rect id="start-0" x="160" y="235" width="60" height="80" rx="0" fill="none" stroke="#28629e" stroke-width="3" stroke-dasharray="9 6"/><rect id="end-0" x="520" y="235" width="60" height="80" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="550" y="285" font-size="28" text-anchor="middle" fill="#20364b">人</text><path d="M230 275L500 275" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="370" y="338" font-size="30" text-anchor="middle" fill="#20364b">1回で右へ4</text><text x="900" y="287" font-size="38" text-anchor="middle" fill="#20364b">速さ 4</text><text x="75" y="470" font-size="29" text-anchor="start" fill="#20364b">どちらかのShiftを押す</text><rect id="start-1" x="160" y="505" width="60" height="80" rx="0" fill="none" stroke="#28629e" stroke-width="3" stroke-dasharray="9 6"/><rect id="end-1" x="700" y="505" width="60" height="80" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="730" y="555" font-size="28" text-anchor="middle" fill="#20364b">人</text><path d="M230 545L680 545" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="460" y="608" font-size="30" text-anchor="middle" fill="#20364b">1回で右へ6</text><text x="900" y="557" font-size="38" text-anchor="middle" fill="#20364b">速さ 6</text><text x="48" y="743" font-size="21" text-anchor="start" fill="#20364b">破線が動く前。移動距離4と6は同じ縮尺で、6は4の1.5倍です。</text><text x="48" y="779" font-size="21" text-anchor="start" fill="#20364b">左Shift・右Shiftのどちらかが押されていればダッシュ。両方でも速さ6です。</text><text x="48" y="815" font-size="21" text-anchor="start" fill="#20364b">模式図：人物の大きさと移動距離は、別々に拡大しています。</text></svg>