<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc" lang="ja"><title id="title">攻撃範囲は、中心どうしの距離で比べる</title><desc id="desc">攻撃範囲は、中心どうしの距離で比べる。タワーの中心は横400・縦250。攻撃できる距離は120までです。敵の中心が横520なら距離120で範囲内。横521なら距離121で範囲外です。模式図：円とタワーを拡大し、右の図は1だけ外にある差を強調しています。敵の端ではなく中心を比べます。範囲内かどうかをタワーが自動で調べます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="840" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">攻撃範囲は、中心どうしの距離で比べる</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">タワーの中心は横400・縦250。攻撃できる距離は120までです。</text><rect id="range-case-0" x="40" y="150" width="550" height="500" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="315" y="201" font-size="29" text-anchor="middle" fill="#20364b">境目と同じ</text><circle id="attack-range-0" cx="260" cy="390" r="150" fill="#e5f2df" stroke="#528852" stroke-width="3"/><rect id="tower-0" x="230" y="360" width="60" height="60" rx="0" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="260" y="326" font-size="26" text-anchor="middle" fill="#20364b">タワー</text><circle id="tower-center-0" cx="260" cy="390" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M260 390H410" fill="none" stroke="#34495e" stroke-width="3"/><circle id="enemy-0" cx="410" cy="390" r="24" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><circle id="enemy-center-0" cx="410" cy="390" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="410" y="346" font-size="24" text-anchor="middle" fill="#20364b">敵の中心</text><text x="410" y="293" font-size="23" text-anchor="middle" fill="#20364b">横520・縦250</text><text x="260" y="465" font-size="23" text-anchor="middle" fill="#20364b">横400・縦250</text><text x="260" y="507" font-size="27" text-anchor="middle" fill="#20364b">半径120</text><text x="360" y="432" font-size="25" text-anchor="middle" fill="#20364b">距離120</text><text x="315" y="600" font-size="28" text-anchor="middle" fill="#18734f">範囲内 → 攻撃できる</text><rect id="range-case-1" x="640" y="150" width="550" height="500" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="915" y="201" font-size="29" text-anchor="middle" fill="#20364b">1だけ外</text><circle id="attack-range-1" cx="860" cy="390" r="150" fill="#e5f2df" stroke="#528852" stroke-width="3"/><rect id="tower-1" x="830" y="360" width="60" height="60" rx="0" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="860" y="326" font-size="26" text-anchor="middle" fill="#20364b">タワー</text><circle id="tower-center-1" cx="860" cy="390" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M860 390H1035" fill="none" stroke="#34495e" stroke-width="3"/><circle id="enemy-1" cx="1035" cy="390" r="24" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><circle id="enemy-center-1" cx="1035" cy="390" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="1035" y="346" font-size="24" text-anchor="middle" fill="#20364b">敵の中心</text><text x="1035" y="293" font-size="23" text-anchor="middle" fill="#20364b">横521・縦250</text><text x="860" y="465" font-size="23" text-anchor="middle" fill="#20364b">横400・縦250</text><text x="860" y="507" font-size="27" text-anchor="middle" fill="#20364b">半径120</text><text x="960" y="432" font-size="25" text-anchor="middle" fill="#20364b">距離121</text><text x="915" y="600" font-size="28" text-anchor="middle" fill="#a64e16">範囲外 → 攻撃できない</text><text x="48" y="733" font-size="21" text-anchor="start" fill="#20364b">敵の中心が横520なら距離120で範囲内。横521なら距離121で範囲外です。</text><text x="48" y="769" font-size="21" text-anchor="start" fill="#20364b">模式図：円とタワーを拡大し、右の図は1だけ外にある差を強調しています。</text><text x="48" y="805" font-size="21" text-anchor="start" fill="#20364b">敵の端ではなく中心を比べます。範囲内かどうかをタワーが自動で調べます。</text></svg>