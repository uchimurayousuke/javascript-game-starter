<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="945" viewBox="0 0 1200 945" role="img" aria-labelledby="title desc" lang="ja"><title id="title">自分の番と敵の番を、交互に進める</title><desc id="desc">自分の番と敵の番を、交互に進める。自分の番は手札3枚・行動力2。カードを使うと行動力が減ります。行動力が0なら、もうカードを使えません。番を終えて敵の行動へ進みます。模式図：手札の内容は説明用です。次の番には手札と行動力を補充します。敵を倒したら勝利です。倒れた敵は行動しません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="945" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">自分の番と敵の番を、交互に進める</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">自分の番は手札3枚・行動力2。カードを使うと行動力が減ります。</text><rect id="my-turn" x="40" y="155" width="500" height="255" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="use-card" x="660" y="155" width="500" height="255" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="enemy-turn" x="660" y="510" width="500" height="255" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="next-turn" x="40" y="510" width="500" height="255" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="290" y="201" font-size="31" text-anchor="middle" fill="#20364b">自分の番</text><rect id="hand-0" x="85" y="240" width="76" height="100" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="123.0" y="300.0" font-size="26" text-anchor="middle" fill="#20364b">攻撃</text><rect id="hand-1" x="180" y="240" width="76" height="100" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="218.0" y="300.0" font-size="26" text-anchor="middle" fill="#20364b">防御</text><rect id="hand-2" x="275" y="240" width="76" height="100" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="313.0" y="300.0" font-size="26" text-anchor="middle" fill="#20364b">回復</text><text x="440" y="258" font-size="26" text-anchor="middle" fill="#20364b">行動力2</text><circle id="energy-415-298-0" cx="415" cy="298" r="17" fill="#ffe29a" stroke="#aa7a20" stroke-width="3"/><circle id="energy-415-298-1" cx="463" cy="298" r="17" fill="#ffe29a" stroke="#aa7a20" stroke-width="3"/><text x="230" y="383" font-size="26" text-anchor="middle" fill="#20364b">手札3枚</text><path d="M550 285L650 285" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="247" font-size="24" text-anchor="middle" fill="#20364b">使う</text><text x="910" y="201" font-size="30" text-anchor="middle" fill="#20364b">カードを1枚使う</text><rect id="used-card" x="705" y="247" width="95" height="100" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="752.5" y="307.0" font-size="26" text-anchor="middle" fill="#20364b">攻撃</text><text x="977" y="270" font-size="29" text-anchor="middle" fill="#20364b">行動力 2 → 1</text><circle id="energy-953-315-0" cx="953" cy="315" r="17" fill="#ffe29a" stroke="#aa7a20" stroke-width="3"/><circle id="energy-953-315-1" cx="1001" cy="315" r="17" fill="#edf0f3" stroke="#93a9bb" stroke-width="3"/><text x="910" y="383" font-size="26" text-anchor="middle" fill="#20364b">1枚につき行動力1を使う</text><path d="M910 422L910 497" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="1010" y="468" font-size="25" text-anchor="middle" fill="#20364b">番を終える</text><text x="910" y="557" font-size="31" text-anchor="middle" fill="#20364b">敵の番</text><rect id="enemy" x="735" y="591" width="110" height="104" rx="12" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><text x="790" y="655" font-size="39" text-anchor="middle" fill="#20364b">敵</text><text x="1000" y="641" font-size="28" text-anchor="middle" fill="#20364b">敵が行動する</text><text x="1000" y="687" font-size="28" text-anchor="middle" fill="#20364b">攻撃6</text><path d="M650 640L550 640" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="290" y="557" font-size="31" text-anchor="middle" fill="#20364b">次の自分の番</text><rect id="next-hand-0" x="85" y="590" width="76" height="100" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="123.0" y="650.0" font-size="26" text-anchor="middle" fill="#20364b">？</text><rect id="next-hand-1" x="180" y="590" width="76" height="100" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="218.0" y="650.0" font-size="26" text-anchor="middle" fill="#20364b">？</text><rect id="next-hand-2" x="275" y="590" width="76" height="100" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="313.0" y="650.0" font-size="26" text-anchor="middle" fill="#20364b">？</text><text x="440" y="616" font-size="26" text-anchor="middle" fill="#20364b">行動力2</text><circle id="energy-415-657-0" cx="415" cy="657" r="17" fill="#ffe29a" stroke="#aa7a20" stroke-width="3"/><circle id="energy-415-657-1" cx="463" cy="657" r="17" fill="#ffe29a" stroke="#aa7a20" stroke-width="3"/><text x="290" y="736" font-size="26" text-anchor="middle" fill="#20364b">手札3枚・行動力2に補充</text><path d="M290 498L290 423" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="122" y="468" font-size="22" text-anchor="middle" fill="#20364b">また自分が動く</text><text x="48" y="838" font-size="21" text-anchor="start" fill="#20364b">行動力が0なら、もうカードを使えません。番を終えて敵の行動へ進みます。</text><text x="48" y="874" font-size="21" text-anchor="start" fill="#20364b">模式図：手札の内容は説明用です。次の番には手札と行動力を補充します。</text><text x="48" y="910" font-size="21" text-anchor="start" fill="#20364b">敵を倒したら勝利です。倒れた敵は行動しません。</text></svg>