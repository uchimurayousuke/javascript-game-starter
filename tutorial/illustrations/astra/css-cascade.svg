<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc" lang="ja"><title id="title">CSSの適用順：同じ文字色への指定を比べる</title><desc id="desc">同じスタイルシート内の通常宣言の例。p class notice id scoreにはid指定redが勝ち、普通のpには同じ具体性で後のorangeが勝つ。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="960" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">CSSの適用順：同じ文字色への指定を比べる</text><text x="40" y="110" font-size="26" text-anchor="start" fill="#20364b">この図は、同じスタイルシート内の通常の指定を比べる例です。</text><rect x="40" y="145" width="1120" height="245" rx="12" fill="#edf3f8" stroke="#607a90" stroke-width="2"/><text x="65" y="195" font-size="29" text-anchor="start" fill="#20364b">1  p { color: blue; }</text><text x="65" y="247" font-size="29" text-anchor="start" fill="#20364b">2  .notice { color: green; }</text><text x="65" y="299" font-size="29" text-anchor="start" fill="#20364b">3  #score { color: red; }</text><text x="65" y="351" font-size="29" text-anchor="start" fill="#20364b">4  p { color: orange; }</text><text x="840" y="210" font-size="27" text-anchor="start" fill="#20364b">上から順に</text><text x="840" y="265" font-size="27" text-anchor="start" fill="#20364b">書いてある</text><path d="M950 290 L950 355" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="425" width="540" height="365" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><rect x="620" y="425" width="540" height="365" rx="12" fill="#fff5df" stroke="#607a90" stroke-width="2"/><text x="65" y="475" font-size="29" text-anchor="start" fill="#20364b">idとclassが付いたp</text><text x="65" y="525" font-size="26" text-anchor="start" fill="#20364b">id=&quot;score&quot; class=&quot;notice&quot;</text><text x="65" y="585" font-size="30" text-anchor="start" fill="#20364b">タグ ＜ class ＜ id</text><text x="65" y="645" font-size="28" text-anchor="start" fill="#20364b">#score の指定を採用</text><text x="65" y="725" font-size="34" text-anchor="start" fill="#a82f29">結果：赤（red）</text><text x="645" y="475" font-size="29" text-anchor="start" fill="#20364b">idもclassもないp</text><text x="645" y="535" font-size="27" text-anchor="start" fill="#20364b">1番と4番は同じ p の指定</text><text x="645" y="595" font-size="29" text-anchor="start" fill="#20364b">同じ具体性 → 後の4番</text><text x="645" y="655" font-size="28" text-anchor="start" fill="#20364b">p { color: orange; }</text><text x="645" y="725" font-size="29" text-anchor="start" fill="#8c4800">結果：オレンジ（orange）</text><text x="40" y="850" font-size="25" text-anchor="start" fill="#20364b">「後に書けばいつも勝つ」ではありません。先に指定の具体性を比べます。</text></svg>