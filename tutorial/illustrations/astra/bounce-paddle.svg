<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" lang="ja"><title id="title">下向きのボールが板に届いたら、はね返る</title><desc id="desc">下向きのボールが板に届いたら、はね返る。この例は横にも重なっているので、ボールの下と板の上に注目。板は左345・右455、上410・下424。幅110・高さ14。破線はボールを囲む四角。下向きで、四角どうしが重なることを確かめます。模式図：ボールと板を読みやすい大きさに拡大しています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="820" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">下向きのボールが板に届いたら、はね返る</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">この例は横にも重なっているので、ボールの下と板の上に注目。</text><rect id="paddle-panel" x="40" y="150" width="1120" height="490" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><circle id="ball" cx="360" cy="355" r="125" fill="#ffe29a" stroke="#936315" stroke-width="3"/><rect id="ball-bounds" x="235" y="230" width="250" height="250" rx="0" fill="none" stroke="#936315" stroke-width="3" stroke-dasharray="9 6"/><text x="360" y="284" font-size="25" text-anchor="middle" fill="#20364b">ボールの中心</text><text x="360" y="323" font-size="26" text-anchor="middle" fill="#20364b">横400・縦400</text><circle id="ball-center" cx="360" cy="355" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M360 364L360 470" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="375" y="412" font-size="23" text-anchor="start" fill="#20364b">半径10</text><rect id="paddle" x="160" y="480" width="440" height="68" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="380" y="523" font-size="30" text-anchor="middle" fill="#20364b">板　上は410</text><path d="M235 480H600" fill="none" stroke="#18734f" stroke-width="5"/><path d="M487 480 630 435H675" fill="none" stroke="#34495e" stroke-width="3"/><text x="690" y="440" font-size="30" text-anchor="start" fill="#20364b">ボールの下410</text><text x="690" y="493" font-size="30" text-anchor="start" fill="#20364b">＝ 板の上410</text><path d="M130 265L130 405" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="80" y="235" font-size="26" text-anchor="start" fill="#20364b">下向き</text><path d="M650 375L650 255" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="690" y="300" font-size="31" text-anchor="start" fill="#20364b">はね返って上へ！</text><text x="600" y="602" font-size="30" text-anchor="middle" fill="#20364b">400 ＋ 10 ＝ 410　同じ高さでもOK</text><text x="48" y="713" font-size="21" text-anchor="start" fill="#20364b">板は左345・右455、上410・下424。幅110・高さ14。</text><text x="48" y="749" font-size="21" text-anchor="start" fill="#20364b">破線はボールを囲む四角。下向きで、四角どうしが重なることを確かめます。</text><text x="48" y="785" font-size="21" text-anchor="start" fill="#20364b">模式図：ボールと板を読みやすい大きさに拡大しています。</text></svg>