<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc" lang="ja"><title id="title">文字の途中で押す？ 全部出てから押す？</title><desc id="desc">最初の文章こんにちはは5文字。100msごとに1文字で200ms後はこん。途中のSpaceでこんにちはを全部出し、もう一度Spaceを押すと次の文章気をつけての文字送りを始める。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="870" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">文字の途中で押す？ 全部出てから押す？</text><text x="40" y="110" font-size="26" text-anchor="start" fill="#20364b">文章0「こんにちは」→ 文章1「気をつけて」→ 文章2「またね」</text><rect x="40" y="155" width="1120" height="160" rx="12" fill="#edf3f8" stroke="#607a90" stroke-width="2"/><text x="65" y="205" font-size="28" text-anchor="start" fill="#20364b">最初の文章：文字の番号は0から4</text><rect x="680" y="190" width="70" height="80" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="715" y="245" font-size="32" text-anchor="middle" fill="#20364b">こ</text><text x="715" y="295" font-size="22" text-anchor="middle" fill="#20364b">0</text><rect x="765" y="190" width="70" height="80" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="800" y="245" font-size="32" text-anchor="middle" fill="#20364b">ん</text><text x="800" y="295" font-size="22" text-anchor="middle" fill="#20364b">1</text><rect x="850" y="190" width="70" height="80" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="885" y="245" font-size="32" text-anchor="middle" fill="#20364b">に</text><text x="885" y="295" font-size="22" text-anchor="middle" fill="#20364b">2</text><rect x="935" y="190" width="70" height="80" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="970" y="245" font-size="32" text-anchor="middle" fill="#20364b">ち</text><text x="970" y="295" font-size="22" text-anchor="middle" fill="#20364b">3</text><rect x="1020" y="190" width="70" height="80" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="1055" y="245" font-size="32" text-anchor="middle" fill="#20364b">は</text><text x="1055" y="295" font-size="22" text-anchor="middle" fill="#20364b">4</text><text x="65" y="265" font-size="29" text-anchor="start" fill="#20364b">1文字ごとの間隔：100ms</text><rect x="40" y="365" width="320" height="230" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="65" y="410" font-size="29" text-anchor="start" fill="#20364b">200ms後</text><text x="65" y="465" font-size="29" text-anchor="start" fill="#20364b">shown＝2</text><text x="200" y="545" font-size="42" text-anchor="middle" fill="#20364b">こん</text><rect x="440" y="365" width="320" height="230" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="465" y="410" font-size="29" text-anchor="start" fill="#20364b">途中でSpace</text><text x="465" y="465" font-size="29" text-anchor="start" fill="#20364b">shown＝5</text><text x="600" y="545" font-size="37" text-anchor="middle" fill="#20364b">こんにちは</text><rect x="840" y="365" width="320" height="230" rx="12" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="865" y="410" font-size="28" text-anchor="start" fill="#20364b">もう一度Space</text><text x="865" y="465" font-size="29" text-anchor="start" fill="#20364b">次の文章へ</text><text x="865" y="530" font-size="31" text-anchor="start" fill="#20364b">「気をつけて」</text><text x="865" y="575" font-size="25" text-anchor="start" fill="#20364b">の文字送りを開始</text><path d="M375 495 L425 495" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M775 495 L825 495" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="665" font-size="27" text-anchor="start" fill="#20364b">途中なら「今の文章を全部表示」。全部表示中なら「次の文章」。</text><text x="40" y="725" font-size="26" text-anchor="start" fill="#20364b">同じSpaceでも、文字が出そろったかどうかで働きが変わります。</text><text x="40" y="810" font-size="24" text-anchor="start" fill="#20364b">Rは文章0・表示0文字へ。右の箱は次に表示する文章の説明です。</text></svg>