<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" lang="ja"><title id="title">ジャンプの最初は「上へ10.5」</title><desc id="desc">ジャンプの最初は「上へ10.5」。−11を設定した直後、重力＋0.5を足してから位置を動かします。縦は下がプラス。速度がマイナスなら上へ、プラスなら下へ進みます。落ちる速度は最大12。着地で速度0、地面にいるときだけジャンプできます。模式図：処理の順番を3場面に分けています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="820" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">ジャンプの最初は「上へ10.5」</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">−11を設定した直後、重力＋0.5を足してから位置を動かします。</text><rect id="jump-setting" x="40" y="155" width="340" height="420" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="gravity-add" x="430" y="155" width="340" height="420" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="first-move" x="820" y="155" width="340" height="420" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="210" y="206" font-size="27" text-anchor="middle" fill="#20364b">地面でジャンプ</text><rect id="player-ready" x="150" y="290" width="120" height="160" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="210" y="347" font-size="30" text-anchor="middle" fill="#20364b">人</text><text x="210" y="395" font-size="38" text-anchor="middle" fill="#20364b">−11</text><path d="M85 450H335" fill="none" stroke="#528852" stroke-width="5"/><text x="210" y="512" font-size="24" text-anchor="middle" fill="#20364b">上向きの速度を設定</text><path d="M385 350L420 350" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="206" font-size="27" text-anchor="middle" fill="#20364b">同じ更新で重力</text><path d="M600 255L600 335" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="388" font-size="40" text-anchor="middle" fill="#20364b">＋0.5</text><text x="600" y="450" font-size="29" text-anchor="middle" fill="#20364b">−11 ＋ 0.5</text><text x="600" y="500" font-size="35" text-anchor="middle" fill="#20364b">＝ −10.5</text><path d="M775 350L810 350" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="990" y="206" font-size="28" text-anchor="middle" fill="#20364b">最初の移動</text><rect id="player-rising" x="930" y="275" width="120" height="160" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="990" y="333" font-size="30" text-anchor="middle" fill="#20364b">人</text><text x="990" y="385" font-size="29" text-anchor="middle" fill="#20364b">−10.5</text><path d="M880 450L880 280" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="990" y="491" font-size="28" text-anchor="middle" fill="#20364b">上へ10.5進む</text><text x="600" y="639" font-size="28" text-anchor="middle" fill="#20364b">その後も毎回＋0.5 → 上昇がゆっくりに → 0 → 落下</text><text x="48" y="713" font-size="21" text-anchor="start" fill="#20364b">縦は下がプラス。速度がマイナスなら上へ、プラスなら下へ進みます。</text><text x="48" y="749" font-size="21" text-anchor="start" fill="#20364b">落ちる速度は最大12。着地で速度0、地面にいるときだけジャンプできます。</text><text x="48" y="785" font-size="21" text-anchor="start" fill="#20364b">模式図：処理の順番を3場面に分けています。</text></svg>