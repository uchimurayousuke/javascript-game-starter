<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc" lang="ja"><title id="title">的のふちも当たり。1だけ外なら外れ</title><desc id="desc">的のふちも当たり。1だけ外なら外れ。中心からクリックした点までの距離を、半径35と比べよう。クリックの縦はどちらも225。距離35は半径と同じなので当たりです。模式図：的を拡大し、右の図の「1だけ外」を大きく強調しています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="750" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">的のふちも当たり。1だけ外なら外れ</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">中心からクリックした点までの距離を、半径35と比べよう。</text><rect id="case-35" x="40" y="150" width="560" height="480" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><circle id="target-35" cx="255" cy="350" r="135" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><text x="255" y="270" font-size="25" text-anchor="middle" fill="#20364b">的の中心</text><text x="255" y="307" font-size="23" text-anchor="middle" fill="#20364b">横400・縦225</text><circle id="center-35" cx="255" cy="350" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M255 350H390" fill="none" stroke="#34495e" stroke-width="3"/><circle id="click-35" cx="390" cy="350" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="315" y="390" font-size="27" text-anchor="middle" fill="#20364b">距離35</text><text x="255" y="445" font-size="28" text-anchor="middle" fill="#20364b">半径35</text><path d="M390 350H510V200H420" fill="none" stroke="#34495e" stroke-width="3"/><text x="420" y="238" font-size="24" text-anchor="middle" fill="#20364b">クリック</text><text x="420" y="275" font-size="26" text-anchor="middle" fill="#20364b">横435</text><text x="320" y="544" font-size="30" text-anchor="middle" fill="#20364b">ふちの上 → 当たり！</text><text x="320" y="590" font-size="26" text-anchor="middle" fill="#20364b">35 ≤ 35 は ○</text><rect id="case-36" x="640" y="150" width="560" height="480" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><circle id="target-36" cx="855" cy="350" r="135" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><text x="855" y="270" font-size="25" text-anchor="middle" fill="#20364b">的の中心</text><text x="855" y="307" font-size="23" text-anchor="middle" fill="#20364b">横400・縦225</text><circle id="center-36" cx="855" cy="350" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M855 350H1012" fill="none" stroke="#34495e" stroke-width="3"/><circle id="click-36" cx="1012" cy="350" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="915" y="390" font-size="27" text-anchor="middle" fill="#20364b">距離36</text><text x="855" y="445" font-size="28" text-anchor="middle" fill="#20364b">半径35</text><path d="M1012 350H1110V200H1020" fill="none" stroke="#34495e" stroke-width="3"/><text x="1020" y="238" font-size="24" text-anchor="middle" fill="#20364b">クリック</text><text x="1020" y="275" font-size="26" text-anchor="middle" fill="#20364b">横436</text><text x="920" y="544" font-size="30" text-anchor="middle" fill="#20364b">ふちの外 → 外れ</text><text x="920" y="590" font-size="26" text-anchor="middle" fill="#20364b">36 ≤ 35 は ×</text><text x="48" y="679" font-size="21" text-anchor="start" fill="#20364b">クリックの縦はどちらも225。距離35は半径と同じなので当たりです。</text><text x="48" y="715" font-size="21" text-anchor="start" fill="#20364b">模式図：的を拡大し、右の図の「1だけ外」を大きく強調しています。</text></svg>