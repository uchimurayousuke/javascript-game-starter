<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" lang="ja"><title id="title">マスの射程：横の差と縦の差を足す</title><desc id="desc">タクティクスは列と行の差の絶対値を足して攻撃距離を求める。列1行3から列2行2は横1縦1で距離2。弓は射程2で届き、剣は射程1で届かない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="820" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#20364b">マスの射程：横の差と縦の差を足す</text><text x="40" y="105" font-size="25" text-anchor="start" fill="#20364b">タクティクス 発展1 ／ 弓の射程2を追加。基本3の剣は射程1です。</text><text x="60" y="200" font-size="23" text-anchor="middle" fill="#20364b">0</text><text x="122" y="145" font-size="23" text-anchor="middle" fill="#20364b">0</text><rect x="80" y="160" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="122" y="210" font-size="27" text-anchor="middle" fill="#20364b">4</text><text x="207" y="145" font-size="23" text-anchor="middle" fill="#20364b">1</text><rect x="165" y="160" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="207" y="210" font-size="27" text-anchor="middle" fill="#20364b">3</text><text x="292" y="145" font-size="23" text-anchor="middle" fill="#20364b">2</text><rect x="250" y="160" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="292" y="210" font-size="27" text-anchor="middle" fill="#20364b">4</text><text x="377" y="145" font-size="23" text-anchor="middle" fill="#20364b">3</text><rect x="335" y="160" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="377" y="210" font-size="27" text-anchor="middle" fill="#20364b">5</text><text x="462" y="145" font-size="23" text-anchor="middle" fill="#20364b">4</text><rect x="420" y="160" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="462" y="210" font-size="27" text-anchor="middle" fill="#20364b">6</text><text x="547" y="145" font-size="23" text-anchor="middle" fill="#20364b">5</text><rect x="505" y="160" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="547" y="210" font-size="27" text-anchor="middle" fill="#20364b">7</text><text x="60" y="285" font-size="23" text-anchor="middle" fill="#20364b">1</text><rect x="80" y="245" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="122" y="295" font-size="27" text-anchor="middle" fill="#20364b">3</text><rect x="165" y="245" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="207" y="295" font-size="27" text-anchor="middle" fill="#20364b">2</text><rect x="250" y="245" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="292" y="295" font-size="27" text-anchor="middle" fill="#20364b">3</text><rect x="335" y="245" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="377" y="295" font-size="27" text-anchor="middle" fill="#20364b">4</text><rect x="420" y="245" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="462" y="295" font-size="27" text-anchor="middle" fill="#20364b">5</text><rect x="505" y="245" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="547" y="295" font-size="27" text-anchor="middle" fill="#20364b">6</text><text x="60" y="370" font-size="23" text-anchor="middle" fill="#20364b">2</text><rect x="80" y="330" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="122" y="380" font-size="27" text-anchor="middle" fill="#20364b">2</text><rect x="165" y="330" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="207" y="380" font-size="27" text-anchor="middle" fill="#20364b">1</text><rect x="250" y="330" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="292" y="360" font-size="22" text-anchor="middle" fill="#20364b">敵</text><text x="292" y="399" font-size="27" text-anchor="middle" fill="#20364b">2</text><rect x="335" y="330" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="377" y="380" font-size="27" text-anchor="middle" fill="#20364b">3</text><rect x="420" y="330" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="462" y="380" font-size="27" text-anchor="middle" fill="#20364b">4</text><rect x="505" y="330" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="547" y="380" font-size="27" text-anchor="middle" fill="#20364b">5</text><text x="60" y="455" font-size="23" text-anchor="middle" fill="#20364b">3</text><rect x="80" y="415" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="122" y="465" font-size="27" text-anchor="middle" fill="#20364b">1</text><rect x="165" y="415" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="207" y="465" font-size="27" text-anchor="middle" fill="#20364b">弓</text><rect x="250" y="415" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="292" y="465" font-size="27" text-anchor="middle" fill="#20364b">1</text><rect x="335" y="415" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="377" y="465" font-size="27" text-anchor="middle" fill="#20364b">2</text><rect x="420" y="415" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="462" y="465" font-size="27" text-anchor="middle" fill="#20364b">3</text><rect x="505" y="415" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="547" y="465" font-size="27" text-anchor="middle" fill="#20364b">4</text><text x="60" y="540" font-size="23" text-anchor="middle" fill="#20364b">4</text><rect x="80" y="500" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="122" y="550" font-size="27" text-anchor="middle" fill="#20364b">2</text><rect x="165" y="500" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="207" y="550" font-size="27" text-anchor="middle" fill="#20364b">1</text><rect x="250" y="500" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="292" y="550" font-size="27" text-anchor="middle" fill="#20364b">2</text><rect x="335" y="500" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="377" y="550" font-size="27" text-anchor="middle" fill="#20364b">3</text><rect x="420" y="500" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="462" y="550" font-size="27" text-anchor="middle" fill="#20364b">4</text><rect x="505" y="500" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="547" y="550" font-size="27" text-anchor="middle" fill="#20364b">5</text><path d="M207 478 L324 478" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M324 478 L324 350" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="640" y="180" font-size="28" text-anchor="start" fill="#20364b">例：弓 (列1, 行3)</text><text x="640" y="230" font-size="25" text-anchor="start" fill="#20364b">敵が (列2, 行2) にいるとき</text><text x="640" y="300" font-size="27" text-anchor="start" fill="#20364b">横の差：|1−2|＝1</text><text x="640" y="350" font-size="27" text-anchor="start" fill="#20364b">縦の差：|3−2|＝1</text><text x="640" y="420" font-size="31" text-anchor="start" fill="#20364b">距離：1＋1＝2</text><text x="640" y="490" font-size="28" text-anchor="start" fill="#20364b">弓の射程2 → 届く</text><text x="640" y="540" font-size="27" text-anchor="start" fill="#20364b">剣の射程1 → 届かない</text><text x="40" y="640" font-size="25" text-anchor="start" fill="#20364b">マスの数字は、弓の位置からの距離。緑の数字1・2が射程内。</text><text x="40" y="690" font-size="25" text-anchor="start" fill="#20364b">斜め隣は「横1＋縦1」で距離2です。丸い範囲ではありません。</text><text x="40" y="740" font-size="23" text-anchor="start" fill="#20364b">矢印は距離の数え方です。攻撃前にその道を歩く必要はありません。</text><text x="40" y="790" font-size="22" text-anchor="start" fill="#20364b">発展1の盤面サイズ6×5と弓の初期位置を使用。敵の位置は説明用です。</text></svg>