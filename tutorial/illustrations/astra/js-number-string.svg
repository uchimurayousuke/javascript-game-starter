<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc" lang="ja"><title id="title">同じ「＋」でも、数は足す・文字はつなぐ</title><desc id="desc">numberは数値10、textは文字列10。number+1は数値11、text+1は文字列101。その他の出力はreadyがtrue、null、typeof missingが文字列undefined。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="960" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">同じ「＋」でも、数は足す・文字はつなぐ</text><rect x="40" y="145" width="540" height="140" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="62" y="187" font-size="26" text-anchor="start" fill="#20364b">const number = 10</text><text x="62" y="240" font-size="30" text-anchor="start" fill="#20364b">数値 10</text><rect x="620" y="145" width="540" height="140" rx="12" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="642" y="187" font-size="26" text-anchor="start" fill="#20364b">const text = &quot;10&quot;</text><text x="642" y="240" font-size="30" text-anchor="start" fill="#20364b">文字列 &quot;10&quot;</text><path d="M310 300 L310 345" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M890 300 L890 345" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="365" width="540" height="230" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="62" y="407" font-size="26" text-anchor="start" fill="#20364b">number + 1</text><text x="62" y="460" font-size="30" text-anchor="start" fill="#20364b">10 + 1 = 11</text><rect x="620" y="365" width="540" height="230" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="642" y="407" font-size="26" text-anchor="start" fill="#20364b">text + 1</text><text x="642" y="455" font-size="25" text-anchor="start" fill="#20364b">数値1を文字列の&quot;1&quot;にしてつなぐ</text><text x="642" y="510" font-size="30" text-anchor="start" fill="#20364b">&quot;10&quot; + &quot;1&quot; → &quot;101&quot;</text><text x="65" y="565" font-size="26" text-anchor="start" fill="#20364b">計算した結果：数値11</text><text x="645" y="565" font-size="25" text-anchor="start" fill="#20364b">文字をつないだ結果：文字列101</text><rect x="40" y="635" width="1120" height="225" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="65" y="680" font-size="29" text-anchor="start" fill="#20364b">同じコードの、ほかの出力</text><text x="65" y="735" font-size="29" text-anchor="start" fill="#20364b">ready → true</text><text x="410" y="735" font-size="29" text-anchor="start" fill="#20364b">null → null</text><text x="765" y="735" font-size="27" text-anchor="start" fill="#20364b">typeof missing</text><text x="765" y="785" font-size="27" text-anchor="start" fill="#20364b">→ &quot;undefined&quot;</text><text x="65" y="825" font-size="26" text-anchor="start" fill="#20364b">let missing; は値をまだ代入していません。</text><text x="40" y="925" font-size="23" text-anchor="start" fill="#20364b">引用符は文字列の目印。Consoleの見た目だけでなく、値の型も確かめます。</text></svg>