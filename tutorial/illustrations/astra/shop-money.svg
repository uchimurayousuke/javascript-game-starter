<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" lang="ja"><title id="title">お金が動くと、パンの数も変わる</title><desc id="desc">お金が動くと、パンの数も変わる。説明用の例：パンは1個20で仕入れ、1個35で売ります。所持金は100 → 40 → 110。在庫は0 → 3 → 1と変わります。3個の仕入れで60を払い、2個の販売で70を受け取った例です。毎回2個売れるとは限りません。模式図：お財布の数字と、棚に残るパンの数を時間順に並べています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="900" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">お金が動くと、パンの数も変わる</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">説明用の例：パンは1個20で仕入れ、1個35で売ります。</text><rect id="shop-stage-0" x="40" y="155" width="350" height="565" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="215" y="205" font-size="27" text-anchor="middle" fill="#20364b">はじめ</text><rect id="wallet-0" x="80" y="240" width="250" height="135" rx="16" fill="#f0d5af" stroke="#946d3d" stroke-width="3"/><rect id="wallet-0-flap" x="298" y="285" width="52" height="48" rx="8" fill="#e7bd85" stroke="#946d3d" stroke-width="3"/><text x="200" y="283" font-size="25" text-anchor="middle" fill="#20364b">所持金</text><text x="200" y="342" font-size="46" text-anchor="middle" fill="#20364b">100</text><text x="215" y="432" font-size="26" text-anchor="middle" fill="#20364b">ここからスタート</text><text x="215" y="491" font-size="30" text-anchor="middle" fill="#20364b">在庫 0個</text><path d="M80 581H350" fill="none" stroke="#946d3d" stroke-width="6"/><text x="215" y="557" font-size="24" text-anchor="middle" fill="#20364b">まだパンはない</text><text x="215" y="657" font-size="26" text-anchor="middle" fill="#20364b">所持金100・在庫0</text><path d="M396 308L426 308" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="shop-stage-1" x="435" y="155" width="350" height="565" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="610" y="205" font-size="27" text-anchor="middle" fill="#20364b">パンを3個仕入れる</text><rect id="wallet-1" x="475" y="240" width="250" height="135" rx="16" fill="#f0d5af" stroke="#946d3d" stroke-width="3"/><rect id="wallet-1-flap" x="693" y="285" width="52" height="48" rx="8" fill="#e7bd85" stroke="#946d3d" stroke-width="3"/><text x="595" y="283" font-size="25" text-anchor="middle" fill="#20364b">所持金</text><text x="595" y="342" font-size="46" text-anchor="middle" fill="#20364b">40</text><text x="610" y="432" font-size="26" text-anchor="middle" fill="#20364b">支出60（20 × 3）</text><text x="610" y="491" font-size="30" text-anchor="middle" fill="#20364b">在庫 3個</text><path d="M475 581H745" fill="none" stroke="#946d3d" stroke-width="6"/><g id="stock-1-0"><path d="M490 549 Q490 525 512 525 H533 Q555 525 555 549 V579 H490 Z" fill="#f4ce88" stroke="#936315" stroke-width="3"/><text x="522.5" y="563" font-size="21" text-anchor="middle" fill="#20364b">パン</text></g><g id="stock-1-1"><path d="M575 549 Q575 525 597 525 H618 Q640 525 640 549 V579 H575 Z" fill="#f4ce88" stroke="#936315" stroke-width="3"/><text x="607.5" y="563" font-size="21" text-anchor="middle" fill="#20364b">パン</text></g><g id="stock-1-2"><path d="M660 549 Q660 525 682 525 H703 Q725 525 725 549 V579 H660 Z" fill="#f4ce88" stroke="#936315" stroke-width="3"/><text x="692.5" y="563" font-size="21" text-anchor="middle" fill="#20364b">パン</text></g><text x="610" y="657" font-size="26" text-anchor="middle" fill="#20364b">所持金40・在庫3</text><path d="M791 308L821 308" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="shop-stage-2" x="830" y="155" width="350" height="565" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="1005" y="205" font-size="27" text-anchor="middle" fill="#20364b">パンが2個売れる</text><rect id="wallet-2" x="870" y="240" width="250" height="135" rx="16" fill="#f0d5af" stroke="#946d3d" stroke-width="3"/><rect id="wallet-2-flap" x="1088" y="285" width="52" height="48" rx="8" fill="#e7bd85" stroke="#946d3d" stroke-width="3"/><text x="990" y="283" font-size="25" text-anchor="middle" fill="#20364b">所持金</text><text x="990" y="342" font-size="46" text-anchor="middle" fill="#20364b">110</text><text x="1005" y="432" font-size="26" text-anchor="middle" fill="#20364b">収入70（35 × 2）</text><text x="1005" y="491" font-size="30" text-anchor="middle" fill="#20364b">在庫 1個</text><path d="M870 581H1140" fill="none" stroke="#946d3d" stroke-width="6"/><g id="stock-2-0"><path d="M885 549 Q885 525 907 525 H928 Q950 525 950 549 V579 H885 Z" fill="#f4ce88" stroke="#936315" stroke-width="3"/><text x="917.5" y="563" font-size="21" text-anchor="middle" fill="#20364b">パン</text></g><text x="1005" y="657" font-size="26" text-anchor="middle" fill="#20364b">所持金110・在庫1</text><text x="48" y="793" font-size="21" text-anchor="start" fill="#20364b">所持金は100 → 40 → 110。在庫は0 → 3 → 1と変わります。</text><text x="48" y="829" font-size="21" text-anchor="start" fill="#20364b">3個の仕入れで60を払い、2個の販売で70を受け取った例です。毎回2個売れるとは限りません。</text><text x="48" y="865" font-size="21" text-anchor="start" fill="#20364b">模式図：お財布の数字と、棚に残るパンの数を時間順に並べています。</text></svg>