<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc" lang="ja"><title id="title">相対パス：HTMLからファイルを探す</title><desc id="desc">index.htmlと同じフォルダーにstyle.cssとscript.jsがある。assets/coin.pngはassetsの中。hrefとsrcに書いた名前がフォルダー構成と対応する。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="880" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">相対パス：HTMLからファイルを探す</text><rect x="40" y="145" width="460" height="600" rx="12" fill="#edf3f8" stroke="#607a90" stroke-width="2"/><text x="65" y="195" font-size="30" text-anchor="start" fill="#20364b">作業フォルダー</text><rect x="80" y="225" width="370" height="75" rx="12" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="100" y="274" font-size="30" text-anchor="start" fill="#20364b">index.html</text><text x="100" y="360" font-size="30" text-anchor="start" fill="#20364b">style.css</text><text x="100" y="445" font-size="30" text-anchor="start" fill="#20364b">script.js</text><rect x="80" y="490" width="370" height="210" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="100" y="535" font-size="28" text-anchor="start" fill="#20364b">assets フォルダー</text><text x="140" y="620" font-size="30" text-anchor="start" fill="#20364b">coin.png</text><text x="555" y="195" font-size="29" text-anchor="start" fill="#20364b">index.htmlに書く場所</text><rect x="550" y="225" width="610" height="125" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="575" y="265" font-size="26" text-anchor="start" fill="#20364b">link の href</text><text x="575" y="315" font-size="31" text-anchor="start" fill="#20364b">&quot;style.css&quot;</text><path d="M550 310 L470 350" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="550" y="390" width="610" height="125" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="575" y="430" font-size="26" text-anchor="start" fill="#20364b">script の src</text><text x="575" y="480" font-size="31" text-anchor="start" fill="#20364b">&quot;script.js&quot;</text><path d="M550 470 L470 440" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="550" y="555" width="610" height="125" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="575" y="595" font-size="26" text-anchor="start" fill="#20364b">img の src</text><text x="575" y="645" font-size="31" text-anchor="start" fill="#20364b">&quot;assets/coin.png&quot;</text><path d="M550 635 L470 615" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="795" font-size="29" text-anchor="start" fill="#20364b">assets / coin.png ＝ assetsへ入る → coin.pngを探す</text><text x="40" y="845" font-size="23" text-anchor="start" fill="#20364b">図はフォルダーの例。href・srcの文字と、実際の名前・拡張子をそろえます。</text></svg>