<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1290" viewBox="0 0 1200 1290" role="img" aria-labelledby="title desc" lang="ja"><title id="title">近い敵へ弾を飛ばす。斜め移動も速さをそろえる</title><desc id="desc">プレイヤー400,225、最も近い敵の例520,225。差120,0、距離120を使って方向1,0へ弾を毎秒300pxで飛ばす。別の移動の説明では斜め入力1,1を√2で割って約0.707,0.707にし、各成分約113.1px毎秒、全体の速さ160px毎秒にそろえる。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1F3D5B"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="1290" rx="10" fill="#FFF8E8" stroke="#1F3D5B" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#1F3D5B">近い敵へ弾を飛ばす。斜め移動も速さをそろえる</text><text x="40" y="115" font-size="29" text-anchor="start" fill="#1F3D5B">① 弾の方向：最も近い敵が (520,225) にいる例</text><rect x="40" y="155" width="1120" height="420" rx="10" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><circle cx="205" cy="285" r="60" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="3"/><text x="205" y="265" font-size="29" text-anchor="middle" fill="#1F3D5B">自分</text><text x="205" y="310" font-size="24" text-anchor="middle" fill="#1F3D5B">(400,225)</text><circle cx="945" cy="285" r="56" fill="#FFD35A" stroke="#1F3D5B" stroke-width="3"/><text x="945" y="265" font-size="29" text-anchor="middle" fill="#1F3D5B">敵</text><text x="945" y="310" font-size="24" text-anchor="middle" fill="#1F3D5B">(520,225)</text><path d="M290 285 L860 285" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="570" y="245" font-size="31" text-anchor="middle" fill="#1F3D5B">右へ：方向 (1,0)</text><text x="570" y="350" font-size="30" text-anchor="middle" fill="#1F3D5B">弾の速さ：300px/秒</text><text x="70" y="420" font-size="28" text-anchor="start" fill="#1F3D5B">dx＝520−400＝120 ／ dy＝225−225＝0</text><text x="70" y="480" font-size="28" text-anchor="start" fill="#1F3D5B">距離120で割る → (120÷120, 0÷120)＝(1,0)</text><text x="70" y="540" font-size="28" text-anchor="start" fill="#1F3D5B">右方向へ、経過秒 × 300pxだけ進めます。</text><text x="40" y="635" font-size="29" text-anchor="start" fill="#1F3D5B">② プレイヤーの移動：右下の入力 (1,1) をそろえる</text><rect x="40" y="675" width="530" height="440" rx="10" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="2"/><rect x="610" y="675" width="550" height="440" rx="10" fill="#E7F0DF" stroke="#1F3D5B" stroke-width="2"/><text x="65" y="725" font-size="28" text-anchor="start" fill="#1F3D5B">そのまま160を掛けると</text><path d="M100 785 L260 785" fill="none" stroke="#1F3D5B" stroke-width="3" stroke-dasharray="7 6"/><path d="M260 785 L260 945" fill="none" stroke="#1F3D5B" stroke-width="3" stroke-dasharray="7 6"/><path d="M100 785 L260 945" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="770" font-size="24" text-anchor="middle" fill="#1F3D5B">横160</text><text x="280" y="875" font-size="24" text-anchor="start" fill="#1F3D5B">縦160</text><text x="65" y="1005" font-size="28" text-anchor="start" fill="#1F3D5B">全体は160×√2 ≒ 226.3</text><text x="65" y="1065" font-size="27" text-anchor="start" fill="#1F3D5B">斜めだけ速さが√2倍になる</text><text x="635" y="725" font-size="28" text-anchor="start" fill="#1F3D5B">まず長さ√2で割る</text><path d="M680 785 L793.1 785" fill="none" stroke="#1F3D5B" stroke-width="3" stroke-dasharray="7 6"/><path d="M793.1 785 L793.1 898.1" fill="none" stroke="#1F3D5B" stroke-width="3" stroke-dasharray="7 6"/><path d="M680 785 L793.1 898.1" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="745" y="770" font-size="23" text-anchor="middle" fill="#1F3D5B">横 約113.1</text><text x="815" y="850" font-size="23" text-anchor="start" fill="#1F3D5B">縦 約113.1</text><text x="635" y="1005" font-size="29" text-anchor="start" fill="#1F3D5B">方向は約 (0.707,0.707)</text><text x="635" y="1065" font-size="30" text-anchor="start" fill="#1F3D5B">全体の速さは160px/秒</text><text x="40" y="1170" font-size="25" text-anchor="start" fill="#1F3D5B">160 ÷ √2 ≒ 113.1。横と縦の成分を足すだけでは速さになりません。</text><text x="40" y="1220" font-size="28" text-anchor="start" fill="#1F3D5B">弾の300と、自分の移動の160は別の速さです。</text><text x="40" y="1270" font-size="22" text-anchor="start" fill="#1F3D5B">上段は模式図。下段の矢印は速度を同じ縮尺で比較。数値はpx/秒、小数は概数。</text></svg>