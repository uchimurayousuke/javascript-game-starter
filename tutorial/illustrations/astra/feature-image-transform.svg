<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="870" viewBox="0 0 1000 870" role="img" aria-labelledby="title desc" lang="ja"><title id="title">画像の変形：中心を固定して反転・回転</title><desc id="desc">画像の変形：中心を固定して反転・回転。基本3 ／ 画像の左上を中心から(-32,-32)にして描きます。3状態を別々に2倍表示。赤い丸は向きを追うための目印で、実際の画像にはありません。実コードの呼出順はtranslate → rotate → scale → drawImage。赤い十字は中心。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="870" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">画像の変形：中心を固定して反転・回転</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 画像の左上を中心から(-32,-32)にして描きます。</text><rect id="pose0" x="70" y="175" width="250" height="320" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="195" y="220" font-size="26" text-anchor="middle" fill="#20364b">元の向き</text><g transform="translate(195 340) rotate(0) scale(2 2)"><g transform="translate(-32 -32) scale(1)" ><rect x="22" y="46" width="10" height="9" rx="3" fill="#244d80"/><rect x="35" y="46" width="10" height="9" rx="3" fill="#244d80"/><rect x="12" y="33" width="8" height="12" rx="4" fill="#419ee4"/><rect x="44" y="33" width="8" height="12" rx="4" fill="#419ee4"/><rect x="20" y="31" width="24" height="19" rx="6" fill="#287bbd"/><path d="M28 34h8v7h-8z" fill="#ffcf64"/><rect x="17" y="9" width="30" height="25" rx="10" fill="#419ee4"/><rect x="21" y="15" width="22" height="15" rx="6" fill="#dff3ff"/><circle cx="27" cy="21" r="2" fill="#20364b"/><circle cx="37" cy="21" r="2" fill="#20364b"/><path d="M29 26Q32 28 35 26" fill="none" stroke="#20364b" stroke-width="1.5" stroke-linecap="round"/></g><rect id="edge0" x="-32" y="-32" width="64" height="64" rx="0" fill="none" stroke="#708391" stroke-width="3" stroke-dasharray="8 6"/><circle id="mark0" cx="-24" cy="-24" r="3" fill="#d14f37" stroke="#d14f37" stroke-width="3"/></g><path d="M186 340 L204 340 M195 331 L195 349" fill="none" stroke="#a02f42" stroke-width="3"/><text x="195" y="465" font-size="24" text-anchor="middle" fill="#20364b">中心は動かない</text><rect id="pose1" x="375" y="175" width="250" height="320" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="500" y="220" font-size="26" text-anchor="middle" fill="#20364b">元からFを1回</text><g transform="translate(500 340) rotate(0) scale(-2 2)"><g transform="translate(-32 -32) scale(1)" ><rect x="22" y="46" width="10" height="9" rx="3" fill="#244d80"/><rect x="35" y="46" width="10" height="9" rx="3" fill="#244d80"/><rect x="12" y="33" width="8" height="12" rx="4" fill="#419ee4"/><rect x="44" y="33" width="8" height="12" rx="4" fill="#419ee4"/><rect x="20" y="31" width="24" height="19" rx="6" fill="#287bbd"/><path d="M28 34h8v7h-8z" fill="#ffcf64"/><rect x="17" y="9" width="30" height="25" rx="10" fill="#419ee4"/><rect x="21" y="15" width="22" height="15" rx="6" fill="#dff3ff"/><circle cx="27" cy="21" r="2" fill="#20364b"/><circle cx="37" cy="21" r="2" fill="#20364b"/><path d="M29 26Q32 28 35 26" fill="none" stroke="#20364b" stroke-width="1.5" stroke-linecap="round"/></g><rect id="edge1" x="-32" y="-32" width="64" height="64" rx="0" fill="none" stroke="#708391" stroke-width="3" stroke-dasharray="8 6"/><circle id="mark1" cx="-24" cy="-24" r="3" fill="#d14f37" stroke="#d14f37" stroke-width="3"/></g><path d="M491 340 L509 340 M500 331 L500 349" fill="none" stroke="#a02f42" stroke-width="3"/><text x="500" y="465" font-size="24" text-anchor="middle" fill="#20364b">中心は動かない</text><rect id="pose2" x="680" y="175" width="250" height="320" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="805" y="220" font-size="26" text-anchor="middle" fill="#20364b">元からAを1回</text><g transform="translate(805 340) rotate(45) scale(2 2)"><g transform="translate(-32 -32) scale(1)" ><rect x="22" y="46" width="10" height="9" rx="3" fill="#244d80"/><rect x="35" y="46" width="10" height="9" rx="3" fill="#244d80"/><rect x="12" y="33" width="8" height="12" rx="4" fill="#419ee4"/><rect x="44" y="33" width="8" height="12" rx="4" fill="#419ee4"/><rect x="20" y="31" width="24" height="19" rx="6" fill="#287bbd"/><path d="M28 34h8v7h-8z" fill="#ffcf64"/><rect x="17" y="9" width="30" height="25" rx="10" fill="#419ee4"/><rect x="21" y="15" width="22" height="15" rx="6" fill="#dff3ff"/><circle cx="27" cy="21" r="2" fill="#20364b"/><circle cx="37" cy="21" r="2" fill="#20364b"/><path d="M29 26Q32 28 35 26" fill="none" stroke="#20364b" stroke-width="1.5" stroke-linecap="round"/></g><rect id="edge2" x="-32" y="-32" width="64" height="64" rx="0" fill="none" stroke="#708391" stroke-width="3" stroke-dasharray="8 6"/><circle id="mark2" cx="-24" cy="-24" r="3" fill="#d14f37" stroke="#d14f37" stroke-width="3"/></g><path d="M796 340 L814 340 M805 331 L805 349" fill="none" stroke="#a02f42" stroke-width="3"/><text x="805" y="465" font-size="24" text-anchor="middle" fill="#20364b">中心は動かない</text><text x="500" y="550" font-size="26" text-anchor="middle" fill="#20364b">3つとも基準の中心は (400,225)。Aは45°ずつ回転。</text><rect id="restore-card" x="90" y="595" width="820" height="125" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="500.0" y="640" font-size="29" text-anchor="middle" fill="#20364b">save → 中心へ移動 → 回転・反転 → 描画 → restore</text><text x="500.0" y="683" font-size="23" text-anchor="middle" fill="#20364b">restoreで元へ戻し、次の文字や図形に変形を残さない</text><text x="40" y="806" font-size="19" text-anchor="start" fill="#20364b">3状態を別々に2倍表示。赤い丸は向きを追うための目印で、実際の画像にはありません。</text><text x="40" y="838" font-size="19" text-anchor="start" fill="#20364b">実コードの呼出順はtranslate → rotate → scale → drawImage。赤い十字は中心。</text></svg>