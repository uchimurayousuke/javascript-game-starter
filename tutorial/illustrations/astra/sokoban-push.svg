<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="895" viewBox="0 0 1000 895" role="img" aria-labelledby="title desc" lang="ja"><title id="title">箱を押す前に、箱のもう1つ先を見る</title><desc id="desc">箱を押す前に、箱のもう1つ先を見る。人 → 箱 → その先、の順でマスを調べます。箱の先が床か目標なら押せます。壁や別の箱なら、人も箱も動きません。模式図：判定に関係する横3マスだけを拡大した別々の例です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="895" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">箱を押す前に、箱のもう1つ先を見る</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">人 → 箱 → その先、の順でマスを調べます。</text><text x="70" y="209" font-size="25" text-anchor="start" fill="#20364b">箱の先が床</text><rect id="case-0-0" x="340" y="185" width="90" height="90" rx="0" fill="#c9dff5" stroke="#7b91aa" stroke-width="3"/><text x="385.0" y="239.0" font-size="26" text-anchor="middle" fill="#20364b">人</text><rect id="case-0-1" x="440" y="185" width="90" height="90" rx="0" fill="#e7bd85" stroke="#7b91aa" stroke-width="3"/><text x="485.0" y="239.0" font-size="26" text-anchor="middle" fill="#20364b">箱</text><rect id="case-0-2" x="540" y="185" width="90" height="90" rx="0" fill="#f5f8f0" stroke="#7b91aa" stroke-width="3"/><text x="585.0" y="239.0" font-size="26" text-anchor="middle" fill="#20364b">床</text><path d="M655 230L720 230" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="850" y="241" font-size="32" text-anchor="middle" fill="#20364b">押せる</text><text x="490" y="322" font-size="26" text-anchor="middle" fill="#20364b">右へ押したい →</text><text x="70" y="414" font-size="25" text-anchor="start" fill="#20364b">箱の先が壁</text><rect id="case-1-0" x="340" y="390" width="90" height="90" rx="0" fill="#c9dff5" stroke="#7b91aa" stroke-width="3"/><text x="385.0" y="444.0" font-size="26" text-anchor="middle" fill="#20364b">人</text><rect id="case-1-1" x="440" y="390" width="90" height="90" rx="0" fill="#e7bd85" stroke="#7b91aa" stroke-width="3"/><text x="485.0" y="444.0" font-size="26" text-anchor="middle" fill="#20364b">箱</text><rect id="case-1-2" x="540" y="390" width="90" height="90" rx="0" fill="#d4dce5" stroke="#7b91aa" stroke-width="3"/><text x="585.0" y="444.0" font-size="26" text-anchor="middle" fill="#20364b">壁</text><path d="M655 435L720 435" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="850" y="446" font-size="32" text-anchor="middle" fill="#20364b">押せない</text><text x="490" y="527" font-size="26" text-anchor="middle" fill="#20364b">右へ押したい →</text><text x="70" y="619" font-size="25" text-anchor="start" fill="#20364b">箱の先にも箱</text><rect id="case-2-0" x="340" y="595" width="90" height="90" rx="0" fill="#c9dff5" stroke="#7b91aa" stroke-width="3"/><text x="385.0" y="649.0" font-size="26" text-anchor="middle" fill="#20364b">人</text><rect id="case-2-1" x="440" y="595" width="90" height="90" rx="0" fill="#e7bd85" stroke="#7b91aa" stroke-width="3"/><text x="485.0" y="649.0" font-size="26" text-anchor="middle" fill="#20364b">箱</text><rect id="case-2-2" x="540" y="595" width="90" height="90" rx="0" fill="#e7bd85" stroke="#7b91aa" stroke-width="3"/><text x="585.0" y="649.0" font-size="26" text-anchor="middle" fill="#20364b">箱</text><path d="M655 640L720 640" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="850" y="651" font-size="32" text-anchor="middle" fill="#20364b">押せない</text><text x="490" y="732" font-size="26" text-anchor="middle" fill="#20364b">右へ押したい →</text><text x="40" y="831" font-size="19" text-anchor="start" fill="#20364b">箱の先が床か目標なら押せます。壁や別の箱なら、人も箱も動きません。</text><text x="40" y="863" font-size="19" text-anchor="start" fill="#20364b">模式図：判定に関係する横3マスだけを拡大した別々の例です。</text></svg>