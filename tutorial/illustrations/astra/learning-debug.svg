<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc" lang="ja"><title id="title">エラー直し：予想と結果を比べよう</title><desc id="desc">エラー直し：予想と結果を比べよう。一度にたくさん変えず、1か所を直して、同じ操作で確かめます。100→110は「右矢印が効かない」練習の例。画面・Consoleの絵は模式化しています。動かないときも、画面の表示・エラー名・行番号・一時的なconsole.logが手がかりです。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="900" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">エラー直し：予想と結果を比べよう</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">一度にたくさん変えず、1か所を直して、同じ操作で確かめます。</text><circle id="step0" cx="100" cy="207" r="33" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="100" y="218" font-size="32" text-anchor="middle" fill="#20364b">1</text><rect id="d0" x="165" y="155" width="775" height="105" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="195" y="194" font-size="27" text-anchor="start" fill="#20364b">予想する</text><text x="195" y="235" font-size="23" text-anchor="start" fill="#20364b">右キーを押すと、10進むはず</text><path d="M560 265L560 275" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><circle id="thought" cx="835" cy="207" r="28" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="835" y="219" font-size="34" text-anchor="middle" fill="#20364b">？</text><circle id="step1" cx="100" cy="332" r="33" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="100" y="343" font-size="32" text-anchor="middle" fill="#20364b">2</text><rect id="d1" x="165" y="280" width="775" height="105" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="195" y="319" font-size="27" text-anchor="start" fill="#20364b">実行する</text><text x="195" y="360" font-size="23" text-anchor="start" fill="#20364b">ゲーム画面で右キーを1回押す</text><path d="M560 390L560 400" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="screen1" x="775" y="298" width="140" height="68" rx="5" fill="#fff" stroke="#708391" stroke-width="3"/><text x="845" y="343" font-size="30" text-anchor="middle" fill="#20364b">→</text><circle id="step2" cx="100" cy="457" r="33" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="100" y="468" font-size="32" text-anchor="middle" fill="#20364b">3</text><rect id="d2" x="165" y="405" width="775" height="105" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="195" y="444" font-size="27" text-anchor="start" fill="#20364b">画面やConsoleで確かめる</text><text x="195" y="485" font-size="23" text-anchor="start" fill="#20364b">期待した値と、実際の値を比べる</text><path d="M560 515L560 525" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="console" x="775" y="423" width="140" height="68" rx="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="845" y="467" font-size="24" text-anchor="middle" fill="#fff">x: 100</text><circle id="step3" cx="100" cy="582" r="33" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="100" y="593" font-size="32" text-anchor="middle" fill="#20364b">4</text><rect id="d3" x="165" y="530" width="775" height="105" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="195" y="569" font-size="27" text-anchor="start" fill="#20364b">1か所を直して保存する</text><text x="195" y="610" font-size="23" text-anchor="start" fill="#20364b">間違いがある場所を、しぼって直す</text><path d="M560 640L560 650" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M795 605 L860 552 L872 567 L808 619 Z" fill="none" stroke="#936315" stroke-width="4"/><circle id="step4" cx="100" cy="707" r="33" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="100" y="718" font-size="32" text-anchor="middle" fill="#20364b">5</text><rect id="d4" x="165" y="655" width="775" height="105" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="195" y="694" font-size="27" text-anchor="start" fill="#20364b">もう一度、同じ操作を試す</text><text x="195" y="735" font-size="23" text-anchor="start" fill="#20364b">保存したゲームを再読み込みする</text><rect id="screen4" x="775" y="673" width="140" height="68" rx="5" fill="#fff" stroke="#708391" stroke-width="3"/><text x="845" y="718" font-size="30" text-anchor="middle" fill="#20364b">110</text><text x="40" y="836" font-size="19" text-anchor="start" fill="#20364b">100→110は「右矢印が効かない」練習の例。画面・Consoleの絵は模式化しています。</text><text x="40" y="868" font-size="19" text-anchor="start" fill="#20364b">動かないときも、画面の表示・エラー名・行番号・一時的なconsole.logが手がかりです。</text></svg>