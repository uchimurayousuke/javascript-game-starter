<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="775" viewBox="0 0 1000 775" role="img" aria-labelledby="title desc" lang="ja"><title id="title">コインの端が画面の端に届いたら反転</title><desc id="desc">コインの端が画面の端に届いたら反転。中心が784から2進むと786。そこが右へ進める限界です。説明用の拡大図。コインの中心と、右端の位置を分けて見よう。コードは中心を786にそろえ、横速度を−2に変えます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="775" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">コインの端が画面の端に届いたら反転</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">中心が784から2進むと786。そこが右へ進める限界です。</text><rect id="phase-0" x="40" y="145" width="440" height="425" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="245" y="190" font-size="28" text-anchor="middle" fill="#20364b">右へ進む</text><path d="M357 250V480" fill="none" stroke="#687e90" stroke-width="9"/><text x="357" y="230" font-size="23" text-anchor="middle" fill="#20364b">端800</text><circle id="coin-0" cx="245" cy="355" r="98" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="245" y="310" font-size="24" text-anchor="middle" fill="#20364b">中心の横</text><text x="245" y="345" font-size="34" text-anchor="middle" fill="#20364b">784</text><circle id="center-0" cx="245" cy="355" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M252 355L337 355" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="287" y="406" font-size="21" text-anchor="middle" fill="#20364b">半径14</text><path d="M190 505L300 505" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="245" y="547" font-size="28" text-anchor="middle" fill="#20364b">横速度 ＋2</text><rect id="phase-1" x="520" y="145" width="440" height="425" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="725" y="190" font-size="28" text-anchor="middle" fill="#20364b">右端で反転</text><path d="M823 250V480" fill="none" stroke="#687e90" stroke-width="9"/><text x="823" y="230" font-size="23" text-anchor="middle" fill="#20364b">端800</text><circle id="coin-1" cx="725" cy="355" r="98" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="725" y="310" font-size="24" text-anchor="middle" fill="#20364b">中心の横</text><text x="725" y="345" font-size="34" text-anchor="middle" fill="#20364b">786</text><circle id="center-1" cx="725" cy="355" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M732 355L817 355" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="767" y="406" font-size="21" text-anchor="middle" fill="#20364b">半径14</text><path d="M780 505L670 505" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="725" y="547" font-size="28" text-anchor="middle" fill="#20364b">横速度 −2</text><text x="500" y="633" font-size="31" text-anchor="middle" fill="#20364b">中心786 ＋ 半径14 ＝ 右端800</text><text x="40" y="711" font-size="19" text-anchor="start" fill="#20364b">説明用の拡大図。コインの中心と、右端の位置を分けて見よう。</text><text x="40" y="743" font-size="19" text-anchor="start" fill="#20364b">コードは中心を786にそろえ、横速度を−2に変えます。</text></svg>