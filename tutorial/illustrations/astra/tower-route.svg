<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" lang="ja"><title id="title">敵は、目標の点を順番にたどる</title><desc id="desc">敵は、目標の点を順番にたどる。右へ進んで曲がり角に着いたら、次は上の点へ進みます。説明用の短い経路です。実際のゲームのコース全体とは形が異なります。模式図：同じ道の曲がる前と後を並べています。左右どちらも同じ縮尺です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="850" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">敵は、目標の点を順番にたどる</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">右へ進んで曲がり角に着いたら、次は上の点へ進みます。</text><rect id="route-case-0" x="40" y="150" width="550" height="490" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="315" y="201" font-size="26" text-anchor="middle" fill="#20364b">まず、曲がり角を目指す</text><path d="M140 500H380V260" fill="none" stroke="#d7e1e9" stroke-width="36"/><path d="M140 500H380V260" fill="none" stroke="#93a9bb" stroke-width="2" stroke-dasharray="8 6"/><circle id="route-0-point-0" cx="140" cy="500" r="12" fill="#fff" stroke="#687e90" stroke-width="3"/><circle id="route-0-point-1" cx="380" cy="500" r="12" fill="#fff" stroke="#687e90" stroke-width="3"/><circle id="route-0-point-2" cx="380" cy="260" r="12" fill="#fff" stroke="#687e90" stroke-width="3"/><circle id="target-0" cx="380" cy="500" r="19" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="140" y="555" font-size="24" text-anchor="middle" fill="#20364b">横100</text><text x="140" y="587" font-size="24" text-anchor="middle" fill="#20364b">縦300</text><text x="380" y="555" font-size="24" text-anchor="middle" fill="#20364b">横300</text><text x="380" y="587" font-size="24" text-anchor="middle" fill="#20364b">縦300</text><text x="380" y="240" font-size="24" text-anchor="middle" fill="#20364b">横300・縦100</text><path d="M180 500L260 500" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><circle id="enemy-before-turn" cx="300" cy="500" r="23" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><text x="300" y="509" font-size="24" text-anchor="middle" fill="#20364b">敵</text><text x="420" y="445" font-size="26" text-anchor="middle" fill="#20364b">目標</text><path d="M420 454L388 478" fill="none" stroke="#34495e" stroke-width="3"/><rect id="route-case-1" x="640" y="150" width="550" height="490" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="915" y="201" font-size="26" text-anchor="middle" fill="#20364b">着いたら、次の点を目指す</text><path d="M740 500H980V260" fill="none" stroke="#d7e1e9" stroke-width="36"/><path d="M740 500H980V260" fill="none" stroke="#93a9bb" stroke-width="2" stroke-dasharray="8 6"/><circle id="route-1-point-0" cx="740" cy="500" r="12" fill="#fff" stroke="#687e90" stroke-width="3"/><circle id="route-1-point-1" cx="980" cy="500" r="12" fill="#fff" stroke="#687e90" stroke-width="3"/><circle id="route-1-point-2" cx="980" cy="260" r="12" fill="#fff" stroke="#687e90" stroke-width="3"/><circle id="target-1" cx="980" cy="260" r="19" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="740" y="555" font-size="24" text-anchor="middle" fill="#20364b">横100</text><text x="740" y="587" font-size="24" text-anchor="middle" fill="#20364b">縦300</text><text x="980" y="555" font-size="24" text-anchor="middle" fill="#20364b">横300</text><text x="980" y="587" font-size="24" text-anchor="middle" fill="#20364b">縦300</text><text x="980" y="240" font-size="24" text-anchor="middle" fill="#20364b">横300・縦100</text><path d="M980 465L980 420" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><circle id="enemy-after-turn" cx="980" cy="370" r="23" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><text x="980" y="379" font-size="24" text-anchor="middle" fill="#20364b">敵</text><text x="1070" y="305" font-size="24" text-anchor="middle" fill="#20364b">次の目標</text><path d="M1001 270H1070V275" fill="none" stroke="#34495e" stroke-width="3"/><text x="600" y="701" font-size="29" text-anchor="middle" fill="#20364b">横100・縦300 → 横300・縦300 → 横300・縦100</text><text x="48" y="779" font-size="21" text-anchor="start" fill="#20364b">説明用の短い経路です。実際のゲームのコース全体とは形が異なります。</text><text x="48" y="815" font-size="21" text-anchor="start" fill="#20364b">模式図：同じ道の曲がる前と後を並べています。左右どちらも同じ縮尺です。</text></svg>