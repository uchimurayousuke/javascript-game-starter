<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">RPG：依頼からクリアまで</title><desc id="desc">RPG：依頼からクリアまで。基本5 ／ 相手の隣に立ち、その方向を向いて Space。順番を表した模式図です。位置は実装の列・行番号に対応。宝や扉の上に乗るのではなく、目の前のマスを調べます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">RPG：依頼からクリアまで</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本5 ／ 相手の隣に立ち、その方向を向いて Space。</text><rect id="q0" x="90" y="150" width="820" height="95" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="115" y="190" font-size="28" text-anchor="start" fill="#20364b">1 住人に話す</text><text x="875" y="190" font-size="23" text-anchor="end" fill="#20364b">列2・行1</text><text x="115" y="226" font-size="24" text-anchor="start" fill="#20364b">宝を探す依頼を受ける</text><path d="M500 248L500 272" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="q1" x="90" y="275" width="820" height="95" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="115" y="315" font-size="28" text-anchor="start" fill="#20364b">2 宝を調べる</text><text x="875" y="315" font-size="23" text-anchor="end" fill="#20364b">列5・行1</text><text x="115" y="351" font-size="24" text-anchor="start" fill="#20364b">依頼を受けてから取る</text><path d="M500 373L500 397" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="q2" x="90" y="400" width="820" height="95" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="115" y="440" font-size="28" text-anchor="start" fill="#20364b">3 住人に渡す</text><text x="875" y="440" font-size="23" text-anchor="end" fill="#20364b">列2・行1</text><text x="115" y="476" font-size="24" text-anchor="start" fill="#20364b">宝を渡すと鍵がもらえる</text><path d="M500 498L500 522" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="q3" x="90" y="525" width="820" height="95" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="115" y="565" font-size="28" text-anchor="start" fill="#20364b">4 扉を調べる</text><text x="875" y="565" font-size="23" text-anchor="end" fill="#20364b">列5・行3</text><text x="115" y="601" font-size="24" text-anchor="start" fill="#20364b">鍵を持っていればクリア</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">順番を表した模式図です。位置は実装の列・行番号に対応。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">宝や扉の上に乗るのではなく、目の前のマスを調べます。</text></svg>