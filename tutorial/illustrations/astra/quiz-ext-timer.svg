<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="805" viewBox="0 0 1000 805" role="img" aria-labelledby="title desc" lang="ja"><title id="title">1問に使える時間は10秒</title><desc id="desc">1問に使える時間は10秒。答えないまま0秒になったら、その問題は時間切れです。時間切れの後は回答できません。Enterで次へ進むと、新しく10秒が始まります。模式図：途中の秒数を省略。最後の問題の後は、次の問題ではなく結果へ進みます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="805" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">1問に使える時間は10秒</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">答えないまま0秒になったら、その問題は時間切れです。</text><rect id="time-10" x="60" y="170" width="350" height="365" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="235" y="220" font-size="25" text-anchor="middle" fill="#20364b">問題が出たとき</text><circle id="clock-10" cx="235" cy="363" r="100" fill="#eef5fb" stroke="#28629e" stroke-width="3"/><text x="235" y="350" font-size="27" text-anchor="middle" fill="#20364b">残り</text><text x="235" y="411" font-size="49" text-anchor="middle" fill="#20364b">10秒</text><rect id="time-0" x="590" y="170" width="350" height="365" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="765" y="220" font-size="25" text-anchor="middle" fill="#20364b">答える前に時間切れ</text><circle id="clock-0" cx="765" cy="363" r="100" fill="#eef5fb" stroke="#28629e" stroke-width="3"/><text x="765" y="350" font-size="27" text-anchor="middle" fill="#20364b">残り</text><text x="765" y="411" font-size="49" text-anchor="middle" fill="#20364b">0秒</text><path d="M425 350L575 350" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="300" font-size="27" text-anchor="middle" fill="#20364b">10秒</text><text x="765" y="593" font-size="28" text-anchor="middle" fill="#20364b">得点は増えない</text><text x="500" y="657" font-size="32" text-anchor="middle" fill="#20364b">Enterで次の問題へ</text><text x="40" y="741" font-size="19" text-anchor="start" fill="#20364b">時間切れの後は回答できません。Enterで次へ進むと、新しく10秒が始まります。</text><text x="40" y="773" font-size="19" text-anchor="start" fill="#20364b">模式図：途中の秒数を省略。最後の問題の後は、次の問題ではなく結果へ進みます。</text></svg>