<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc" lang="ja"><title id="title">入力した数と正解を比べて、ヒントを出す</title><desc id="desc">入力した数と正解を比べて、ヒントを出す。1〜20の数あて。ここでは説明のため正解12を見せています。8は12より小さいので「もっと大きい」。15は大きいので「もっと小さい」。12を入力すると正解です。実際のゲームでは、正解を隠して遊びます。模式図：3つの入力例を並べています。数直線の間隔は同じです。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="1020" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">入力した数と正解を比べて、ヒントを出す</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">1〜20の数あて。ここでは説明のため正解12を見せています。</text><rect id="guess-8" x="40" y="160" width="1120" height="220" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="input-8" x="80" y="210" width="150" height="100" rx="12" fill="#fff0be" stroke="#aa7a20" stroke-width="3"/><text x="155" y="245" font-size="23" text-anchor="middle" fill="#20364b">入力した数</text><text x="155" y="293" font-size="42" text-anchor="middle" fill="#20364b">8</text><path d="M320 263H1080" fill="none" stroke="#93a9bb" stroke-width="4"/><text x="320" y="303" font-size="24" text-anchor="middle" fill="#20364b">1</text><text x="1080" y="303" font-size="24" text-anchor="middle" fill="#20364b">20</text><rect id="answer-8" x="737" y="240" width="46" height="46" rx="0" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="760" y="272" font-size="24" text-anchor="middle" fill="#20364b">12</text><text x="760" y="217" font-size="23" text-anchor="middle" fill="#20364b">説明用の正解</text><circle id="guess-point-8" cx="600" cy="263" r="22" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="600" y="272" font-size="26" text-anchor="middle" fill="#20364b">8</text><path d="M600 230L720 230" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="348" font-size="34" text-anchor="middle" fill="#20364b">もっと大きい</text><rect id="guess-15" x="40" y="400" width="1120" height="220" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="input-15" x="80" y="450" width="150" height="100" rx="12" fill="#fff0be" stroke="#aa7a20" stroke-width="3"/><text x="155" y="485" font-size="23" text-anchor="middle" fill="#20364b">入力した数</text><text x="155" y="533" font-size="42" text-anchor="middle" fill="#20364b">15</text><path d="M320 503H1080" fill="none" stroke="#93a9bb" stroke-width="4"/><text x="320" y="543" font-size="24" text-anchor="middle" fill="#20364b">1</text><text x="1080" y="543" font-size="24" text-anchor="middle" fill="#20364b">20</text><rect id="answer-15" x="737" y="480" width="46" height="46" rx="0" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="760" y="512" font-size="24" text-anchor="middle" fill="#20364b">12</text><text x="760" y="457" font-size="23" text-anchor="middle" fill="#20364b">説明用の正解</text><circle id="guess-point-15" cx="880" cy="503" r="22" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="880" y="512" font-size="26" text-anchor="middle" fill="#20364b">15</text><path d="M880 470L800 470" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="700" y="588" font-size="34" text-anchor="middle" fill="#20364b">もっと小さい</text><rect id="guess-12" x="40" y="640" width="1120" height="220" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="input-12" x="80" y="690" width="150" height="100" rx="12" fill="#fff0be" stroke="#aa7a20" stroke-width="3"/><text x="155" y="725" font-size="23" text-anchor="middle" fill="#20364b">入力した数</text><text x="155" y="773" font-size="42" text-anchor="middle" fill="#20364b">12</text><path d="M320 743H1080" fill="none" stroke="#93a9bb" stroke-width="4"/><text x="320" y="783" font-size="24" text-anchor="middle" fill="#20364b">1</text><text x="1080" y="783" font-size="24" text-anchor="middle" fill="#20364b">20</text><rect id="answer-12" x="737" y="720" width="46" height="46" rx="0" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="760" y="752" font-size="24" text-anchor="middle" fill="#20364b">12</text><text x="760" y="697" font-size="23" text-anchor="middle" fill="#20364b">説明用の正解</text><text x="875" y="700" font-size="26" text-anchor="start" fill="#20364b">ぴったり！</text><text x="700" y="828" font-size="34" text-anchor="middle" fill="#18734f">正解！</text><text x="48" y="913" font-size="21" text-anchor="start" fill="#20364b">8は12より小さいので「もっと大きい」。15は大きいので「もっと小さい」。</text><text x="48" y="949" font-size="21" text-anchor="start" fill="#20364b">12を入力すると正解です。実際のゲームでは、正解を隠して遊びます。</text><text x="48" y="985" font-size="21" text-anchor="start" fill="#20364b">模式図：3つの入力例を並べています。数直線の間隔は同じです。</text></svg>