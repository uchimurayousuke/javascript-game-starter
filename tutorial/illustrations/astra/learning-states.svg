<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc" lang="ja"><title id="title">画面の切り替え：今の状態で操作が変わる</title><desc id="desc">画面の切り替え：今の状態で操作が変わる。組み合わせ 基本2 ／ 結果からは、再挑戦かメニューを選べます。画面と操作の模式図。コイン5個・×3個はクリアと終了の条件を表しています。Spaceで再挑戦すると得点0・残り3へ。Mでメニューへ戻り、Enterで開始します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="880" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">画面の切り替え：今の状態で操作が変わる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">組み合わせ 基本2 ／ 結果からは、再挑戦かメニューを選べます。</text><rect id="menu" x="90" y="170" width="300" height="170" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="240.0" y="215" font-size="29" text-anchor="middle" fill="#20364b">メニュー</text><text x="240.0" y="258" font-size="23" text-anchor="middle" fill="#20364b">menu</text><rect id="menu-button" x="160" y="285" width="160" height="35" rx="8" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="240" y="310" font-size="23" text-anchor="middle" fill="#20364b">Enter</text><rect id="playing" x="610" y="170" width="300" height="170" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="760.0" y="215" font-size="29" text-anchor="middle" fill="#20364b">ゲーム中</text><text x="760.0" y="258" font-size="23" text-anchor="middle" fill="#20364b">playing</text><circle id="coin-play" cx="760" cy="290" r="12" fill="#ffe29a" stroke="#936315" stroke-width="3"/><rect id="paddle-play" x="725" y="315" width="70" height="10" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><path d="M400 255L600 255" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="230" font-size="28" text-anchor="middle" fill="#20364b">Enter</text><rect id="results" x="70" y="490" width="860" height="250" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="500" y="525" font-size="25" text-anchor="middle" fill="#20364b">結果：どちらの画面でも</text><rect id="clear" x="120" y="545" width="320" height="145" rx="16" fill="#d4efde" stroke="#a9bdcf" stroke-width="3"/><text x="280.0" y="590" font-size="29" text-anchor="middle" fill="#20364b">クリア clear</text><text x="280.0" y="633" font-size="23" text-anchor="middle" fill="#20364b">コイン5枚</text><rect id="gameover" x="560" y="545" width="320" height="145" rx="16" fill="#ffe3d9" stroke="#a9bdcf" stroke-width="3"/><text x="720.0" y="590" font-size="29" text-anchor="middle" fill="#20364b">終了 gameover</text><text x="720.0" y="633" font-size="23" text-anchor="middle" fill="#20364b">ミス3回</text><circle id="coin0" cx="200" cy="665" r="11" fill="#ffe29a" stroke="#936315" stroke-width="3"/><circle id="coin1" cx="240" cy="665" r="11" fill="#ffe29a" stroke="#936315" stroke-width="3"/><circle id="coin2" cx="280" cy="665" r="11" fill="#ffe29a" stroke="#936315" stroke-width="3"/><circle id="coin3" cx="320" cy="665" r="11" fill="#ffe29a" stroke="#936315" stroke-width="3"/><circle id="coin4" cx="360" cy="665" r="11" fill="#ffe29a" stroke="#936315" stroke-width="3"/><circle id="miss0" cx="660" cy="665" r="13" fill="#fff" stroke="#b4593b" stroke-width="3"/><text x="660" y="672" font-size="20" text-anchor="middle" fill="#20364b">×</text><circle id="miss1" cx="720" cy="665" r="13" fill="#fff" stroke="#b4593b" stroke-width="3"/><text x="720" y="672" font-size="20" text-anchor="middle" fill="#20364b">×</text><circle id="miss2" cx="780" cy="665" r="13" fill="#fff" stroke="#b4593b" stroke-width="3"/><text x="780" y="672" font-size="20" text-anchor="middle" fill="#20364b">×</text><path d="M660 345 L660 380 L280 380 L280 540" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="310" y="440" font-size="26" text-anchor="start" fill="#20364b">5枚集める</text><path d="M810 345 L810 400 L720 400 L720 540" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="750" y="460" font-size="26" text-anchor="start" fill="#20364b">3回逃す</text><path d="M65 620 L35 620 L35 255 L85 255" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="m-label" x="15" y="420" width="40" height="45" rx="0" fill="#fffdf8" stroke="#fffdf8" stroke-width="3"/><text x="35" y="452" font-size="28" text-anchor="middle" fill="#20364b">M</text><path d="M935 620 L965 620 L965 255 L915 255" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="space-label" x="930" y="420" width="68" height="45" rx="0" fill="#fffdf8" stroke="#fffdf8" stroke-width="3"/><text x="964" y="450" font-size="22" text-anchor="middle" fill="#20364b">Space</text><text x="40" y="816" font-size="19" text-anchor="start" fill="#20364b">画面と操作の模式図。コイン5個・×3個はクリアと終了の条件を表しています。</text><text x="40" y="848" font-size="19" text-anchor="start" fill="#20364b">Spaceで再挑戦すると得点0・残り3へ。Mでメニューへ戻り、Enterで開始します。</text></svg>