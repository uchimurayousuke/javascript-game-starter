<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc" lang="ja"><title id="title">ゲームへ戻す前に、セーブの大きさと中身を確かめる</title><desc id="desc">得点30とレベル2をversion1のJSONとして保存。読み込むファイルは4096バイトまで、version1、score整数0から999、level整数1から10を確認。成功だけ反映し、失敗や古い読み込み結果では今の値を保つ。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="1000" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">ゲームへ戻す前に、セーブの大きさと中身を確かめる</text><rect x="40" y="145" width="450" height="180" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="65" y="195" font-size="29" text-anchor="start" fill="#20364b">書き出す現在の値</text><text x="65" y="250" font-size="31" text-anchor="start" fill="#20364b">score＝30 ／ level＝2</text><text x="65" y="300" font-size="25" text-anchor="start" fill="#20364b">保存用の形式：version＝1</text><path d="M510 235 L580 235" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="600" y="145" width="560" height="180" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="625" y="190" font-size="29" text-anchor="start" fill="#20364b">JSONファイル</text><text x="625" y="245" font-size="28" text-anchor="start" fill="#20364b">{&quot;version&quot;:1,</text><text x="625" y="295" font-size="28" text-anchor="start" fill="#20364b"> &quot;score&quot;:30, &quot;level&quot;:2}</text><path d="M875 340 L875 385" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="405" width="1120" height="265" rx="12" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="65" y="450" font-size="30" text-anchor="start" fill="#20364b">読み込んだら、まず検査</text><text x="65" y="510" font-size="27" text-anchor="start" fill="#20364b">大きさ：4096バイトまで</text><text x="650" y="510" font-size="27" text-anchor="start" fill="#20364b">version：1</text><text x="65" y="570" font-size="28" text-anchor="start" fill="#20364b">score：0〜999の整数</text><text x="650" y="570" font-size="28" text-anchor="start" fill="#20364b">level：1〜10の整数</text><text x="65" y="630" font-size="27" text-anchor="start" fill="#20364b">3つの項目をそろえ、正しい範囲の値かを確かめる。</text><path d="M300 685 L300 735" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M900 685 L900 735" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="755" width="520" height="120" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="65" y="800" font-size="27" text-anchor="start" fill="#20364b">成功した新しい読込だけ反映</text><text x="65" y="850" font-size="29" text-anchor="start" fill="#20364b">得点30・レベル2にする</text><rect x="620" y="755" width="540" height="120" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="645" y="800" font-size="28" text-anchor="start" fill="#20364b">失敗・古い読込結果</text><text x="645" y="850" font-size="29" text-anchor="start" fill="#20364b">今の得点とレベルを保つ</text><text x="40" y="930" font-size="26" text-anchor="start" fill="#20364b">新しい読込やRの後に届いた、古い読込結果は使いません。</text><text x="40" y="980" font-size="22" text-anchor="start" fill="#20364b">矢印は処理の順番。保存例の30点・レベル2は開始直後の値ではありません。</text></svg>