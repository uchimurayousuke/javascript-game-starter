<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc" lang="ja"><title id="title">違うレベルの丸は、重なった分を半分ずつ戻す</title><desc id="desc">変更前のAは内部レベル0で表示数字1、中心200,250で半径18。Bは内部レベル1で表示数字2、中心232,250で半径24。異なる内部レベルなので合体しない。距離32に対し半径合計42なので重なり10。右向き1,0に沿い、Aを左へ5、Bを右へ5動かす。変更後はA195,250、B237,250で、距離42が半径合計42と等しくなり重なりがなくなる。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1F3D5B"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="1140" rx="24" fill="#FFF8E8"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#1F3D5B">違うレベルの丸は、重なった分を半分ずつ戻す</text><text x="40" y="120" font-size="29" text-anchor="start" fill="#1F3D5B">① 変更前：半径の合計から、中心の距離を引く</text><text x="415" y="180" font-size="27" text-anchor="middle" fill="#1F3D5B">重なり10</text><path d="M390 210 L440 210" fill="none" stroke="#1F3D5B" stroke-width="3"/><path d="M390 198 L390 222" fill="none" stroke="#1F3D5B" stroke-width="3"/><path d="M440 198 L440 222" fill="none" stroke="#1F3D5B" stroke-width="3"/><circle cx="350" cy="350" r="90" fill="#FFD35A" stroke="#1F3D5B" stroke-width="3"/><circle cx="510" cy="350" r="120" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="3"/><text x="350" y="320" font-size="25" text-anchor="middle" fill="#1F3D5B">A：表示1</text><circle cx="350" cy="350" r="4" fill="#1F3D5B" stroke="#1F3D5B" stroke-width="3"/><text x="350" y="387" font-size="24" text-anchor="middle" fill="#1F3D5B">(200,250)</text><text x="350" y="422" font-size="24" text-anchor="middle" fill="#1F3D5B">半径18</text><text x="510" y="320" font-size="25" text-anchor="middle" fill="#1F3D5B">B：表示2</text><circle cx="510" cy="350" r="4" fill="#1F3D5B" stroke="#1F3D5B" stroke-width="3"/><text x="510" y="387" font-size="24" text-anchor="middle" fill="#1F3D5B">(232,250)</text><text x="510" y="422" font-size="24" text-anchor="middle" fill="#1F3D5B">半径24</text><path d="M350 495 L510 495" fill="none" stroke="#1F3D5B" stroke-width="3"/><path d="M350 483 L350 507" fill="none" stroke="#1F3D5B" stroke-width="3"/><path d="M510 483 L510 507" fill="none" stroke="#1F3D5B" stroke-width="3"/><text x="430" y="550" font-size="29" text-anchor="middle" fill="#1F3D5B">距離32</text><text x="745" y="245" font-size="28" text-anchor="start" fill="#1F3D5B">半径の合計：18＋24＝42</text><text x="745" y="305" font-size="27" text-anchor="start" fill="#1F3D5B">中心の距離：232−200＝32</text><text x="745" y="365" font-size="30" text-anchor="start" fill="#1F3D5B">重なり：42−32＝10</text><text x="745" y="425" font-size="30" text-anchor="start" fill="#1F3D5B">半分ずつ：10÷2＝5</text><text x="745" y="485" font-size="25" text-anchor="start" fill="#1F3D5B">AからBへの向きは右 (1,0)</text><path d="M105 485 L105 565" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="630" font-size="29" text-anchor="start" fill="#1F3D5B">② 変更後：Aは左へ5、Bは右へ5。yは250のまま</text><path d="M350 680 L325 680" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="290" y="710" font-size="25" text-anchor="middle" fill="#1F3D5B">左へ5</text><path d="M510 680 L535 680" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="710" font-size="25" text-anchor="middle" fill="#1F3D5B">右へ5</text><circle cx="325" cy="825" r="90" fill="#FFD35A" stroke="#1F3D5B" stroke-width="3"/><circle cx="535" cy="825" r="120" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="3"/><text x="325" y="795" font-size="25" text-anchor="middle" fill="#1F3D5B">A：表示1</text><circle cx="325" cy="825" r="4" fill="#1F3D5B" stroke="#1F3D5B" stroke-width="3"/><text x="325" y="862" font-size="24" text-anchor="middle" fill="#1F3D5B">(195,250)</text><text x="325" y="897" font-size="24" text-anchor="middle" fill="#1F3D5B">半径18</text><text x="535" y="795" font-size="25" text-anchor="middle" fill="#1F3D5B">B：表示2</text><circle cx="535" cy="825" r="4" fill="#1F3D5B" stroke="#1F3D5B" stroke-width="3"/><text x="535" y="862" font-size="24" text-anchor="middle" fill="#1F3D5B">(237,250)</text><text x="535" y="897" font-size="24" text-anchor="middle" fill="#1F3D5B">半径24</text><text x="745" y="775" font-size="30" text-anchor="start" fill="#1F3D5B">A：200−5＝195</text><text x="745" y="840" font-size="30" text-anchor="start" fill="#1F3D5B">B：232＋5＝237</text><text x="745" y="905" font-size="29" text-anchor="start" fill="#1F3D5B">合体せず、2個のまま</text><path d="M325 980 L535 980" fill="none" stroke="#1F3D5B" stroke-width="3"/><path d="M325 968 L325 992" fill="none" stroke="#1F3D5B" stroke-width="3"/><path d="M535 968 L535 992" fill="none" stroke="#1F3D5B" stroke-width="3"/><text x="430" y="1030" font-size="28" text-anchor="middle" fill="#1F3D5B">距離：237−195＝42</text><text x="745" y="1025" font-size="28" text-anchor="start" fill="#1F3D5B">半径の合計42と同じ</text><text x="40" y="1100" font-size="23" text-anchor="start" fill="#1F3D5B">円・距離・移動量は上下とも5倍。中心の黒い点を基準に比べます。箱と落下は省略。</text></svg>