<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">if：条件がtrueなら、こちらの処理へ</title><desc id="desc">hpが7なら7&gt;5はtrue。元気の枝を実行してConsoleに元気と表示し、elseの注意は実行しない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="800" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">if：条件がtrueなら、こちらの処理へ</text><rect x="405" y="135" width="390" height="120" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="427" y="177" font-size="26" text-anchor="start" fill="#20364b">条件に入れる値</text><text x="427" y="230" font-size="30" text-anchor="start" fill="#20364b">hp = 7</text><path d="M600 270 L600 315" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="330" width="470" height="110" rx="12" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="600" y="375" font-size="31" text-anchor="middle" fill="#20364b">hp &gt; 5</text><text x="600" y="415" font-size="29" text-anchor="middle" fill="#20364b">7 &gt; 5 は true</text><path d="M365 385 L250 385" fill="none" stroke="#20364b" stroke-width="3"/><path d="M250 385 L250 495" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M835 385 L950 385" fill="none" stroke="#20364b" stroke-width="3" stroke-dasharray="7 6"/><path d="M950 385 L950 495" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="230" y="460" font-size="25" text-anchor="end" fill="#20364b">true：実行する</text><text x="970" y="460" font-size="25" text-anchor="start" fill="#20364b">false のとき</text><rect x="60" y="515" width="480" height="135" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="82" y="557" font-size="26" text-anchor="start" fill="#20364b">if の中</text><text x="82" y="610" font-size="30" text-anchor="start" fill="#20364b">console.log(&quot;元気&quot;)</text><rect x="660" y="515" width="480" height="135" rx="12" fill="#f4f7fa" stroke="#607a90" stroke-width="2"/><text x="682" y="557" font-size="26" text-anchor="start" fill="#20364b">else の中：今回は実行しない</text><text x="682" y="610" font-size="30" text-anchor="start" fill="#20364b">console.log(&quot;注意&quot;)</text><text x="40" y="715" font-size="32" text-anchor="start" fill="#20364b">今回のConsole：元気</text><text x="40" y="765" font-size="25" text-anchor="start" fill="#20364b">どちらか一方だけを実行します。破線は今回通らない道です。</text></svg>