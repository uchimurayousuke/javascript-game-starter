<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc" lang="ja"><title id="title">時間で移動：更新回数が違っても同じ距離</title><desc id="desc">時間で移動：更新回数が違っても同じ距離。基本3 ／ 移動距離 ＝ 速さ120px/秒 × 経過した秒数。移動距離を3倍にした模式図。四角は説明用サイズで、表示更新の等間隔な例です。初回の時刻記録後から1秒を比較。長い停止では上限を使うため、実時間分は進みません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="900" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">時間で移動：更新回数が違っても同じ距離</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 移動距離 ＝ 速さ120px/秒 × 経過した秒数</text><rect id="fps0" x="65" y="175" width="870" height="195" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="100" y="223" font-size="29" text-anchor="start" fill="#20364b">30回/秒</text><text x="570" y="223" font-size="28" text-anchor="middle" fill="#20364b">120 × (1/30) × 30 ＝ 120px</text><rect id="start0" x="405" y="260" width="30" height="30" rx="0" fill="none" stroke="#708391" stroke-width="3" stroke-dasharray="8 6"/><rect id="end0" x="765" y="260" width="30" height="30" rx="0" fill="#95c7ed" stroke="#28629e" stroke-width="3"/><path d="M445 275L755 275" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="420" y="340" font-size="24" text-anchor="middle" fill="#20364b">x＝100</text><text x="780" y="340" font-size="24" text-anchor="middle" fill="#20364b">x＝220</text><text x="170" y="300" font-size="25" text-anchor="middle" fill="#20364b">1回は4px</text><rect id="fps1" x="65" y="395" width="870" height="195" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="100" y="443" font-size="29" text-anchor="start" fill="#20364b">60回/秒</text><text x="570" y="443" font-size="28" text-anchor="middle" fill="#20364b">120 × (1/60) × 60 ＝ 120px</text><rect id="start1" x="405" y="480" width="30" height="30" rx="0" fill="none" stroke="#708391" stroke-width="3" stroke-dasharray="8 6"/><rect id="end1" x="765" y="480" width="30" height="30" rx="0" fill="#95c7ed" stroke="#28629e" stroke-width="3"/><path d="M445 495L755 495" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="420" y="560" font-size="24" text-anchor="middle" fill="#20364b">x＝100</text><text x="780" y="560" font-size="24" text-anchor="middle" fill="#20364b">x＝220</text><text x="170" y="520" font-size="25" text-anchor="middle" fill="#20364b">1回は2px</text><rect id="cap" x="115" y="650" width="770" height="115" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="500.0" y="695" font-size="29" text-anchor="middle" fill="#20364b">長い停止は、1回の経過時間を0.05秒までに制限</text><text x="500.0" y="738" font-size="23" text-anchor="middle" fill="#20364b">1回の移動は最大 120 × 0.05 ＝ 6px</text><text x="40" y="836" font-size="19" text-anchor="start" fill="#20364b">移動距離を3倍にした模式図。四角は説明用サイズで、表示更新の等間隔な例です。</text><text x="40" y="868" font-size="19" text-anchor="start" fill="#20364b">初回の時刻記録後から1秒を比較。長い停止では上限を使うため、実時間分は進みません。</text></svg>