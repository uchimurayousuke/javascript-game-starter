<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" lang="ja"><title id="title">absolute：親の左上から、子の左上を測る</title><desc id="desc">relativeの親fieldは幅200高さ100。paddingとborderなし。absoluteの子markerの左上は親の左から30、上から20。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="820" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">absolute：親の左上から、子の左上を測る</text><text x="40" y="110" font-size="27" text-anchor="start" fill="#20364b">親 field：position:relative ／ 子 marker：position:absolute</text><rect x="100" y="210" width="1000" height="500" rx="0" fill="#edf3f8" stroke="#607a90" stroke-width="2"/><text x="600" y="185" font-size="28" text-anchor="middle" fill="#20364b">親の幅200px</text><text x="1120" y="430" font-size="22" text-anchor="middle" fill="#20364b">高さ</text><text x="1120" y="465" font-size="22" text-anchor="middle" fill="#20364b">100px</text><text x="100" y="165" font-size="25" text-anchor="start" fill="#20364b">親の左上 (0,0)</text><path d="M100 280 L250 280" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="175" y="265" font-size="23" text-anchor="middle" fill="#20364b">left:30px</text><path d="M250 210 L250 310" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="280" y="265" font-size="25" text-anchor="start" fill="#20364b">top:20px</text><rect x="250" y="310" width="290" height="145" rx="12" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="275" y="355" font-size="30" text-anchor="start" fill="#20364b">marker</text><text x="275" y="410" font-size="28" text-anchor="start" fill="#20364b">左上 (30,20)</text><text x="140" y="560" font-size="28" text-anchor="start" fill="#20364b">親の左から30、上から20へ進むと、子の左上。</text><text x="140" y="620" font-size="27" text-anchor="start" fill="#20364b">この親にはpaddingもborderもありません。</text><text x="40" y="775" font-size="22" text-anchor="start" fill="#20364b">親の寸法と位置の差は5倍表示。子の大きさは説明用で、コードの指定値ではありません。</text></svg>