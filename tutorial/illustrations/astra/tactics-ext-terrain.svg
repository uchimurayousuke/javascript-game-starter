300" y="495" width="75" height="75" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><text x="337.5" y="541" font-size="24" text-anchor="middle" fill="#20364b"></text><rect id="e4-4" x="375" y="495" width="75" height="75" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><text x="412.5" y="541" font-size="24" text-anchor="middle" fill="#20364b"></text><rect id="e5-4" x="450" y="495" width="75" height="75" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><text x="487.5" y="541" font-size="24" text-anchor="middle" fill="#20364b"></text><text x="112.5" y="177" font-size="22" text-anchor="middle" fill="#20364b">0</text><text x="187.5" y="177" font-size="22" text-anchor="middle" fill="#20364b">1</text><text x="262.5" y="177" font-size="22" text-anchor="middle" fill="#20364b">2</text><text x="337.5" y="177" font-size="22" text-anchor="middle" fill="#20364b">3</text><text x="412.5" y="177" font-size="22" text-anchor="middle" fill="#20364b">4</text><text x="487.5" y="177" font-size="22" text-anchor="middle" fill="#20364b">5</text><text x="50" y="241" font-size="22" text-anchor="middle" fill="#20364b">0</text><text x="50" y="316" font-size="22" text-anchor="middle" fill="#20364b">1</text><text x="50" y="391" font-size="22" text-anchor="middle" fill="#20364b">2</text><text x="50" y="466" font-size="22" text-anchor="middle" fill="#20364b">3</text><text x="50" y="541" font-size="22" text-anchor="middle" fill="#20364b">4</text><text x="575" y="220" font-size="29" text-anchor="start" fill="#20364b">1回の移動力は2</text><text x="575" y="285" font-size="26" text-anchor="start" fill="#20364b">普通の床：1マスで1</text><text x="575" y="335" font-size="26" text-anchor="start" fill="#20364b">森：1マスで2</text><text x="575" y="400" font-size="25" text-anchor="start" fill="#20364b">列1・行1 → 列1・行2</text><text x="575" y="445" font-size="25" text-anchor="start" fill="#20364b">森に入るだけで2を使う</text><text x="575" y="510" font-size="26" text-anchor="start" fill="#20364b">壁には入れない</text><text x="75" y="630" font-size="29" text-anchor="start" fill="#20364b">床2マスなら 1＋1＝2。森1マスでも 2。</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">実際の6列×5行の地形を75pxに拡大。HP表示は省略しています。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">移動先は空きマスのみ。森の先へ進むには移動力が足りません。</text></svg>