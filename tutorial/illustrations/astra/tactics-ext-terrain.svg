<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">タクティクス：地形で移動力が変わる</title><desc id="desc">タクティクス：地形で移動力が変わる。発展2 ／ 歩数だけでなく、移動先のコストを足す。実際の6列×5行の地形を75pxに拡大。HP表示は省略しています。移動先は空きマスのみ。森の先へ進むには移動力が足りません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">タクティクス：地形で移動力が変わる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">発展2 ／ 歩数だけでなく、移動先のコストを足す。</text><rect id="e0-0" x="75" y="195" width="75" height="75" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><text x="112.5" y="241" font-size="24" text-anchor="middle" fill="#20364b"></text><rect id="e1-0" x="150" y="195" width="75" height="75" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><text x="187.5" y="241" font-size="24" text-anchor="middle" fill="#20364b"></text><rect id="e2-0" x="225" y="195" width="75" height="75" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><text x="262.5" y="241" font-size="24" text-anchor="middle" fill="#20364b"></text><rect id="e3-0" x="300" y="195" width="75" height="75" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><text x="337.5" y="241" font-size="24" text-anchor="middle" fill="#20364b"></text><rect id="e4-0" x="375" y="195" width="75" height="75" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><text x="412.5" y="241" font-size="24" text-anchor="middle" fill="#20364b"></text><rect id="e5-0" x="450" y="195" width="75" height="75" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><text x="487.5" y="241" font-size="24" text-anchor="middle" fill="#20364b"></text><rect id="e0-1" x="75" y="270" width="75" he