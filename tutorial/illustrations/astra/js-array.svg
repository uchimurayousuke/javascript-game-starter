<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc" lang="ja"><title id="title">配列：番号で読み、末尾に足して取り出す</title><desc id="desc">独立した2例。例1のcolorsは赤青緑で添字0が赤、1が青、length3。例2は赤青から始め、緑をpushで追加、popで緑を取り出すと赤青が残る。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="1010" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">配列：番号で読み、末尾に足して取り出す</text><text x="40" y="110" font-size="27" text-anchor="start" fill="#20364b">上と下は独立した例です。それぞれのコードだけを実行します。</text><rect x="40" y="145" width="1120" height="275" rx="12" fill="#edf3f8" stroke="#607a90" stroke-width="2"/><text x="65" y="190" font-size="30" text-anchor="start" fill="#20364b">例1：colors = [&quot;赤&quot;, &quot;青&quot;, &quot;緑&quot;]</text><text x="175" y="240" font-size="25" text-anchor="middle" fill="#20364b">番号0</text><rect x="80" y="260" width="190" height="90" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="175" y="320" font-size="35" text-anchor="middle" fill="#20364b">赤</text><text x="410" y="240" font-size="25" text-anchor="middle" fill="#20364b">番号1</text><rect x="315" y="260" width="190" height="90" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="410" y="320" font-size="35" text-anchor="middle" fill="#20364b">青</text><text x="645" y="240" font-size="25" text-anchor="middle" fill="#20364b">番号2</text><rect x="550" y="260" width="190" height="90" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="645" y="320" font-size="35" text-anchor="middle" fill="#20364b">緑</text><text x="830" y="265" font-size="31" text-anchor="start" fill="#20364b">length = 3</text><text x="830" y="320" font-size="28" text-anchor="start" fill="#20364b">要素は3個</text><text x="65" y="390" font-size="27" text-anchor="start" fill="#20364b">colors[0] → 赤 ／ colors[1] → 青 ／ colors.length → 3</text><rect x="40" y="450" width="1120" height="440" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="65" y="495" font-size="29" text-anchor="start" fill="#20364b">例2：別の colors = [&quot;赤&quot;, &quot;青&quot;] から始める</text><text x="70" y="595" font-size="27" text-anchor="start" fill="#20364b">はじめ</text><rect x="230" y="540" width="130" height="75" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="295" y="590" font-size="31" text-anchor="middle" fill="#20364b">赤</text><rect x="380" y="540" width="130" height="75" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="445" y="590" font-size="31" text-anchor="middle" fill="#20364b">青</text><text x="70" y="710" font-size="27" text-anchor="start" fill="#20364b">push後</text><rect x="230" y="655" width="130" height="75" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="295" y="705" font-size="31" text-anchor="middle" fill="#20364b">赤</text><rect x="380" y="655" width="130" height="75" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="445" y="705" font-size="31" text-anchor="middle" fill="#20364b">青</text><rect x="530" y="655" width="130" height="75" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="595" y="705" font-size="31" text-anchor="middle" fill="#20364b">緑</text><text x="70" y="825" font-size="27" text-anchor="start" fill="#20364b">pop後</text><rect x="230" y="770" width="130" height="75" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="295" y="820" font-size="31" text-anchor="middle" fill="#20364b">赤</text><rect x="380" y="770" width="130" height="75" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="445" y="820" font-size="31" text-anchor="middle" fill="#20364b">青</text><text x="770" y="585" font-size="29" text-anchor="start" fill="#20364b">colors.push(&quot;緑&quot;)</text><text x="770" y="635" font-size="26" text-anchor="start" fill="#20364b">末尾に「緑」を足す</text><text x="770" y="745" font-size="28" text-anchor="start" fill="#20364b">last = colors.pop()</text><text x="770" y="800" font-size="29" text-anchor="start" fill="#20364b">last は「緑」</text><text x="770" y="850" font-size="25" text-anchor="start" fill="#20364b">配列からは取り除く</text><text x="40" y="940" font-size="28" text-anchor="start" fill="#20364b">join(&quot;,&quot;)で確認：push後は 赤,青,緑 ／ pop後は 赤,青</text><text x="40" y="985" font-size="24" text-anchor="start" fill="#20364b">最初の番号は0。lengthは最後の番号ではなく、入っている個数です。</text></svg>