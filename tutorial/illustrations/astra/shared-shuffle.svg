<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc" lang="ja"><title id="title">シャッフル：2枚を交換して、後ろから決める</title><desc id="desc">神経衰弱の8枚を混ぜる最初の1回。i=7でj=1を選ぶ例。番号7のCを一時保存し、番号1のBを7へ、保存したCを1へ移す。交換後はA,C,C,D,B,A,D,B。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="880" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#20364b">シャッフル：2枚を交換して、後ろから決める</text><text x="40" y="103" font-size="25" text-anchor="start" fill="#20364b">神経衰弱 基本4 ／ 番号7のCと番号1のBを交換する、最初の1回。</text><text x="100" y="155" font-size="22" text-anchor="middle" fill="#20364b">番号0</text><rect x="45" y="175" width="110" height="90" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="100" y="230" font-size="30" text-anchor="middle" fill="#20364b">A</text><text x="240" y="155" font-size="22" text-anchor="middle" fill="#20364b">番号1</text><rect x="185" y="175" width="110" height="90" rx="12" fill="#ffdfac" stroke="#657e91" stroke-width="2"/><text x="240" y="230" font-size="30" text-anchor="middle" fill="#20364b">B</text><text x="380" y="155" font-size="22" text-anchor="middle" fill="#20364b">番号2</text><rect x="325" y="175" width="110" height="90" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="380" y="230" font-size="30" text-anchor="middle" fill="#20364b">C</text><text x="520" y="155" font-size="22" text-anchor="middle" fill="#20364b">番号3</text><rect x="465" y="175" width="110" height="90" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="520" y="230" font-size="30" text-anchor="middle" fill="#20364b">D</text><text x="660" y="155" font-size="22" text-anchor="middle" fill="#20364b">番号4</text><rect x="605" y="175" width="110" height="90" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="660" y="230" font-size="30" text-anchor="middle" fill="#20364b">B</text><text x="800" y="155" font-size="22" text-anchor="middle" fill="#20364b">番号5</text><rect x="745" y="175" width="110" height="90" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="800" y="230" font-size="30" text-anchor="middle" fill="#20364b">A</text><text x="940" y="155" font-size="22" text-anchor="middle" fill="#20364b">番号6</text><rect x="885" y="175" width="110" height="90" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="940" y="230" font-size="30" text-anchor="middle" fill="#20364b">D</text><text x="1080" y="155" font-size="22" text-anchor="middle" fill="#20364b">番号7</text><rect x="1025" y="175" width="110" height="90" rx="12" fill="#ffdfac" stroke="#657e91" stroke-width="2"/><text x="1080" y="230" font-size="30" text-anchor="middle" fill="#20364b">C</text><text x="40" y="310" font-size="27" text-anchor="start" fill="#20364b">i＝7 → jは0〜7から選ぶ。ここでは j＝1。</text><text x="40" y="355" font-size="25" text-anchor="start" fill="#20364b">例：Math.random() が0.2なら floor(0.2 × 8)＝1</text><rect x="40" y="390" width="355" height="160" rx="12" fill="#e8f0fb" stroke="#657e91" stroke-width="2"/><rect x="425" y="390" width="355" height="160" rx="12" fill="#e8f0fb" stroke="#657e91" stroke-width="2"/><rect x="810" y="390" width="350" height="160" rx="12" fill="#e8f0fb" stroke="#657e91" stroke-width="2"/><text x="60" y="430" font-size="26" text-anchor="start" fill="#20364b">① 番号7を一時保存</text><text x="60" y="485" font-size="30" text-anchor="start" fill="#20364b">card ← C</text><text x="445" y="430" font-size="26" text-anchor="start" fill="#20364b">② 番号1を番号7へ</text><text x="445" y="485" font-size="28" text-anchor="start" fill="#20364b">cards[7] ← B</text><text x="830" y="430" font-size="25" text-anchor="start" fill="#20364b">③ 保存した1枚を1へ</text><text x="830" y="485" font-size="28" text-anchor="start" fill="#20364b">cards[1] ← C</text><text x="40" y="600" font-size="27" text-anchor="start" fill="#20364b">交換した後</text><rect x="45" y="625" width="110" height="80" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="100" y="675" font-size="30" text-anchor="middle" fill="#20364b">A</text><rect x="185" y="625" width="110" height="80" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="240" y="675" font-size="30" text-anchor="middle" fill="#20364b">C</text><rect x="325" y="625" width="110" height="80" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="380" y="675" font-size="30" text-anchor="middle" fill="#20364b">C</text><rect x="465" y="625" width="110" height="80" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="520" y="675" font-size="30" text-anchor="middle" fill="#20364b">D</text><rect x="605" y="625" width="110" height="80" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="660" y="675" font-size="30" text-anchor="middle" fill="#20364b">B</text><rect x="745" y="625" width="110" height="80" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="800" y="675" font-size="30" text-anchor="middle" fill="#20364b">A</text><rect x="885" y="625" width="110" height="80" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="940" y="675" font-size="30" text-anchor="middle" fill="#20364b">D</text><rect x="1025" y="625" width="110" height="80" rx="12" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="1080" y="675" font-size="30" text-anchor="middle" fill="#20364b">B</text><text x="40" y="755" font-size="27" text-anchor="start" fill="#20364b">次は i＝6。jは0〜6から選び、番号7はもう変えない。</text><text x="40" y="805" font-size="24" text-anchor="start" fill="#20364b">8枚のまま、A・B・C・Dが各2枚。カードは増えたり消えたりしません。</text><text x="40" y="850" font-size="22" text-anchor="start" fill="#20364b">図は最初の交換1回だけ。続けて番号6、5、4、3、2、1の順に交換します。</text></svg>