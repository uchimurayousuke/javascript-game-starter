<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc" lang="ja"><title id="title">同じ文字なら、その2枚は開いたまま</title><desc id="desc">同じ文字なら、その2枚は開いたまま。？は裏向き。めくった2枚の文字を比べて、同じ組を探します。説明用の並び：上段 A・B・C・D ／ 下段 B・A・D・C。毎回この並びとは限りません。どちらも最初の状態から試した別の例です。裏向きの文字はゲームでは見えません。模式図：カードを読みやすく拡大し、一致と不一致の結果を左右に並べています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="840" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">同じ文字なら、その2枚は開いたまま</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">？は裏向き。めくった2枚の文字を比べて、同じ組を探します。</text><rect id="pair-case-0" x="40" y="150" width="550" height="510" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="315" y="201" font-size="30" text-anchor="middle" fill="#20364b">AとAをめくる</text><rect id="case-0-card-0" x="95" y="240" width="88" height="110" rx="10" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="139.0" y="311.0" font-size="42" text-anchor="middle" fill="#20364b">A</text><rect id="case-0-card-1" x="205" y="240" width="88" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="249.0" y="311.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><rect id="case-0-card-2" x="315" y="240" width="88" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="359.0" y="311.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><rect id="case-0-card-3" x="425" y="240" width="88" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="469.0" y="311.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><rect id="case-0-card-4" x="95" y="375" width="88" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="139.0" y="446.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><rect id="case-0-card-5" x="205" y="375" width="88" height="110" rx="10" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="249.0" y="446.0" font-size="42" text-anchor="middle" fill="#20364b">A</text><rect id="case-0-card-6" x="315" y="375" width="88" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="359.0" y="446.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><rect id="case-0-card-7" x="425" y="375" width="88" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="469.0" y="446.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><text x="315" y="548" font-size="34" text-anchor="middle" fill="#18734f">一致！</text><text x="315" y="602" font-size="28" text-anchor="middle" fill="#20364b">2枚とも開いたまま</text><rect id="pair-case-1" x="640" y="150" width="550" height="510" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="915" y="201" font-size="30" text-anchor="middle" fill="#20364b">AとBをめくる</text><rect id="case-1-card-0" x="695" y="240" width="88" height="110" rx="10" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="739.0" y="311.0" font-size="42" text-anchor="middle" fill="#20364b">A</text><rect id="case-1-card-1" x="805" y="240" width="88" height="110" rx="10" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="849.0" y="311.0" font-size="42" text-anchor="middle" fill="#20364b">B</text><rect id="case-1-card-2" x="915" y="240" width="88" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="959.0" y="311.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><rect id="case-1-card-3" x="1025" y="240" width="88" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="1069.0" y="311.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><rect id="case-1-card-4" x="695" y="375" width="88" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="739.0" y="446.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><rect id="case-1-card-5" x="805" y="375" width="88" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="849.0" y="446.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><rect id="case-1-card-6" x="915" y="375" width="88" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="959.0" y="446.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><rect id="case-1-card-7" x="1025" y="375" width="88" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="1069.0" y="446.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><text x="915" y="548" font-size="34" text-anchor="middle" fill="#a64e16">不一致</text><text x="915" y="602" font-size="28" text-anchor="middle" fill="#20364b">1秒待って2枚を閉じる</text><text x="48" y="733" font-size="21" text-anchor="start" fill="#20364b">説明用の並び：上段 A・B・C・D ／ 下段 B・A・D・C。毎回この並びとは限りません。</text><text x="48" y="769" font-size="21" text-anchor="start" fill="#20364b">どちらも最初の状態から試した別の例です。裏向きの文字はゲームでは見えません。</text><text x="48" y="805" font-size="21" text-anchor="start" fill="#20364b">模式図：カードを読みやすく拡大し、一致と不一致の結果を左右に並べています。</text></svg>