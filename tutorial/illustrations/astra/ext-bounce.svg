<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="905" viewBox="0 0 1000 905" role="img" aria-labelledby="title desc" lang="ja"><title id="title">板のどこに当たったかで、向きを変える</title><desc id="desc">板のどこに当たったかで、向きを変える。板の中心より右で当たる例。基準の速さが4のときを見ます。27.5 ÷ 55 ＝ 0.5、0.5 × 4 ＝ 2。左側なら横速度はマイナスです。板とボールは6倍の拡大図。上向き4・右向き2の矢印は模式図です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="905" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">板のどこに当たったかで、向きを変える</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">板の中心より右で当たる例。基準の速さが4のときを見ます。</text><rect id="paddle" x="170" y="470" width="660" height="84" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="500" y="522" font-size="31" text-anchor="middle" fill="#20364b">板の幅110</text><circle id="ball" cx="665" cy="410" r="60" fill="#ffe29a" stroke="#936315" stroke-width="3"/><circle id="ball-center" cx="665" cy="410" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M500 455V650" fill="none" stroke="#7b8da0" stroke-width="2" stroke-dasharray="8 6"/><text x="500" y="437" font-size="25" text-anchor="middle" fill="#20364b">板の中心</text><path d="M665 335L745 175" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="820" y="239" font-size="28" text-anchor="middle" fill="#20364b">右へ2</text><text x="820" y="282" font-size="28" text-anchor="middle" fill="#20364b">上へ4</text><path d="M500 579H665 M500 568V590 M665 568V590" fill="none" stroke="#34495e" stroke-width="3"/><text x="582" y="619" font-size="26" text-anchor="middle" fill="#20364b">ずれ27.5</text><path d="M500 654H830 M500 643V665 M830 643V665" fill="none" stroke="#34495e" stroke-width="3"/><text x="665" y="702" font-size="27" text-anchor="middle" fill="#20364b">半分の幅55</text><text x="500" y="764" font-size="28" text-anchor="middle" fill="#20364b">半分までずれた → 比率0.5 → 横速度2</text><text x="40" y="841" font-size="19" text-anchor="start" fill="#20364b">27.5 ÷ 55 ＝ 0.5、0.5 × 4 ＝ 2。左側なら横速度はマイナスです。</text><text x="40" y="873" font-size="19" text-anchor="start" fill="#20364b">板とボールは6倍の拡大図。上向き4・右向き2の矢印は模式図です。</text></svg>