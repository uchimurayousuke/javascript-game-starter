<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">効果音：鳴らせないときも知らせる</title><desc id="desc">効果音：鳴らせないときも知らせる。基本3 ／ 操作をきっかけに、音の機能を準備します。処理の分岐を示す模式図。音量は0 → 0.25 → 0.5 → 0の順に切り替わります。未対応・再開できない状態・例外では、再生せず画面にメッセージを出します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">効果音：鳴らせないときも知らせる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 操作をきっかけに、音の機能を準備します。</text><rect id="press" x="60" y="170" width="330" height="125" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="225.0" y="215" font-size="29" text-anchor="middle" fill="#20364b">Spaceを押す</text><text x="225.0" y="258" font-size="23" text-anchor="middle" fill="#20364b">V：音量 / M：ミュート</text><rect id="silent" x="600" y="170" width="340" height="125" rx="16" fill="#fff0c7" stroke="#a9bdcf" stroke-width="3"/><text x="770.0" y="215" font-size="29" text-anchor="middle" fill="#20364b">音は出さない</text><text x="770.0" y="258" font-size="23" text-anchor="middle" fill="#20364b">ミュート または 音量0</text><path d="M395 225L595 225" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="202" font-size="23" text-anchor="middle" fill="#20364b">音なし</text><path d="M225 305L225 400" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="265" y="360" font-size="24" text-anchor="start" fill="#20364b">音あり</text><rect id="api" x="60" y="410" width="330" height="155" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="225.0" y="455" font-size="29" text-anchor="middle" fill="#20364b">音の機能を準備</text><text x="225.0" y="498" font-size="23" text-anchor="middle" fill="#20364b">AudioContext</text><text x="225" y="540" font-size="23" text-anchor="middle" fill="#20364b">音量：0.25 または 0.5</text><rect id="ok" x="600" y="365" width="340" height="125" rx="16" fill="#d4efde" stroke="#a9bdcf" stroke-width="3"/><text x="770.0" y="410" font-size="29" text-anchor="middle" fill="#20364b">再生できた</text><text x="770.0" y="453" font-size="23" text-anchor="middle" fill="#20364b">440Hz・0.08秒</text><rect id="no" x="600" y="550" width="340" height="125" rx="16" fill="#ffe3d9" stroke="#a9bdcf" stroke-width="3"/><text x="770.0" y="595" font-size="29" text-anchor="middle" fill="#20364b">再生できない</text><text x="770.0" y="638" font-size="23" text-anchor="middle" fill="#20364b">画面にメッセージを表示</text><path d="M395 455 L475 455 L475 425 L595 425" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M395 525 L475 525 L475 610 L595 610" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">処理の分岐を示す模式図。音量は0 → 0.25 → 0.5 → 0の順に切り替わります。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">未対応・再開できない状態・例外では、再生せず画面にメッセージを出します。</text></svg>