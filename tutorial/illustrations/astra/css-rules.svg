<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" lang="ja"><title id="title">CSS：どこに、何を、どの値にする？</title><desc id="desc">p、.notice、#scoreの3つのセレクターと、colorプロパティの値blue green redを対応させる。コロンはプロパティと値、セミコロンは宣言の区切り。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="850" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">CSS：どこに、何を、どの値にする？</text><rect x="40" y="150" width="310" height="120" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="62" y="192" font-size="26" text-anchor="start" fill="#20364b">セレクター</text><text x="62" y="245" font-size="30" text-anchor="start" fill="#20364b">p</text><path d="M365 210 L415 210" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="150" width="350" height="120" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="452" y="192" font-size="26" text-anchor="start" fill="#20364b">一致する要素</text><text x="452" y="245" font-size="30" text-anchor="start" fill="#20364b">pタグ</text><rect x="810" y="150" width="350" height="120" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="832" y="192" font-size="26" text-anchor="start" fill="#20364b">文字色の指定</text><text x="832" y="245" font-size="30" text-anchor="start" fill="#20364b">blue</text><rect x="40" y="310" width="310" height="120" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="62" y="352" font-size="26" text-anchor="start" fill="#20364b">セレクター</text><text x="62" y="405" font-size="30" text-anchor="start" fill="#20364b">.notice</text><path d="M365 370 L415 370" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="310" width="350" height="120" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="452" y="352" font-size="26" text-anchor="start" fill="#20364b">一致する要素</text><text x="452" y="405" font-size="30" text-anchor="start" fill="#20364b">class=&quot;notice&quot;</text><rect x="810" y="310" width="350" height="120" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="832" y="352" font-size="26" text-anchor="start" fill="#20364b">文字色の指定</text><text x="832" y="405" font-size="30" text-anchor="start" fill="#20364b">green</text><rect x="40" y="470" width="310" height="120" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="62" y="512" font-size="26" text-anchor="start" fill="#20364b">セレクター</text><text x="62" y="565" font-size="30" text-anchor="start" fill="#20364b">#score</text><path d="M365 530 L415 530" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="470" width="350" height="120" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="452" y="512" font-size="26" text-anchor="start" fill="#20364b">一致する要素</text><text x="452" y="565" font-size="30" text-anchor="start" fill="#20364b">id=&quot;score&quot;</text><rect x="810" y="470" width="350" height="120" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="832" y="512" font-size="26" text-anchor="start" fill="#20364b">文字色の指定</text><text x="832" y="565" font-size="30" text-anchor="start" fill="#20364b">red</text><rect x="40" y="635" width="1120" height="130" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="65" y="685" font-size="35" text-anchor="start" fill="#20364b">p  {  color : blue ;  }</text><text x="590" y="680" font-size="27" text-anchor="start" fill="#20364b">: は名前と値の間</text><text x="590" y="730" font-size="27" text-anchor="start" fill="#20364b">; は1つの指定の終わり</text><text x="40" y="815" font-size="23" text-anchor="start" fill="#20364b">複数の指定が同じ要素に当たるときは「適用順」の図で結果を確かめます。</text></svg>