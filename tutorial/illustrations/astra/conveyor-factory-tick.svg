<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1190" viewBox="0 0 1200 1190" role="img" aria-labelledby="title desc" lang="ja"><title id="title">移動先は刻みの開始時に空いていたかで決める</title><desc id="desc">行y1でAは1,1、Bは2,1。開始時に2,1が埋まっているのでAは止まり、Bだけ3,1へ進む。同じ刻み中に空いた2,1へAを進めない。次の刻みでAは2,1、Bは4,1へ1マスずつ進む。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1F3D5B"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="1190" rx="12" fill="#FFF8E8" stroke="#1F3D5B" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#1F3D5B">移動先は刻みの開始時に空いていたかで決める</text><text x="40" y="110" font-size="27" text-anchor="start" fill="#1F3D5B">右向きの経路の一部。1刻みで進めるのは最大1マスです。</text><text x="65" y="222" font-size="28" text-anchor="start" fill="#1F3D5B">① 開始</text><text x="65" y="269" font-size="25" text-anchor="start" fill="#1F3D5B">行 y＝1</text><rect x="390" y="170" width="175" height="115" rx="0" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><text x="477.5" y="213" font-size="31" text-anchor="middle" fill="#1F3D5B">A</text><text x="477.5" y="261" font-size="25" text-anchor="middle" fill="#1F3D5B">(1,1)</text><rect x="565" y="170" width="175" height="115" rx="0" fill="#FFD35A" stroke="#1F3D5B" stroke-width="2"/><text x="652.5" y="213" font-size="31" text-anchor="middle" fill="#1F3D5B">B</text><text x="652.5" y="261" font-size="25" text-anchor="middle" fill="#1F3D5B">(2,1)</text><rect x="740" y="170" width="175" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="827.5" y="213" font-size="31" text-anchor="middle" fill="#1F3D5B">空</text><text x="827.5" y="261" font-size="25" text-anchor="middle" fill="#1F3D5B">(3,1)</text><rect x="915" y="170" width="175" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="1002.5" y="213" font-size="31" text-anchor="middle" fill="#1F3D5B">空</text><text x="1002.5" y="261" font-size="25" text-anchor="middle" fill="#1F3D5B">(4,1)</text><text x="390" y="330" font-size="27" text-anchor="start" fill="#1F3D5B">すべての行き先を、この位置から判定</text><text x="65" y="447" font-size="28" text-anchor="start" fill="#1F3D5B">② 判定</text><text x="65" y="494" font-size="25" text-anchor="start" fill="#1F3D5B">行 y＝1</text><rect x="390" y="395" width="175" height="115" rx="0" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><text x="477.5" y="438" font-size="31" text-anchor="middle" fill="#1F3D5B">A</text><text x="477.5" y="486" font-size="25" text-anchor="middle" fill="#1F3D5B">(1,1)</text><rect x="565" y="395" width="175" height="115" rx="0" fill="#FFD35A" stroke="#1F3D5B" stroke-width="2"/><text x="652.5" y="438" font-size="31" text-anchor="middle" fill="#1F3D5B">B</text><text x="652.5" y="486" font-size="25" text-anchor="middle" fill="#1F3D5B">(2,1)</text><rect x="740" y="395" width="175" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="827.5" y="438" font-size="31" text-anchor="middle" fill="#1F3D5B">空</text><text x="827.5" y="486" font-size="25" text-anchor="middle" fill="#1F3D5B">(3,1)</text><rect x="915" y="395" width="175" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="1002.5" y="438" font-size="31" text-anchor="middle" fill="#1F3D5B">空</text><text x="1002.5" y="486" font-size="25" text-anchor="middle" fill="#1F3D5B">(4,1)</text><path d="M477.5 365 L652.5 365" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="565" y="350" font-size="23" text-anchor="middle" fill="#1F3D5B">Aの希望</text><path d="M652.5 540 L827.5 540" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="740" y="585" font-size="25" text-anchor="middle" fill="#1F3D5B">B：空きへ進める</text><text x="65" y="555" font-size="25" text-anchor="start" fill="#1F3D5B">A：Bがいるので止まる</text><text x="65" y="702" font-size="28" text-anchor="start" fill="#1F3D5B">③ 1刻み後</text><text x="65" y="749" font-size="25" text-anchor="start" fill="#1F3D5B">行 y＝1</text><rect x="390" y="650" width="175" height="115" rx="0" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><text x="477.5" y="693" font-size="31" text-anchor="middle" fill="#1F3D5B">A</text><text x="477.5" y="741" font-size="25" text-anchor="middle" fill="#1F3D5B">(1,1)</text><rect x="565" y="650" width="175" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="652.5" y="693" font-size="31" text-anchor="middle" fill="#1F3D5B">空</text><text x="652.5" y="741" font-size="25" text-anchor="middle" fill="#1F3D5B">(2,1)</text><rect x="740" y="650" width="175" height="115" rx="0" fill="#FFD35A" stroke="#1F3D5B" stroke-width="2"/><text x="827.5" y="693" font-size="31" text-anchor="middle" fill="#1F3D5B">B</text><text x="827.5" y="741" font-size="25" text-anchor="middle" fill="#1F3D5B">(3,1)</text><rect x="915" y="650" width="175" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="1002.5" y="693" font-size="31" text-anchor="middle" fill="#1F3D5B">空</text><text x="1002.5" y="741" font-size="25" text-anchor="middle" fill="#1F3D5B">(4,1)</text><text x="390" y="815" font-size="26" text-anchor="start" fill="#1F3D5B">(2,1)が空いても、Aはこの刻みでは進めない。</text><text x="65" y="932" font-size="28" text-anchor="start" fill="#1F3D5B">④ 2刻み後</text><text x="65" y="979" font-size="25" text-anchor="start" fill="#1F3D5B">行 y＝1</text><rect x="390" y="880" width="175" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="477.5" y="923" font-size="31" text-anchor="middle" fill="#1F3D5B">空</text><text x="477.5" y="971" font-size="25" text-anchor="middle" fill="#1F3D5B">(1,1)</text><rect x="565" y="880" width="175" height="115" rx="0" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><text x="652.5" y="923" font-size="31" text-anchor="middle" fill="#1F3D5B">A</text><text x="652.5" y="971" font-size="25" text-anchor="middle" fill="#1F3D5B">(2,1)</text><rect x="740" y="880" width="175" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="827.5" y="923" font-size="31" text-anchor="middle" fill="#1F3D5B">空</text><text x="827.5" y="971" font-size="25" text-anchor="middle" fill="#1F3D5B">(3,1)</text><rect x="915" y="880" width="175" height="115" rx="0" fill="#FFD35A" stroke="#1F3D5B" stroke-width="2"/><text x="1002.5" y="923" font-size="31" text-anchor="middle" fill="#1F3D5B">B</text><text x="1002.5" y="971" font-size="25" text-anchor="middle" fill="#1F3D5B">(4,1)</text><text x="40" y="1065" font-size="27" text-anchor="start" fill="#1F3D5B">次の刻み：Aは1→2、Bは3→4。どちらも1マスだけ進みます。</text><text x="40" y="1130" font-size="25" text-anchor="start" fill="#1F3D5B">この工場の簡略ルールでは、材料で埋まった輪の経路は止まります。</text><text x="40" y="1170" font-size="22" text-anchor="start" fill="#1F3D5B">各行は同じ縮尺。刻みごとに開始時の配置を取り直して判定します。</text></svg>