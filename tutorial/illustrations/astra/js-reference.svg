<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc" lang="ja"><title id="title">参照とコピー：矢印の先が同じか確かめる</title><desc id="desc">上段の独立例ではoriginalとaliasが同じ配列を指し、copyは別配列。aliasの0を9にするとoriginalは9,2、copyは1,2。下段の独立例ではboardとcopiedの外側は別、内側の配列は共有。copied[0][0]=9で両方から9が読める。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="1220" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">参照とコピー：矢印の先が同じか確かめる</text><text x="40" y="110" font-size="25" text-anchor="start" fill="#20364b">上と下は独立した例です。矢印は「同じデータを指す」関係を示します。</text><rect x="40" y="145" width="1120" height="395" rx="12" fill="#edf3f8" stroke="#607a90" stroke-width="2"/><text x="65" y="190" font-size="29" text-anchor="start" fill="#20364b">例1：平らな配列をコピーする</text><rect x="70" y="220" width="240" height="110" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="92" y="262" font-size="26" text-anchor="start" fill="#20364b">変数</text><text x="92" y="315" font-size="30" text-anchor="start" fill="#20364b">original</text><rect x="70" y="375" width="240" height="110" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="92" y="417" font-size="26" text-anchor="start" fill="#20364b">変数</text><text x="92" y="470" font-size="30" text-anchor="start" fill="#20364b">alias</text><rect x="425" y="280" width="280" height="110" rx="12" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="565" y="325" font-size="35" text-anchor="middle" fill="#20364b">[9, 2]</text><text x="565" y="370" font-size="25" text-anchor="middle" fill="#20364b">0番：1 → 9</text><path d="M325 275 L410 315" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M325 430 L410 355" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="805" y="220" width="320" height="265" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="830" y="265" font-size="25" text-anchor="start" fill="#20364b">copy = [...original]</text><text x="965" y="345" font-size="35" text-anchor="middle" fill="#20364b">[1, 2]</text><text x="830" y="425" font-size="25" text-anchor="start" fill="#20364b">別の配列なので不変</text><text x="65" y="520" font-size="27" text-anchor="start" fill="#20364b">alias[0] = 9 → originalは9,2 ／ copyは1,2</text><rect x="40" y="570" width="1120" height="530" rx="12" fill="#f3f0fa" stroke="#607a90" stroke-width="2"/><text x="65" y="615" font-size="29" text-anchor="start" fill="#20364b">例2：配列の中に配列があると、内側は共有</text><text x="65" y="660" font-size="27" text-anchor="start" fill="#20364b">board = [[1,2],[3,4]] ／ copied = [...board]</text><rect x="70" y="710" width="310" height="130" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="95" y="750" font-size="27" text-anchor="start" fill="#20364b">board：外側A</text><text x="130" y="805" font-size="27" text-anchor="start" fill="#20364b">[0]</text><text x="280" y="805" font-size="27" text-anchor="start" fill="#20364b">[1]</text><rect x="820" y="710" width="310" height="130" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="845" y="750" font-size="27" text-anchor="start" fill="#20364b">copied：外側B</text><text x="875" y="805" font-size="27" text-anchor="start" fill="#20364b">[0]</text><text x="1030" y="805" font-size="27" text-anchor="start" fill="#20364b">[1]</text><rect x="225" y="900" width="310" height="105" rx="12" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="380" y="945" font-size="30" text-anchor="middle" fill="#20364b">内側 [9, 2]</text><text x="380" y="985" font-size="24" text-anchor="middle" fill="#20364b">0番：1 → 9</text><rect x="665" y="900" width="310" height="105" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="820" y="960" font-size="30" text-anchor="middle" fill="#20364b">内側 [3, 4]</text><path d="M145 850 L285 885" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M890 850 L475 885" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M295 850 L715 885" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1045 850 L925 885" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="1060" font-size="26" text-anchor="start" fill="#20364b">copied[0][0] = 9 → board[0][0]も copied[0][0]も9</text><text x="40" y="1150" font-size="28" text-anchor="start" fill="#20364b">board === copied → false：外側は別</text><text x="40" y="1200" font-size="27" text-anchor="start" fill="#20364b">board[0] === copied[0] → true：内側の同じ配列を指す</text></svg>