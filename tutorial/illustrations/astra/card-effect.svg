<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc" lang="ja"><title id="title">攻撃・防御・回復で、数はどう変わる？</title><desc id="desc">攻撃・防御・回復で、数はどう変わる？カード1枚の効果を、HPの棒と盾で見てみよう。説明用の3例です。どのカードも1枚で行動力1を消費します。攻撃で敵HP18→12。防御4で攻撃6を受けるとダメージ2。HP28からの回復は30まで。模式図：HPの棒はそれぞれの例の中で同じ縮尺。盾とカードは見やすく拡大しています。敵HP18はすでに攻撃を受けた場面で、敵の最初のHPは24です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="1130" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">攻撃・防御・回復で、数はどう変わる？</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">カード1枚の効果を、HPの棒と盾で見てみよう。</text><rect id="attack-example" x="40" y="150" width="1120" height="230" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="defend-example" x="40" y="405" width="1120" height="230" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="heal-example" x="40" y="660" width="1120" height="250" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="attack-card" x="75" y="216" width="120" height="110" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="135.0" y="281.0" font-size="26" text-anchor="middle" fill="#20364b">攻撃</text><text x="135" y="200" font-size="27" text-anchor="middle" fill="#20364b">効果6</text><text x="355" y="245" font-size="25" text-anchor="middle" fill="#20364b">行動力</text><text x="355" y="297" font-size="38" text-anchor="middle" fill="#20364b">2 → 1</text><text x="630" y="205" font-size="28" text-anchor="start" fill="#20364b">敵のHP</text><text x="600" y="256" font-size="26" text-anchor="end" fill="#20364b">前18</text><rect id="enemy-hp-before" x="630" y="230" width="270" height="30" rx="0" fill="#e6a7b1" stroke="#ad334b" stroke-width="3"/><text x="600" y="320" font-size="26" text-anchor="end" fill="#20364b">後12</text><rect id="enemy-hp-after" x="630" y="294" width="180" height="30" rx="0" fill="#e6a7b1" stroke="#ad334b" stroke-width="3"/><text x="1000" y="293" font-size="32" text-anchor="middle" fill="#20364b">6減る</text><text x="90" y="452" font-size="31" text-anchor="start" fill="#20364b">防御4</text><text x="220" y="520" font-size="30" text-anchor="middle" fill="#20364b">敵の攻撃6</text><path d="M330 511L420 511" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path id="shield" d="M465 460H595V515Q585 568 530 592Q475 568 465 515Z" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="530" y="510" font-size="28" text-anchor="middle" fill="#20364b">盾</text><text x="530" y="551" font-size="27" text-anchor="middle" fill="#20364b">4防ぐ</text><path d="M620 511L710 511" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="920" y="510" font-size="33" text-anchor="middle" fill="#20364b">受けるダメージ2</text><text x="920" y="565" font-size="27" text-anchor="middle" fill="#20364b">6のうち4を防ぐ</text><rect id="heal-card" x="75" y="734" width="120" height="110" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="135.0" y="799.0" font-size="26" text-anchor="middle" fill="#20364b">回復</text><text x="135" y="713" font-size="27" text-anchor="middle" fill="#20364b">効果5</text><text x="355" y="773" font-size="30" text-anchor="middle" fill="#20364b">HP28で</text><text x="355" y="822" font-size="35" text-anchor="middle" fill="#20364b">5回復</text><text x="660" y="710" font-size="28" text-anchor="start" fill="#20364b">自分のHP（最大30）</text><rect id="hp-max-before" x="650" y="746" width="420" height="30" rx="0" fill="#eef1f4" stroke="#93a9bb" stroke-width="3"/><rect id="hp-28" x="650" y="746" width="392" height="30" rx="0" fill="#b9dfce" stroke="#398164" stroke-width="3"/><text x="620" y="772" font-size="25" text-anchor="end" fill="#20364b">前28</text><rect id="hp-30" x="650" y="811" width="420" height="30" rx="0" fill="#b9dfce" stroke="#398164" stroke-width="3"/><text x="620" y="837" font-size="25" text-anchor="end" fill="#20364b">後30</text><text x="860" y="881" font-size="29" text-anchor="middle" fill="#20364b">最大30を越えない</text><text x="48" y="1023" font-size="21" text-anchor="start" fill="#20364b">説明用の3例です。どのカードも1枚で行動力1を消費します。</text><text x="48" y="1059" font-size="21" text-anchor="start" fill="#20364b">攻撃で敵HP18→12。防御4で攻撃6を受けるとダメージ2。HP28からの回復は30まで。</text><text x="48" y="1095" font-size="21" text-anchor="start" fill="#20364b">模式図：HPの棒はそれぞれの例の中で同じ縮尺。盾とカードは見やすく拡大しています。</text><text x="48" y="987" font-size="21" text-anchor="start" fill="#20364b">敵HP18は、すでに攻撃を受けた場面の例です。敵の最初のHPは24です。</text></svg>