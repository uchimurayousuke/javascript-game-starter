<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">RPG：敵を倒してレベルアップ</title><desc id="desc">RPG：敵を倒してレベルアップ。発展3 ／ 1回反撃され、HPが8になった場面の例。実装の値を使った状態比較です。レベル1から2に上がる条件は経験値4。HPは全回復ではなく＋2（最大12まで）。図の枠はHP1を表します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">RPG：敵を倒してレベルアップ</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">発展3 ／ 1回反撃され、HPが8になった場面の例。</text><rect id="before" x="60" y="175" width="390" height="420" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="after" x="550" y="175" width="390" height="420" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="90" y="225" font-size="28" text-anchor="start" fill="#20364b">最後の攻撃の前</text><text x="90" y="285" font-size="30" text-anchor="start" fill="#20364b">レベル 1</text><text x="90" y="340" font-size="28" text-anchor="start" fill="#20364b">経験値 0</text><text x="90" y="400" font-size="30" text-anchor="start" fill="#20364b">HP 8 / 10</text><rect id="h90-0" x="90" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h90-1" x="117" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h90-2" x="144" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h90-3" x="171" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h90-4" x="198" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h90-5" x="225" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h90-6" x="252" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h90-7" x="279" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h90-8" x="306" y="435" width="24" height="45" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><rect id="h90-9" x="333" y="435" width="24" height="45" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><rect id="h90-10" x="360" y="435" width="24" height="45" rx="0" fill="#e0e3e8" stroke="#708391" stroke-width="3"/><rect id="h90-11" x="387" y="435" width="24" height="45" rx="0" fill="#e0e3e8" stroke="#708391" stroke-width="3"/><text x="90" y="540" font-size="27" text-anchor="start" fill="#20364b">最大HP：10</text><text x="580" y="225" font-size="28" text-anchor="start" fill="#20364b">敵を倒したあと</text><text x="580" y="285" font-size="30" text-anchor="start" fill="#20364b">レベル 2</text><text x="580" y="340" font-size="28" text-anchor="start" fill="#20364b">経験値 4</text><text x="580" y="400" font-size="30" text-anchor="start" fill="#20364b">HP 10 / 12</text><rect id="h580-0" x="580" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h580-1" x="607" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h580-2" x="634" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h580-3" x="661" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h580-4" x="688" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h580-5" x="715" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h580-6" x="742" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h580-7" x="769" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h580-8" x="796" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h580-9" x="823" y="435" width="24" height="45" rx="0" fill="#82c6a2" stroke="#708391" stroke-width="3"/><rect id="h580-10" x="850" y="435" width="24" height="45" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><rect id="h580-11" x="877" y="435" width="24" height="45" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="580" y="540" font-size="27" text-anchor="start" fill="#20364b">最大HP：12</text><path d="M465 365L535 365" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="635" font-size="27" text-anchor="middle" fill="#20364b">経験値＋4 → レベル2 → 最大HP＋2・現在HP＋2</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">実装の値を使った状態比較です。レベル1から2に上がる条件は経験値4。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">HPは全回復ではなく＋2（最大12まで）。図の枠はHP1を表します。</text></svg>