<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc" lang="ja"><title id="title">値下げで買い手が増えても、在庫が上限</title><desc id="desc">値下げで買い手が増えても、在庫が上限。基準の需要が2、パンの在庫が2個ある日の説明例です。基準35から30へ値下げすると需要は＋1で3。販売数は在庫を超えません。模式図：その日の出来事による増加がない場合を比べています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="850" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">値下げで買い手が増えても、在庫が上限</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基準の需要が2、パンの在庫が2個ある日の説明例です。</text><rect id="price-35" x="40" y="160" width="430" height="475" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="255" y="208" font-size="28" text-anchor="middle" fill="#20364b">基準の値段</text><rect id="price-tag-0" x="135" y="240" width="240" height="75" rx="12" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="255" y="289" font-size="30" text-anchor="middle" fill="#20364b">パン1個 35</text><text x="255" y="365" font-size="27" text-anchor="middle" fill="#20364b">買いたい人数 2</text><circle id="buyer-0-0" cx="140" cy="410" r="16" fill="#ffe29a" stroke="#936315" stroke-width="3"/><rect id="buyer-body-0-0" x="123" y="433" width="34" height="40" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><circle id="buyer-0-1" cx="235" cy="410" r="16" fill="#ffe29a" stroke="#936315" stroke-width="3"/><rect id="buyer-body-0-1" x="218" y="433" width="34" height="40" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="255" y="535" font-size="29" text-anchor="middle" fill="#20364b">在庫は2個</text><text x="255" y="590" font-size="30" text-anchor="middle" fill="#20364b">売れるのも2個</text><rect id="price-30" x="530" y="160" width="430" height="475" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="745" y="208" font-size="28" text-anchor="middle" fill="#20364b">5だけ値下げ</text><rect id="price-tag-1" x="625" y="240" width="240" height="75" rx="12" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="745" y="289" font-size="30" text-anchor="middle" fill="#20364b">パン1個 30</text><text x="745" y="365" font-size="27" text-anchor="middle" fill="#20364b">買いたい人数 3</text><circle id="buyer-1-0" cx="630" cy="410" r="16" fill="#ffe29a" stroke="#936315" stroke-width="3"/><rect id="buyer-body-1-0" x="613" y="433" width="34" height="40" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><circle id="buyer-1-1" cx="725" cy="410" r="16" fill="#ffe29a" stroke="#936315" stroke-width="3"/><rect id="buyer-body-1-1" x="708" y="433" width="34" height="40" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><circle id="buyer-1-2" cx="820" cy="410" r="16" fill="#ffe29a" stroke="#936315" stroke-width="3"/><rect id="buyer-body-1-2" x="803" y="433" width="34" height="40" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="745" y="535" font-size="29" text-anchor="middle" fill="#20364b">在庫は2個</text><text x="745" y="590" font-size="30" text-anchor="middle" fill="#20364b">売れるのも2個</text><text x="500" y="702" font-size="29" text-anchor="middle" fill="#20364b">買いたい人が3人いても、在庫2個まで</text><text x="40" y="786" font-size="19" text-anchor="start" fill="#20364b">基準35から30へ値下げすると需要は＋1で3。販売数は在庫を超えません。</text><text x="40" y="818" font-size="19" text-anchor="start" fill="#20364b">模式図：その日の出来事による増加がない場合を比べています。</text></svg>