<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc" lang="ja"><title id="title">毒は、敵が行動する前に効く</title><desc id="desc">毒は、敵が行動する前に効く。敵HP6から、2ダメージが3回続く説明例です。HPは6 → 4 → 2 → 0。最後の毒で倒れた敵は、予告していた行動をしません。模式図：毒以外でHPが減らない例。3つの箱は同じ敵の3回の手番です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="790" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">毒は、敵が行動する前に効く</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">敵HP6から、2ダメージが3回続く説明例です。</text><rect id="poison-turn-1" x="40" y="165" width="260" height="400" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="170" y="210" font-size="25" text-anchor="middle" fill="#20364b">敵の番 1回目</text><circle id="poison-0" cx="170" cy="280" r="33" fill="#e5d3f3" stroke="#8455a5" stroke-width="3"/><text x="170" y="289" font-size="24" text-anchor="middle" fill="#20364b">毒2</text><rect id="enemy-0" x="105" y="345" width="130" height="105" rx="0" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><text x="170" y="384" font-size="26" text-anchor="middle" fill="#20364b">敵</text><text x="170" y="428" font-size="32" text-anchor="middle" fill="#20364b">HP 4</text><text x="170" y="520" font-size="22" text-anchor="middle" fill="#20364b">その後に行動</text><path d="M312 395L358 395" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="poison-turn-2" x="370" y="165" width="260" height="400" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="500" y="210" font-size="25" text-anchor="middle" fill="#20364b">敵の番 2回目</text><circle id="poison-1" cx="500" cy="280" r="33" fill="#e5d3f3" stroke="#8455a5" stroke-width="3"/><text x="500" y="289" font-size="24" text-anchor="middle" fill="#20364b">毒2</text><rect id="enemy-1" x="435" y="345" width="130" height="105" rx="0" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><text x="500" y="384" font-size="26" text-anchor="middle" fill="#20364b">敵</text><text x="500" y="428" font-size="32" text-anchor="middle" fill="#20364b">HP 2</text><text x="500" y="520" font-size="22" text-anchor="middle" fill="#20364b">その後に行動</text><path d="M642 395L688 395" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="poison-turn-3" x="700" y="165" width="260" height="400" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="830" y="210" font-size="25" text-anchor="middle" fill="#20364b">敵の番 3回目</text><circle id="poison-2" cx="830" cy="280" r="33" fill="#e5d3f3" stroke="#8455a5" stroke-width="3"/><text x="830" y="289" font-size="24" text-anchor="middle" fill="#20364b">毒2</text><rect id="enemy-2" x="765" y="345" width="130" height="105" rx="0" fill="#ffe0e5" stroke="#ad334b" stroke-width="3" stroke-dasharray="8 6"/><text x="830" y="384" font-size="26" text-anchor="middle" fill="#20364b">敵</text><text x="830" y="428" font-size="32" text-anchor="middle" fill="#20364b">HP 0</text><text x="830" y="520" font-size="22" text-anchor="middle" fill="#20364b">倒れたので行動なし</text><text x="500" y="634" font-size="29" text-anchor="middle" fill="#20364b">先に毒のダメージ → 生きていれば行動</text><text x="40" y="726" font-size="19" text-anchor="start" fill="#20364b">HPは6 → 4 → 2 → 0。最後の毒で倒れた敵は、予告していた行動をしません。</text><text x="40" y="758" font-size="19" text-anchor="start" fill="#20364b">模式図：毒以外でHPが減らない例。3つの箱は同じ敵の3回の手番です。</text></svg>