<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc" lang="ja"><title id="title">サッカー：ボール全体が線を越えたら</title><desc id="desc">サッカー：ボール全体が線を越えたら。基本5 ／ 半径8pxを使って、球の端を調べる。境界付近を4倍に拡大。茶色の線は上段が右ゴール線、下段が開口の上端。右：中心−8＞750。左：中心＋8＜50。縦：中心−8≧170 かつ 中心＋8≦280。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="850" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">サッカー：ボール全体が線を越えたら</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本5 ／ 半径8pxを使って、球の端を調べる。</text><rect id="x0" x="50" y="155" width="430" height="245" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="75" y="195" font-size="26" text-anchor="start" fill="#20364b">右ゴール：中心 x＝758</text><path d="M155 225 L155 335" fill="none" stroke="#b97819" stroke-width="4"/><circle id="xb0" cx="187" cy="280" r="32" fill="#fff" stroke="#34495e" stroke-width="3"/><circle id="xc0" cx="187" cy="280" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="265" y="260" font-size="27" text-anchor="start" fill="#20364b">まだ未得点</text><text x="265" y="305" font-size="25" text-anchor="start" fill="#20364b">左端 750</text><text x="75" y="375" font-size="24" text-anchor="start" fill="#20364b">758 − 8 ＝750：線に接する</text><rect id="x1" x="520" y="155" width="430" height="245" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="545" y="195" font-size="26" text-anchor="start" fill="#20364b">右ゴール：中心 x＝759</text><path d="M625 225 L625 335" fill="none" stroke="#b97819" stroke-width="4"/><circle id="xb1" cx="661" cy="280" r="32" fill="#fff" stroke="#34495e" stroke-width="3"/><circle id="xc1" cx="661" cy="280" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="735" y="260" font-size="27" text-anchor="start" fill="#20364b">自分に1点</text><text x="735" y="305" font-size="25" text-anchor="start" fill="#20364b">左端 751</text><text x="545" y="375" font-size="24" text-anchor="start" fill="#20364b">759 − 8 ＝751：線を越えた</text><rect id="y0" x="50" y="435" width="430" height="245" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="75" y="475" font-size="26" text-anchor="start" fill="#20364b">縦の判定：中心 y＝178</text><path d="M100 515 L230 515" fill="none" stroke="#b97819" stroke-width="4"/><circle id="yb0" cx="165" cy="547" r="32" fill="#fff" stroke="#34495e" stroke-width="3"/><circle id="yc0" cx="165" cy="547" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="265" y="540" font-size="25" text-anchor="start" fill="#20364b">開口に収まる</text><text x="265" y="585" font-size="25" text-anchor="start" fill="#20364b">上端 170</text><text x="75" y="655" font-size="25" text-anchor="start" fill="#20364b">178 − 8 ＝ 170</text><rect id="y1" x="520" y="435" width="430" height="245" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="545" y="475" font-size="26" text-anchor="start" fill="#20364b">縦の判定：中心 y＝177</text><path d="M570 515 L700 515" fill="none" stroke="#b97819" stroke-width="4"/><circle id="yb1" cx="635" cy="543" r="32" fill="#fff" stroke="#34495e" stroke-width="3"/><circle id="yc1" cx="635" cy="543" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="735" y="540" font-size="25" text-anchor="start" fill="#20364b">上に1はみ出す</text><text x="735" y="585" font-size="25" text-anchor="start" fill="#20364b">上端 169</text><text x="545" y="655" font-size="25" text-anchor="start" fill="#20364b">177 − 8 ＝ 169</text><text x="500" y="730" font-size="28" text-anchor="middle" fill="#20364b">球全体がゴールを通ると1点。先に3点で勝ち。</text><text x="40" y="786" font-size="19" text-anchor="start" fill="#20364b">境界付近を4倍に拡大。茶色の線は上段が右ゴール線、下段が開口の上端。</text><text x="40" y="818" font-size="19" text-anchor="start" fill="#20364b">右：中心−8＞750。左：中心＋8＜50。縦：中心−8≧170 かつ 中心＋8≦280。</text></svg>