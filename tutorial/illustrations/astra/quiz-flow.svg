<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc" lang="ja"><title id="title">選んだ答えが一致したら、1点増やす</title><desc id="desc">選んだ答えが一致したら、1点増やす。「3＋4」の問題で、キー2を押して答え7を選ぶ例です。コードでは押した番号から1を引き、正解の内部番号と比べます。模式図：画面の番号2と、配列の番号1を混同しないように並べています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="880" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">選んだ答えが一致したら、1点増やす</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">「3＋4」の問題で、キー2を押して答え7を選ぶ例です。</text><rect id="input" x="40" y="160" width="420" height="315" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="correct" x="540" y="160" width="420" height="315" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="250" y="209" font-size="28" text-anchor="middle" fill="#20364b">押したキー</text><rect id="key-2" x="165" y="240" width="170" height="120" rx="16" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="250" y="323" font-size="58" text-anchor="middle" fill="#20364b">2</text><text x="250" y="420" font-size="30" text-anchor="middle" fill="#20364b">選んだ答えは7</text><text x="750" y="209" font-size="28" text-anchor="middle" fill="#20364b">正しい答え</text><circle id="answer-seven" cx="750" cy="301" r="70" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="750" y="320" font-size="52" text-anchor="middle" fill="#20364b">7</text><text x="750" y="420" font-size="28" text-anchor="middle" fill="#20364b">選択肢2の場所</text><text x="250" y="527" font-size="27" text-anchor="middle" fill="#20364b">2 − 1 → 内部の番号1</text><text x="750" y="527" font-size="27" text-anchor="middle" fill="#20364b">正解も内部の番号1</text><path d="M250 550V590H500 M750 550V590H500" fill="none" stroke="#34495e" stroke-width="3"/><path d="M500 590L500 625" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="result" x="250" y="640" width="500" height="100" rx="14" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="500" y="702" font-size="35" text-anchor="middle" fill="#20364b">一致！ 得点0 → 1</text><text x="40" y="816" font-size="19" text-anchor="start" fill="#20364b">コードでは押した番号から1を引き、正解の内部番号と比べます。</text><text x="40" y="848" font-size="19" text-anchor="start" fill="#20364b">模式図：画面の番号2と、配列の番号1を混同しないように並べています。</text></svg>