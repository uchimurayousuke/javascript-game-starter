<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc" lang="ja"><title id="title">カードの番号から、行と列を求めよう</title><desc id="desc">8枚のカードを4列2行に置く。番号5は5%4=1列、floor(5/4)=1行。右キーで7から0、左キーで0から7へ戻る。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="840" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#20364b">カードの番号から、行と列を求めよう</text><text x="40" y="105" font-size="25" text-anchor="start" fill="#20364b">神経衰弱 基本1〜2 ／ 番号・行・列はすべて0から始まります。</text><text x="55" y="240" font-size="24" text-anchor="start" fill="#20364b">行0</text><text x="170" y="160" font-size="24" text-anchor="middle" fill="#20364b">列0</text><rect x="105" y="180" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="170" y="245" font-size="27" text-anchor="middle" fill="#20364b">番号0</text><text x="320" y="160" font-size="24" text-anchor="middle" fill="#20364b">列1</text><rect x="255" y="180" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="320" y="245" font-size="27" text-anchor="middle" fill="#20364b">番号1</text><text x="470" y="160" font-size="24" text-anchor="middle" fill="#20364b">列2</text><rect x="405" y="180" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="470" y="245" font-size="27" text-anchor="middle" fill="#20364b">番号2</text><text x="620" y="160" font-size="24" text-anchor="middle" fill="#20364b">列3</text><rect x="555" y="180" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="620" y="245" font-size="27" text-anchor="middle" fill="#20364b">番号3</text><text x="55" y="385" font-size="24" text-anchor="start" fill="#20364b">行1</text><rect x="105" y="325" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="170" y="390" font-size="27" text-anchor="middle" fill="#20364b">番号4</text><rect x="255" y="325" width="130" height="125" rx="12" fill="#ffdfac" stroke="#657e91" stroke-width="2"/><text x="320" y="390" font-size="27" text-anchor="middle" fill="#20364b">番号5</text><rect x="405" y="325" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="470" y="390" font-size="27" text-anchor="middle" fill="#20364b">番号6</text><rect x="555" y="325" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="620" y="390" font-size="27" text-anchor="middle" fill="#20364b">番号7</text><rect x="750" y="175" width="410" height="285" rx="12" fill="#e9f3e9" stroke="#657e91" stroke-width="2"/><text x="775" y="220" font-size="28" text-anchor="start" fill="#20364b">番号5を調べる</text><text x="775" y="270" font-size="25" text-anchor="start" fill="#20364b">5 ÷ 4＝1 あまり1</text><text x="775" y="320" font-size="27" text-anchor="start" fill="#20364b">列：5 % 4＝1</text><text x="775" y="370" font-size="25" text-anchor="start" fill="#20364b">行：floor(5 / 4)＝1</text><text x="775" y="425" font-size="25" text-anchor="start" fill="#20364b">2行目・左から2枚目</text><text x="40" y="510" font-size="25" text-anchor="start" fill="#20364b">カード左上：x＝160＋1×120＝280、y＝90＋1×130＝220</text><rect x="40" y="555" width="550" height="170" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><rect x="620" y="555" width="540" height="170" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="65" y="600" font-size="27" text-anchor="start" fill="#20364b">番号7で右キー → 番号0</text><text x="65" y="660" font-size="29" text-anchor="start" fill="#20364b">(7＋1) % 8＝0</text><text x="645" y="600" font-size="27" text-anchor="start" fill="#20364b">番号0で左キー → 番号7</text><text x="645" y="660" font-size="29" text-anchor="start" fill="#20364b">(0＋8−1) % 8＝7</text><text x="40" y="780" font-size="22" text-anchor="start" fill="#20364b">図は番号の配置図です。カードの文字・選択枠は省略し、間隔を広げています。</text></svg>