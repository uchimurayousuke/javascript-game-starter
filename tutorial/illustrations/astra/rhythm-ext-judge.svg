<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc" lang="ja"><title id="title">リズム：レーンと時刻差で判定する</title><desc id="desc">リズム：レーンと時刻差で判定する。発展3 ／ レーンが合っていても、時刻差で結果が変わります。判定条件の模式図。差は絶対値なので、早い場合・遅い場合を同じ値で比べます。遅れが150msを超えた未判定の拍は、更新で「見逃し」になります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="820" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">リズム：レーンと時刻差で判定する</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">発展3 ／ レーンが合っていても、時刻差で結果が変わります。</text><text x="500" y="175" font-size="27" text-anchor="middle" fill="#20364b">押したキーのレーンで、最も近い未判定の拍を選ぶ</text><rect id="d" x="70" y="220" width="390" height="120" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="265.0" y="265" font-size="29" text-anchor="middle" fill="#20364b">Dキー：左レーン</text><text x="265.0" y="308" font-size="23" text-anchor="middle" fill="#20364b">Fのノートは判定しない</text><rect id="f" x="540" y="220" width="390" height="120" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="735.0" y="265" font-size="29" text-anchor="middle" fill="#20364b">Fキー：右レーン</text><text x="735.0" y="308" font-size="23" text-anchor="middle" fill="#20364b">Dのノートは判定しない</text><text x="500" y="410" font-size="29" text-anchor="middle" fill="#20364b">時刻の差 ＝ | 押した時刻 − 予定時刻 |</text><rect id="j0" x="40" y="460" width="225" height="145" rx="16" fill="#d4efde" stroke="#a9bdcf" stroke-width="3"/><text x="152.5" y="505" font-size="29" text-anchor="middle" fill="#20364b">差 60ms</text><text x="152.5" y="548" font-size="23" text-anchor="middle" fill="#20364b">Perfect</text><rect id="j1" x="285" y="460" width="225" height="145" rx="16" fill="#fff0c7" stroke="#a9bdcf" stroke-width="3"/><text x="397.5" y="505" font-size="29" text-anchor="middle" fill="#20364b">差 61ms</text><text x="397.5" y="548" font-size="23" text-anchor="middle" fill="#20364b">Good</text><rect id="j2" x="530" y="460" width="225" height="145" rx="16" fill="#fff0c7" stroke="#a9bdcf" stroke-width="3"/><text x="642.5" y="505" font-size="29" text-anchor="middle" fill="#20364b">差 150ms</text><text x="642.5" y="548" font-size="23" text-anchor="middle" fill="#20364b">Good</text><rect id="j3" x="775" y="460" width="225" height="145" rx="16" fill="#e4e7ec" stroke="#a9bdcf" stroke-width="3"/><text x="887.5" y="505" font-size="29" text-anchor="middle" fill="#20364b">差 151ms</text><text x="887.5" y="548" font-size="23" text-anchor="middle" fill="#20364b">成功しない</text><text x="500" y="670" font-size="26" text-anchor="middle" fill="#20364b">60ms以内はPerfect、60msを超え150ms以内はGood。</text><text x="40" y="756" font-size="19" text-anchor="start" fill="#20364b">判定条件の模式図。差は絶対値なので、早い場合・遅い場合を同じ値で比べます。</text><text x="40" y="788" font-size="19" text-anchor="start" fill="#20364b">遅れが150msを超えた未判定の拍は、更新で「見逃し」になります。</text></svg>