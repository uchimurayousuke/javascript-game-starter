<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">リズム：早くても遅くても150ms以内</title><desc id="desc">リズム：早くても遅くても150ms以内。基本3 ／ Spaceで、最も近い未判定の拍を調べます。時間軸は1msを2pxで表示。下のカードは境界を確かめる例です。1850msと2150msは成功。成功した拍は判定済みになり、二重に得点しません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">リズム：早くても遅くても150ms以内</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ Spaceで、最も近い未判定の拍を調べます。</text><rect id="range" x="200" y="230" width="600" height="100" rx="0" fill="#d4efde" stroke="#538b68" stroke-width="3"/><text x="500" y="290" font-size="29" text-anchor="middle" fill="#20364b">成功する範囲：差が150ms以内</text><path d="M100 360L920 360" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M200 345 L200 375" fill="none" stroke="#34495e" stroke-width="3"/><text x="200" y="415" font-size="27" text-anchor="middle" fill="#20364b">1850ms</text><path d="M500 345 L500 375" fill="none" stroke="#34495e" stroke-width="3"/><text x="500" y="415" font-size="27" text-anchor="middle" fill="#20364b">2000ms</text><path d="M800 345 L800 375" fill="none" stroke="#34495e" stroke-width="3"/><text x="800" y="415" font-size="27" text-anchor="middle" fill="#20364b">2150ms</text><text x="500" y="465" font-size="26" text-anchor="middle" fill="#20364b">予定時刻2000msの、まだ判定していない拍</text><rect id="edge0" x="40" y="520" width="225" height="120" rx="16" fill="#e4e7ec" stroke="#a9bdcf" stroke-width="3"/><text x="152.5" y="565" font-size="29" text-anchor="middle" fill="#20364b">1849ms</text><text x="152.5" y="608" font-size="23" text-anchor="middle" fill="#20364b">成功しない</text><rect id="edge1" x="285" y="520" width="225" height="120" rx="16" fill="#d4efde" stroke="#a9bdcf" stroke-width="3"/><text x="397.5" y="565" font-size="29" text-anchor="middle" fill="#20364b">1850ms</text><text x="397.5" y="608" font-size="23" text-anchor="middle" fill="#20364b">成功</text><rect id="edge2" x="530" y="520" width="225" height="120" rx="16" fill="#d4efde" stroke="#a9bdcf" stroke-width="3"/><text x="642.5" y="565" font-size="29" text-anchor="middle" fill="#20364b">2150ms</text><text x="642.5" y="608" font-size="23" text-anchor="middle" fill="#20364b">成功</text><rect id="edge3" x="775" y="520" width="225" height="120" rx="16" fill="#e4e7ec" stroke="#a9bdcf" stroke-width="3"/><text x="887.5" y="565" font-size="29" text-anchor="middle" fill="#20364b">2151ms</text><text x="887.5" y="608" font-size="23" text-anchor="middle" fill="#20364b">成功しない</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">時間軸は1msを2pxで表示。下のカードは境界を確かめる例です。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">1850msと2150msは成功。成功した拍は判定済みになり、二重に得点しません。</text></svg>