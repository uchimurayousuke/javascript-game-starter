<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc" lang="ja"><title id="title">敵より上から落ちてきたら、踏める！</title><desc id="desc">敵より上から落ちてきたら、踏める！動く前の足 → 下向きで重なる → 足をそろえて少しはねる。上の3場面は4倍の拡大図。前の足350、敵の上360、移動後の足362。生きている敵と下向きに重なり、動く前の足が敵の上より上なら成功。動く前の足と敵の上が、同じ高さでもOK。補正で人の上を320、足を360にし、敵を消して速度−8を設定します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="1020" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">敵より上から落ちてきたら、踏める！</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">動く前の足 → 下向きで重なる → 足をそろえて少しはねる。</text><rect id="stomp-stage-0" x="30" y="150" width="365" height="470" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="212" y="195" font-size="28" text-anchor="middle" fill="#20364b">動く前</text><rect id="enemy-0" x="100" y="460" width="120" height="120" rx="0" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><rect id="player-0" x="100" y="260" width="120" height="160" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="160" y="311" font-size="28" text-anchor="middle" fill="#20364b">人</text><text x="160" y="355" font-size="24" text-anchor="middle" fill="#20364b">高さ40</text><text x="160" y="393" font-size="25" text-anchor="middle" fill="#20364b">上310</text><text x="160" y="536" font-size="25" text-anchor="middle" fill="#20364b">敵</text><path d="M220 420H245" fill="none" stroke="#34495e" stroke-width="3"/><text x="250" y="412" font-size="23" text-anchor="start" fill="#20364b">足350</text><text x="250" y="505" font-size="23" text-anchor="start" fill="#20364b">上360</text><path d="M220 460 275 478" fill="none" stroke="#34495e" stroke-width="3"/><path d="M67 300L67 403" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="stomp-stage-1" x="430" y="150" width="365" height="470" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="612" y="195" font-size="28" text-anchor="middle" fill="#20364b">下へ進んだ後</text><rect id="enemy-1" x="500" y="460" width="120" height="120" rx="0" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><rect id="player-1" x="500" y="308" width="120" height="160" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="560" y="359" font-size="28" text-anchor="middle" fill="#20364b">人</text><text x="560" y="403" font-size="24" text-anchor="middle" fill="#20364b">高さ40</text><text x="560" y="441" font-size="25" text-anchor="middle" fill="#20364b">上322</text><text x="560" y="536" font-size="25" text-anchor="middle" fill="#20364b">敵</text><path d="M620 468H645" fill="none" stroke="#34495e" stroke-width="3"/><text x="650" y="460" font-size="23" text-anchor="start" fill="#20364b">足362</text><text x="650" y="505" font-size="23" text-anchor="start" fill="#20364b">上360</text><path d="M620 460 675 478" fill="none" stroke="#34495e" stroke-width="3"/><path d="M467 300L467 403" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="stomp-stage-2" x="830" y="150" width="365" height="470" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="1012" y="195" font-size="28" text-anchor="middle" fill="#20364b">踏んだ後の補正</text><rect id="enemy-2" x="900" y="460" width="120" height="120" rx="0" fill="none" stroke="#ad334b" stroke-width="3" stroke-dasharray="9 6"/><rect id="player-2" x="900" y="300" width="120" height="160" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="960" y="351" font-size="28" text-anchor="middle" fill="#20364b">人</text><text x="960" y="395" font-size="24" text-anchor="middle" fill="#20364b">高さ40</text><text x="960" y="433" font-size="25" text-anchor="middle" fill="#20364b">上320</text><text x="960" y="536" font-size="25" text-anchor="middle" fill="#20364b">消える</text><path d="M1020 460H1045" fill="none" stroke="#34495e" stroke-width="3"/><text x="1050" y="452" font-size="23" text-anchor="start" fill="#20364b">足360</text><text x="1050" y="505" font-size="23" text-anchor="start" fill="#20364b">上360</text><path d="M1020 460 1075 478" fill="none" stroke="#34495e" stroke-width="3"/><path d="M867 400L867 295" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="212" y="657" font-size="27" text-anchor="middle" fill="#20364b">350 ≤ 360</text><text x="612" y="657" font-size="26" text-anchor="middle" fill="#20364b">足362が敵に重なる</text><text x="1012" y="657" font-size="26" text-anchor="middle" fill="#20364b">足を360にそろえる</text><text x="1012" y="699" font-size="28" text-anchor="middle" fill="#20364b">上向き速度 −8</text><rect id="side-player" x="120" y="760" width="60" height="80" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><rect id="side-enemy" x="180" y="780" width="60" height="60" rx="0" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><path d="M75 800L110 800" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="280" y="810" font-size="28" text-anchor="start" fill="#20364b">横から触れる → 踏めない</text><rect id="rising-player" x="760" y="770" width="60" height="80" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><rect id="rising-enemy" x="760" y="740" width="60" height="60" rx="0" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><path d="M720 850L720 750" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="850" y="810" font-size="28" text-anchor="start" fill="#20364b">上昇中も ×</text><text x="48" y="900" font-size="21" text-anchor="start" fill="#20364b">上の3場面は4倍の拡大図。前の足350、敵の上360、移動後の足362。</text><text x="48" y="934" font-size="21" text-anchor="start" fill="#20364b">生きている敵と下向きに重なり、動く前の足が敵の上より上なら成功。</text><text x="48" y="1000" font-size="21" text-anchor="start" fill="#20364b">補正で人の上を320、足を360にし、敵を消して速度−8を設定します。</text><text x="48" y="965" font-size="21" text-anchor="start" fill="#20364b">動く前の足と敵の上が、同じ高さでもOK。</text></svg>