<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc" lang="ja"><title id="title">作業フォルダー：3ファイルを一緒に置く</title><desc id="desc">作業フォルダー：3ファイルを一緒に置く。編集する場所はエディター。動きを確かめる場所はブラウザ。フォルダー構成と作業の模式図です。画面・アイコンの大きさは実寸ではありません。画像を使うときはassetsも一緒にコピー。index.html・style.css・script.jsは同じ階層。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="830" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">作業フォルダー：3ファイルを一緒に置く</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">編集する場所はエディター。動きを確かめる場所はブラウザ。</text><rect id="folder" x="50" y="200" width="430" height="440" rx="12" fill="#fff0c7" stroke="#b28a37" stroke-width="3"/><rect id="folder-tab" x="65" y="155" width="220" height="55" rx="10" fill="#fff0c7" stroke="#b28a37" stroke-width="3"/><text x="175" y="192" font-size="28" text-anchor="middle" fill="#20364b">my-game</text><path d="M90 255 L90 550 M90 275 L125 275 M90 345 L125 345 M90 415 L125 415 M90 505 L125 505" fill="none" stroke="#8b784c" stroke-width="3"/><rect id="file0" x="125" y="245" width="330" height="55" rx="4" fill="#fff" stroke="#708391" stroke-width="3"/><text x="145" y="281" font-size="26" text-anchor="start" fill="#20364b">index.html</text><text x="440" y="281" font-size="23" text-anchor="end" fill="#20364b">ページ</text><rect id="file1" x="125" y="315" width="330" height="55" rx="4" fill="#fff" stroke="#708391" stroke-width="3"/><text x="145" y="351" font-size="26" text-anchor="start" fill="#20364b">style.css</text><text x="440" y="351" font-size="23" text-anchor="end" fill="#20364b">見た目</text><rect id="file2" x="125" y="385" width="330" height="55" rx="4" fill="#fff" stroke="#708391" stroke-width="3"/><text x="145" y="421" font-size="26" text-anchor="start" fill="#20364b">script.js</text><text x="440" y="421" font-size="23" text-anchor="end" fill="#20364b">動き</text><rect id="assets-folder" x="125" y="480" width="330" height="125" rx="8" fill="#ffe3a1" stroke="#b28a37" stroke-width="3"/><text x="145" y="515" font-size="26" text-anchor="start" fill="#20364b">assets/</text><text x="165" y="565" font-size="24" text-anchor="start" fill="#20364b">coin.png</text><rect id="editor" x="600" y="175" width="340" height="160" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="770.0" y="220" font-size="29" text-anchor="middle" fill="#20364b">エディター</text><text x="770.0" y="263" font-size="23" text-anchor="middle" fill="#20364b">3ファイルを編集する</text><path d="M635 290 L750 290 M635 305 L820 305" fill="none" stroke="#5089b8" stroke-width="5"/><path d="M595 260L485 260" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="235" font-size="25" text-anchor="middle" fill="#20364b">保存</text><rect id="browser" x="600" y="480" width="340" height="185" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="770.0" y="525" font-size="29" text-anchor="middle" fill="#20364b">ブラウザ</text><text x="770.0" y="568" font-size="23" text-anchor="middle" fill="#20364b">index.htmlを開く</text><rect id="canvas-preview" x="715" y="590" width="110" height="55" rx="3" fill="#e8f2ff" stroke="#28629e" stroke-width="3"/><circle id="coin-preview" cx="770" cy="610" r="8" fill="#ffe29a" stroke="#936315" stroke-width="3"/><rect id="player-preview" x="750" y="630" width="40" height="7" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><path d="M485 550L595 550" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="525" font-size="25" text-anchor="middle" fill="#20364b">開く</text><path d="M770 345L770 470" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="790" y="405" font-size="24" text-anchor="start" fill="#20364b">保存したら</text><text x="790" y="440" font-size="24" text-anchor="start" fill="#20364b">再読み込み</text><text x="40" y="766" font-size="19" text-anchor="start" fill="#20364b">フォルダー構成と作業の模式図です。画面・アイコンの大きさは実寸ではありません。</text><text x="40" y="798" font-size="19" text-anchor="start" fill="#20364b">画像を使うときはassetsも一緒にコピー。index.html・style.css・script.jsは同じ階層。</text></svg>