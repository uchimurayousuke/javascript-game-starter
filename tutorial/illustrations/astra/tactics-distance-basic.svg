<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc" lang="ja"><title id="title">隣の敵に届く？ 横の差と縦の差を足そう</title><desc id="desc">タクティクス基本3の剣は射程1。初期位置の列1行1から、列2行1は横1縦0で距離1、列2行2は横1縦1で距離2。上下左右には届き、斜めには届かない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="860" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#20364b">隣の敵に届く？ 横の差と縦の差を足そう</text><text x="40" y="105" font-size="25" text-anchor="start" fill="#20364b">タクティクス 基本3 ／ 剣の射程は1。数字はマスの数です。</text><text x="60" y="200" font-size="23" text-anchor="middle" fill="#20364b">0</text><text x="122" y="145" font-size="23" text-anchor="middle" fill="#20364b">0</text><rect x="80" y="160" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="122" y="210" font-size="27" text-anchor="middle" fill="#20364b">2</text><text x="207" y="145" font-size="23" text-anchor="middle" fill="#20364b">1</text><rect x="165" y="160" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="207" y="210" font-size="27" text-anchor="middle" fill="#20364b">1</text><text x="292" y="145" font-size="23" text-anchor="middle" fill="#20364b">2</text><rect x="250" y="160" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="292" y="210" font-size="27" text-anchor="middle" fill="#20364b">2</text><text x="377" y="145" font-size="23" text-anchor="middle" fill="#20364b">3</text><rect x="335" y="160" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="377" y="210" font-size="27" text-anchor="middle" fill="#20364b">3</text><text x="462" y="145" font-size="23" text-anchor="middle" fill="#20364b">4</text><rect x="420" y="160" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="462" y="210" font-size="27" text-anchor="middle" fill="#20364b">4</text><text x="547" y="145" font-size="23" text-anchor="middle" fill="#20364b">5</text><rect x="505" y="160" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="547" y="210" font-size="27" text-anchor="middle" fill="#20364b">5</text><text x="60" y="285" font-size="23" text-anchor="middle" fill="#20364b">1</text><rect x="80" y="245" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="122" y="295" font-size="27" text-anchor="middle" fill="#20364b">1</text><rect x="165" y="245" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="207" y="295" font-size="27" text-anchor="middle" fill="#20364b">剣</text><rect x="250" y="245" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="292" y="275" font-size="22" text-anchor="middle" fill="#20364b">敵A</text><text x="292" y="314" font-size="27" text-anchor="middle" fill="#20364b">1</text><rect x="335" y="245" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="377" y="295" font-size="27" text-anchor="middle" fill="#20364b">2</text><rect x="420" y="245" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="462" y="295" font-size="27" text-anchor="middle" fill="#20364b">3</text><rect x="505" y="245" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="547" y="295" font-size="27" text-anchor="middle" fill="#20364b">4</text><text x="60" y="370" font-size="23" text-anchor="middle" fill="#20364b">2</text><rect x="80" y="330" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="122" y="380" font-size="27" text-anchor="middle" fill="#20364b">2</text><rect x="165" y="330" width="85" height="85" rx="0" fill="#dcefdc" stroke="#657e91" stroke-width="2"/><text x="207" y="380" font-size="27" text-anchor="middle" fill="#20364b">1</text><rect x="250" y="330" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="292" y="360" font-size="22" text-anchor="middle" fill="#20364b">敵B</text><text x="292" y="399" font-size="27" text-anchor="middle" fill="#20364b">2</text><rect x="335" y="330" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="377" y="380" font-size="27" text-anchor="middle" fill="#20364b">3</text><rect x="420" y="330" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="462" y="380" font-size="27" text-anchor="middle" fill="#20364b">4</text><rect x="505" y="330" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="547" y="380" font-size="27" text-anchor="middle" fill="#20364b">5</text><text x="60" y="455" font-size="23" text-anchor="middle" fill="#20364b">3</text><rect x="80" y="415" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="122" y="465" font-size="27" text-anchor="middle" fill="#20364b">3</text><rect x="165" y="415" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="207" y="465" font-size="27" text-anchor="middle" fill="#20364b">2</text><rect x="250" y="415" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="292" y="465" font-size="27" text-anchor="middle" fill="#20364b">3</text><rect x="335" y="415" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="377" y="465" font-size="27" text-anchor="middle" fill="#20364b">4</text><rect x="420" y="415" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="462" y="465" font-size="27" text-anchor="middle" fill="#20364b">5</text><rect x="505" y="415" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="547" y="465" font-size="27" text-anchor="middle" fill="#20364b">6</text><text x="60" y="540" font-size="23" text-anchor="middle" fill="#20364b">4</text><rect x="80" y="500" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="122" y="550" font-size="27" text-anchor="middle" fill="#20364b">4</text><rect x="165" y="500" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="207" y="550" font-size="27" text-anchor="middle" fill="#20364b">3</text><rect x="250" y="500" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="292" y="550" font-size="27" text-anchor="middle" fill="#20364b">4</text><rect x="335" y="500" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="377" y="550" font-size="27" text-anchor="middle" fill="#20364b">5</text><rect x="420" y="500" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="462" y="550" font-size="27" text-anchor="middle" fill="#20364b">6</text><rect x="505" y="500" width="85" height="85" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="547" y="550" font-size="27" text-anchor="middle" fill="#20364b">7</text><rect x="630" y="155" width="530" height="205" rx="12" fill="#e9f3e9" stroke="#657e91" stroke-width="2"/><text x="655" y="200" font-size="28" text-anchor="start" fill="#20364b">敵A：列2・行1</text><text x="655" y="250" font-size="25" text-anchor="start" fill="#20364b">横 |1−2|＝1、縦 |1−1|＝0</text><text x="655" y="315" font-size="31" text-anchor="start" fill="#20364b">1＋0＝1 → 届く</text><rect x="630" y="385" width="530" height="205" rx="12" fill="#fff0e7" stroke="#657e91" stroke-width="2"/><text x="655" y="430" font-size="28" text-anchor="start" fill="#20364b">敵B：列2・行2</text><text x="655" y="480" font-size="25" text-anchor="start" fill="#20364b">横 |1−2|＝1、縦 |1−2|＝1</text><text x="655" y="545" font-size="31" text-anchor="start" fill="#20364b">1＋1＝2 → 届かない</text><text x="40" y="650" font-size="26" text-anchor="start" fill="#20364b">剣は列1・行1。緑の数字1が射程内の上下左右です。</text><text x="40" y="700" font-size="25" text-anchor="start" fill="#20364b">斜め隣は距離2。「見た目が近い」だけでは攻撃できません。</text><text x="40" y="750" font-size="25" text-anchor="start" fill="#20364b">まだ攻撃していない味方を選び、届く敵を押すと2ダメージ。</text><text x="40" y="810" font-size="22" text-anchor="start" fill="#20364b">6列×5行と剣の初期位置は実装の値。敵A・Bは比較用に置いた例です。</text></svg>