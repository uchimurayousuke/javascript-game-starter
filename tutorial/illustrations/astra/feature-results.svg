<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">結果画面：もう一度？ メニューへ？</title><desc id="desc">結果画面：もう一度？ メニューへ？基本3 ／ 結果からの行き先を、キーで選びます。画面の遷移を示す模式図です。RとMは結果画面で受け付けます。再挑戦やメニューからの開始では、得点を0に戻してから遊びます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">結果画面：もう一度？ メニューへ？</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 結果からの行き先を、キーで選びます。</text><rect id="play" x="60" y="190" width="340" height="145" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="230.0" y="235" font-size="29" text-anchor="middle" fill="#20364b">プレイ中</text><text x="230.0" y="278" font-size="23" text-anchor="middle" fill="#20364b">Spaceで＋1点</text><rect id="result" x="600" y="190" width="340" height="145" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="770.0" y="235" font-size="29" text-anchor="middle" fill="#20364b">結果</text><text x="770.0" y="278" font-size="23" text-anchor="middle" fill="#20364b">3点に到達</text><path d="M410 265L590 265" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="240" font-size="27" text-anchor="middle" fill="#20364b">3点</text><path d="M770 340 L770 425 L230 425 L230 340" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="405" font-size="28" text-anchor="middle" fill="#20364b">R：0点から再挑戦</text><rect id="menu" x="600" y="535" width="340" height="125" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="770.0" y="580" font-size="29" text-anchor="middle" fill="#20364b">メニュー</text><text x="770.0" y="623" font-size="23" text-anchor="middle" fill="#20364b">Enterではじめる</text><path d="M900 340L900 530" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="925" y="460" font-size="28" text-anchor="start" fill="#20364b">M</text><path d="M595 595 L230 595 L230 440" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="395" y="575" font-size="24" text-anchor="middle" fill="#20364b">Enter：0点で開始</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">画面の遷移を示す模式図です。RとMは結果画面で受け付けます。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">再挑戦やメニューからの開始では、得点を0に戻してから遊びます。</text></svg>