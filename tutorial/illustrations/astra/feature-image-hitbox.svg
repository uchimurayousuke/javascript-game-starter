<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">画像と当たり判定：見た目と枠を分ける</title><desc id="desc">画像と当たり判定：見た目と枠を分ける。基本3 ／ Spaceで緑のロボット、Hで判定枠を表示した例。画像・判定枠を5倍に拡大。赤い十字は説明用で、キャラクターの中心を示します。画像左上は(152,193)、判定枠左上は(184,203)。透明部分も画像サイズに含みます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">画像と当たり判定：見た目と枠を分ける</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ Spaceで緑のロボット、Hで判定枠を表示した例。</text><text x="320" y="180" font-size="29" text-anchor="middle" fill="#20364b">画像全体：96 × 64px</text><rect id="transparent-area" x="80" y="220" width="480" height="320" rx="0" fill="#edf1f5" stroke="#28629e" stroke-width="3" stroke-dasharray="8 6"/><g transform="translate(80 220) scale(5)" ><rect x="35" y="44" width="10" height="12" rx="3" fill="#315d56"/><rect x="51" y="44" width="10" height="12" rx="3" fill="#315d56"/><rect x="10" y="33" width="25" height="10" rx="5" fill="#77c5a0"/><rect x="61" y="33" width="25" height="10" rx="5" fill="#77c5a0"/><circle cx="12" cy="38" r="4" fill="#315d56"/><circle cx="84" cy="38" r="4" fill="#315d56"/><rect x="32" y="30" width="32" height="20" rx="6" fill="#46a77e"/><circle cx="48" cy="39" r="4" fill="#ffcf64"/><rect x="30" y="9" width="36" height="25" rx="7" fill="#77c5a0"/><rect x="35" y="15" width="26" height="13" rx="4" fill="#e4fff4"/><rect x="39" y="19" width="5" height="5" rx="1" fill="#315d56"/><rect x="52" y="19" width="5" height="5" rx="1" fill="#315d56"/></g><rect id="hitbox" x="240" y="270" width="160" height="220" rx="0" fill="none" stroke="#b43b36" stroke-width="3"/><path d="M307 380 L333 380 M320 367 L320 393" fill="none" stroke="#a02f42" stroke-width="4"/><text x="625" y="240" font-size="28" text-anchor="start" fill="#20364b">中心 (200,225)</text><text x="625" y="315" font-size="27" text-anchor="start" fill="#20364b">赤枠：32 × 44px</text><text x="625" y="385" font-size="24" text-anchor="start" fill="#20364b">左右は中心から16px</text><text x="625" y="435" font-size="24" text-anchor="start" fill="#20364b">上下は中心から22px</text><text x="625" y="510" font-size="26" text-anchor="start" fill="#20364b">灰色部分は透明</text><text x="500" y="625" font-size="27" text-anchor="middle" fill="#20364b">Spaceで絵を替えても、当たり判定の大きさは同じ。</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">画像・判定枠を5倍に拡大。赤い十字は説明用で、キャラクターの中心を示します。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">画像左上は(152,193)、判定枠左上は(184,203)。透明部分も画像サイズに含みます。</text></svg>