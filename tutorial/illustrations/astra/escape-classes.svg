<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1085" viewBox="0 0 1200 1085" role="img" aria-labelledby="title desc" lang="ja"><title id="title">同じ設計図から、名前や位置の違う物をつくる</title><desc id="desc">同じ設計図から、名前や位置の違う物をつくる。本棚と引き出しは、どちらもRoomObjectからつくった別々の実体です。RoomObjectのx・yは位置、width・heightは大きさ、nameは名前です。this.xは、その実体自身の横の位置。本棚の位置と引き出しの位置は別々に持ちます。模式図：実コードの値を記載しています。部屋の実際の配置や大きさの比率とは異なります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="1085" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">同じ設計図から、名前や位置の違う物をつくる</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">本棚と引き出しは、どちらもRoomObjectからつくった別々の実体です。</text><rect id="room-object-blueprint" x="325" y="155" width="550" height="195" rx="16" fill="#fff5dc" stroke="#aa7a20" stroke-width="3"/><text x="600" y="202" font-size="29" text-anchor="middle" fill="#20364b">部屋の物の設計図</text><text x="600" y="247" font-size="36" text-anchor="middle" fill="#20364b">RoomObject</text><text x="600" y="291" font-size="27" text-anchor="middle" fill="#20364b">位置・大きさ・名前を持つ</text><text x="600" y="329" font-size="24" text-anchor="middle" fill="#20364b">クリックが中にあるかを調べる</text><path d="M600 350V390H305V435" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 390H895V435" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="305" y="415" font-size="24" text-anchor="middle" fill="#20364b">別々の実体をつくる</text><text x="895" y="415" font-size="24" text-anchor="middle" fill="#20364b">別々の実体をつくる</text><rect id="bookshelf-instance" x="75" y="450" width="460" height="265" rx="10" fill="#f0d5af" stroke="#946d3d" stroke-width="3"/><text x="305" y="501" font-size="34" text-anchor="middle" fill="#20364b">名前：本棚</text><text x="305" y="556" font-size="31" text-anchor="middle" fill="#20364b">横60・縦105</text><text x="305" y="607" font-size="29" text-anchor="middle" fill="#20364b">幅160・高さ180</text><text x="305" y="664" font-size="24" text-anchor="middle" fill="#20364b">この本棚自身の位置と大きさ</text><rect id="drawer-instance" x="665" y="450" width="460" height="265" rx="10" fill="#f0d5af" stroke="#946d3d" stroke-width="3"/><text x="895" y="501" font-size="34" text-anchor="middle" fill="#20364b">名前：引き出し</text><text x="895" y="556" font-size="31" text-anchor="middle" fill="#20364b">横300・縦130</text><text x="895" y="607" font-size="29" text-anchor="middle" fill="#20364b">幅170・高さ140</text><text x="895" y="664" font-size="23" text-anchor="middle" fill="#20364b">この引き出し自身の位置と大きさ</text><rect id="game-state" x="75" y="760" width="1050" height="155" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="600" y="805" font-size="29" text-anchor="middle" fill="#20364b">開いたかどうかは、Gameが別に記録する</text><text x="600" y="853" font-size="26" text-anchor="middle" fill="#20364b">unlocked：引き出し　／　ventOpen：換気口</text><text x="600" y="892" font-size="24" text-anchor="middle" fill="#20364b">最初はどちらも false（まだ開いていない）</text><text x="48" y="978" font-size="21" text-anchor="start" fill="#20364b">RoomObjectのx・yは位置、width・heightは大きさ、nameは名前です。</text><text x="48" y="1014" font-size="21" text-anchor="start" fill="#20364b">this.xは、その実体自身の横の位置。本棚の位置と引き出しの位置は別々に持ちます。</text><text x="48" y="1050" font-size="21" text-anchor="start" fill="#20364b">模式図：実コードの値を記載しています。部屋の実際の配置や大きさの比率とは異なります。</text></svg>