<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">難易度：同じ回数でも進み方が変わる</title><desc id="desc">難易度：同じ回数でも進み方が変わる。基本3 ／ ←→で普通・速いを選び、Enterで開始。移動距離だけを5倍で表示。四角のサイズは模式化し、実寸ではありません。更新回数の比較で、10秒という意味ではありません。Rで普通の設定に戻ります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">難易度：同じ回数でも進み方が変わる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ ←→で普通・速いを選び、Enterで開始。</text><text x="90" y="180" font-size="28" text-anchor="start" fill="#20364b">同じ位置 x＝100 から、10回更新した例</text><rect id="d0" x="70" y="230" width="860" height="180" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="95" y="275" font-size="28" text-anchor="start" fill="#20364b">普通：1回で＋2</text><rect id="old0" x="400" y="300" width="50" height="50" rx="0" fill="none" stroke="#708391" stroke-width="3" stroke-dasharray="8 6"/><rect id="new0" x="500" y="300" width="50" height="50" rx="0" fill="#95c7ed" stroke="#28629e" stroke-width="3"/><path d="M430 370L525 370" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="750" y="330" font-size="30" text-anchor="middle" fill="#20364b">x＝120</text><text x="750" y="375" font-size="25" text-anchor="middle" fill="#20364b">20px進む</text><rect id="d1" x="70" y="450" width="860" height="180" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="95" y="495" font-size="28" text-anchor="start" fill="#20364b">速い：1回で＋4</text><rect id="old1" x="400" y="520" width="50" height="50" rx="0" fill="none" stroke="#708391" stroke-width="3" stroke-dasharray="8 6"/><rect id="new1" x="600" y="520" width="50" height="50" rx="0" fill="#95c7ed" stroke="#28629e" stroke-width="3"/><path d="M430 590L625 590" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="750" y="550" font-size="30" text-anchor="middle" fill="#20364b">x＝140</text><text x="750" y="595" font-size="25" text-anchor="middle" fill="#20364b">40px進む</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">移動距離だけを5倍で表示。四角のサイズは模式化し、実寸ではありません。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">更新回数の比較で、10秒という意味ではありません。Rで普通の設定に戻ります。</text></svg>