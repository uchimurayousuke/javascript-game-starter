<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" lang="ja"><title id="title">めり込んだら、端をぴったりそろえる</title><desc id="desc">めり込んだら、端をぴったりそろえる。横の移動 → 横の補正 → 縦の移動 → 縦の補正、の順に調べます。人は幅30・高さ40。図は補正後の位置を4倍に拡大しています。壁では右端300、床では足390にそろえます。着地したら縦の速度を0に。この教材の「重なり」は端だけの接触を含みません。重なった後に外へ戻します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="820" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">めり込んだら、端をぴったりそろえる</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">横の移動 → 横の補正 → 縦の移動 → 縦の補正、の順に調べます。</text><rect id="wall-example" x="40" y="150" width="550" height="480" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="floor-example" x="610" y="150" width="550" height="480" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="315" y="204" font-size="26" text-anchor="middle" fill="#20364b">右へ動いて壁に重なったら</text><rect id="wall" x="370" y="260" width="120" height="270" rx="0" fill="#d6e9cc" stroke="#528852" stroke-width="3"/><rect id="player-wall" x="250" y="330" width="120" height="160" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="310" y="386" font-size="30" text-anchor="middle" fill="#20364b">人</text><text x="310" y="431" font-size="26" text-anchor="middle" fill="#20364b">幅30</text><text x="430" y="315" font-size="30" text-anchor="middle" fill="#20364b">壁</text><text x="430" y="245" font-size="28" text-anchor="middle" fill="#20364b">左300</text><text x="185" y="309" font-size="28" text-anchor="middle" fill="#20364b">左270</text><path d="M185 320H250V330" fill="none" stroke="#34495e" stroke-width="3"/><path d="M115 400L220 400" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="310" y="583" font-size="30" text-anchor="middle" fill="#20364b">300 − 30 ＝ 270</text><text x="885" y="204" font-size="26" text-anchor="middle" fill="#20364b">落ちて床に重なったら</text><rect id="floor" x="660" y="490" width="440" height="60" rx="0" fill="#d6e9cc" stroke="#528852" stroke-width="3"/><rect id="player-floor" x="780" y="330" width="120" height="160" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="840" y="386" font-size="30" text-anchor="middle" fill="#20364b">人</text><text x="840" y="431" font-size="25" text-anchor="middle" fill="#20364b">高さ40</text><text x="990" y="343" font-size="29" text-anchor="start" fill="#20364b">上350</text><path d="M909 330H975" fill="none" stroke="#34495e" stroke-width="3"/><text x="990" y="480" font-size="26" text-anchor="middle" fill="#20364b">床の上390</text><text x="840" y="532" font-size="28" text-anchor="middle" fill="#20364b">床</text><path d="M710 300L710 440" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="885" y="583" font-size="30" text-anchor="middle" fill="#20364b">390 − 40 ＝ 350</text><text x="48" y="713" font-size="21" text-anchor="start" fill="#20364b">人は幅30・高さ40。図は補正後の位置を4倍に拡大しています。</text><text x="48" y="749" font-size="21" text-anchor="start" fill="#20364b">壁では右端300、床では足390にそろえます。着地したら縦の速度を0に。</text><text x="48" y="785" font-size="21" text-anchor="start" fill="#20364b">この教材の「重なり」は端だけの接触を含みません。重なった後に外へ戻します。</text></svg>