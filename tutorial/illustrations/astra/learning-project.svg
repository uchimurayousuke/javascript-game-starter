<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="870" viewBox="0 0 1000 870" role="img" aria-labelledby="title desc" lang="ja"><title id="title">企画から完成へ：小さく作って確かめる</title><desc id="desc">企画から完成へ：小さく作って確かめる。一度に全部を作らず、遊べるところまで作って試します。制作の流れを表す模式図。画面・人・作品のアイコンは説明用です。遊んでもらった様子を見て一つ直し、再確認してから作品を紹介・ふりかえりします。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="870" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">企画から完成へ：小さく作って確かめる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">一度に全部を作らず、遊べるところまで作って試します。</text><rect id="plan" x="50" y="165" width="270" height="240" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="185.0" y="210" font-size="29" text-anchor="middle" fill="#20364b">1 小さく企画</text><text x="185.0" y="253" font-size="23" text-anchor="middle" fill="#20364b">何をして、どう終わる？</text><rect id="paper" x="145" y="285" width="80" height="85" rx="4" fill="#fff" stroke="#708391" stroke-width="3"/><path d="M160 305 L210 305 M160 325 L210 325 M160 345 L195 345" fill="none" stroke="#708391" stroke-width="3"/><rect id="build" x="365" y="165" width="270" height="240" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="500.0" y="210" font-size="29" text-anchor="middle" fill="#20364b">2 遊べる最小版</text><text x="500.0" y="253" font-size="23" text-anchor="middle" fill="#20364b">動きと終わり方を作る</text><rect id="screen" x="440" y="285" width="120" height="80" rx="5" fill="#e8f2ff" stroke="#28629e" stroke-width="3"/><circle id="ball" cx="500" cy="310" r="11" fill="#ffe29a" stroke="#936315" stroke-width="3"/><rect id="paddle" x="470" y="345" width="60" height="9" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><rect id="observe" x="680" y="165" width="270" height="240" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="815.0" y="210" font-size="29" text-anchor="middle" fill="#20364b">3 遊んでもらう</text><text x="815.0" y="253" font-size="23" text-anchor="middle" fill="#20364b">迷った場所を観察</text><circle id="head1" cx="735" cy="310" r="15" fill="#ffe1bd" stroke="#936315" stroke-width="3"/><circle id="head2" cx="895" cy="310" r="15" fill="#ffe1bd" stroke="#936315" stroke-width="3"/><path d="M720 355 Q735 325 750 355 M880 355 Q895 325 910 355" fill="none" stroke="#28629e" stroke-width="6"/><rect id="play-screen" x="775" y="310" width="80" height="55" rx="0" fill="#e8f2ff" stroke="#28629e" stroke-width="3"/><path d="M325 270L360 270" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 270L675 270" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M815 415L815 500" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="fix" x="520" y="510" width="430" height="220" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="735.0" y="555" font-size="29" text-anchor="middle" fill="#20364b">4 一つ直して再確認</text><text x="735.0" y="598" font-size="23" text-anchor="middle" fill="#20364b">気づいたことを1つ選ぶ</text><rect id="one-fix" x="690" y="625" width="90" height="65" rx="6" fill="#d4efde" stroke="#498765" stroke-width="3"/><text x="735" y="670" font-size="36" text-anchor="middle" fill="#20364b">1</text><path d="M795 680 L845 625 L857 638 L807 692 Z" fill="none" stroke="#936315" stroke-width="4"/><rect id="share" x="50" y="510" width="370" height="220" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="235.0" y="555" font-size="29" text-anchor="middle" fill="#20364b">5 紹介・ふりかえり</text><text x="235.0" y="598" font-size="23" text-anchor="middle" fill="#20364b">作品名・遊び方・工夫</text><rect id="work" x="125" y="625" width="100" height="65" rx="6" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="175" y="665" font-size="27" text-anchor="middle" fill="#20364b">作品</text><path d="M250 625 L340 625 L340 670 L280 670 L260 685 L260 670 L250 670 Z" fill="none" stroke="#28629e" stroke-width="3"/><path d="M510 620L430 620" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="806" font-size="19" text-anchor="start" fill="#20364b">制作の流れを表す模式図。画面・人・作品のアイコンは説明用です。</text><text x="40" y="838" font-size="19" text-anchor="start" fill="#20364b">遊んでもらった様子を見て一つ直し、再確認してから作品を紹介・ふりかえりします。</text></svg>