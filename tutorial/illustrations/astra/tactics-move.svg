t3-4" x="300" y="495" width="75" height="75" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><text x="337.5" y="541" font-size="24" text-anchor="middle" fill="#20364b"></text><rect id="t4-4" x="375" y="495" width="75" height="75" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><text x="412.5" y="541" font-size="24" text-anchor="middle" fill="#20364b"></text><rect id="t5-4" x="450" y="495" width="75" height="75" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><text x="487.5" y="541" font-size="24" text-anchor="middle" fill="#20364b"></text><text x="112.5" y="177" font-size="22" text-anchor="middle" fill="#20364b">0</text><text x="187.5" y="177" font-size="22" text-anchor="middle" fill="#20364b">1</text><text x="262.5" y="177" font-size="22" text-anchor="middle" fill="#20364b">2</text><text x="337.5" y="177" font-size="22" text-anchor="middle" fill="#20364b">3</text><text x="412.5" y="177" font-size="22" text-anchor="middle" fill="#20364b">4</text><text x="487.5" y="177" font-size="22" text-anchor="middle" fill="#20364b">5</text><text x="50" y="241" font-size="22" text-anchor="middle" fill="#20364b">0</text><text x="50" y="316" font-size="22" text-anchor="middle" fill="#20364b">1</text><text x="50" y="391" font-size="22" text-anchor="middle" fill="#20364b">2</text><text x="50" y="466" font-size="22" text-anchor="middle" fill="#20364b">3</text><text x="50" y="541" font-size="22" text-anchor="middle" fill="#20364b">4</text><text x="575" y="220" font-size="26" text-anchor="start" fill="#20364b">列1・行1の味方を選ぶ</text><text x="575" y="285" font-size="26" text-anchor="start" fill="#20364b">上下左右の空きマスへ</text><text x="575" y="325" font-size="26" text-anchor="start" fill="#20364b">1マスだけ移動できる</text><text x="575" y="405" font-size="26" text-anchor="start" fill="#20364b">斜めには移動しない</text><text x="575" y="465" font-size="25" text-anchor="start" fill="#20364b">他のユニットを通らない</text><text x="75" y="630" font-size="27" text-anchor="start" fill="#20364b">移動後は「移動 済」。同じ番では、もう移動で