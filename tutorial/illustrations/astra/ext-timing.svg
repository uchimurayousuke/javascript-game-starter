<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc" lang="ja"><title id="title">成功の中でも、中央に近いと2点</title><desc id="desc">成功の中でも、中央に近いと2点。目印の中心を調べます。成功も追加点も、範囲の境目を含みます。390と410は中央400から10なので追加点。411は11離れるので成功の1点です。範囲の横幅は実際の比率。下の3つの箱は別々の停止例を示す模式図です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="790" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">成功の中でも、中央に近いと2点</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">目印の中心を調べます。成功も追加点も、範囲の境目を含みます。</text><text x="500" y="173" font-size="29" text-anchor="middle" fill="#20364b">3ラウンド目：成功は360〜440</text><rect id="success-zone" x="180" y="260" width="640" height="80" rx="0" fill="#dcefd5" stroke="#528852" stroke-width="3"/><rect id="bonus-zone" x="420" y="260" width="160" height="80" rx="0" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="500" y="310" font-size="28" text-anchor="middle" fill="#20364b">追加点</text><path d="M180 345V365" fill="none" stroke="#34495e" stroke-width="3"/><text x="180" y="400" font-size="25" text-anchor="middle" fill="#20364b">360</text><path d="M420 345V365" fill="none" stroke="#34495e" stroke-width="3"/><text x="420" y="400" font-size="25" text-anchor="middle" fill="#20364b">390</text><path d="M500 345V365" fill="none" stroke="#34495e" stroke-width="3"/><text x="500" y="400" font-size="25" text-anchor="middle" fill="#20364b">400</text><path d="M580 345V365" fill="none" stroke="#34495e" stroke-width="3"/><text x="580" y="400" font-size="25" text-anchor="middle" fill="#20364b">410</text><path d="M820 345V365" fill="none" stroke="#34495e" stroke-width="3"/><text x="820" y="400" font-size="25" text-anchor="middle" fill="#20364b">440</text><text x="500" y="230" font-size="25" text-anchor="middle" fill="#20364b">中央から左右10まで</text><rect id="example-390" x="40" y="465" width="260" height="180" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="170" y="514" font-size="28" text-anchor="middle" fill="#20364b">中心が390</text><text x="170" y="571" font-size="25" text-anchor="middle" fill="#20364b">成功1＋追加1</text><text x="170" y="612" font-size="28" text-anchor="middle" fill="#20364b">合計2点</text><rect id="example-410" x="370" y="465" width="260" height="180" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="500" y="514" font-size="28" text-anchor="middle" fill="#20364b">中心が410</text><text x="500" y="571" font-size="25" text-anchor="middle" fill="#20364b">成功1＋追加1</text><text x="500" y="612" font-size="28" text-anchor="middle" fill="#20364b">合計2点</text><rect id="example-411" x="700" y="465" width="260" height="180" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="830" y="514" font-size="28" text-anchor="middle" fill="#20364b">中心が411</text><text x="830" y="571" font-size="25" text-anchor="middle" fill="#20364b">成功の1点だけ</text><text x="830" y="612" font-size="28" text-anchor="middle" fill="#20364b">合計1点</text><text x="40" y="726" font-size="19" text-anchor="start" fill="#20364b">390と410は中央400から10なので追加点。411は11離れるので成功の1点です。</text><text x="40" y="758" font-size="19" text-anchor="start" fill="#20364b">範囲の横幅は実際の比率。下の3つの箱は別々の停止例を示す模式図です。</text></svg>