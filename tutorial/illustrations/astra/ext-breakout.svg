<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="745" viewBox="0 0 1000 745" role="img" aria-labelledby="title desc" lang="ja"><title id="title">丈夫なブロックは、2回当ててこわす</title><desc id="desc">丈夫なブロックは、2回当ててこわす。体力2のブロックの例。色だけでなく、残りの数を見よう。体力2 → 1 → 0。0になるまではブロックを残し、0になったら消します。模式図：同じブロックが、別々の2回の接触で変わる様子です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="745" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">丈夫なブロックは、2回当ててこわす</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">体力2のブロックの例。色だけでなく、残りの数を見よう。</text><rect id="phase-0" x="40" y="160" width="260" height="365" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="170" y="208" font-size="23" text-anchor="middle" fill="#20364b">まだ当たっていない</text><rect id="brick-0" x="75" y="270" width="190" height="110" rx="0" fill="#ffe3c9" stroke="#aa6226" stroke-width="3"/><text x="170" y="310" font-size="25" text-anchor="middle" fill="#20364b">ブロック</text><text x="170" y="355" font-size="34" text-anchor="middle" fill="#20364b">体力2</text><text x="170" y="465" font-size="30" text-anchor="middle" fill="#20364b">残る</text><path d="M312 327L358 327" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="phase-1" x="370" y="160" width="260" height="365" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="500" y="208" font-size="23" text-anchor="middle" fill="#20364b">1回当たった後</text><rect id="brick-1" x="405" y="270" width="190" height="110" rx="0" fill="#ffe3c9" stroke="#aa6226" stroke-width="3"/><text x="500" y="310" font-size="25" text-anchor="middle" fill="#20364b">ブロック</text><text x="500" y="355" font-size="34" text-anchor="middle" fill="#20364b">体力1</text><text x="500" y="465" font-size="30" text-anchor="middle" fill="#20364b">残る</text><path d="M642 327L688 327" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="phase-2" x="700" y="160" width="260" height="365" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="830" y="208" font-size="23" text-anchor="middle" fill="#20364b">2回当たった後</text><rect id="brick-2" x="735" y="270" width="190" height="110" rx="0" fill="none" stroke="#aa6226" stroke-width="3" stroke-dasharray="8 6"/><text x="830" y="310" font-size="25" text-anchor="middle" fill="#20364b">ブロック</text><text x="830" y="355" font-size="34" text-anchor="middle" fill="#20364b">体力0</text><text x="830" y="465" font-size="30" text-anchor="middle" fill="#20364b">消える</text><text x="500" y="602" font-size="31" text-anchor="middle" fill="#20364b">1回の接触で1だけ減らす</text><text x="40" y="681" font-size="19" text-anchor="start" fill="#20364b">体力2 → 1 → 0。0になるまではブロックを残し、0になったら消します。</text><text x="40" y="713" font-size="19" text-anchor="start" fill="#20364b">模式図：同じブロックが、別々の2回の接触で変わる様子です。</text></svg>