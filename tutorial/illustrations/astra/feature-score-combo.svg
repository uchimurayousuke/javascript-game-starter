<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc" lang="ja"><title id="title">連続成功で加点が増える。失敗しても得点は残る</title><desc id="desc">最初は得点0とコンボ0。成功でコンボ1、10点加算。次はコンボ2、20点加算で30。Fでコンボ0にしても得点30は残る。次の成功で10点加算し40。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="790" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">連続成功で加点が増える。失敗しても得点は残る</text><text x="40" y="110" font-size="27" text-anchor="start" fill="#20364b">最初は score＝0、combo＝0。Spaceで成功、Fで失敗の例です。</text><rect x="40" y="170" width="250" height="355" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="165" y="215" font-size="28" text-anchor="middle" fill="#20364b">成功1回目</text><text x="165" y="275" font-size="29" text-anchor="middle" fill="#20364b">コンボ 1</text><text x="165" y="340" font-size="25" text-anchor="middle" fill="#20364b">10×1＝10</text><text x="165" y="410" font-size="26" text-anchor="middle" fill="#20364b">合計得点</text><text x="165" y="480" font-size="46" text-anchor="middle" fill="#20364b">10</text><path d="M297 350 L320 350" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="170" width="250" height="355" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="455" y="215" font-size="28" text-anchor="middle" fill="#20364b">成功2回目</text><text x="455" y="275" font-size="29" text-anchor="middle" fill="#20364b">コンボ 2</text><text x="455" y="340" font-size="25" text-anchor="middle" fill="#20364b">10×2＝20</text><text x="455" y="410" font-size="26" text-anchor="middle" fill="#20364b">合計得点</text><text x="455" y="480" font-size="46" text-anchor="middle" fill="#20364b">30</text><path d="M587 350 L610 350" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="620" y="170" width="250" height="355" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="745" y="215" font-size="28" text-anchor="middle" fill="#20364b">F：失敗</text><text x="745" y="275" font-size="29" text-anchor="middle" fill="#20364b">コンボ 0</text><text x="745" y="340" font-size="25" text-anchor="middle" fill="#20364b">加点なし</text><text x="745" y="410" font-size="26" text-anchor="middle" fill="#20364b">合計得点</text><text x="745" y="480" font-size="46" text-anchor="middle" fill="#20364b">30</text><path d="M877 350 L900 350" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="910" y="170" width="250" height="355" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="1035" y="215" font-size="28" text-anchor="middle" fill="#20364b">次の成功</text><text x="1035" y="275" font-size="29" text-anchor="middle" fill="#20364b">コンボ 1</text><text x="1035" y="340" font-size="25" text-anchor="middle" fill="#20364b">10×1＝10</text><text x="1035" y="410" font-size="26" text-anchor="middle" fill="#20364b">合計得点</text><text x="1035" y="480" font-size="46" text-anchor="middle" fill="#20364b">40</text><rect x="40" y="575" width="1120" height="115" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="65" y="620" font-size="27" text-anchor="start" fill="#20364b">加点する順番：comboを1増やす → 10 × comboをscoreに足す</text><text x="65" y="665" font-size="26" text-anchor="start" fill="#20364b">Fはcomboだけ0。Rならscoreもcomboも0からやり直します。</text><text x="40" y="750" font-size="24" text-anchor="start" fill="#20364b">4つの箱は左から順に操作した結果です。</text></svg>