<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc" lang="ja"><title id="title">行と列でマスを調べる。壁なら進まない</title><desc id="desc">実装の5行5列の初期地図。1は壁、0は床、2はアイテム。人は行1列1。map[1][1]の左上は310,120。右へ2回で行1列3のアイテムを取り2が0、得点0が1になる。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="920" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">行と列でマスを調べる。壁なら進まない</text><text x="40" y="110" font-size="27" text-anchor="start" fill="#20364b">map[行][列] ／ 0＝床、1＝壁、2＝アイテム。番号は0から。</text><text x="55" y="235" font-size="25" text-anchor="middle" fill="#20364b">0</text><text x="135" y="170" font-size="25" text-anchor="middle" fill="#20364b">0</text><rect x="90" y="190" width="90" height="90" rx="0" fill="#dbe4ec" stroke="#607a90" stroke-width="2"/><text x="135" y="225" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="135" y="261" font-size="25" text-anchor="middle" fill="#20364b">壁</text><text x="225" y="170" font-size="25" text-anchor="middle" fill="#20364b">1</text><rect x="180" y="190" width="90" height="90" rx="0" fill="#dbe4ec" stroke="#607a90" stroke-width="2"/><text x="225" y="225" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="225" y="261" font-size="25" text-anchor="middle" fill="#20364b">壁</text><text x="315" y="170" font-size="25" text-anchor="middle" fill="#20364b">2</text><rect x="270" y="190" width="90" height="90" rx="0" fill="#dbe4ec" stroke="#607a90" stroke-width="2"/><text x="315" y="225" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="315" y="261" font-size="25" text-anchor="middle" fill="#20364b">壁</text><text x="405" y="170" font-size="25" 