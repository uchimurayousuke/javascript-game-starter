ont-size="25" text-anchor="middle" fill="#20364b">床</text><rect x="270" y="460" width="90" height="90" rx="0" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="315" y="495" font-size="29" text-anchor="middle" fill="#20364b">0</text><text x="315" y="531" font-size="25" text-anchor="middle" fill="#20364b">床</text><rect x="360" y="460" width="90" height="90" rx="0" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="405" y="495" font-size="29" text-anchor="middle" fill="#20364b">0</text><text x="405" y="531" font-size="25" text-anchor="middle" fill="#20364b">床</text><rect x="450" y="460" width="90" height="90" rx="0" fill="#dbe4ec" stroke="#607a90" stroke-width="2"/><text x="495" y="495" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="495" y="531" font-size="25" text-anchor="middle" fill="#20364b">壁</text><text x="55" y="595" font-size="25" text-anchor="middle" fill="#20364b">4</text><rect x="90" y="550" width="90" height="90" rx="0" fill="#dbe4ec" stroke="#607a90" stroke-width="2"/><text x="135" y="585" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="135" y="621" font-size="25" text-anchor="middle" fill="#20364b">壁</text><rect x="180" y="550" width="90" height="90" rx="0" fill="#dbe4ec" stroke="#607a90" stroke-width="2"/><text x="225" y="585" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="225" y="621" font-size="25" text-anchor="middle" fill="#20364b">壁</text><rect x="270" y="550" width="90" height="90" rx="0" fill="#dbe4ec" stroke="#607a90" stroke-width="2"/><text x="315" y="585" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="315" y="621" font-size="25" text-anchor="middle" fill="#20364b">壁</text><rect x="360" y="550" width="90" height="90" rx="0" fill="#dbe4ec" stroke="#607a90" stroke-width="2"/><text x="405" y="585" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="405" y="621" font-size="25" text-anchor="middle" fill="#20364b">壁</text><rect x="450" y="550" width="90" height="90" rx="0" fill="#dbe4ec" stroke="#607a90" stroke-width="2"/><text x="495" y="585" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="495" y="621" font-size="25" text-anchor="middle" fill="#20364b">壁</text><text x="590" y="205" font-size="30" text-anchor="start" fill="#20364b">初期位置：行1・列1</text><text x="590" y="265" font-size="28" text-anchor="start" fill="#20364b">x＝250＋1×60＝310</text><text x="590" y="320" font-size="28" text-anchor="start" fill="#20364b">y＝60＋1×60＝120</text><text x="590" y="375" font-size="29" text-anchor="start" fill="#20364b">マス左上は (310,120)</text><rect x="590" y="415" width="565" height="190" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="615" y="460" font-size="28" text-anchor="start" fill="#20364b">右へ2回で、行1・列3へ</text><text x="615" y="520" font-size="28" text-anchor="start" fill="#20364b">アイテム：2 → 0（床）</text><text x="615" y="575" font-size="31" text-anchor="start" fill="#20364b">得点：0 → 1</text><text x="40" y="705" font-size="27" text-anchor="start" fill="#20364b">移動先の値が1なら壁。プレイヤーの行・列は変えません。</text><text x="40" y="765" font-size="26" text-anchor="start" fill="#20364b">人は床の上にいます。人の位置と、地図の値は別々に持ちます。</text><text x="40" y="825" font-size="26" text-anchor="start" fill="#20364b">Rで初期位置・地図・得点を戻します。</text><text x="40" y="885" font-size="23" text-anchor="start" fill="#20364b">実地図の1マス60pxを90pxに拡大。図内の1・0・2が配列の値です。</text></svg>