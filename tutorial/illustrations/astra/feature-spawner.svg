<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" lang="ja"><title id="title">1秒ごとに生まれ、1個ずつ3秒で消える</title><desc id="desc">Aを0msにSpaceで出す説明例。Bが1000ms、Cが2000msに自動出現した場合、Aは3000ms、Bは4000ms、Cは5000msで消える。各個体の寿命は3000ms。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="900" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">1秒ごとに生まれ、1個ずつ3秒で消える</text><text x="40" y="110" font-size="27" text-anchor="start" fill="#20364b">Aを開始時にSpaceで出し、その後は自動出現した例です。</text><text x="130.0" y="170" font-size="25" text-anchor="middle" fill="#20364b">0ms</text><path d="M130.0 190 L130.0 520" fill="none" stroke="#20364b" stroke-width="3" stroke-dasharray="7 6"/><text x="320.0" y="170" font-size="25" text-anchor="middle" fill="#20364b">1000ms</text><path d="M320.0 190 L320.0 520" fill="none" stroke="#20364b" stroke-width="3" stroke-dasharray="7 6"/><text x="510.0" y="170" font-size="25" text-anchor="middle" fill="#20364b">2000ms</text><path d="M510.0 190 L510.0 520" fill="none" stroke="#20364b" stroke-width="3" stroke-dasharray="7 6"/><text x="700.0" y="170" font-size="25" text-anchor="middle" fill="#20364b">3000ms</text><path d="M700.0 190 L700.0 520" fill="none" stroke="#20364b" stroke-width="3" stroke-dasharray="7 6"/><text x="890.0" y="170" font-size="25" text-anchor="middle" fill="#20364b">4000ms</text><path d="M890.0 190 L890.0 520" fill="none" stroke="#20364b" stroke-width="3" stroke-dasharray="7 6"/><text x="1080.0" y="170" font-size="25" text-anchor="middle" fill="#20364b">5000ms</text><path d="M1080.0 190 L1080.0 520" fill="none" stroke="#20364b" stroke-width="3" stroke-dasharray="7 6"/><rect x="130.0" y="225" width="570" height="65" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="415.0" y="268" font-size="27" text-anchor="middle" fill="#20364b">A：3000msだけ残る</text><text x="130.0" y="213" font-size="22" text-anchor="start" fill="#20364b">出現</text><text x="700.0" y="319" font-size="22" text-anchor="middle" fill="#20364b">消える</text><rect x="320.0" y="335" width="570" height="65" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="605.0" y="378" font-size="27" text-anchor="middle" fill="#20364b">B：3000msだけ残る</text><text x="320.0" y="323" font-size="22" text-anchor="start" fill="#20364b">出現</text><text x="890.0" y="429" font-size="22" text-anchor="middle" fill="#20364b">消える</text><rect x="510.0" y="445" width="570" height="65" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="795.0" y="488" font-size="27" text-anchor="middle" fill="#20364b">C：3000msだけ残る</text><text x="510.0" y="433" font-size="22" text-anchor="start" fill="#20364b">出現</text><text x="1080.0" y="539" font-size="22" text-anchor="middle" fill="#20364b">消える</text><text x="40" y="595" font-size="28" text-anchor="start" fill="#20364b">生まれて2999ms：残る ／ 3000msちょうど：取り除く</text><rect x="40" y="640" width="1120" height="135" rx="12" fill="#edf3f8" stroke="#607a90" stroke-width="2"/><text x="65" y="685" font-size="28" text-anchor="start" fill="#20364b">items.length ＜ 10 のときだけ、1個追加。上限は10個。</text><text x="65" y="735" font-size="26" text-anchor="start" fill="#20364b">寿命があるので、先に生まれたものから別々に消えます。</text><text x="40" y="825" font-size="24" text-anchor="start" fill="#20364b">長く止まった後の自動出現は1回にまとめます。Rは配列を空にします。</text><text x="40" y="875" font-size="23" text-anchor="start" fill="#20364b">時間軸は同じ縮尺。A〜Cだけを抜粋し、後の自動出現は省略しています。</text></svg>