<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc" lang="ja"><title id="title">サッカー：ためると強く蹴れる</title><desc id="desc">サッカー：ためると強く蹴れる。発展1 ／ 強さ ＝ 4 ＋ ためた量 ÷ 15。量と強さの比較図です。ためは更新1回につき＋1、最大60。60は秒数ではありません。蹴ったあとは、ためが0に戻ります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="820" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">サッカー：ためると強く蹴れる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">発展1 ／ 強さ ＝ 4 ＋ ためた量 ÷ 15</text><text x="80" y="175" font-size="30" text-anchor="start" fill="#20364b">Spaceを押す → ためる → はなして蹴る</text><rect id="c0" x="65" y="215" width="870" height="115" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="90" y="260" font-size="27" text-anchor="start" fill="#20364b">ため 0 / 60</text><rect id="bg0" x="330" y="245" width="300" height="35" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="690" y="270" font-size="31" text-anchor="start" fill="#20364b">強さ 4</text><text x="330" y="313" font-size="25" text-anchor="start" fill="#20364b">4 ＋ 0 ÷ 15 ＝ 4</text><rect id="c1" x="65" y="355" width="870" height="115" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="90" y="400" font-size="27" text-anchor="start" fill="#20364b">ため 30 / 60</text><rect id="bg1" x="330" y="385" width="300" height="35" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><rect id="fill1" x="330" y="385" width="150.0" height="35" rx="0" fill="#e9bf51" stroke="#936315" stroke-width="3"/><text x="690" y="410" font-size="31" text-anchor="start" fill="#20364b">強さ 6</text><text x="330" y="453" font-size="25" text-anchor="start" fill="#20364b">4 ＋ 30 ÷ 15 ＝ 6</text><rect id="c2" x="65" y="495" width="870" height="115" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="90" y="540" font-size="27" text-anchor="start" fill="#20364b">ため 60 / 60</text><rect id="bg2" x="330" y="525" width="300" height="35" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><rect id="fill2" x="330" y="525" width="300.0" height="35" rx="0" fill="#e9bf51" stroke="#936315" stroke-width="3"/><text x="690" y="550" font-size="31" text-anchor="start" fill="#20364b">強さ 8</text><text x="330" y="593" font-size="25" text-anchor="start" fill="#20364b">4 ＋ 60 ÷ 15 ＝ 8</text><text x="80" y="690" font-size="27" text-anchor="start" fill="#20364b">はなした瞬間、ボールが32px以内にあれば成功。</text><text x="40" y="756" font-size="19" text-anchor="start" fill="#20364b">量と強さの比較図です。ためは更新1回につき＋1、最大60。</text><text x="40" y="788" font-size="19" text-anchor="start" fill="#20364b">60は秒数ではありません。蹴ったあとは、ためが0に戻ります。</text></svg>