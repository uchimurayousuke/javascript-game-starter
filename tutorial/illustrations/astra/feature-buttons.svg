<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc" lang="ja"><title id="title">ボタン：押し始めと離す場所を調べる</title><desc id="desc">ボタン：押し始めと離す場所を調べる。基本3 ／ 有効なボタンを、同じ指・ポインターで操作した例。操作を比べる模式図。ボタンの幅240・高さ70は等倍、図中の配置は移動しています。Dで無効にすると実行しません。中で押して同じpointerIdで中で離すと1回増えます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="830" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">ボタン：押し始めと離す場所を調べる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 有効なボタンを、同じ指・ポインターで操作した例。</text><rect id="row0" x="50" y="155" width="900" height="155" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="75" y="185" font-size="25" text-anchor="start" fill="#20364b">内で押す → 内で離す</text><rect id="button0" x="350" y="195" width="240" height="70" rx="10" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="470" y="222" font-size="23" text-anchor="middle" fill="#20364b">ボタン</text><circle id="down0" cx="400" cy="245" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M410 245L530 245" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><circle id="up0" cx="540" cy="245" r="6" fill="#fff" stroke="#34495e" stroke-width="3"/><text x="400" y="292" font-size="22" text-anchor="middle" fill="#20364b">押す</text><text x="540" y="292" font-size="22" text-anchor="middle" fill="#20364b">離す</text><text x="790" y="245" font-size="27" text-anchor="middle" fill="#20364b">実行 ＋1</text><rect id="row1" x="50" y="330" width="900" height="155" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="75" y="360" font-size="25" text-anchor="start" fill="#20364b">外で押す → 内で離す</text><rect id="button1" x="350" y="370" width="240" height="70" rx="10" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="470" y="397" font-size="23" text-anchor="middle" fill="#20364b">ボタン</text><circle id="down1" cx="260" cy="420" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M270 420L530 420" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><circle id="up1" cx="540" cy="420" r="6" fill="#fff" stroke="#34495e" stroke-width="3"/><text x="260" y="467" font-size="22" text-anchor="middle" fill="#20364b">押す</text><text x="540" y="467" font-size="22" text-anchor="middle" fill="#20364b">離す</text><text x="790" y="420" font-size="27" text-anchor="middle" fill="#20364b">実行しない</text><rect id="row2" x="50" y="505" width="900" height="155" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="75" y="535" font-size="25" text-anchor="start" fill="#20364b">内で押す → 外で離す</text><rect id="button2" x="350" y="545" width="240" height="70" rx="10" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="470" y="572" font-size="23" text-anchor="middle" fill="#20364b">ボタン</text><circle id="down2" cx="400" cy="595" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M410 595L660 595" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><circle id="up2" cx="670" cy="595" r="6" fill="#fff" stroke="#34495e" stroke-width="3"/><text x="400" y="642" font-size="22" text-anchor="middle" fill="#20364b">押す</text><text x="670" y="642" font-size="22" text-anchor="middle" fill="#20364b">離す</text><text x="790" y="595" font-size="27" text-anchor="middle" fill="#20364b">実行しない</text><text x="40" y="766" font-size="19" text-anchor="start" fill="#20364b">操作を比べる模式図。ボタンの幅240・高さ70は等倍、図中の配置は移動しています。</text><text x="40" y="798" font-size="19" text-anchor="start" fill="#20364b">Dで無効にすると実行しません。中で押して同じpointerIdで中で離すと1回増えます。</text></svg>