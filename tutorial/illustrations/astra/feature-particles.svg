<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">粒の演出：寿命が0になったら消す</title><desc id="desc">粒の演出：寿命が0になったら消す。基本3 ／ y＝200・縦速度−3で生まれた、代表の1粒の例。代表の1粒の状態比較です。ほかの粒と横方向の移動は省略しています。寿命は秒数ではなく更新回数。寿命を減らしたあと、0以下の粒を取り除きます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">粒の演出：寿命が0になったら消す</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ y＝200・縦速度−3で生まれた、代表の1粒の例。</text><rect id="life0" x="40" y="220" width="225" height="250" rx="16" fill="#ffe6c9" stroke="#a9bdcf" stroke-width="3"/><text x="152.5" y="265" font-size="29" text-anchor="middle" fill="#20364b">生成直後</text><text x="152.5" y="308" font-size="23" text-anchor="middle" fill="#20364b">残り30</text><text x="152.5" y="365" font-size="26" text-anchor="middle" fill="#20364b">y＝200</text><text x="152.5" y="425" font-size="24" text-anchor="middle" fill="#20364b">縦速度 −3</text><path d="M270 300L280 300" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="life1" x="285" y="220" width="225" height="250" rx="16" fill="#ffe6c9" stroke="#a9bdcf" stroke-width="3"/><text x="397.5" y="265" font-size="29" text-anchor="middle" fill="#20364b">1回更新後</text><text x="397.5" y="308" font-size="23" text-anchor="middle" fill="#20364b">残り29</text><text x="397.5" y="365" font-size="26" text-anchor="middle" fill="#20364b">y＝197</text><text x="397.5" y="425" font-size="24" text-anchor="middle" fill="#20364b">縦速度 −2.9</text><path d="M515 300L525 300" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="life2" x="530" y="220" width="225" height="250" rx="16" fill="#ffe6c9" stroke="#a9bdcf" stroke-width="3"/><text x="642.5" y="265" font-size="29" text-anchor="middle" fill="#20364b">2回更新後</text><text x="642.5" y="308" font-size="23" text-anchor="middle" fill="#20364b">残り28</text><text x="642.5" y="365" font-size="26" text-anchor="middle" fill="#20364b">y＝194.1</text><text x="642.5" y="425" font-size="24" text-anchor="middle" fill="#20364b">縦速度 −2.8</text><path d="M760 300L770 300" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="life3" x="775" y="220" width="225" height="250" rx="16" fill="#e4e7ec" stroke="#a9bdcf" stroke-width="3"/><text x="887.5" y="265" font-size="29" text-anchor="middle" fill="#20364b">30回更新後</text><text x="887.5" y="308" font-size="23" text-anchor="middle" fill="#20364b">残り0</text><text x="887.5" y="365" font-size="26" text-anchor="middle" fill="#20364b">削除する</text><text x="887.5" y="425" font-size="24" text-anchor="middle" fill="#20364b">描画しない</text><rect id="order" x="85" y="535" width="830" height="120" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="500.0" y="580" font-size="29" text-anchor="middle" fill="#20364b">更新する順番</text><text x="500.0" y="623" font-size="23" text-anchor="middle" fill="#20364b">位置を動かす → 縦速度に0.1を足す → 寿命を1減らす</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">代表の1粒の状態比較です。ほかの粒と横方向の移動は省略しています。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">寿命は秒数ではなく更新回数。寿命を減らしたあと、0以下の粒を取り除きます。</text></svg>