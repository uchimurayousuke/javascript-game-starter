<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc" lang="ja"><title id="title">長いステージの、一部分を画面に映す</title><desc id="desc">長いステージの、一部分を画面に映す。ステージの横500～1300が、画面の横0～800に見えます。図の人の左端：ステージでは885、画面では385。描くときだけ500を引きます。当たり判定はステージの座標。カメラの左端は0～1600の間に収めます。横幅の比率は実際の値に対応。縦の高さは見やすくした模式図です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="930" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">長いステージの、一部分を画面に映す</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">ステージの横500～1300が、画面の横0～800に見えます。</text><text x="80" y="170" font-size="29" text-anchor="start" fill="#20364b">ステージ全体：横2400</text><rect id="world" x="80" y="210" width="960" height="160" rx="0" fill="#eef3f6" stroke="#93a9bb" stroke-width="3"/><rect id="visible-range" x="280" y="210" width="320" height="160" rx="0" fill="#e2f1df" stroke="#528852" stroke-width="3"/><text x="80" y="407" font-size="25" text-anchor="start" fill="#20364b">横0</text><text x="1040" y="407" font-size="25" text-anchor="end" fill="#20364b">横2400</text><text x="280" y="195" font-size="25" text-anchor="middle" fill="#20364b">横500</text><text x="600" y="195" font-size="25" text-anchor="middle" fill="#20364b">横1300</text><rect id="world-player" x="434" y="290" width="12" height="16" rx="0" fill="#3474b9" stroke="#28629e" stroke-width="3"/><text x="440" y="250" font-size="26" text-anchor="middle" fill="#20364b">左端885</text><path d="M440 260V283" fill="none" stroke="#34495e" stroke-width="3"/><text x="440" y="345" font-size="27" text-anchor="middle" fill="#20364b">映す範囲800</text><path d="M280 375 160 485 M600 375 960 485" fill="none" stroke="#7b8da0" stroke-width="2" stroke-dasharray="8 6"/><rect id="screen" x="160" y="490" width="800" height="230" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="560" y="534" font-size="30" text-anchor="middle" fill="#20364b">画面：横800</text><rect id="screen-player" x="545" y="600" width="30" height="40" rx="0" fill="#3474b9" stroke="#28629e" stroke-width="3"/><text x="545" y="582" font-size="28" text-anchor="middle" fill="#20364b">左端は横385</text><text x="560" y="683" font-size="31" text-anchor="middle" fill="#20364b">885 − 500 ＝ 385</text><text x="160" y="760" font-size="25" text-anchor="start" fill="#20364b">画面の横0</text><text x="960" y="760" font-size="25" text-anchor="end" fill="#20364b">画面の横800</text><text x="48" y="823" font-size="21" text-anchor="start" fill="#20364b">図の人の左端：ステージでは885、画面では385。描くときだけ500を引きます。</text><text x="48" y="859" font-size="21" text-anchor="start" fill="#20364b">当たり判定はステージの座標。カメラの左端は0～1600の間に収めます。</text><text x="48" y="895" font-size="21" text-anchor="start" fill="#20364b">横幅の比率は実際の値に対応。縦の高さは見やすくした模式図です。</text></svg>