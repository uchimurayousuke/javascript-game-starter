<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc" lang="ja"><title id="title">覚える2秒と、遊ぶ60秒を分ける</title><desc id="desc">覚える2秒と、遊ぶ60秒を分ける。最初に全カードを公開し、終わったら裏返して操作を始めます。説明用に2枚だけ描いています。実際は全カードを公開し、その間は選べません。模式図：公開 → 操作 → 時間切れの順です。時間内にそろえた場合は先にクリアします。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="790" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">覚える2秒と、遊ぶ60秒を分ける</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">最初に全カードを公開し、終わったら裏返して操作を始めます。</text><rect id="memory-phase-0" x="40" y="165" width="260" height="400" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="170" y="210" font-size="25" text-anchor="middle" fill="#20364b">最初に覚える</text><rect id="card-0-0" x="75" y="265" width="90" height="110" rx="8" fill="#fff3cf" stroke="#28629e" stroke-width="3"/><text x="120" y="338" font-size="38" text-anchor="middle" fill="#20364b">A</text><rect id="card-0-1" x="175" y="265" width="90" height="110" rx="8" fill="#fff3cf" stroke="#28629e" stroke-width="3"/><text x="220" y="338" font-size="38" text-anchor="middle" fill="#20364b">B</text><text x="170" y="442" font-size="31" text-anchor="middle" fill="#20364b">2秒公開</text><text x="170" y="505" font-size="25" text-anchor="middle" fill="#20364b">選べない</text><path d="M312 320L358 320" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="memory-phase-1" x="370" y="165" width="260" height="400" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="500" y="210" font-size="25" text-anchor="middle" fill="#20364b">公開が終わったら</text><rect id="card-1-0" x="405" y="265" width="90" height="110" rx="8" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="450" y="338" font-size="38" text-anchor="middle" fill="#20364b">？</text><rect id="card-1-1" x="505" y="265" width="90" height="110" rx="8" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="550" y="338" font-size="38" text-anchor="middle" fill="#20364b">？</text><text x="500" y="442" font-size="31" text-anchor="middle" fill="#20364b">残り60秒</text><text x="500" y="505" font-size="25" text-anchor="middle" fill="#20364b">ここから選べる</text><path d="M642 320L688 320" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="memory-phase-2" x="700" y="165" width="260" height="400" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="830" y="210" font-size="25" text-anchor="middle" fill="#20364b">時間切れの例</text><rect id="card-2-0" x="735" y="265" width="90" height="110" rx="8" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="780" y="338" font-size="38" text-anchor="middle" fill="#20364b">？</text><rect id="card-2-1" x="835" y="265" width="90" height="110" rx="8" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="880" y="338" font-size="38" text-anchor="middle" fill="#20364b">？</text><text x="830" y="442" font-size="31" text-anchor="middle" fill="#20364b">残り0秒</text><text x="830" y="505" font-size="25" text-anchor="middle" fill="#20364b">終了</text><text x="500" y="634" font-size="29" text-anchor="middle" fill="#20364b">最初の2秒は、制限時間60秒に含めない</text><text x="40" y="726" font-size="19" text-anchor="start" fill="#20364b">説明用に2枚だけ描いています。実際は全カードを公開し、その間は選べません。</text><text x="40" y="758" font-size="19" text-anchor="start" fill="#20364b">模式図：公開 → 操作 → 時間切れの順です。時間内にそろえた場合は先にクリアします。</text></svg>