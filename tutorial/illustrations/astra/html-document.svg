<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" lang="ja"><title id="title">HTMLの骨組み：headとbodyで役割が違う</title><desc id="desc">doctypeはHTML文書の宣言。html lang jaの中のheadには文字コードとタイトル、bodyには画面の見出しがある。titleの練習はブラウザーのタブ、h1のゲームは本文に現れる。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="850" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">HTMLの骨組み：headとbodyで役割が違う</text><text x="40" y="110" font-size="28" text-anchor="start" fill="#20364b">&lt;!doctype html&gt;：HTML文書だと知らせる</text><rect x="40" y="145" width="690" height="625" rx="12" fill="#edf3f8" stroke="#607a90" stroke-width="2"/><text x="65" y="190" font-size="30" text-anchor="start" fill="#20364b">&lt;html lang=&quot;ja&quot;&gt;</text><rect x="70" y="220" width="630" height="205" rx="12" fill="#e8f0fb" stroke="#607a90" stroke-width="2"/><text x="90" y="260" font-size="28" text-anchor="start" fill="#20364b">&lt;head&gt;</text><text x="115" y="310" font-size="28" text-anchor="start" fill="#20364b">&lt;meta charset=&quot;utf-8&quot;&gt;</text><text x="115" y="360" font-size="28" text-anchor="start" fill="#20364b">&lt;title&gt;練習&lt;/title&gt;</text><text x="90" y="405" font-size="28" text-anchor="start" fill="#20364b">&lt;/head&gt;</text><rect x="70" y="455" width="630" height="225" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="90" y="500" font-size="28" text-anchor="start" fill="#20364b">&lt;body&gt;</text><text x="115" y="560" font-size="30" text-anchor="start" fill="#20364b">&lt;h1&gt;ゲーム&lt;/h1&gt;</text><text x="90" y="650" font-size="28" text-anchor="start" fill="#20364b">&lt;/body&gt;</text><text x="65" y="735" font-size="30" text-anchor="start" fill="#20364b">&lt;/html&gt;</text><rect x="800" y="220" width="350" height="460" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><rect x="800" y="220" width="350" height="70" rx="12" fill="#e8f0fb" stroke="#607a90" stroke-width="2"/><text x="830" y="267" font-size="29" text-anchor="start" fill="#20364b">タブ：練習</text><text x="830" y="385" font-size="45" text-anchor="start" fill="#20364b">ゲーム</text><text x="830" y="610" font-size="26" text-anchor="start" fill="#20364b">本文に見出し</text><path d="M700 350 L780 255" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 555 L780 380" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="820" font-size="23" text-anchor="start" fill="#20364b">lang=&quot;ja&quot; は文書の言語。utf-8は文字コード。矢印は表示先を示します。</text></svg>