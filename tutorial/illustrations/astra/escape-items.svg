<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc" lang="ja"><title id="title">道具は、使う場所を考えて選ぼう</title><desc id="desc">道具は、使う場所を考えて選ぼう。同じドライバーでも、使う相手によって結果が変わります。ドライバーで外せるのは換気口のネジ。出口を開けるには鍵が必要です。模式図：2つの使い方を比べています。間違った場所で使っても道具は持ち物に残ります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="840" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">道具は、使う場所を考えて選ぼう</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">同じドライバーでも、使う相手によって結果が変わります。</text><rect id="correct-use" x="40" y="155" width="550" height="535" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="wrong-use" x="610" y="155" width="550" height="535" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="315" y="207" font-size="29" text-anchor="middle" fill="#20364b">換気口のネジに使う</text><text x="885" y="207" font-size="29" text-anchor="middle" fill="#20364b">出口に使ってみる</text><g id="driver-correct"><path d="M110 380L180 310" fill="none" stroke="#687e90" stroke-width="12"/><path d="M170 320L210 280" fill="none" stroke="#28629e" stroke-width="28"/><path d="M102 392L118 376" fill="none" stroke="#687e90" stroke-width="9"/></g><g id="driver-wrong"><path d="M680 380L750 310" fill="none" stroke="#687e90" stroke-width="12"/><path d="M740 320L780 280" fill="none" stroke="#28629e" stroke-width="28"/><path d="M672 392L688 376" fill="none" stroke="#687e90" stroke-width="9"/></g><text x="165" y="439" font-size="25" text-anchor="middle" fill="#20364b">ドライバー</text><text x="735" y="439" font-size="25" text-anchor="middle" fill="#20364b">ドライバー</text><path d="M240 340L310 340" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M810 340L880 340" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="open-vent" x="335" y="280" width="150" height="120" rx="0" fill="#314a60" stroke="#687e90" stroke-width="3"/><path d="M489 280L527 295V415L489 400Z" fill="none" stroke="#687e90" stroke-width="4"/><rect id="closed-exit" x="940" y="262" width="100" height="150" rx="0" fill="#f0d5af" stroke="#946d3d" stroke-width="3"/><circle id="closed-exit-knob" cx="1018" cy="342" r="6" fill="#aa7a20" stroke="#aa7a20" stroke-width="3"/><text x="315" y="511" font-size="31" text-anchor="middle" fill="#18734f">ネジが外れて開く！</text><text x="885" y="511" font-size="31" text-anchor="middle" fill="#a64e16">出口は開かない</text><g id="found-key"><circle id="found-key-ring" cx="265" cy="585" r="25" fill="none" stroke="#aa7a20" stroke-width="3"/><path d="M290 585H372V605 M348 585V605" fill="none" stroke="#aa7a20" stroke-width="10"/></g><text x="315" y="658" font-size="25" text-anchor="middle" fill="#20364b">中の鍵を手に入れる</text><rect id="inventory-after-wrong-use" x="650" y="550" width="470" height="105" rx="12" fill="#eef5fb" stroke="#7b91aa" stroke-width="3"/><text x="885" y="592" font-size="28" text-anchor="middle" fill="#20364b">持ち物：ドライバー</text><text x="885" y="633" font-size="25" text-anchor="middle" fill="#20364b">間違えても消えない</text><text x="48" y="769" font-size="21" text-anchor="start" fill="#20364b">ドライバーで外せるのは換気口のネジ。出口を開けるには鍵が必要です。</text><text x="48" y="805" font-size="21" text-anchor="start" fill="#20364b">模式図：2つの使い方を比べています。間違った場所で使っても道具は持ち物に残ります。</text></svg>