<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">保存：読み込んだ値を確かめる</title><desc id="desc">保存：読み込んだ値を確かめる。基本3 ／ 保存するのは現在の得点ではなく、ベスト得点。保存と読込の処理を分けた模式図。例のJSONはベスト3の場合です。データなし・JSON破損・値の不正・保存先の利用不可をメッセージで知らせます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">保存：読み込んだ値を確かめる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 保存するのは現在の得点ではなく、ベスト得点。</text><rect id="save" x="60" y="170" width="410" height="130" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="265.0" y="215" font-size="29" text-anchor="middle" fill="#20364b">S：保存</text><text x="265.0" y="258" font-size="23" text-anchor="middle" fill="#20364b">ベスト3 → {&quot;best&quot;:3}</text><rect id="load" x="530" y="170" width="410" height="130" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="735.0" y="215" font-size="29" text-anchor="middle" fill="#20364b">L：読み込み</text><text x="735.0" y="258" font-size="23" text-anchor="middle" fill="#20364b">保存された文字列を取り出す</text><path d="M265 310L265 365" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M735 310L735 365" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="storage" x="60" y="375" width="410" height="135" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="265.0" y="420" font-size="29" text-anchor="middle" fill="#20364b">保存先へ書き込む</text><text x="265.0" y="463" font-size="23" text-anchor="middle" fill="#20364b">成功／保存できません</text><rect id="validate" x="530" y="375" width="410" height="135" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="735.0" y="420" font-size="29" text-anchor="middle" fill="#20364b">JSONを読み、値を検査</text><text x="735.0" y="463" font-size="23" text-anchor="middle" fill="#20364b">bestは0〜9999の整数？</text><path d="M735 520L735 560" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="apply" x="530" y="570" width="410" height="105" rx="16" fill="#d4efde" stroke="#a9bdcf" stroke-width="3"/><text x="735.0" y="615" font-size="29" text-anchor="middle" fill="#20364b">正しいときだけ反映</text><text x="735.0" y="658" font-size="23" text-anchor="middle" fill="#20364b">例：ベストを3にする</text><text x="80" y="565" font-size="27" text-anchor="start" fill="#20364b">失敗したらメッセージ</text><text x="80" y="615" font-size="27" text-anchor="start" fill="#20364b">不正な値は使わない</text><text x="80" y="655" font-size="24" text-anchor="start" fill="#20364b">D：この例の保存だけ削除</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">保存と読込の処理を分けた模式図。例のJSONはベスト3の場合です。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">データなし・JSON破損・値の不正・保存先の利用不可をメッセージで知らせます。</text></svg>