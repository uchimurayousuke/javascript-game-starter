<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc" lang="ja"><title id="title">ゲームの流れ：初期化と繰り返しを分ける</title><desc id="desc">ゲームの流れ：初期化と繰り返しを分ける。組み合わせ 基本4 ／ 入力が値を変え、ループが更新して描きます。処理の関係を表す模式図。矢印の長さは処理時間や回数を表しません。start()は初回の開始時と再挑戦時に呼び、値を初期化。ループはメニュー表示中も動き、増やしません。draw()の後、gameLoop()が次回を予約します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="900" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">ゲームの流れ：初期化と繰り返しを分ける</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">組み合わせ 基本4 ／ 入力が値を変え、ループが更新して描きます。</text><rect id="boot" x="500" y="160" width="430" height="120" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="715.0" y="205" font-size="29" text-anchor="middle" fill="#20364b">ページを開く</text><text x="715.0" y="248" font-size="23" text-anchor="middle" fill="#20364b">gameLoop()を1本始める</text><path d="M715 290L715 335" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="update" x="500" y="345" width="430" height="120" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="715.0" y="390" font-size="29" text-anchor="middle" fill="#20364b">update()：値を更新</text><text x="715.0" y="433" font-size="23" text-anchor="middle" fill="#20364b">playingのときに移動・判定</text><path d="M715 475L715 520" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="draw" x="500" y="530" width="430" height="120" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="715.0" y="575" font-size="29" text-anchor="middle" fill="#20364b">draw()：今の状態を描く</text><text x="715.0" y="618" font-size="23" text-anchor="middle" fill="#20364b">メニューや結果も描く</text><path d="M935 755 L965 755 L965 405 L935 405" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="start-event" x="50" y="305" width="340" height="190" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="220.0" y="350" font-size="29" text-anchor="middle" fill="#20364b">初回の開始・再挑戦</text><text x="220.0" y="393" font-size="23" text-anchor="middle" fill="#20364b">start()で初期化</text><rect id="score-zero" x="75" y="420" width="135" height="50" rx="7" fill="#d4efde" stroke="#498765" stroke-width="3"/><text x="142.5" y="453" font-size="25" text-anchor="middle" fill="#20364b">得点0</text><rect id="life-three" x="230" y="420" width="135" height="50" rx="7" fill="#d4efde" stroke="#498765" stroke-width="3"/><text x="297.5" y="453" font-size="25" text-anchor="middle" fill="#20364b">残り3</text><text x="220" y="260" font-size="21" text-anchor="middle" fill="#20364b">メニューでEnter／結果でSpace</text><path d="M395 405L495 405" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="keys" x="50" y="555" width="340" height="130" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="220.0" y="600" font-size="29" text-anchor="middle" fill="#20364b">左右キーのイベント</text><text x="220.0" y="643" font-size="23" text-anchor="middle" fill="#20364b">押した状態を変える</text><path d="M395 620 L450 620 L450 445 L495 445" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="836" font-size="19" text-anchor="start" fill="#20364b">処理の関係を表す模式図。矢印の長さは処理時間や回数を表しません。</text><text x="40" y="868" font-size="19" text-anchor="start" fill="#20364b">start()は初回の開始時と再挑戦時に呼び、値を初期化。ループはメニュー表示中も動き、増やしません。</text><path d="M715 655 L715 700" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="schedule" x="500" y="705" width="430" height="100" rx="16" fill="#fff0c7" stroke="#b28a37" stroke-width="3"/><text x="715" y="745" font-size="25" text-anchor="middle" fill="#20364b">gameLoop()で次回を予約</text><text x="715" y="782" font-size="20" text-anchor="middle" fill="#20364b">requestAnimationFrame(gameLoop)</text></svg>