<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc" lang="ja"><title id="title">Rで戻る場所は、2つの条件で決まる</title><desc id="desc">Rで戻る場所は、2つの条件で決まる。中間を通ってから失敗したときだけ、進めた記録を残して再開。「それ以外」には、中間より前の失敗・プレイ中・クリア後が含まれます。Rの押しっぱなしによる繰り返し入力は無視します。旗と人は模式図です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="1080" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">Rで戻る場所は、2つの条件で決まる</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">中間を通ってから失敗したときだけ、進めた記録を残して再開。</text><rect id="key-r" x="500" y="145" width="200" height="70" rx="14" fill="#fff5dc" stroke="#aa7a20" stroke-width="3"/><text x="600" y="191" font-size="33" text-anchor="middle" fill="#20364b">Rを押す</text><path d="M600 220L600 255" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="decision" x="285" y="265" width="630" height="90" rx="15" fill="#f0f7fc" stroke="#7b91aa" stroke-width="3"/><text x="600" y="303" font-size="27" text-anchor="middle" fill="#20364b">失敗している ＆ 中間地点を通過済み？</text><text x="600" y="338" font-size="23" text-anchor="middle" fill="#20364b">両方あてはまるかを確かめる</text><path d="M600 355V390H310V455" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 390H895V455" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="310" y="430" font-size="28" text-anchor="middle" fill="#20364b">はい</text><text x="895" y="430" font-size="28" text-anchor="middle" fill="#20364b">それ以外</text><rect id="retry-result" x="40" y="465" width="540" height="500" rx="18" fill="#f0f8f4" stroke="#cedce8" stroke-width="3"/><rect id="start-result" x="620" y="465" width="540" height="500" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="310" y="514" font-size="30" text-anchor="middle" fill="#20364b">中間から再開（retry）</text><text x="890" y="514" font-size="30" text-anchor="middle" fill="#20364b">最初から開始（start）</text><path d="M100 625V548H175V585H100" fill="none" stroke="#aa7a20" stroke-width="4"/><text x="137" y="576" font-size="22" text-anchor="middle" fill="#20364b">中間</text><rect id="restart-player-1200" x="235" y="555" width="60" height="80" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="265" y="604" font-size="28" text-anchor="middle" fill="#20364b">人</text><text x="360" y="572" font-size="29" text-anchor="start" fill="#20364b">横1200</text><text x="360" y="614" font-size="29" text-anchor="start" fill="#20364b">縦350</text><path d="M680 625V548H755V585H680" fill="none" stroke="#aa7a20" stroke-width="4"/><text x="717" y="576" font-size="22" text-anchor="middle" fill="#20364b">出発</text><rect id="restart-player-80" x="815" y="555" width="60" height="80" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="845" y="604" font-size="28" text-anchor="middle" fill="#20364b">人</text><text x="940" y="572" font-size="29" text-anchor="start" fill="#20364b">横80</text><text x="940" y="614" font-size="29" text-anchor="start" fill="#20364b">縦350</text><text x="75" y="687" font-size="27" text-anchor="start" fill="#20364b">戻すもの</text><text x="75" y="728" font-size="24" text-anchor="start" fill="#20364b">人の速度0・入力・プレイ状態</text><text x="75" y="766" font-size="24" text-anchor="start" fill="#20364b">カメラを再計算（左端815）</text><text x="75" y="818" font-size="27" text-anchor="start" fill="#20364b">残すもの</text><text x="75" y="859" font-size="24" text-anchor="start" fill="#20364b">コイン・敵・得点・倒した数</text><text x="75" y="897" font-size="24" text-anchor="start" fill="#20364b">中間地点を通った記録</text><text x="655" y="687" font-size="27" text-anchor="start" fill="#20364b">最初の状態につくり直す</text><text x="655" y="728" font-size="24" text-anchor="start" fill="#20364b">人の速度0・入力・プレイ状態</text><text x="655" y="766" font-size="24" text-anchor="start" fill="#20364b">カメラの左端0</text><text x="655" y="818" font-size="25" text-anchor="start" fill="#20364b">コインと敵を全部戻す</text><text x="655" y="859" font-size="25" text-anchor="start" fill="#20364b">得点0・倒した数0</text><text x="655" y="897" font-size="25" text-anchor="start" fill="#20364b">中間地点は「未通過」</text><text x="48" y="1009" font-size="21" text-anchor="start" fill="#20364b">「それ以外」には、中間より前の失敗・プレイ中・クリア後が含まれます。</text><text x="48" y="1045" font-size="21" text-anchor="start" fill="#20364b">Rの押しっぱなしによる繰り返し入力は無視します。旗と人は模式図です。</text></svg>