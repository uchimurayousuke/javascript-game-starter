<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">タグの対応：内側のタグから閉じる</title><desc id="desc">pの中にstrongを入れる例。pが段落全体を囲み、strongはゲームの文字だけを囲む。開始と終了の対応を線で示す。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="800" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">タグの対応：内側のタグから閉じる</text><text x="40" y="110" font-size="31" text-anchor="start" fill="#20364b">&lt;p&gt;こんにちは &lt;strong&gt;ゲーム&lt;/strong&gt;&lt;/p&gt;</text><rect x="60" y="175" width="1080" height="340" rx="12" fill="#eaf1fa" stroke="#607a90" stroke-width="2"/><text x="85" y="220" font-size="29" text-anchor="start" fill="#20364b">外側：段落 p</text><rect x="380" y="255" width="580" height="175" rx="12" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="400" y="295" font-size="28" text-anchor="start" fill="#20364b">内側：重要な文字 strong</text><text x="95" y="375" font-size="34" text-anchor="start" fill="#20364b">こんにちは</text><text x="565" y="375" font-size="42" text-anchor="start" fill="#20364b">ゲーム</text><text x="85" y="475" font-size="30" text-anchor="start" fill="#20364b">&lt;p&gt;</text><text x="1010" y="475" font-size="30" text-anchor="start" fill="#20364b">&lt;/p&gt;</text><path d="M160 465 L990 465" fill="none" stroke="#20364b" stroke-width="3"/><text x="405" y="415" font-size="26" text-anchor="start" fill="#20364b">&lt;strong&gt;</text><text x="765" y="415" font-size="26" text-anchor="start" fill="#20364b">&lt;/strong&gt;</text><path d="M550 405 L745 405" fill="none" stroke="#20364b" stroke-width="3"/><rect x="60" y="555" width="500" height="125" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="82" y="597" font-size="26" text-anchor="start" fill="#20364b">閉じる順番</text><text x="82" y="650" font-size="30" text-anchor="start" fill="#20364b">strong → p</text><rect x="600" y="555" width="540" height="125" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="622" y="597" font-size="26" text-anchor="start" fill="#20364b">画面で読める文字</text><text x="622" y="650" font-size="30" text-anchor="start" fill="#20364b">こんにちは ゲーム</text><text x="40" y="740" font-size="24" text-anchor="start" fill="#20364b">タグ自体は画面に表示しません。imgのように終了タグがない要素もあります。</text></svg>