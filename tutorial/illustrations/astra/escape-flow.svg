<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc" lang="ja"><title id="title">ヒントと道具をつないで、部屋から脱出！</title><desc id="desc">ヒントと道具をつないで、部屋から脱出！部屋の物をクリックして調べます。キャラクターを動かす操作はありません。棚の241は引き出しの番号。ドライバーは換気口のネジ、鍵は出口に使います。模式図：1つの部屋で進める仕掛けを、使う順番に並べています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="950" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">ヒントと道具をつないで、部屋から脱出！</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">部屋の物をクリックして調べます。キャラクターを動かす操作はありません。</text><rect id="shelf-panel" x="50" y="160" width="320" height="280" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="210" y="204" font-size="30" text-anchor="middle" fill="#20364b">棚</text><rect id="drawer-panel" x="440" y="160" width="320" height="280" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="600" y="204" font-size="30" text-anchor="middle" fill="#20364b">引き出し</text><rect id="driver-panel" x="830" y="160" width="320" height="280" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="990" y="204" font-size="30" text-anchor="middle" fill="#20364b">ドライバー</text><rect id="exit-panel" x="50" y="530" width="320" height="280" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="210" y="574" font-size="30" text-anchor="middle" fill="#20364b">出口</text><rect id="key-panel" x="440" y="530" width="320" height="280" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="600" y="574" font-size="30" text-anchor="middle" fill="#20364b">鍵</text><rect id="vent-panel" x="830" y="530" width="320" height="280" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="990" y="574" font-size="30" text-anchor="middle" fill="#20364b">換気口</text><rect id="shelf" x="120" y="225" width="180" height="140" rx="0" fill="#f0d5af" stroke="#946d3d" stroke-width="3"/><path d="M120 325H300" fill="none" stroke="#946d3d" stroke-width="5"/><rect id="hint-note" x="150" y="245" width="120" height="65" rx="0" fill="#fff5dc" stroke="#aa7a20" stroke-width="3"/><text x="210" y="292" font-size="40" text-anchor="middle" fill="#20364b">241</text><text x="210" y="407" font-size="24" text-anchor="middle" fill="#20364b">ヒントの数字を読む</text><rect id="drawer" x="510" y="237" width="180" height="120" rx="0" fill="#f0d5af" stroke="#946d3d" stroke-width="3"/><rect id="digit-0" x="522" y="260" width="44" height="48" rx="0" fill="#fff" stroke="#946d3d" stroke-width="3"/><text x="544" y="294" font-size="28" text-anchor="middle" fill="#20364b">2</text><rect id="digit-1" x="573" y="260" width="44" height="48" rx="0" fill="#fff" stroke="#946d3d" stroke-width="3"/><text x="595" y="294" font-size="28" text-anchor="middle" fill="#20364b">4</text><rect id="digit-2" x="624" y="260" width="44" height="48" rx="0" fill="#fff" stroke="#946d3d" stroke-width="3"/><text x="646" y="294" font-size="28" text-anchor="middle" fill="#20364b">1</text><text x="600" y="407" font-size="24" text-anchor="middle" fill="#20364b">241を入力して開ける</text><g id="screwdriver"><path d="M950 344L1020 274" fill="none" stroke="#687e90" stroke-width="12"/><path d="M1010 284L1050 244" fill="none" stroke="#28629e" stroke-width="28"/><path d="M942 356L958 340" fill="none" stroke="#687e90" stroke-width="9"/></g><text x="990" y="407" font-size="22" text-anchor="middle" fill="#20364b">引き出しから手に入れる</text><path d="M380 300L430 300" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M770 300L820 300" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M990 450L990 518" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="1080" y="490" font-size="23" text-anchor="middle" fill="#20364b">ネジに使う</text><rect id="vent" x="915" y="600" width="150" height="120" rx="0" fill="#314a60" stroke="#687e90" stroke-width="3"/><path d="M1069 600L1107 615V735L1069 720Z" fill="none" stroke="#687e90" stroke-width="4"/><text x="990" y="777" font-size="24" text-anchor="middle" fill="#20364b">ネジを外すと中に鍵</text><g id="key"><circle id="key-ring" cx="550" cy="660" r="25" fill="none" stroke="#aa7a20" stroke-width="3"/><path d="M575 660H657V680 M633 660V680" fill="none" stroke="#aa7a20" stroke-width="10"/></g><text x="600" y="777" font-size="24" text-anchor="middle" fill="#20364b">鍵を手に入れる</text><rect id="exit" x="160" y="590" width="100" height="150" rx="0" fill="#f0d5af" stroke="#946d3d" stroke-width="3"/><circle id="exit-knob" cx="238" cy="670" r="6" fill="#aa7a20" stroke="#aa7a20" stroke-width="3"/><text x="210" y="777" font-size="24" text-anchor="middle" fill="#20364b">鍵で開けてクリア！</text><path d="M820 680L770 680" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M430 680L380 680" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="879" font-size="21" text-anchor="start" fill="#20364b">棚の241は引き出しの番号。ドライバーは換気口のネジ、鍵は出口に使います。</text><text x="48" y="915" font-size="21" text-anchor="start" fill="#20364b">模式図：1つの部屋で進める仕掛けを、使う順番に並べています。</text></svg>