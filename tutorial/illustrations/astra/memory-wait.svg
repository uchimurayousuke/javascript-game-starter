<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc" lang="ja"><title id="title">違う2枚を覚えるために、1秒待つ</title><desc id="desc">違う2枚を覚えるために、1秒待つ。不一致の2枚を見せている間は、3枚目をめくりません。説明用のAとBの例です。比較が終わって2枚を閉じると、次のカードを選べます。模式図：同じ2枚の変化を時間順に並べています。各場面の下のカードが3枚目の候補です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="870" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">違う2枚を覚えるために、1秒待つ</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">不一致の2枚を見せている間は、3枚目をめくりません。</text><rect id="wait-stage-0" x="40" y="155" width="350" height="500" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="215" y="205" font-size="27" text-anchor="middle" fill="#20364b">2枚目をめくった</text><rect id="wait-0-a" x="95" y="245" width="100" height="110" rx="10" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="145.0" y="316.0" font-size="42" text-anchor="middle" fill="#20364b">A</text><rect id="wait-0-b" x="235" y="245" width="100" height="110" rx="10" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="285.0" y="316.0" font-size="42" text-anchor="middle" fill="#20364b">B</text><text x="215" y="402" font-size="26" text-anchor="middle" fill="#20364b">AとB → 不一致</text><rect id="wait-0-third" x="95" y="450" width="100" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="145.0" y="521.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><text x="215" y="608" font-size="23" text-anchor="middle" fill="#20364b">3枚目は</text><text x="215" y="642" font-size="24" text-anchor="middle" fill="#20364b">まだ選ばない</text><path d="M395 310L427 310" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="wait-stage-1" x="435" y="155" width="350" height="500" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="610" y="205" font-size="27" text-anchor="middle" fill="#20364b">比べている間</text><rect id="wait-1-a" x="490" y="245" width="100" height="110" rx="10" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="540.0" y="316.0" font-size="42" text-anchor="middle" fill="#20364b">A</text><rect id="wait-1-b" x="630" y="245" width="100" height="110" rx="10" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="680.0" y="316.0" font-size="42" text-anchor="middle" fill="#20364b">B</text><text x="610" y="402" font-size="26" text-anchor="middle" fill="#20364b">2枚は見せたまま</text><rect id="wait-1-third" x="490" y="450" width="100" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="540.0" y="521.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><text x="610" y="608" font-size="23" text-anchor="middle" fill="#20364b">3枚目は</text><text x="610" y="642" font-size="24" text-anchor="middle" fill="#20364b">選べない</text><path d="M790 310L822 310" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="wait-stage-2" x="830" y="155" width="350" height="500" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="1005" y="205" font-size="27" text-anchor="middle" fill="#20364b">1秒たった</text><rect id="wait-2-a" x="885" y="245" width="100" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="935.0" y="316.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><rect id="wait-2-b" x="1025" y="245" width="100" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="1075.0" y="316.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><text x="1005" y="402" font-size="26" text-anchor="middle" fill="#20364b">2枚とも裏向きへ</text><rect id="wait-2-third" x="885" y="450" width="100" height="110" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="935.0" y="521.0" font-size="42" text-anchor="middle" fill="#20364b">？</text><text x="1005" y="608" font-size="23" text-anchor="middle" fill="#20364b">次のカードを</text><text x="1005" y="642" font-size="24" text-anchor="middle" fill="#20364b">選べる</text><text x="600" y="720" font-size="32" text-anchor="middle" fill="#20364b">比較中は待とう。1000ミリ秒 ＝ 1秒</text><text x="48" y="799" font-size="21" text-anchor="start" fill="#20364b">説明用のAとBの例です。比較が終わって2枚を閉じると、次のカードを選べます。</text><text x="48" y="835" font-size="21" text-anchor="start" fill="#20364b">模式図：同じ2枚の変化を時間順に並べています。各場面の下のカードが3枚目の候補です。</text></svg>