<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="905" viewBox="0 0 1000 905" role="img" aria-labelledby="title desc" lang="ja"><title id="title">1手前の盤面は、行ごとにコピーして残す</title><desc id="desc">1手前の盤面は、行ごとにコピーして残す。動けることを確かめたら、変更する前の盤面と人を保存します。履歴の各行は現在の各行とは別物。今の盤面を変えても、保存した箱の場所は変わりません。模式図：盤面の一部3×3だけを抜き出しています。Uで盤面と人の位置を復元します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="905" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">1手前の盤面は、行ごとにコピーして残す</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">動けることを確かめたら、変更する前の盤面と人を保存します。</text><rect id="current" x="40" y="165" width="420" height="340" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="saved" x="540" y="165" width="420" height="340" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="250" y="210" font-size="29" text-anchor="middle" fill="#20364b">動いている盤面</text><text x="750" y="210" font-size="29" text-anchor="middle" fill="#20364b">履歴に残す盤面</text><rect id="current-0-0" x="115" y="235" width="75" height="75" rx="0" fill="#f5f8f0" stroke="#7b91aa" stroke-width="3"/><text x="152.5" y="281.5" font-size="23.25" text-anchor="middle" fill="#20364b">床</text><rect id="saved-0-0" x="615" y="235" width="75" height="75" rx="0" fill="#f5f8f0" stroke="#7b91aa" stroke-width="3"/><text x="652.5" y="281.5" font-size="23.25" text-anchor="middle" fill="#20364b">床</text><rect id="current-0-1" x="205" y="235" width="75" height="75" rx="0" fill="#f5f8f0" stroke="#7b91aa" stroke-width="3"/><text x="242.5" y="281.5" font-size="23.25" text-anchor="middle" fill="#20364b">床</text><rect id="saved-0-1" x="705" y="235" width="75" height="75" rx="0" fill="#f5f8f0" stroke="#7b91aa" stroke-width="3"/><text x="742