<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc" lang="ja"><title id="title">同じ設計図から、別々の敵をつくる</title><desc id="desc">同じ設計図から、別々の敵をつくる。2体は同じ動き方。でも、位置は1体ずつ持っています。敵1の横900を動かしても、敵2の横1700は変わりません。模式図：設計図から2体への分岐と、それぞれの行動範囲を示しています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="890" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">同じ設計図から、別々の敵をつくる</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">2体は同じ動き方。でも、位置は1体ずつ持っています。</text><rect id="enemy-blueprint" x="400" y="155" width="400" height="210" rx="14" fill="#fff5dc" stroke="#aa7a20" stroke-width="3"/><text x="600" y="204" font-size="30" text-anchor="middle" fill="#20364b">敵の設計図：Enemy</text><text x="600" y="251" font-size="26" text-anchor="middle" fill="#20364b">幅30・高さ30・縦360</text><text x="600" y="295" font-size="27" text-anchor="middle" fill="#20364b">横へ1ずつ動く</text><text x="600" y="337" font-size="25" text-anchor="middle" fill="#20364b">端まで来たら折り返す</text><path d="M600 365V405H300V450" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 405H900V450" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="426" font-size="25" text-anchor="middle" fill="#20364b">1体つくる</text><text x="900" y="426" font-size="25" text-anchor="middle" fill="#20364b">もう1体つくる</text><rect id="enemy-1" x="200" y="470" width="200" height="160" rx="0" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><text x="300" y="512" font-size="31" text-anchor="middle" fill="#20364b">敵1</text><text x="300" y="555" font-size="32" text-anchor="middle" fill="#20364b">横900</text><text x="300" y="598" font-size="27" text-anchor="middle" fill="#20364b">縦360</text><path d="M130 675H470" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="130" y="713" font-size="25" text-anchor="middle" fill="#20364b">850</text><text x="470" y="713" font-size="25" text-anchor="middle" fill="#20364b">990</text><text x="300" y="756" font-size="25" text-anchor="middle" fill="#20364b">行き来する横の範囲</text><rect id="enemy-2" x="800" y="470" width="200" height="160" rx="0" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><text x="900" y="512" font-size="31" text-anchor="middle" fill="#20364b">敵2</text><text x="900" y="555" font-size="32" text-anchor="middle" fill="#20364b">横1700</text><text x="900" y="598" font-size="27" text-anchor="middle" fill="#20364b">縦360</text><path d="M730 675H1070" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="730" y="713" font-size="25" text-anchor="middle" fill="#20364b">1640</text><text x="1070" y="713" font-size="25" text-anchor="middle" fill="#20364b">1780</text><text x="900" y="756" font-size="25" text-anchor="middle" fill="#20364b">行き来する横の範囲</text><text x="48" y="819" font-size="21" text-anchor="start" fill="#20364b">敵1の横900を動かしても、敵2の横1700は変わりません。</text><text x="48" y="855" font-size="21" text-anchor="start" fill="#20364b">模式図：設計図から2体への分岐と、それぞれの行動範囲を示しています。</text></svg>