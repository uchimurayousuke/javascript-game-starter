<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" lang="ja"><title id="title">薬を1個使うとHP＋3。ただしHPは10まで</title><desc id="desc">初期HP5と薬2。1キーで薬を1個使いHP8薬1、次はHP10薬0。薬0またはHP10では使用せず薬も減らない。拾う薬は最大5個。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="850" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">薬を1個使うとHP＋3。ただしHPは10まで</text><rect x="40" y="155" width="340" height="330" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="210" y="200" font-size="29" text-anchor="middle" fill="#20364b">はじめ</text><text x="65" y="270" font-size="35" text-anchor="start" fill="#20364b">HP 5 / 10</text><rect x="65" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="94" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="123" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="152" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="181" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="210" y="300" width="24" height="38" rx="2" fill="#ffffff" stroke="#607a90" stroke-width="2"/><rect x="239" y="300" width="24" height="38" rx="2" fill="#ffffff" stroke="#607a90" stroke-width="2"/><rect x="268" y="300" width="24" height="38" rx="2" fill="#ffffff" stroke="#607a90" stroke-width="2"/><rect x="297" y="300" width="24" height="38" rx="2" fill="#ffffff" stroke="#607a90" stroke-width="2"/><rect x="326" y="300" width="24" height="38" rx="2" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="65" y="400" font-size="36" text-anchor="start" fill="#20364b">薬 2 個</text><rect x="220" y="365" width="45" height="70" rx="12" fill="#ffdfac" stroke="#607a90" stroke-width="2"/><text x="242" y="413" font-size="25" text-anchor="middle" fill="#20364b">薬</text><rect x="280" y="365" width="45" height="70" rx="12" fill="#ffdfac" stroke="#607a90" stroke-width="2"/><text x="302" y="413" font-size="25" text-anchor="middle" fill="#20364b">薬</text><path d="M390 320 L420 320" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="155" width="340" height="330" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="600" y="200" font-size="29" text-anchor="middle" fill="#20364b">1を押す</text><text x="455" y="270" font-size="35" text-anchor="start" fill="#20364b">HP 8 / 10</text><rect x="455" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="484" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="513" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="542" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="571" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="600" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="629" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="658" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="687" y="300" width="24" height="38" rx="2" fill="#ffffff" stroke="#607a90" stroke-width="2"/><rect x="716" y="300" width="24" height="38" rx="2" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="455" y="400" font-size="36" text-anchor="start" fill="#20364b">薬 1 個</text><rect x="610" y="365" width="45" height="70" rx="12" fill="#ffdfac" stroke="#607a90" stroke-width="2"/><text x="632" y="413" font-size="25" text-anchor="middle" fill="#20364b">薬</text><path d="M780 320 L810 320" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="155" width="340" height="330" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="990" y="200" font-size="29" text-anchor="middle" fill="#20364b">もう一度1</text><text x="845" y="270" font-size="35" text-anchor="start" fill="#20364b">HP 10 / 10</text><rect x="845" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="874" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="903" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="932" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="961" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="990" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="1019" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="1048" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="1077" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><rect x="1106" y="300" width="24" height="38" rx="2" fill="#80b98d" stroke="#607a90" stroke-width="2"/><text x="845" y="400" font-size="36" text-anchor="start" fill="#20364b">薬 0 個</text><text x="40" y="545" font-size="29" text-anchor="start" fill="#20364b">1回目：5＋3＝8 ／ 2回目：8＋3＝11 → 上限10</text><rect x="40" y="590" width="1120" height="125" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="65" y="635" font-size="28" text-anchor="start" fill="#20364b">薬0 または HP10なら使わない。薬の数も減らさない。</text><text x="65" y="685" font-size="26" text-anchor="start" fill="#20364b">HP10で薬を持っていても、そのまま残ります。</text><text x="40" y="775" font-size="27" text-anchor="start" fill="#20364b">Gで薬を拾う：最大5個。RでHP5・薬2個に戻します。</text><text x="40" y="825" font-size="23" text-anchor="start" fill="#20364b">小さい枠1つがHP1。3つの箱は同じプレイの前後です。</text></svg>