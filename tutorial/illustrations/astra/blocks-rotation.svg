<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">右に90度回転：列を取り出し、逆順にする</title><desc id="desc">L形の3行2列を右へ90度回転すると2行3列になる。元の列0は1,1,1、列1は0,0,1。列を逆順にして新しい行を作る。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="800" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#20364b">右に90度回転：列を取り出し、逆順にする</text><text x="40" y="104" font-size="25" text-anchor="start" fill="#20364b">落ちものパズル 基本3 ／ 1はブロック、0は空きマス。</text><text x="80" y="165" font-size="28" text-anchor="start" fill="#20364b">回転前：3行 × 2列</text><rect x="90" y="225" width="90" height="90" rx="0" fill="#ffdfac" stroke="#657e91" stroke-width="2"/><text x="135" y="280" font-size="30" text-anchor="middle" fill="#20364b">1</text><rect x="180" y="225" width="90" height="90" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="225" y="280" font-size="30" text-anchor="middle" fill="#20364b">0</text><rect x="90" y="315" width="90" height="90" rx="0" fill="#ffdfac" stroke="#657e91" stroke-width="2"/><text x="135" y="370" font-size="30" text-anchor="middle" fill="#20364b">1</text><rect x="180" y="315" width="90" height="90" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="225" y="370" font-size="30" text-anchor="middle" fill="#20364b">0</text><rect x="90" y="405" width="90" height="90" rx="0" fill="#ffdfac" stroke="#657e91" stroke-width="2"/><text x="135" y="460" font-size="30" text-anchor="middle" fill="#20364b">1</text><rect x="180" y="405" width="90" height="90" rx="0" fill="#ffdfac" stroke="#657e91" stroke-width="2"/><text x="225" y="460" font-size="30" text-anchor="middle" fill="#20364b">1</text><text x="135" y="215" font-size="22" text-anchor="middle" fill="#20364b">列0</text><text x="225" y="215" font-size="22" text-anchor="middle" fill="#20364b">列1</text><text x="380" y="220" font-size="27" text-anchor="start" fill="#20364b">列0：1 → 1 → 1</text><text x="380" y="270" font-size="27" text-anchor="start" fill="#20364b">逆順：1 → 1 → 1</text><text x="380" y="355" font-size="27" text-anchor="start" fill="#20364b">列1：0 → 0 → 1</text><text x="380" y="405" font-size="27" text-anchor="start" fill="#20364b">逆順：1 → 0 → 0</text><path d="M290 290 L350 290" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M710 290 L780 290" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="820" y="165" font-size="28" text-anchor="start" fill="#20364b">回転後：2行 × 3列</text><rect x="820" y="220" width="90" height="90" rx="0" fill="#ffdfac" stroke="#657e91" stroke-width="2"/><text x="865" y="275" font-size="30" text-anchor="middle" fill="#20364b">1</text><rect x="910" y="220" width="90" height="90" rx="0" fill="#ffdfac" stroke="#657e91" stroke-width="2"/><text x="955" y="275" font-size="30" text-anchor="middle" fill="#20364b">1</text><rect x="1000" y="220" width="90" height="90" rx="0" fill="#ffdfac" stroke="#657e91" stroke-width="2"/><text x="1045" y="275" font-size="30" text-anchor="middle" fill="#20364b">1</text><rect x="820" y="310" width="90" height="90" rx="0" fill="#ffdfac" stroke="#657e91" stroke-width="2"/><text x="865" y="365" font-size="30" text-anchor="middle" fill="#20364b">1</text><rect x="910" y="310" width="90" height="90" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="955" y="365" font-size="30" text-anchor="middle" fill="#20364b">0</text><rect x="1000" y="310" width="90" height="90" rx="0" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="1045" y="365" font-size="30" text-anchor="middle" fill="#20364b">0</text><text x="80" y="535" font-size="27" text-anchor="start" fill="#20364b">[[1,0], [1,0], [1,1]]</text><text x="670" y="535" font-size="27" text-anchor="start" fill="#20364b">[[1,1,1], [1,0,0]]</text><rect x="60" y="580" width="1080" height="135" rx="12" fill="#e9f3e9" stroke="#657e91" stroke-width="2"/><text x="85" y="625" font-size="28" text-anchor="start" fill="#20364b">まず回転後の「候補」を作る。置けるか fits で調べる。</text><text x="85" y="675" font-size="27" text-anchor="start" fill="#20364b">盤外・固定済みマスと重なるなら、回転前の形を残す。</text><text x="40" y="765" font-size="22" text-anchor="start" fill="#20364b">実コードの shapes[2] の例。マスを拡大。矢印は計算の順番です。</text></svg>