<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">3つそろえ：交差した中心は1個だけ</title><desc id="desc">3つそろえ：交差した中心は1個だけ。基本3 ／ 横と縦に同じ文字が3個以上続く場所を探します。6×6盤面の一部を説明用の3×3にした例。初期配置ではありません。1マス50pxを105pxへ拡大。基本3では「そろった」の判定までを行います。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">3つそろえ：交差した中心は1個だけ</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 横と縦に同じ文字が3個以上続く場所を探します。</text><rect id="m00" x="85" y="230" width="105" height="105" rx="0" fill="#eaa29d" stroke="#708391" stroke-width="3"/><text x="137.5" y="296" font-size="38" text-anchor="middle" fill="#20364b">B</text><rect id="m01" x="190" y="230" width="105" height="105" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="242.5" y="296" font-size="38" text-anchor="middle" fill="#20364b">A</text><rect id="m02" x="295" y="230" width="105" height="105" rx="0" fill="#bad18f" stroke="#708391" stroke-width="3"/><text x="347.5" y="296" font-size="38" text-anchor="middle" fill="#20364b">C</text><rect id="m10" x="85" y="335" width="105" height="105" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="137.5" y="401" font-size="38" text-anchor="middle" fill="#20364b">A</text><rect id="m11" x="190" y="335" width="105" height="105" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="242.5" y="401" font-size="38" text-anchor="middle" fill="#20364b">A</text><rect id="m12" x="295" y="335" width="105" height="105" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="347.5" y="401" font-size="38" text-anchor="middle" fill="#20364b">A</text><rect id="m20" x="85" y="440" width="105" height="105" rx="0" fill="#c7a2dc" stroke="#708391" stroke-width="3"/><text x="137.5" y="506" font-size="38" text-anchor="middle" fill="#20364b">D</text><rect id="m21" x="190" y="440" width="105" height="105" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="242.5" y="506" font-size="38" text-anchor="middle" fill="#20364b">A</text><rect id="m22" x="295" y="440" width="105" height="105" rx="0" fill="#eaa29d" stroke="#708391" stroke-width="3"/><text x="347.5" y="506" font-size="38" text-anchor="middle" fill="#20364b">B</text><text x="560" y="235" font-size="30" text-anchor="start" fill="#20364b">横のA：3個</text><text x="560" y="300" font-size="30" text-anchor="start" fill="#20364b">縦のA：3個</text><text x="560" y="370" font-size="27" text-anchor="start" fill="#20364b">中心のAは同じ1マス</text><text x="560" y="455" font-size="32" text-anchor="start" fill="#20364b">3 ＋ 3 − 1 ＝ 5個</text><text x="560" y="515" font-size="28" text-anchor="start" fill="#20364b">中心を2回数えない</text><text x="500" y="635" font-size="27" text-anchor="middle" fill="#20364b">マスの番号を集合（Set）に入れると、重複しません。</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">6×6盤面の一部を説明用の3×3にした例。初期配置ではありません。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">1マス50pxを105pxへ拡大。基本3では「そろった」の判定までを行います。</text></svg>