<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc" lang="ja"><title id="title">同じ3つの箱：flexは横1列、gridは2列へ</title><desc id="desc">独立した2つのCSS例。親の幅300、箱80×40、gap10。flexは左上0,0と90,0と180,0。2列のgridは0,0と90,0と0,50に並ぶ。図は3倍。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="1010" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">同じ3つの箱：flexは横1列、gridは2列へ</text><text x="40" y="110" font-size="26" text-anchor="start" fill="#20364b">どちらも親の幅300px、箱80×40px、gap:10px。別々のCSS例です。</text><text x="60" y="165" font-size="31" text-anchor="start" fill="#20364b">① display:flex</text><text x="750" y="165" font-size="27" text-anchor="start" fill="#20364b">親の幅300px</text><rect x="60" y="205" width="900" height="120" rx="0" fill="#f4f7fa" stroke="#607a90" stroke-width="2"/><rect x="60" y="205" width="240" height="120" rx="0" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="180" y="250" font-size="31" text-anchor="middle" fill="#20364b">赤</text><text x="180" y="300" font-size="28" text-anchor="middle" fill="#20364b">(0,0)</text><rect x="330" y="205" width="240" height="120" rx="0" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="450" y="250" font-size="31" text-anchor="middle" fill="#20364b">青</text><text x="450" y="300" font-size="28" text-anchor="middle" fill="#20364b">(90,0)</text><rect x="600" y="205" width="240" height="120" rx="0" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="720" y="250" font-size="31" text-anchor="middle" fill="#20364b">緑</text><text x="720" y="300" font-size="28" text-anchor="middle" fill="#20364b">(180,0)</text><text x="1010" y="250" font-size="24" text-anchor="start" fill="#20364b">高さ</text><text x="1010" y="290" font-size="24" text-anchor="start" fill="#20364b">40px</text><text x="60" y="380" font-size="29" text-anchor="start" fill="#20364b">次の箱のx：0 ＋ 幅80 ＋ 間10 ＝ 90</text><text x="60" y="430" font-size="27" text-anchor="start" fill="#20364b">3つ目は 90 ＋ 80 ＋ 10 ＝ 180。3つとも同じ行です。</text><text x="60" y="500" font-size="31" text-anchor="start" fill="#20364b">② display:grid ／ 列の幅 80px 80px</text><rect x="60" y="540" width="900" height="270" rx="0" fill="#f4f7fa" stroke="#607a90" stroke-width="2"/><rect x="60" y="540" width="240" height="120" rx="0" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="180" y="585" font-size="31" text-anchor="middle" fill="#20364b">赤</text><text x="180" y="635" font-size="28" text-anchor="middle" fill="#20364b">(0,0)</text><rect x="330" y="540" width="240" height="120" rx="0" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="450" y="585" font-size="31" text-anchor="middle" fill="#20364b">青</text><text x="450" y="635" font-size="28" text-anchor="middle" fill="#20364b">(90,0)</text><rect x="60" y="690" width="240" height="120" rx="0" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="180" y="735" font-size="31" text-anchor="middle" fill="#20364b">緑</text><text x="180" y="785" font-size="28" text-anchor="middle" fill="#20364b">(0,50)</text><text x="670" y="615" font-size="29" text-anchor="start" fill="#20364b">1行に2つまで</text><text x="380" y="745" font-size="29" text-anchor="start" fill="#20364b">3つ目は、次の行の左へ</text><text x="380" y="795" font-size="26" text-anchor="start" fill="#20364b">y：0 ＋ 高さ40 ＋ 間10 ＝ 50</text><text x="60" y="875" font-size="27" text-anchor="start" fill="#20364b">かっこの数字は、親の左上から測った子の左上 (x,y)。</text><text x="60" y="930" font-size="27" text-anchor="start" fill="#20364b">白いすき間がgap。横も縦も10pxです。</text><text x="40" y="985" font-size="23" text-anchor="start" fill="#20364b">親の幅と箱・すき間は3倍表示。親の空いた部分に、箱は追加していません。</text></svg>