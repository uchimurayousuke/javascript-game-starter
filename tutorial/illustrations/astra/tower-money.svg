<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc" lang="ja"><title id="title">タワーを置くと、お金が20ずつ減る</title><desc id="desc">タワーを置くと、お金が20ずつ減る。説明用の例：所持金60から、空いている設置場所に1基20で置きます。この例では追加の収入はなく、3基で所持金が0になります。模式図：お財布と設置済みのタワーを並べています。実際の設置場所の配置図ではありません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="950" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">タワーを置くと、お金が20ずつ減る</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">説明用の例：所持金60から、空いている設置場所に1基20で置きます。</text><rect id="build-stage-0" x="40" y="155" width="265" height="460" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="172" y="202" font-size="27" text-anchor="middle" fill="#20364b">最初</text><rect id="wallet-0" x="75" y="235" width="195" height="115" rx="14" fill="#f0d5af" stroke="#946d3d" stroke-width="3"/><text x="172" y="274" font-size="24" text-anchor="middle" fill="#20364b">所持金</text><text x="172" y="326" font-size="40" text-anchor="middle" fill="#20364b">60</text><text x="172" y="399" font-size="28" text-anchor="middle" fill="#20364b">タワー 0基</text><text x="172" y="508" font-size="22" text-anchor="middle" fill="#20364b">まだ置いていない</text><path d="M309 290L329 290" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="build-stage-1" x="335" y="155" width="265" height="460" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="467" y="202" font-size="27" text-anchor="middle" fill="#20364b">1基置いた後</text><rect id="wallet-1" x="370" y="235" width="195" height="115" rx="14" fill="#f0d5af" stroke="#946d3d" stroke-width="3"/><text x="467" y="274" font-size="24" text-anchor="middle" fill="#20364b">所持金</text><text x="467" y="326" font-size="40" text-anchor="middle" fill="#20364b">40</text><text x="467" y="399" font-size="28" text-anchor="middle" fill="#20364b">タワー 1基</text><g id="built-1-0"><rect id="built-1-0-base" x="360" y="482" width="60" height="65" rx="0" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><rect id="built-1-0-top" x="355" y="462" width="70" height="25" rx="0" fill="#a8ccef" stroke="#28629e" stroke-width="3"/><path d="M390 462V442" fill="none" stroke="#28629e" stroke-width="12"/></g><path d="M604 290L624 290" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="build-stage-2" x="630" y="155" width="265" height="460" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="762" y="202" font-size="27" text-anchor="middle" fill="#20364b">2基置いた後</text><rect id="wallet-2" x="665" y="235" width="195" height="115" rx="14" fill="#f0d5af" stroke="#946d3d" stroke-width="3"/><text x="762" y="274" font-size="24" text-anchor="middle" fill="#20364b">所持金</text><text x="762" y="326" font-size="40" text-anchor="middle" fill="#20364b">20</text><text x="762" y="399" font-size="28" text-anchor="middle" fill="#20364b">タワー 2基</text><g id="built-2-0"><rect id="built-2-0-base" x="655" y="482" width="60" height="65" rx="0" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><rect id="built-2-0-top" x="650" y="462" width="70" height="25" rx="0" fill="#a8ccef" stroke="#28629e" stroke-width="3"/><path d="M685 462V442" fill="none" stroke="#28629e" stroke-width="12"/></g><g id="built-2-1"><rect id="built-2-1-base" x="730" y="482" width="60" height="65" rx="0" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><rect id="built-2-1-top" x="725" y="462" width="70" height="25" rx="0" fill="#a8ccef" stroke="#28629e" stroke-width="3"/><path d="M760 462V442" fill="none" stroke="#28629e" stroke-width="12"/></g><path d="M899 290L919 290" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="build-stage-3" x="925" y="155" width="265" height="460" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="1057" y="202" font-size="27" text-anchor="middle" fill="#20364b">3基置いた後</text><rect id="wallet-3" x="960" y="235" width="195" height="115" rx="14" fill="#f0d5af" stroke="#946d3d" stroke-width="3"/><text x="1057" y="274" font-size="24" text-anchor="middle" fill="#20364b">所持金</text><text x="1057" y="326" font-size="40" text-anchor="middle" fill="#20364b">0</text><text x="1057" y="399" font-size="28" text-anchor="middle" fill="#20364b">タワー 3基</text><g id="built-3-0"><rect id="built-3-0-base" x="950" y="482" width="60" height="65" rx="0" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><rect id="built-3-0-top" x="945" y="462" width="70" height="25" rx="0" fill="#a8ccef" stroke="#28629e" stroke-width="3"/><path d="M980 462V442" fill="none" stroke="#28629e" stroke-width="12"/></g><g id="built-3-1"><rect id="built-3-1-base" x="1025" y="482" width="60" height="65" rx="0" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><rect id="built-3-1-top" x="1020" y="462" width="70" height="25" rx="0" fill="#a8ccef" stroke="#28629e" stroke-width="3"/><path d="M1055 462V442" fill="none" stroke="#28629e" stroke-width="12"/></g><g id="built-3-2"><rect id="built-3-2-base" x="1100" y="482" width="60" height="65" rx="0" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><rect id="built-3-2-top" x="1095" y="462" width="70" height="25" rx="0" fill="#a8ccef" stroke="#28629e" stroke-width="3"/><path d="M1130 462V442" fill="none" stroke="#28629e" stroke-width="12"/></g><text x="600" y="674" font-size="31" text-anchor="middle" fill="#20364b">1基20を使うたびに、60 → 40 → 20 → 0</text><rect id="cannot-build" x="300" y="710" width="600" height="100" rx="14" fill="#fff0e7" stroke="#b76b35" stroke-width="3"/><text x="600" y="752" font-size="29" text-anchor="middle" fill="#20364b">所持金0では、次の1基を置けない</text><text x="600" y="790" font-size="25" text-anchor="middle" fill="#20364b">タワーを置くには20必要</text><text x="48" y="879" font-size="21" text-anchor="start" fill="#20364b">この例では追加の収入はなく、3基で所持金が0になります。</text><text x="48" y="915" font-size="21" text-anchor="start" fill="#20364b">模式図：お財布と設置済みのタワーを並べています。実際の設置場所の配置図ではありません。</text></svg>