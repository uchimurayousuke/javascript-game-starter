<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="855" viewBox="0 0 1200 855" role="img" aria-labelledby="title desc" lang="ja"><title id="title">動かす → 止める → 調べる → もう一度</title><desc id="desc">動かす → 止める → 調べる → もう一度。Spaceを押した瞬間の位置で判定します。結果を見たら、やり直そう。止めた後は目印を動かさず、その中心が300〜500に入っているかを調べます。模式図：操作と状態の流れです。やり直しの操作は教材の案内に従います。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="855" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">動かす → 止める → 調べる → もう一度</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">Spaceを押した瞬間の位置で判定します。結果を見たら、やり直そう。</text><rect id="moving" x="40" y="160" width="480" height="230" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="stopped" x="680" y="160" width="480" height="230" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="restart" x="40" y="490" width="480" height="230" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="judged" x="680" y="490" width="480" height="230" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="280" y="207" font-size="31" text-anchor="middle" fill="#20364b">動いている</text><text x="920" y="207" font-size="31" text-anchor="middle" fill="#20364b">止まった！</text><path d="M100 302H460" fill="none" stroke="#93a9bb" stroke-width="4"/><rect id="moving-zone" x="210" y="273" width="140" height="58" rx="0" fill="#dcefd5" stroke="#528852" stroke-width="3"/><rect id="moving-marker" x="320" y="254" width="24" height="96" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="280" y="365" font-size="24" text-anchor="middle" fill="#20364b">成功ゾーン 300〜500</text><path d="M740 302H1100" fill="none" stroke="#93a9bb" stroke-width="4"/><rect id="stopped-zone" x="850" y="273" width="140" height="58" rx="0" fill="#dcefd5" stroke="#528852" stroke-width="3"/><rect id="stopped-marker" x="960" y="254" width="24" height="96" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="920" y="365" font-size="24" text-anchor="middle" fill="#20364b">成功ゾーン 300〜500</text><path d="M200 245L330 245" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="920" y="254" font-size="22" text-anchor="middle" fill="#20364b">中心をここで記録</text><path d="M530 280L670 280" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="247" font-size="29" text-anchor="middle" fill="#20364b">Space</text><path d="M920 402L920 477" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="944" y="445" font-size="23" text-anchor="start" fill="#20364b">位置を調べる</text><text x="920" y="538" font-size="26" text-anchor="middle" fill="#20364b">中心の数で結果を決める</text><text x="920" y="598" font-size="30" text-anchor="middle" fill="#18734f">300〜500 → 成功</text><text x="920" y="656" font-size="30" text-anchor="middle" fill="#a64e16">それ以外 → 範囲外</text><path d="M665 610L535 610" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="280" y="541" font-size="31" text-anchor="middle" fill="#20364b">やり直す</text><text x="280" y="599" font-size="26" text-anchor="middle" fill="#20364b">前の結果をリセット</text><text x="280" y="650" font-size="28" text-anchor="middle" fill="#20364b">もう一度チャレンジ！</text><path d="M280 476L280 403" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="115" y="445" font-size="24" text-anchor="middle" fill="#20364b">再び動く</text><text x="48" y="784" font-size="21" text-anchor="start" fill="#20364b">止めた後は目印を動かさず、その中心が300〜500に入っているかを調べます。</text><text x="48" y="820" font-size="21" text-anchor="start" fill="#20364b">模式図：操作と状態の流れです。やり直しの操作は教材の案内に従います。</text></svg>