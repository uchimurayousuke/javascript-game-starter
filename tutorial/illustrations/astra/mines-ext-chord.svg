<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="785" viewBox="0 0 1000 785" role="img" aria-labelledby="title desc" lang="ja"><title id="title">旗の数が合ったら、まわりをまとめて開く</title><desc id="desc">旗の数が合ったら、まわりをまとめて開く。開いた数字2の周囲に旗が2つある例です。旗を立てたマスは開きません。間違った場所に旗があれば、残った爆弾を開いて失敗します。模式図：3×3を拡大し、右は開く対象を「開く」と表示。実際は各マスの数字が出ます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="785" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">旗の数が合ったら、まわりをまとめて開く</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">開いた数字2の周囲に旗が2つある例です。</text><text x="250" y="184" font-size="29" text-anchor="middle" fill="#20364b">数字2をクリック</text><rect id="chord-0-0-0" x="115" y="230" width="90" height="90" rx="0" fill="#fff0ae" stroke="#7b91aa" stroke-width="3"/><text x="160.0" y="284.0" font-size="26" text-anchor="middle" fill="#20364b">旗</text><rect id="chord-0-1-0" x="205" y="230" width="90" height="90" rx="0" fill="#c9dff5" stroke="#7b91aa" stroke-width="3"/><text x="250.0" y="284.0" font-size="26" text-anchor="middle" fill="#20364b">？</text><rect id="chord-0-2-0" x="295" y="230" width="90" height="90" rx="0" fill="#fff0ae" stroke="#7b91aa" stroke-width="3"/><text x="340.0" y="284.0" font-size="26" text-anchor="middle" fill="#20364b">旗</text><rect id="chord-0-0-1" x="115" y="320" width="90" height="90" rx="0" fill="#c9dff5" stroke="#7b91aa" stroke-width="3"/><text x="160.0" y="374.0" font-size="26" text-anchor="middle" fill="#20364b">？</text><rect id="chord-0-1-1" x="205" y="320" width="90" height="90" rx="0" fill="#fff" stroke="#7b91aa" stroke-width="3"/><text x="250.0" y="374.0" font-size="26" text-anchor="middle" fill="#20364b">2</text><rect id="chord-0-2-1" x="295" y="320" width="90" height="90" rx="0" fill="#c9dff5" stroke="#7b91aa" stroke-width="3"/><text x="340.0" y="374.0" font-size="26" text-anchor="middle" fill="#20364b">？</text><rect id="chord-0-0-2" x="115" y="410" width="90" height="90" rx="0" fill="#c9dff5" stroke="#7b91aa" stroke-width="3"/><text x="160.0" y="464.0" font-size="26" text-anchor="middle" fill="#20364b">？</text><rect id="chord-0-1-2" x="205" y="410" width="90" height="90" rx="0" fill="#c9dff5" stroke="#7b91aa" stroke-width="3"/><text x="250.0" y="464.0" font-size="26" text-anchor="middle" fill="#20364b">？</text><rect id="chord-0-2-2" x="295" y="410" width="90" height="90" rx="0" fill="#c9dff5" stroke="#7b91aa" stroke-width="3"/><text x="340.0" y="464.0" font-size="26" text-anchor="middle" fill="#20364b">？</text><text x="750" y="184" font-size="29" text-anchor="middle" fill="#20364b">旗以外を開く</text><rect id="chord-1-0-0" x="615" y="230" width="90" height="90" rx="0" fill="#fff0ae" stroke="#7b91aa" stroke-width="3"/><text x="660.0" y="284.0" font-size="26" text-anchor="middle" fill="#20364b">旗</text><rect id="chord-1-1-0" x="705" y="230" width="90" height="90" rx="0" fill="#e4f0dc" stroke="#7b91aa" stroke-width="3"/><text x="750.0" y="284.0" font-size="26" text-anchor="middle" fill="#20364b">開く</text><rect id="chord-1-2-0" x="795" y="230" width="90" height="90" rx="0" fill="#fff0ae" stroke="#7b91aa" stroke-width="3"/><text x="840.0" y="284.0" font-size="26" text-anchor="middle" fill="#20364b">旗</text><rect id="chord-1-0-1" x="615" y="320" width="90" height="90" rx="0" fill="#e4f0dc" stroke="#7b91aa" stroke-width="3"/><text x="660.0" y="374.0" font-size="26" text-anchor="middle" fill="#20364b">開く</text><rect id="chord-1-1-1" x="705" y="320" width="90" height="90" rx="0" fill="#fff" stroke="#7b91aa" stroke-width="3"/><text x="750.0" y="374.0" font-size="26" text-anchor="middle" fill="#20364b">2</text><rect id="chord-1-2-1" x="795" y="320" width="90" height="90" rx="0" fill="#e4f0dc" stroke="#7b91aa" stroke-width="3"/><text x="840.0" y="374.0" font-size="26" text-anchor="middle" fill="#20364b">開く</text><rect id="chord-1-0-2" x="615" y="410" width="90" height="90" rx="0" fill="#e4f0dc" stroke="#7b91aa" stroke-width="3"/><text x="660.0" y="464.0" font-size="26" text-anchor="middle" fill="#20364b">開く</text><rect id="chord-1-1-2" x="705" y="410" width="90" height="90" rx="0" fill="#e4f0dc" stroke="#7b91aa" stroke-width="3"/><text x="750.0" y="464.0" font-size="26" text-anchor="middle" fill="#20364b">開く</text><rect id="chord-1-2-2" x="795" y="410" width="90" height="90" rx="0" fill="#e4f0dc" stroke="#7b91aa" stroke-width="3"/><text x="840.0" y="464.0" font-size="26" text-anchor="middle" fill="#20364b">開く</text><path d="M425 365L575 365" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="568" font-size="31" text-anchor="middle" fill="#20364b">周囲の旗2つ ＝ 開いた数字2</text><text x="500" y="632" font-size="26" text-anchor="middle" fill="#20364b">旗の「数」が合っても、場所が正しいとは限らない</text><text x="40" y="721" font-size="19" text-anchor="start" fill="#20364b">旗を立てたマスは開きません。間違った場所に旗があれば、残った爆弾を開いて失敗します。</text><text x="40" y="753" font-size="19" text-anchor="start" fill="#20364b">模式図：3×3を拡大し、右は開く対象を「開く」と表示。実際は各マスの数字が出ます。</text></svg>