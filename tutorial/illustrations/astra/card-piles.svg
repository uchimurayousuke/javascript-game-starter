<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1490" viewBox="0 0 1200 1490" role="img" aria-labelledby="title desc" lang="ja"><title id="title">カードは移動する。合計は9枚のまま</title><desc id="desc">カードは移動する。合計は9枚のまま。山札9枚の内訳は、攻撃・防御・回復が各3枚です。説明用の枚数です。1枚使うと手札から捨て札へ、番の終わりには残りの手札も捨て札へ。次の番に山札から3枚引くと、山札3・手札3・捨て札3になります。模式図：重ねたカードを数えやすくずらしています。シャッフルしてもカードは増減しません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="1490" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">カードは移動する。合計は9枚のまま</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">山札9枚の内訳は、攻撃・防御・回復が各3枚です。</text><rect id="piles-row-0" x="40" y="150" width="1120" height="265" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="75" y="193" font-size="27" text-anchor="start" fill="#20364b">最初の自分の番</text><text x="402" y="240" font-size="26" text-anchor="middle" fill="#20364b">山札</text><rect id="row-0-pile-0-0" x="330" y="295" width="66" height="65" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="363.0" y="337.5" font-size="26" text-anchor="middle" fill="#20364b"></text><rect id="row-0-pile-0-1" x="343" y="287" width="66" height="65" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="376.0" y="329.5" font-size="26" text-anchor="middle" fill="#20364b"></text><rect id="row-0-pile-0-2" x="356" y="279" width="66" height="65" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="389.0" y="321.5" font-size="26" text-anchor="middle" fill="#20364b"></text><rect id="row-0-pile-0-3" x="369" y="271" width="66" height="65" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="402.0" y="313.5" font-size="26" text-anchor="middle" fill="#20364b"></text><rect id="row-0-pile-