<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="795" viewBox="0 0 1000 795" role="img" aria-labelledby="title desc" lang="ja"><title id="title">数字は、周囲8マスにある爆弾の数</title><desc id="desc">数字は、周囲8マスにある爆弾の数。上・下・左・右だけでなく、ななめのマスも調べます。基本2の盤面の左上3×3を拡大。列1・行1の周囲には、左上の爆弾が1個あります。図は説明のため爆弾を表示。ゲームで隠す段階では、開くまで爆弾は見えません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="795" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">数字は、周囲8マスにある爆弾の数</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">上・下・左・右だけでなく、ななめのマスも調べます。</text><rect id="neighbor-0-0" x="120" y="235" width="110" height="110" rx="0" fill="#ffe0e5" stroke="#7b91aa" stroke-width="3"/><text x="175" y="305" font-size="25" text-anchor="middle" fill="#20364b">爆弾</text><rect id="neighbor-1-0" x="230" y="235" width="110" height="110" rx="0" fill="#e4f0dc" stroke="#7b91aa" stroke-width="3"/><text x="285" y="305" font-size="25" text-anchor="middle" fill="#20364b">調べる</text><rect id="neighbor-2-0" x="340" y="235" width="110" height="110" rx="0" fill="#e4f0dc" stroke="#7b91aa" stroke-width="3"/><text x="395" y="305" font-size="25" text-anchor="middle" fill="#20364b">調べる</text><rect id="neighbor-0-1" x="120" y="345" width="110" height="110" rx="0" fill="#e4f0dc" stroke="#7b91aa" stroke-width="3"/><text x="175" y="415" font-size="25" text-anchor="middle" fill="#20364b">調べる</text><rect id="neighbor-1-1" x="230" y="345" width="110" height="110" rx="0" fill="#fff0ae" stroke="#7b91aa" stroke-width="3"/><text x="285" y="415" font-size="42" text-anchor="middle" fill="#20364b">1</text><rect id="neighbor-2-1" x="340" y="345" width="110" height="110" rx="0" fill="#e4f0dc" stroke="#7b91aa" stroke-width="3"/><text x="395" y="415" font-size="25" text-anchor="middle" fill="#20364b">調べる</text><rect id="neighbor-0-2" x="120" y="455" width="110" height="110" rx="0" fill="#e4f0dc" stroke="#7b91aa" stroke-width="3"/><text x="175" y="525" font-size="25" text-anchor="middle" fill="#20364b">調べる</text><rect id="neighbor-1-2" x="230" y="455" width="110" height="110" rx="0" fill="#e4f0dc" stroke="#7b91aa" stroke-width="3"/><text x="285" y="525" font-size="25" text-anchor="middle" fill="#20364b">調べる</text><rect id="neighbor-2-2" x="340" y="455" width="110" height="110" rx="0" fill="#e4f0dc" stroke="#7b91aa" stroke-width="3"/><text x="395" y="525" font-size="25" text-anchor="middle" fill="#20364b">調べる</text><text x="700" y="270" font-size="32" text-anchor="middle" fill="#20364b">まわりは8マス</text><text x="700" y="330" font-size="28" text-anchor="middle" fill="#20364b">ななめも含む</text><text x="700" y="423" font-size="31" text-anchor="middle" fill="#20364b">爆弾が1個</text><text x="700" y="476" font-size="31" text-anchor="middle" fill="#20364b">中心の数は1</text><text x="500" y="647" font-size="30" text-anchor="middle" fill="#20364b">中心のマス自身は、数に含めない</text><text x="40" y="731" font-size="19" text-anchor="start" fill="#20364b">基本2の盤面の左上3×3を拡大。列1・行1の周囲には、左上の爆弾が1個あります。</text><text x="40" y="763" font-size="19" text-anchor="start" fill="#20364b">図は説明のため爆弾を表示。ゲームで隠す段階では、開くまで爆弾は見えません。</text></svg>