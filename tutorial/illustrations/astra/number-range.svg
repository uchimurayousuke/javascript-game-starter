<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc" lang="ja"><title id="title">ヒントを聞いたら、残る候補を考えよう</title><desc id="desc">ヒントを聞いたら、残る候補を考えよう。緑の数が「まだ正解かもしれない数」。小さい数から順に並んでいます。「8より大きい」なら9〜20。さらに「15より小さい」なら9〜14に絞れます。これはプレイヤーの考え方です。ゲームが候補を自動表示するという意味ではありません。数直線の間隔は同じです。正解12は候補の中にありますが、この図では特別扱いしません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="930" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">ヒントを聞いたら、残る候補を考えよう</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">緑の数が「まだ正解かもしれない数」。小さい数から順に並んでいます。</text><rect id="range-stage-0" x="40" y="160" width="1120" height="185" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="80" y="207" font-size="30" text-anchor="start" fill="#20364b">はじめ：1〜20のどれか</text><path d="M160 250H1072" fill="none" stroke="#a8b6c4" stroke-width="3"/><circle id="stage-0-number-1" cx="160" cy="250" r="20" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="160" y="257" font-size="20" text-anchor="middle" fill="#20364b">1</text><circle id="stage-0-number-2" cx="208" cy="250" r="20" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="208" y="257" font-size="20" text-anchor="middle" fill="#20364b">2</text><circle id="stage-0-number-3" cx="256" cy="250" r="20" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="256" y="257" font-size="20" text-anchor="middle" fill="#20364b">3</text><circle id="stage-0-number-4" cx="304" cy="250" r="20" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="304" y="257" font-size="20" text-anchor="middle" fill="#20364b">4</text><circle id="stage-0-number-5" cx="352" cy="250" r="20" fill="#dcefd5" stroke="#52