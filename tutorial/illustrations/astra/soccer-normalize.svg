<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" lang="ja"><title id="title">斜めにも、1回で進む距離は2.5px</title><desc id="desc">右入力は(1,0)、右下入力は(1,1)。右下の入力長さは約1.414。それぞれを長さで割ってから速さ2.5を掛けると、斜めも2.5px進む。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="820" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#20364b">斜めにも、1回で進む距離は2.5px</text><text x="40" y="105" font-size="25" text-anchor="start" fill="#20364b">サッカー 基本2 ／ 画面の下向きが y のプラス。壁から離れた場所の例。</text><rect x="40" y="145" width="530" height="490" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><rect x="610" y="145" width="550" height="490" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="65" y="190" font-size="28" text-anchor="start" fill="#20364b">右だけ：入力 (1,0)</text><text x="635" y="190" font-size="28" text-anchor="start" fill="#20364b">右＋下：入力 (1,1)</text><path d="M100 285 L440 285" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="100" cy="285" r="6" fill="#20364b"/><text x="270" y="260" font-size="27" text-anchor="middle" fill="#20364b">右へ2.5px</text><text x="65" y="375" font-size="27" text-anchor="start" fill="#20364b">長さ＝1</text><text x="65" y="425" font-size="25" text-anchor="start" fill="#20364b">横：1 ÷ 1 × 2.5＝2.5</text><text x="65" y="475" font-size="25" text-anchor="start" fill="#20364b">縦：0 ÷ 1 × 2.5＝0</text><text x="65" y="555" font-size="25" text-anchor="start" fill="#20364b">中心 (200,225)</text><text x="65" y="600" font-size="27" text-anchor="start" fill="#20364b">→ (202.5,225)</text><path d="M670 235 L910 235" fill="none" stroke="#20364b" stroke-width="3" stroke-dasharray="8 6"/><path d="M910 235 L910 475" fill="none" stroke="#20364b" stroke-width="3" stroke-dasharray="8 6"/><path d="M670 235 L910 475" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><circle cx="670" cy="235" r="6" fill="#20364b"/><text x="795" y="220" font-size="22" text-anchor="middle" fill="#20364b">横 約1.768</text><text x="930" y="330" font-size="22" text-anchor="start" fill="#20364b">縦</text><text x="930" y="370" font-size="22" text-anchor="start" fill="#20364b">約1.768</text><text x="705" y="405" font-size="25" text-anchor="start" fill="#20364b">距離2.5px</text><text x="635" y="520" font-size="25" text-anchor="start" fill="#20364b">長さ＝√2 ≒ 1.414</text><text x="635" y="565" font-size="24" text-anchor="start" fill="#20364b">横も縦も：1 ÷ √2 × 2.5</text><text x="635" y="605" font-size="23" text-anchor="start" fill="#20364b">中心 → (約201.768, 約226.768)</text><text x="40" y="690" font-size="29" text-anchor="start" fill="#20364b">長さで割る → 向きだけにする → 速さ2.5を掛ける。</text><text x="40" y="740" font-size="24" text-anchor="start" fill="#20364b">何も押さないと (0,0)。コードの「|| 1」で0割りを避け、動きも0。</text><text x="40" y="790" font-size="22" text-anchor="start" fill="#20364b">移動の矢印は約136倍。小数は四捨五入して表示しています。</text></svg>