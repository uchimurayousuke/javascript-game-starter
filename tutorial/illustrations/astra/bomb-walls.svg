<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">爆弾迷路：壁と箱で爆風が止まる</title><desc id="desc">爆弾迷路：壁と箱で爆風が止まる。基本3 ／ 壁は火にせず、箱のマスは火にしてから止めます。実盤面の列1〜3・行0〜2を抜粋。1マス45pxを105pxへ拡大。列2・行1に置いた爆弾が爆発した例。プレイヤーは別の場所へ避難した想定です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">爆弾迷路：壁と箱で爆風が止まる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 壁は火にせず、箱のマスは火にしてから止めます。</text><rect id="w10" x="110" y="230" width="105" height="105" rx="0" fill="#b8c1cb" stroke="#708391" stroke-width="3"/><text x="162.5" y="296" font-size="26" text-anchor="middle" fill="#20364b">壁</text><rect id="w20" x="215" y="230" width="105" height="105" rx="0" fill="#b8c1cb" stroke="#708391" stroke-width="3"/><text x="267.5" y="296" font-size="26" text-anchor="middle" fill="#20364b">壁</text><rect id="w30" x="320" y="230" width="105" height="105" rx="0" fill="#b8c1cb" stroke="#708391" stroke-width="3"/><text x="372.5" y="296" font-size="26" text-anchor="middle" fill="#20364b">壁</text><rect id="w11" x="110" y="335" width="105" height="105" rx="0" fill="#ffe29a" stroke="#708391" stroke-width="3"/><text x="162.5" y="401" font-size="26" text-anchor="middle" fill="#20364b">火</text><rect id="w21" x="215" y="335" width="105" height="105" rx="0" fill="#ffe29a" stroke="#708391" stroke-width="3"/><text x="267.5" y="401" font-size="26" text-anchor="middle" fill="#20364b">火元</text><rect id="w31" x="320" y="335" width="105" height="105" rx="0" fill="#ffe29a" stroke="#708391" stroke-width="3"/><text x="372.5" y="401" font-size="26" text-anchor="middle" fill="#20364b">箱→火</text><rect id="w12" x="110" y="440" width="105" height="105" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="162.5" y="506" font-size="26" text-anchor="middle" fill="#20364b">床</text><rect id="w22" x="215" y="440" width="105" height="105" rx="0" fill="#ffe29a" stroke="#708391" stroke-width="3"/><text x="267.5" y="506" font-size="26" text-anchor="middle" fill="#20364b">火</text><rect id="w32" x="320" y="440" width="105" height="105" rx="0" fill="#b8c1cb" stroke="#708391" stroke-width="3"/><text x="372.5" y="506" font-size="26" text-anchor="middle" fill="#20364b">壁</text><text x="162.5" y="205" font-size="25" text-anchor="middle" fill="#20364b">1</text><text x="80" y="296" font-size="25" text-anchor="middle" fill="#20364b">0</text><text x="267.5" y="205" font-size="25" text-anchor="middle" fill="#20364b">2</text><text x="80" y="401" font-size="25" text-anchor="middle" fill="#20364b">1</text><text x="372.5" y="205" font-size="25" text-anchor="middle" fill="#20364b">3</text><text x="80" y="506" font-size="25" text-anchor="middle" fill="#20364b">2</text><text x="520" y="235" font-size="29" text-anchor="start" fill="#20364b">爆弾：列2・行1</text><text x="520" y="300" font-size="25" text-anchor="start" fill="#20364b">上：壁なので火は入らない</text><text x="520" y="365" font-size="25" text-anchor="start" fill="#20364b">右：箱を壊し、そこで止まる</text><text x="520" y="430" font-size="25" text-anchor="start" fill="#20364b">左・下：1マスに火が届く</text><text x="520" y="500" font-size="27" text-anchor="start" fill="#20364b">斜めには広がらない</text><text x="500" y="635" font-size="28" text-anchor="middle" fill="#20364b">基本3の範囲は1。火元と上下左右を調べます。</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">実盤面の列1〜3・行0〜2を抜粋。1マス45pxを105pxへ拡大。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">列2・行1に置いた爆弾が爆発した例。プレイヤーは別の場所へ避難した想定です。</text></svg>