<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc" lang="ja"><title id="title">3回続けて当てると、追加で2点！</title><desc id="desc">3回続けて当てると、追加で2点！最初の3連続の例。3回目は通常1点にボーナス2点を足します。外すと連続回数は0に戻ります。6回・9回…の連続でも追加2点です。模式図：的の大きさはそろえ、今回は連続命中の得点に注目しています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="760" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">3回続けて当てると、追加で2点！</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">最初の3連続の例。3回目は通常1点にボーナス2点を足します。</text><rect id="hit-1" x="40" y="155" width="260" height="400" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="170" y="206" font-size="26" text-anchor="middle" fill="#20364b">1回連続で命中</text><circle id="target-0" cx="170" cy="330" r="85" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><text x="170" y="315" font-size="36" text-anchor="middle" fill="#20364b">＋1点</text><text x="170" y="358" font-size="23" text-anchor="middle" fill="#20364b">通常の1点</text><text x="170" y="465" font-size="32" text-anchor="middle" fill="#20364b">合計 1点</text><path d="M310 330L350 330" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="hit-2" x="370" y="155" width="260" height="400" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="500" y="206" font-size="26" text-anchor="middle" fill="#20364b">2回連続で命中</text><circle id="target-1" cx="500" cy="330" r="85" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><text x="500" y="315" font-size="36" text-anchor="middle" fill="#20364b">＋1点</text><text x="500" y="358" font-size="23" text-anchor="middle" fill="#20364b">通常の1点</text><text x="500" y="465" font-size="32" text-anchor="middle" fill="#20364b">合計 2点</text><path d="M640 330L680 330" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="hit-3" x="700" y="155" width="260" height="400" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="830" y="206" font-size="26" text-anchor="middle" fill="#20364b">3回連続で命中</text><circle id="target-2" cx="830" cy="330" r="85" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><text x="830" y="315" font-size="36" text-anchor="middle" fill="#20364b">＋3点</text><text x="830" y="358" font-size="23" text-anchor="middle" fill="#20364b">1＋追加2</text><text x="830" y="465" font-size="32" text-anchor="middle" fill="#20364b">合計 5点</text><text x="500" y="620" font-size="32" text-anchor="middle" fill="#20364b">1点 ＋ 1点 ＋ 3点 ＝ 5点</text><text x="40" y="696" font-size="19" text-anchor="start" fill="#20364b">外すと連続回数は0に戻ります。6回・9回…の連続でも追加2点です。</text><text x="40" y="728" font-size="19" text-anchor="start" fill="#20364b">模式図：的の大きさはそろえ、今回は連続命中の得点に注目しています。</text></svg>