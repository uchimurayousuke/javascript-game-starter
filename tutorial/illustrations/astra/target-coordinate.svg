<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" lang="ja"><title id="title">小さく表示しても、ゲームの中は横800</title><desc id="desc">小さく表示しても、ゲームの中は横800。表示の左から200の点は、内部では左から400。どちらも真ん中！横： (クリック300 − 左端100) × 800 ÷ 400 ＝ 400。縦： (クリック162.5 − 上端50) × 450 ÷ 225 ＝ 225。模式図：横幅は400対800。縦の枠は説明のため同じ高さにしています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="900" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">小さく表示しても、ゲームの中は横800</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">表示の左から200の点は、内部では左から400。どちらも真ん中！</text><text x="80" y="170" font-size="29" text-anchor="start" fill="#20364b">画面に見えている大きさ</text><rect id="display" x="80" y="200" width="400" height="225" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="280" y="240" font-size="28" text-anchor="middle" fill="#20364b">表示の幅400</text><circle id="display-click" cx="280" cy="312.5" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="280" y="350" font-size="28" text-anchor="middle" fill="#20364b">左から200</text><path d="M80 312.5H280" fill="none" stroke="#34495e" stroke-width="3"/><text x="80" y="460" font-size="25" text-anchor="start" fill="#20364b">左端100 → クリック300</text><text x="610" y="210" font-size="30" text-anchor="start" fill="#20364b">同じ場所を</text><text x="610" y="253" font-size="30" text-anchor="start" fill="#20364b">ゲームの数に直す</text><path d="M485 310L650 420" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="350" font-size="33" text-anchor="start" fill="#20364b">×2</text><rect id="internal" x="80" y="500" width="800" height="225" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="480" y="544" font-size="30" text-anchor="middle" fill="#20364b">内部の幅800</text><circle id="internal-click" cx="480" cy="612.5" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M80 612.5H480" fill="none" stroke="#34495e" stroke-width="3"/><text x="480" y="655" font-size="30" text-anchor="middle" fill="#20364b">横400・縦225</text><text x="920" y="553" font-size="25" text-anchor="start" fill="#20364b">横の位置</text><text x="920" y="595" font-size="29" text-anchor="start" fill="#20364b">200 × 2</text><text x="920" y="637" font-size="32" text-anchor="start" fill="#20364b">＝ 400</text><text x="48" y="793" font-size="21" text-anchor="start" fill="#20364b">横： (クリック300 − 左端100) × 800 ÷ 400 ＝ 400</text><text x="48" y="829" font-size="21" text-anchor="start" fill="#20364b">縦： (クリック162.5 − 上端50) × 450 ÷ 225 ＝ 225</text><text x="48" y="865" font-size="21" text-anchor="start" fill="#20364b">模式図：横幅は400対800。縦の枠は説明のため同じ高さにしています。</text></svg>