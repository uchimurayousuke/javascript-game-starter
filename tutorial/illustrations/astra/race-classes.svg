<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1155" viewBox="0 0 1200 1155" role="img" aria-labelledby="title desc" lang="ja"><title id="title">車と通過点は、それぞれの設計図からつくる</title><desc id="desc">車と通過点は、それぞれの設計図からつくる。車は1台。通過点は同じCheckpointから4つの実体をつくります。Carのx・yは中心、angleは向き、speedは速さ。Checkpointのx・yは点の中心です。次の点と周回数はCheckpointの中にはありません。nextCheckpointとlapsで管理します。模式図：実コードの開始時の値です。通過点の箱の配置は実際のコースとは異なります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="1155" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">車と通過点は、それぞれの設計図からつくる</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">車は1台。通過点は同じCheckpointから4つの実体をつくります。</text><rect id="car-blueprint" x="60" y="155" width="340" height="160" rx="14" fill="#fff5dc" stroke="#aa7a20" stroke-width="3"/><text x="230" y="198" font-size="27" text-anchor="middle" fill="#20364b">車の設計図</text><text x="230" y="239" font-size="36" text-anchor="middle" fill="#20364b">Car</text><text x="230" y="286" font-size="26" text-anchor="middle" fill="#20364b">位置・向き・速さ</text><rect id="checkpoint-blueprint" x="490" y="155" width="650" height="160" rx="14" fill="#fff5dc" stroke="#aa7a20" stroke-width="3"/><text x="815" y="198" font-size="27" text-anchor="middle" fill="#20364b">通過点の設計図</text><text x="815" y="239" font-size="36" text-anchor="middle" fill="#20364b">Checkpoint</text><text x="815" y="286" font-size="26" text-anchor="middle" fill="#20364b">各点の位置を持つ</text><path d="M230 325L230 385" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="car-instance" x="60" y="400" width="340" height="355" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="class-car" x="190" y="445" width="80" height="50" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><rect id="class-car-window" x="235" y="453" width="18" height="34" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><path d="M205 438H223 M250 438H265 M205 502H223 M250 502H265" fill="none" stroke="#34495e" stroke-width="6"/><circle id="class-car-center" cx="230" cy="470" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="230" y="552" font-size="29" text-anchor="middle" fill="#20364b">横140・縦110</text><text x="230" y="603" font-size="26" text-anchor="middle" fill="#20364b">向き0（右向き）</text><text x="230" y="650" font-size="26" text-anchor="middle" fill="#20364b">速さ0（停止）</text><text x="230" y="711" font-size="24" text-anchor="middle" fill="#20364b">最初の車の状態</text><path d="M815 315V350H665V390" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M815 350H985V390" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="checkpoint-instance-0" x="510" y="400" width="290" height="155" rx="14" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="655" y="443" font-size="29" text-anchor="middle" fill="#20364b">点1</text><text x="655" y="488" font-size="28" text-anchor="middle" fill="#20364b">横660・縦110</text><text x="655" y="530" font-size="23" text-anchor="middle" fill="#20364b">配列の番号0</text><rect id="checkpoint-instance-1" x="830" y="400" width="290" height="155" rx="14" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="975" y="443" font-size="29" text-anchor="middle" fill="#20364b">点2</text><text x="975" y="488" font-size="28" text-anchor="middle" fill="#20364b">横660・縦350</text><text x="975" y="530" font-size="23" text-anchor="middle" fill="#20364b">配列の番号1</text><rect id="checkpoint-instance-2" x="510" y="600" width="290" height="155" rx="14" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="655" y="643" font-size="29" text-anchor="middle" fill="#20364b">点3</text><text x="655" y="688" font-size="28" text-anchor="middle" fill="#20364b">横140・縦350</text><text x="655" y="730" font-size="23" text-anchor="middle" fill="#20364b">配列の番号2</text><rect id="checkpoint-instance-3" x="830" y="600" width="290" height="155" rx="14" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="975" y="643" font-size="29" text-anchor="middle" fill="#20364b">点4</text><text x="975" y="688" font-size="28" text-anchor="middle" fill="#20364b">横140・縦110</text><text x="975" y="730" font-size="23" text-anchor="middle" fill="#20364b">配列の番号3</text><rect id="race-progress" x="60" y="815" width="1080" height="165" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="600" y="858" font-size="30" text-anchor="middle" fill="#20364b">進み具合は、別の変数で記録する</text><text x="600" y="906" font-size="27" text-anchor="middle" fill="#20364b">nextCheckpoint = 0　→　次は点1</text><text x="600" y="950" font-size="27" text-anchor="middle" fill="#20364b">laps = 0　→　まだ0周</text><text x="48" y="1048" font-size="21" text-anchor="start" fill="#20364b">Carのx・yは中心、angleは向き、speedは速さ。Checkpointのx・yは点の中心です。</text><text x="48" y="1084" font-size="21" text-anchor="start" fill="#20364b">次の点と周回数はCheckpointの中にはありません。nextCheckpointとlapsで管理します。</text><text x="48" y="1120" font-size="21" text-anchor="start" fill="#20364b">模式図：実コードの開始時の値です。通過点の箱の配置は実際のコースとは異なります。</text><path d="M815 350V580H655V590" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M815 580H975V590" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/></svg>