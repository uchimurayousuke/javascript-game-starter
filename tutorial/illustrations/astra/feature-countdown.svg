<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc" lang="ja"><title id="title">開始前カウント：3 → 2 → 1 → 開始</title><desc id="desc">開始前カウント：3 → 2 → 1 → 開始。基本3 ／ 経過時間 ＝ 今の時刻 − 開始した時刻。時間の区切りを表す模式図です。1000ms＝1秒。表示は経過時間で決まります。Enterの連打でカウントはやり直しません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="830" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">開始前カウント：3 → 2 → 1 → 開始</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 経過時間 ＝ 今の時刻 − 開始した時刻</text><rect id="count0" x="60" y="230" width="270" height="190" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="195.0" y="275" font-size="29" text-anchor="middle" fill="#20364b">3</text><text x="195.0" y="318" font-size="23" text-anchor="middle" fill="#20364b">0〜1000ms未満</text><path d="M335 325L355 325" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="count1" x="360" y="230" width="270" height="190" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="495.0" y="275" font-size="29" text-anchor="middle" fill="#20364b">2</text><text x="495.0" y="318" font-size="23" text-anchor="middle" fill="#20364b">1000〜2000ms未満</text><path d="M635 325L655 325" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="count2" x="660" y="230" width="270" height="190" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="795.0" y="275" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="795.0" y="318" font-size="23" text-anchor="middle" fill="#20364b">2000〜3000ms未満</text><path d="M500 435L500 500" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="play" x="270" y="515" width="460" height="130" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="500.0" y="560" font-size="29" text-anchor="middle" fill="#20364b">スタート！</text><text x="500.0" y="603" font-size="23" text-anchor="middle" fill="#20364b">3000ms以上で playing</text><text x="500" y="185" font-size="28" text-anchor="middle" fill="#20364b">Enterを押した時刻を 0ms とする</text><text x="500" y="690" font-size="26" text-anchor="middle" fill="#20364b">カウント中は止まり、開始した更新から四角が動く。</text><text x="40" y="766" font-size="19" text-anchor="start" fill="#20364b">時間の区切りを表す模式図です。1000ms＝1秒。</text><text x="40" y="798" font-size="19" text-anchor="start" fill="#20364b">表示は経過時間で決まります。Enterの連打でカウントはやり直しません。</text></svg>