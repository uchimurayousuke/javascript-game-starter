<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" lang="ja"><title id="title">border-box：幅200の中に、余白と枠も入る</title><desc id="desc">width200pxのborder-box。左右padding10pxとborder5pxを除き、内容幅170px。margin20pxは幅200の外側。図の横寸法は4倍。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="850" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">border-box：幅200の中に、余白と枠も入る</text><text x="40" y="110" font-size="27" text-anchor="start" fill="#20364b">width:200px ／ padding:10px ／ border:5px ／ margin:20px</text><rect x="120" y="215" width="960" height="350" rx="0" fill="#fff0d9" stroke="#a98245" stroke-width="2"/><rect x="200" y="245" width="800" height="290" rx="0" fill="#20364b" stroke="#20364b" stroke-width="2"/><rect x="220" y="265" width="760" height="250" rx="0" fill="#dcebdc" stroke="#58775d" stroke-width="2"/><rect x="260" y="305" width="680" height="170" rx="0" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="600" y="375" font-size="34" text-anchor="middle" fill="#20364b">内容の幅170px</text><text x="600" y="430" font-size="28" text-anchor="middle" fill="#20364b">文字や画像を置く部分</text><text x="600" y="195" font-size="27" text-anchor="middle" fill="#20364b">外側の margin：左右20pxずつ</text><path d="M200 600 L1000 600" fill="none" stroke="#20364b" stroke-width="3"/><path d="M200 585 L200 615" fill="none" stroke="#20364b" stroke-width="3"/><path d="M1000 585 L1000 615" fill="none" stroke="#20364b" stroke-width="3"/><text x="600" y="645" font-size="30" text-anchor="middle" fill="#20364b">borderを含む幅：200px</text><text x="160" y="550" font-size="23" text-anchor="middle" fill="#20364b">20</text><text x="1040" y="550" font-size="23" text-anchor="middle" fill="#20364b">20</text><text x="210" y="525" font-size="22" text-anchor="middle" fill="#ffffff">5</text><text x="990" y="525" font-size="22" text-anchor="middle" fill="#ffffff">5</text><text x="240" y="500" font-size="22" text-anchor="middle" fill="#20364b">10</text><text x="960" y="500" font-size="22" text-anchor="middle" fill="#20364b">10</text><text x="40" y="710" font-size="30" text-anchor="start" fill="#20364b">200 − 10 − 10 − 5 − 5 ＝ 170px（内容の幅）</text><text x="40" y="760" font-size="27" text-anchor="start" fill="#20364b">左右のmarginまで含む横の範囲：20 ＋ 200 ＋ 20 ＝ 240px</text><text x="40" y="815" font-size="23" text-anchor="start" fill="#20364b">横寸法は4倍。高さは説明用です。黒い枠がborder、緑の帯がpadding。</text></svg>