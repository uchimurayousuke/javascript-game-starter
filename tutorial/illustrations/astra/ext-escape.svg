<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img" aria-labelledby="title desc" lang="ja"><title id="title">電池と懐中電灯を組み合わせよう</title><desc id="desc">電池と懐中電灯を組み合わせよう。道具を組み合わせると、それまで読めなかったヒントが読めます。暗い隣室で314を読みます。出口で鍵を選んで使い、読んだ番号を入力します。模式図：道具と条件のつながりを示しています。実際の部屋の配置図ではありません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="950" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">電池と懐中電灯を組み合わせよう</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">道具を組み合わせると、それまで読めなかったヒントが読めます。</text><rect id="combine" x="40" y="155" width="920" height="270" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="battery" x="100" y="230" width="80" height="110" rx="8" fill="#dcefd5" stroke="#528852" stroke-width="3"/><rect id="battery-cap" x="120" y="215" width="40" height="15" rx="0" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="140" y="271" font-size="29" text-anchor="middle" fill="#20364b">＋</text><text x="140" y="323" font-size="29" text-anchor="middle" fill="#20364b">−</text><text x="140" y="386" font-size="28" text-anchor="middle" fill="#20364b">電池</text><text x="255" y="300" font-size="42" text-anchor="middle" fill="#20364b">＋</text><rect id="flashlight" x="320" y="260" width="100" height="55" rx="0" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><path id="flashlight-head" d="M420 260L455 240V335L420 315Z" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="390" y="386" font-size="28" text-anchor="middle" fill="#20364b">懐中電灯</text><path d="M510 285L610 285" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path id="light-beam" d="M820 245L925 207V367L820 330Z" fill="#fff0ae"/><rect id="lit-flashlight" x="680" y="260" width="100" height="55" rx="0" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><path id="lit-head" d="M780 260L820 240V335L780 315Z" fill="#ffe29a" stroke="#28629e" stroke-width="3"/><text x="785" y="386" font-size="26" text-anchor="middle" fill="#20364b">点灯するライト</text><path d="M780 438V455H275V478" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="read-number" x="40" y="490" width="920" height="260" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="275" y="535" font-size="27" text-anchor="middle" fill="#20364b">暗い隣室で照らす</text><rect id="dark-room" x="85" y="561" width="380" height="130" rx="0" fill="#34495e" stroke="#20364b" stroke-width="3"/><rect id="number-note" x="190" y="581" width="170" height="90" rx="0" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="275" y="642" font-size="46" text-anchor="middle" fill="#20364b">314</text><path d="M485 620L540 620" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="key-condition" x="560" y="563" width="140" height="130" rx="12" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="630" y="611" font-size="34" text-anchor="middle" fill="#20364b">鍵</text><text x="630" y="660" font-size="21" text-anchor="middle" fill="#20364b">選んで使う</text><text x="730" y="636" font-size="32" text-anchor="middle" fill="#20364b">＋</text><rect id="number-condition" x="765" y="563" width="160" height="130" rx="12" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="845" y="611" font-size="34" text-anchor="middle" fill="#20364b">314</text><text x="845" y="660" font-size="22" text-anchor="middle" fill="#20364b">読んで入力</text><text x="500" y="810" font-size="29" text-anchor="middle" fill="#20364b">道具でヒントを読み、鍵と番号で出口へ</text><text x="40" y="886" font-size="19" text-anchor="start" fill="#20364b">暗い隣室で314を読みます。出口で鍵を選んで使い、読んだ番号を入力します。</text><text x="40" y="918" font-size="19" text-anchor="start" fill="#20364b">模式図：道具と条件のつながりを示しています。実際の部屋の配置図ではありません。</text></svg>