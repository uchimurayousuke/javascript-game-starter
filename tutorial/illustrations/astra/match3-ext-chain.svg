<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc" lang="ja"><title id="title">3つそろえ：連鎖すると倍率が上がる</title><desc id="desc">3つそろえ：連鎖すると倍率が上がる。発展1 ／ 1回の交換から続く、1連鎖目と2連鎖目の例。そろった3個だけを取り出した模式図。盤面全体や実際の配置は示していません。連鎖数は交換ごとに1から数え直し、最大12回まで処理します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="830" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">3つそろえ：連鎖すると倍率が上がる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">発展1 ／ 1回の交換から続く、1連鎖目と2連鎖目の例。</text><rect id="first" x="60" y="180" width="390" height="130" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="255.0" y="225" font-size="29" text-anchor="middle" fill="#20364b">1連鎖目：3個そろう</text><text x="255.0" y="268" font-size="23" text-anchor="middle" fill="#20364b">1個10点 × 1倍</text><rect id="second" x="550" y="180" width="390" height="130" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="745.0" y="225" font-size="29" text-anchor="middle" fill="#20364b">2連鎖目：3個そろう</text><text x="745.0" y="268" font-size="23" text-anchor="middle" fill="#20364b">1個10点 × 2倍</text><rect id="chain00" x="120" y="350" width="90" height="85" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="165" y="405" font-size="35" text-anchor="middle" fill="#20364b">A</text><rect id="chain01" x="210" y="350" width="90" height="85" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="255" y="405" font-size="35" text-anchor="middle" fill="#20364b">A</text><rect id="chain02" x="300" y="350" width="90" height="85" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="345" y="405" font-size="35" text-anchor="middle" fill="#20364b">A</text><text x="255" y="505" font-size="28" text-anchor="middle" fill="#20364b">3 × 10 × 1 ＝ 30点</text><rect id="chain10" x="610" y="350" width="90" height="85" rx="0" fill="#eaa29d" stroke="#708391" stroke-width="3"/><text x="655" y="405" font-size="35" text-anchor="middle" fill="#20364b">B</text><rect id="chain11" x="700" y="350" width="90" height="85" rx="0" fill="#eaa29d" stroke="#708391" stroke-width="3"/><text x="745" y="405" font-size="35" text-anchor="middle" fill="#20364b">B</text><rect id="chain12" x="790" y="350" width="90" height="85" rx="0" fill="#eaa29d" stroke="#708391" stroke-width="3"/><text x="835" y="405" font-size="35" text-anchor="middle" fill="#20364b">B</text><text x="745" y="505" font-size="28" text-anchor="middle" fill="#20364b">3 × 10 × 2 ＝ 60点</text><path d="M460 390L540 390" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="550" font-size="26" text-anchor="middle" fill="#20364b">落下・補充で、続けてそろった</text><rect id="total" x="220" y="590" width="560" height="100" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="500.0" y="635" font-size="29" text-anchor="middle" fill="#20364b">合計 30 ＋ 60 ＝ 90点</text><text x="40" y="766" font-size="19" text-anchor="start" fill="#20364b">そろった3個だけを取り出した模式図。盤面全体や実際の配置は示していません。</text><text x="40" y="798" font-size="19" text-anchor="start" fill="#20364b">連鎖数は交換ごとに1から数え直し、最大12回まで処理します。</text></svg>