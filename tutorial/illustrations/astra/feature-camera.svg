<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc" lang="ja"><title id="title">カメラ：画面の場所を世界の場所に戻す</title><desc id="desc">カメラ：画面の場所を世界の場所に戻す。基本3 ／ カメラが右へ200・下へ100移動している場面。世界と画面を0.4倍に縮小。赤い点はクリック位置を説明するために追加しています。クリックをCanvas座標へ変換してからカメラ座標を加算。描画するときは逆に引きます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="900" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">カメラ：画面の場所を世界の場所に戻す</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ カメラが右へ200・下へ100移動している場面。</text><rect id="world" x="100" y="210" width="800" height="360" rx="0" fill="#edf4e7" stroke="#708391" stroke-width="3"/><rect id="camera" x="180" y="250" width="320" height="180" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><circle id="origin" cx="180" cy="250" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M180 245 L180 180 L380 180" fill="none" stroke="#34495e" stroke-width="3"/><text x="400" y="188" font-size="27" text-anchor="start" fill="#20364b">カメラ左上 (200,100)</text><circle id="click" cx="220" cy="270" r="6" fill="#d14f37" stroke="#d14f37" stroke-width="3"/><path d="M228 270 L540 270" fill="none" stroke="#34495e" stroke-width="3"/><text x="565" y="280" font-size="27" text-anchor="start" fill="#20364b">画面で (100,50)</text><text x="565" y="335" font-size="27" text-anchor="start" fill="#20364b">世界で (300,150)</text><text x="340" y="400" font-size="25" text-anchor="middle" fill="#20364b">画面800 × 450</text><text x="500" y="530" font-size="28" text-anchor="middle" fill="#20364b">世界2000 × 900</text><rect id="sum" x="110" y="625" width="780" height="135" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="500.0" y="670" font-size="29" text-anchor="middle" fill="#20364b">世界の座標 ＝ 画面の座標 ＋ カメラの左上</text><text x="500.0" y="713" font-size="23" text-anchor="middle" fill="#20364b">(100,50) ＋ (200,100) ＝ (300,150)</text><text x="40" y="836" font-size="19" text-anchor="start" fill="#20364b">世界と画面を0.4倍に縮小。赤い点はクリック位置を説明するために追加しています。</text><text x="40" y="868" font-size="19" text-anchor="start" fill="#20364b">クリックをCanvas座標へ変換してからカメラ座標を加算。描画するときは逆に引きます。</text></svg>