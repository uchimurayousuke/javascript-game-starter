<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">体力バー：残りの割合を長さにする</title><desc id="desc">体力バー：残りの割合を長さにする。基本3 ／ バーの幅 ＝ 最大幅300px × HP ÷ 最大HP100。バーの長さと高さを1.8倍に拡大。HP100・50・0の3状態を並べています。Dは30ダメージ、Hは20回復。HPは0未満にも100超にもなりません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">体力バー：残りの割合を長さにする</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ バーの幅 ＝ 最大幅300px × HP ÷ 最大HP100</text><text x="90" y="245" font-size="29" text-anchor="start" fill="#20364b">HP 100 / 100</text><rect id="bar0" x="370" y="205" width="540" height="54" rx="0" fill="#e4eaf0" stroke="#708391" stroke-width="3"/><rect id="hp0" x="370" y="205" width="540.0" height="54" rx="0" fill="#78bf95" stroke="#498765" stroke-width="3"/><text x="640" y="310" font-size="27" text-anchor="middle" fill="#20364b">300 × 100 ÷ 100 ＝ 300px</text><text x="90" y="410" font-size="29" text-anchor="start" fill="#20364b">HP 50 / 100</text><rect id="bar1" x="370" y="370" width="540" height="54" rx="0" fill="#e4eaf0" stroke="#708391" stroke-width="3"/><rect id="hp1" x="370" y="370" width="270.0" height="54" rx="0" fill="#78bf95" stroke="#498765" stroke-width="3"/><text x="640" y="475" font-size="27" text-anchor="middle" fill="#20364b">300 × 50 ÷ 100 ＝ 150px</text><text x="90" y="575" font-size="29" text-anchor="start" fill="#20364b">HP 0 / 100</text><rect id="bar2" x="370" y="535" width="540" height="54" rx="0" fill="#e4eaf0" stroke="#708391" stroke-width="3"/><text x="640" y="640" font-size="27" text-anchor="middle" fill="#20364b">300 × 0 ÷ 100 ＝ 0px</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">バーの長さと高さを1.8倍に拡大。HP100・50・0の3状態を並べています。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">Dは30ダメージ、Hは20回復。HPは0未満にも100超にもなりません。</text></svg>