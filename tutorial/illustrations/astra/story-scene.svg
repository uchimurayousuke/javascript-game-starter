<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc" lang="ja"><title id="title">物語が終わったら、Rで最初から</title><desc id="desc">物語が終わったら、Rで最初から。広場で1なら家へ、2なら森を見渡して丘を見つけます。結末の場面では、1・2で先へは進みません。Rで森の入口に戻ります。模式図：広場からの2つの結末を例にしています。川の結末でもRで再開できます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="930" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">物語が終わったら、Rで最初から</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">広場で1なら家へ、2なら森を見渡して丘を見つけます。</text><rect id="ending-one" x="40" y="160" width="430" height="230" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="ending-two" x="530" y="160" width="430" height="230" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="255" y="208" font-size="29" text-anchor="middle" fill="#20364b">家へ帰る結末</text><text x="255" y="267" font-size="25" text-anchor="middle" fill="#20364b">森の景色を楽しんだ</text><text x="745" y="208" font-size="29" text-anchor="middle" fill="#20364b">丘を見つける結末</text><text x="745" y="267" font-size="25" text-anchor="middle" fill="#20364b">森を見渡した</text><text x="255" y="341" font-size="32" text-anchor="middle" fill="#20364b">おしまい</text><text x="745" y="341" font-size="32" text-anchor="middle" fill="#20364b">おしまい</text><path d="M255 390V450H500 M745 390V450H500" fill="none" stroke="#34495e" stroke-width="3"/><path d="M500 450L500 510" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="restart-key" x="420" y="520" width="160" height="90" rx="14" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="500" y="580" font-size="42" text-anchor="middle" fill="#20364b">R</text><path d="M500 625L500 670" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="start-again" x="250" y="685" width="500" height="105" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="500" y="751" font-size="30" text-anchor="middle" fill="#20364b">森の入口から、もう一度</text><text x="40" y="866" font-size="19" text-anchor="start" fill="#20364b">結末の場面では、1・2で先へは進みません。Rで森の入口に戻ります。</text><text x="40" y="898" font-size="19" text-anchor="start" fill="#20364b">模式図：広場からの2つの結末を例にしています。川の結末でもRで再開できます。</text></svg>