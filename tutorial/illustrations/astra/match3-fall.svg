<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc" lang="ja"><title id="title">3つそろえ：消す → 落とす → 補充</title><desc id="desc">3つそろえ：消す → 落とす → 補充。基本4 ／ 1列の中で、残るマスを下から詰めます。6×6のうち1列を示す説明用の例。途中状態を分けていますが、実際は一度に処理。新しい3文字は補充の一例。実装はA〜Dからランダムに選びます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="820" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">3つそろえ：消す → 落とす → 補充</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本4 ／ 1列の中で、残るマスを下から詰めます。</text><text x="130" y="180" font-size="27" text-anchor="middle" fill="#20364b">そろった列</text><rect id="f00" x="90" y="220" width="80" height="65" rx="0" fill="#eaa29d" stroke="#708391" stroke-width="3"/><text x="130" y="263" font-size="28" text-anchor="middle" fill="#20364b">B</text><rect id="f01" x="90" y="285" width="80" height="65" rx="0" fill="#bad18f" stroke="#708391" stroke-width="3"/><text x="130" y="328" font-size="28" text-anchor="middle" fill="#20364b">C</text><rect id="f02" x="90" y="350" width="80" height="65" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="130" y="393" font-size="28" text-anchor="middle" fill="#20364b">A</text><rect id="f03" x="90" y="415" width="80" height="65" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="130" y="458" font-size="28" text-anchor="middle" fill="#20364b">A</text><rect id="f04" x="90" y="480" width="80" height="65" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="130" y="523" font-size="28" text-anchor="middle" fill="#20364b">A</text><rect id="f05" x="90" y="545" width="80" height="65" rx="0" fill="#c7a2dc" stroke="#708391" stroke-width="3"/><text x="130" y="588" fon