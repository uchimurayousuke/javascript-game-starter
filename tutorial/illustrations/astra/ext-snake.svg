<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="925" viewBox="0 0 1000 925" role="img" aria-labelledby="title desc" lang="ja"><title id="title">得点が増えると、待つ時間が短くなる</title><desc id="desc">得点が増えると、待つ時間が短くなる。同じ1マスを進むまでの時間が短いほど、速く動きます。得点3なら200 − 3 × 20 ＝ 140ミリ秒。短くしても最小80ミリ秒です。模式図：各行は別の得点の例。体の長さや食べ物の位置は省略しています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="925" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">得点が増えると、待つ時間が短くなる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">同じ1マスを進むまでの時間が短いほど、速く動きます。</text><rect id="speed-0" x="40" y="175" width="920" height="135" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="165" y="225" font-size="29" text-anchor="middle" fill="#20364b">得点0</text><rect id="snake-0-0" x="300" y="210" width="55" height="55" rx="0" fill="#b9dfce" stroke="#398164" stroke-width="3"/><rect id="snake-0-1" x="360" y="210" width="55" height="55" rx="0" fill="#b9dfce" stroke="#398164" stroke-width="3"/><rect id="snake-0-2" x="420" y="210" width="55" height="55" rx="0" fill="#b9dfce" stroke="#398164" stroke-width="3"/><text x="447" y="248" font-size="23" text-anchor="middle" fill="#20364b">頭</text><path d="M500 238L625 238" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="785" y="226" font-size="32" text-anchor="middle" fill="#20364b">200ミリ秒</text><text x="785" y="270" font-size="23" text-anchor="middle" fill="#20364b">待つと1マス進む</text><rect id="speed-1" x="40" y="330" width="920" height="135" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="165" y="380" font-size="29" text-anchor="middle" fill="#20364b">得点1</text><rect id="snake-1-0" x="300" y="365" width="55" height="55" rx="0" fill="#b9dfce" stroke="#398164" stroke-width="3"/><rect id="snake-1-1" x="360" y="365" width="55" height="55" rx="0" fill="#b9dfce" stroke="#398164" stroke-width="3"/><rect id="snake-1-2" x="420" y="365" width="55" height="55" rx="0" fill="#b9dfce" stroke="#398164" stroke-width="3"/><text x="447" y="403" font-size="23" text-anchor="middle" fill="#20364b">頭</text><path d="M500 393L625 393" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="785" y="381" font-size="32" text-anchor="middle" fill="#20364b">180ミリ秒</text><text x="785" y="425" font-size="23" text-anchor="middle" fill="#20364b">待つと1マス進む</text><rect id="speed-2" x="40" y="485" width="920" height="135" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="165" y="535" font-size="29" text-anchor="middle" fill="#20364b">得点2</text><rect id="snake-2-0" x="300" y="520" width="55" height="55" rx="0" fill="#b9dfce" stroke="#398164" stroke-width="3"/><rect id="snake-2-1" x="360" y="520" width="55" height="55" rx="0" fill="#b9dfce" stroke="#398164" stroke-width="3"/><rect id="snake-2-2" x="420" y="520" width="55" height="55" rx="0" fill="#b9dfce" stroke="#398164" stroke-width="3"/><text x="447" y="558" font-size="23" text-anchor="middle" fill="#20364b">頭</text><path d="M500 548L625 548" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="785" y="536" font-size="32" text-anchor="middle" fill="#20364b">160ミリ秒</text><text x="785" y="580" font-size="23" text-anchor="middle" fill="#20364b">待つと1マス進む</text><rect id="speed-3" x="40" y="640" width="920" height="135" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="165" y="690" font-size="29" text-anchor="middle" fill="#20364b">得点3</text><rect id="snake-3-0" x="300" y="675" width="55" height="55" rx="0" fill="#b9dfce" stroke="#398164" stroke-width="3"/><rect id="snake-3-1" x="360" y="675" width="55" height="55" rx="0" fill="#b9dfce" stroke="#398164" stroke-width="3"/><rect id="snake-3-2" x="