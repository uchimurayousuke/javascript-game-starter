<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" role="img" aria-labelledby="title desc" lang="ja"><title id="title">座標：左上から右へ、下へ数える</title><desc id="desc">座標：左上から右へ、下へ数える。Canvasの原点は左上。点の場所を (x, y) で表します。Canvas 800×450を等倍で表示。図の中で置く位置だけをずらしています。赤い点・破線・矢印は説明用です。xとyは、右・下へ行くほど大きくなります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="860" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">座標：左上から右へ、下へ数える</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">Canvasの原点は左上。点の場所を (x, y) で表します。</text><rect id="canvas-area" x="120" y="200" width="800" height="450" rx="0" fill="#eef5fb" stroke="#a9bdcf" stroke-width="3"/><path d="M120 200L960 200" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M120 200L120 695" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="935" y="170" font-size="27" text-anchor="middle" fill="#20364b">x →</text><text x="75" y="695" font-size="27" text-anchor="middle" fill="#20364b">y ↓</text><circle id="origin" cx="120" cy="200" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="95" y="165" font-size="27" text-anchor="middle" fill="#20364b">(0,0)</text><path d="M420 200 L420 350 L120 350" fill="none" stroke="#798d9d" stroke-width="3" stroke-dasharray="8 6"/><circle id="point" cx="420" cy="350" r="8" fill="#d14f37" stroke="#d14f37" stroke-width="3"/><text x="420" y="175" font-size="29" text-anchor="middle" fill="#20364b">300</text><text x="80" y="360" font-size="29" text-anchor="middle" fill="#20364b">150</text><text x="460" y="360" font-size="34" text-anchor="start" fill="#20364b">(300,150)</text><text x="460" y="410" font-size="28" text-anchor="start" fill="#20364b">右へ300・下へ150</text><text x="520" y="725" font-size="28" text-anchor="middle" fill="#20364b">横800px</text><text x="780" y="610" font-size="28" text-anchor="middle" fill="#20364b">縦450px</text><text x="40" y="796" font-size="19" text-anchor="start" fill="#20364b">Canvas 800×450を等倍で表示。図の中で置く位置だけをずらしています。</text><text x="40" y="828" font-size="19" text-anchor="start" fill="#20364b">赤い点・破線・矢印は説明用です。xとyは、右・下へ行くほど大きくなります。</text></svg>