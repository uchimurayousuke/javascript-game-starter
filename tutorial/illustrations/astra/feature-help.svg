<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">遊び方：読んだあとに戻れる画面</title><desc id="desc">遊び方：読んだあとに戻れる画面。基本3 ／ 画面ごとに、受け付けるキーを決めます。状態の切り替えを示す模式図で、画面の位置や大きさを表しません。遊び方でEnterを押しても開始しません。Escで戻り、タイトルでEnter。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">遊び方：読んだあとに戻れる画面</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 画面ごとに、受け付けるキーを決めます。</text><rect id="title-screen" x="70" y="230" width="330" height="150" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="235.0" y="275" font-size="29" text-anchor="middle" fill="#20364b">タイトル</text><text x="235.0" y="318" font-size="23" text-anchor="middle" fill="#20364b">state = title</text><rect id="help" x="600" y="230" width="330" height="150" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="765.0" y="275" font-size="29" text-anchor="middle" fill="#20364b">遊び方</text><text x="765.0" y="318" font-size="23" text-anchor="middle" fill="#20364b">state = help</text><path d="M405 270L595 270" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="245" font-size="30" text-anchor="middle" fill="#20364b">H</text><path d="M765 385 L765 465 L420 465 L420 350 L405 350" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="445" font-size="28" text-anchor="middle" fill="#20364b">Escでタイトルへ</text><rect id="playing" x="70" y="550" width="330" height="125" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="235.0" y="595" font-size="29" text-anchor="middle" fill="#20364b">ゲーム</text><text x="235.0" y="638" font-size="23" text-anchor="middle" fill="#20364b">state = playing</text><path d="M235 385L235 545" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="585" font-size="27" text-anchor="start" fill="#20364b">タイトルで Enter</text><text x="440" y="635" font-size="25" text-anchor="start" fill="#20364b">説明を閉じてから始めよう</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">状態の切り替えを示す模式図で、画面の位置や大きさを表しません。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">遊び方でEnterを押しても開始しません。Escで戻り、タイトルでEnter。</text></svg>