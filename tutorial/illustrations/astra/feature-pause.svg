<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc" lang="ja"><title id="title">一時停止：止めた時間を数えない</title><desc id="desc">一時停止：止めた時間を数えない。基本3 ／ 制限時間は10秒。Pで停止・再開します。時刻を説明する模式図。開始時刻を0とした例で、表示の幅は時間の長さと無関係。停止中は停止した時刻を使い、再開時に停止時間を合計へ加えます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="830" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">一時停止：止めた時間を数えない</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 制限時間は10秒。Pで停止・再開します。</text><text x="80" y="180" font-size="28" text-anchor="start" fill="#20364b">例：開始から2秒で停止し、3秒待って再開</text><rect id="p0" x="65" y="240" width="270" height="170" rx="16" fill="#d4efde" stroke="#a9bdcf" stroke-width="3"/><text x="200.0" y="285" font-size="29" text-anchor="middle" fill="#20364b">プレイ 2秒</text><text x="200.0" y="328" font-size="23" text-anchor="middle" fill="#20364b">残り8秒</text><path d="M340 325L370 325" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="p1" x="375" y="240" width="270" height="170" rx="16" fill="#fff0c7" stroke="#a9bdcf" stroke-width="3"/><text x="510.0" y="285" font-size="29" text-anchor="middle" fill="#20364b">停止 3秒</text><text x="510.0" y="328" font-size="23" text-anchor="middle" fill="#20364b">残り8秒のまま</text><path d="M650 325L680 325" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="p2" x="685" y="240" width="270" height="170" rx="16" fill="#d4efde" stroke="#a9bdcf" stroke-width="3"/><text x="820.0" y="285" font-size="29" text-anchor="middle" fill="#20364b">再開した瞬間</text><text x="820.0" y="328" font-size="23" text-anchor="middle" fill="#20364b">残り8秒</text><text x="350" y="225" font-size="28" text-anchor="middle" fill="#20364b">P</text><text x="660" y="225" font-size="28" text-anchor="middle" fill="#20364b">P</text><rect id="calc" x="95" y="485" width="810" height="150" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="500.0" y="530" font-size="29" text-anchor="middle" fill="#20364b">ゲームで進んだ時間</text><text x="500.0" y="573" font-size="23" text-anchor="middle" fill="#20364b">実時間5秒 − 停止3秒 ＝ 2秒</text><text x="500" y="680" font-size="27" text-anchor="middle" fill="#20364b">停止中は四角も止まり、残り時間も減りません。</text><text x="40" y="766" font-size="19" text-anchor="start" fill="#20364b">時刻を説明する模式図。開始時刻を0とした例で、表示の幅は時間の長さと無関係。</text><text x="40" y="798" font-size="19" text-anchor="start" fill="#20364b">停止中は停止した時刻を使い、再開時に停止時間を合計へ加えます。</text></svg>