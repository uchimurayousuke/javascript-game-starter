<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" lang="ja"><title id="title">ヒット演出は600msだけ。描いた後は元に戻す</title><desc id="desc">ヒットから600ms未満だけ点滅と揺れと上昇数字を表示する。点滅は200ms間隔。数字は1秒40pxなので200msで8px、400msで16px上がり、600msちょうどで消える。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="900" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">ヒット演出は600msだけ。描いた後は元に戻す</text><text x="40" y="110" font-size="27" text-anchor="start" fill="#20364b">Spaceで開始。期限は開始時刻＋600ms。Rでも演出を消せます。</text><rect x="100" y="185" width="900" height="100" rx="0" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="550" y="245" font-size="28" text-anchor="middle" fill="#20364b">この間だけ演出中：0 ≦ 経過時間 ＜ 600ms</text><path d="M100.0 170 L100.0 305" fill="none" stroke="#20364b" stroke-width="3"/><text x="100.0" y="350" font-size="27" text-anchor="middle" fill="#20364b">0ms</text><path d="M400.0 170 L400.0 305" fill="none" stroke="#20364b" stroke-width="3"/><text x="400.0" y="350" font-size="27" text-anchor="middle" fill="#20364b">200ms</text><path d="M700.0 170 L700.0 305" fill="none" stroke="#20364b" stroke-width="3"/><text x="700.0" y="350" font-size="27" text-anchor="middle" fill="#20364b">400ms</text><path d="M1000.0 170 L1000.0 305" fill="none" stroke="#20364b" stroke-width="3"/><text x="1000.0" y="350" font-size="27" text-anchor="middle" fill="#20364b">600ms</text><text x="100" y="410" font-size="28" text-anchor="start" fill="#20364b">点滅の間隔：200ms。600msちょうどでは演出終了。</text><rect x="40" y="465" width="250" height="155" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="165" y="510" font-size="29" text-anchor="middle" fill="#20364b">0ms</text><text x="165" y="580" font-size="29" text-anchor="middle" fill="#20364b">基準の高さ</text><rect x="330" y="465" width="250" height="155" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="455" y="510" font-size="29" text-anchor="middle" fill="#20364b">200ms</text><text x="455" y="580" font-size="29" text-anchor="middle" fill="#20364b">上へ8px</text><rect x="620" y="465" width="250" height="155" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="745" y="510" font-size="29" text-anchor="middle" fill="#20364b">400ms</text><text x="745" y="580" font-size="29" text-anchor="middle" fill="#20364b">上へ16px</text><rect x="910" y="465" width="250" height="155" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="1035" y="510" font-size="29" text-anchor="middle" fill="#20364b">600ms</text><text x="1035" y="580" font-size="29" text-anchor="middle" fill="#20364b">数字を消す</text><text x="40" y="680" font-size="30" text-anchor="start" fill="#20364b">数字の上昇量：40px/秒 × 0.2秒 ＝ 8px</text><rect x="40" y="720" width="1120" height="105" rx="12" fill="#edf3f8" stroke="#607a90" stroke-width="2"/><text x="65" y="765" font-size="28" text-anchor="start" fill="#20364b">揺れの描画：save → ずらして描く → restore</text><text x="65" y="805" font-size="25" text-anchor="start" fill="#20364b">描いた後に戻すので、その後の描画にずれを残しません。</text><text x="40" y="875" font-size="23" text-anchor="start" fill="#20364b">時間軸は同じ縮尺。下の箱は上昇量の比較です。点滅の明暗順は省略。</text></svg>