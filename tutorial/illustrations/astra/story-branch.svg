<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="835" viewBox="0 0 1000 835" role="img" aria-labelledby="title desc" lang="ja"><title id="title">選んだ行動で、次の場面が変わる</title><desc id="desc">選んだ行動で、次の場面が変わる。森の入口で1か2を押して、進む場所を選びます。1なら広場、2なら川の場面へ。選択肢には、次にする行動を書いています。模式図：物語の分岐です。キャラクターを地図の上で移動させる図ではありません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="835" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">選んだ行動で、次の場面が変わる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">森の入口で1か2を押して、進む場所を選びます。</text><rect id="forest" x="280" y="155" width="440" height="190" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="500" y="202" font-size="32" text-anchor="middle" fill="#20364b">森の入口</text><rect id="trunk-0" x="340" y="269" width="25" height="40" rx="0" fill="#be9663" stroke="#946d3d" stroke-width="3"/><circle id="tree-0" cx="352" cy="250" r="37" fill="#dcefd5" stroke="#528852" stroke-width="3"/><rect id="trunk-1" x="620" y="269" width="25" height="40" rx="0" fill="#be9663" stroke="#946d3d" stroke-width="3"/><circle id="tree-1" cx="632" cy="250" r="37" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="500" y="290" font-size="27" text-anchor="middle" fill="#20364b">どちらへ進む？</text><path d="M500 345V388H255V465" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 388H745V465" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="255" y="435" font-size="28" text-anchor="middle" fill="#20364b">1：広場へ進む</text><text x="745" y="435" font-size="28" text-anchor="middle" fill="#20364b">2：川へ進む</text><rect id="clearing" x="40" y="485" width="430" height="210" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="255" y="535" font-size="32" text-anchor="middle" fill="#20364b">広場に着く</text><circle id="clearing-land" cx="255" cy="610" r="55" fill="#dcefd5" stroke="#528852" stroke-width="3"/><rect id="river" x="530" y="485" width="430" height="210" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="745" y="535" font-size="32" text-anchor="middle" fill="#20364b">川へ進む</text><path d="M600 590Q665 560 730 590T890 590 M600 630Q665 600 730 630T890 630" fill="none" stroke="#5699bc" stroke-width="12"/><text x="40" y="771" font-size="19" text-anchor="start" fill="#20364b">1なら広場、2なら川の場面へ。選択肢には、次にする行動を書いています。</text><text x="40" y="803" font-size="19" text-anchor="start" fill="#20364b">模式図：物語の分岐です。キャラクターを地図の上で移動させる図ではありません。</text></svg>