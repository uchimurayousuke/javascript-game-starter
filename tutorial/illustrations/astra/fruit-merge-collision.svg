<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc" lang="ja"><title id="title">重なった同じレベルの2個を、1個に合体する</title><desc id="desc">内部レベル0で表示数字1、半径18のフルーツ2個。中心200,250と232,250の距離32は半径の合計36より小さい。同じ内部レベル0なので各1回だけ消費し、中心の平均216,250に内部レベル1で表示数字2、半径24のフルーツを1個作り20点加える。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1F3D5B"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="880" rx="10" fill="#FFF8E8" stroke="#1F3D5B" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#1F3D5B">重なった同じレベルの2個を、1個に合体する</text><text x="40" y="110" font-size="29" text-anchor="start" fill="#1F3D5B">① 中心の距離と、半径の合計を比べる</text><text x="170" y="185" font-size="30" text-anchor="start" fill="#1F3D5B">表示1を2個</text><circle cx="210" cy="310" r="90" fill="#FFD35A" stroke="#1F3D5B" stroke-width="3"/><circle cx="370" cy="310" r="90" fill="#FFD35A" stroke="#1F3D5B" stroke-width="3"/><text x="210" y="280" font-size="25" text-anchor="middle" fill="#1F3D5B">表示1</text><circle cx="210" cy="310" r="4" fill="#1F3D5B" stroke="#1F3D5B" stroke-width="3"/><text x="210" y="355" font-size="24" text-anchor="middle" fill="#1F3D5B">(200,250)</text><text x="370" y="280" font-size="25" text-anchor="middle" fill="#1F3D5B">表示1</text><circle cx="370" cy="310" r="4" fill="#1F3D5B" stroke="#1F3D5B" stroke-width="3"/><text x="370" y="355" font-size="24" text-anchor="middle" fill="#1F3D5B">(232,250)</text><path d="M210 310 L120 310" fill="none" stroke="#1F3D5B" stroke-width="3"/><path d="M370 310 L460 310" fill="none" stroke="#1F3D5B" stroke-width="3"/><text x="105" y="420" font-size="25" text-anchor="start" fill="#1F3D5B">半径18</text><text x="375" y="420" font-size="25" text-anchor="start" fill="#1F3D5B">半径18</text><path d="M210 450 L370 450" fill="none" stroke="#1F3D5B" stroke-width="3"/><path d="M210 438 L210 462" fill="none" stroke="#1F3D5B" stroke-width="3"/><path d="M370 438 L370 462" fill="none" stroke="#1F3D5B" stroke-width="3"/><text x="290" y="500" font-size="28" text-anchor="middle" fill="#1F3D5B">距離：232−200＝32</text><path d="M540 310 L705 310" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="623" y="275" font-size="28" text-anchor="middle" fill="#1F3D5B">合体</text><text x="820" y="185" font-size="30" text-anchor="start" fill="#1F3D5B">表示2を1個</text><circle cx="925" cy="310" r="120" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="3"/><text x="925" y="265" font-size="29" text-anchor="middle" fill="#1F3D5B">表示2</text><circle cx="925" cy="310" r="4" fill="#1F3D5B" stroke="#1F3D5B" stroke-width="3"/><text x="925" y="355" font-size="28" text-anchor="middle" fill="#1F3D5B">(216,250)</text><text x="925" y="485" font-size="30" text-anchor="middle" fill="#1F3D5B">半径24 ／ ＋20点</text><rect x="40" y="545" width="1120" height="120" rx="10" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="65" y="590" font-size="31" text-anchor="start" fill="#1F3D5B">32 ＜ 18＋18＝36 → 重なっている</text><text x="65" y="640" font-size="27" text-anchor="start" fill="#1F3D5B">2個は同じレベル。元の2個をそれぞれ1回だけ使って消す。</text><text x="40" y="725" font-size="29" text-anchor="start" fill="#1F3D5B">② 新しい中心：x＝(200＋232)÷2＝216</text><text x="40" y="780" font-size="28" text-anchor="start" fill="#1F3D5B">y＝(250＋250)÷2＝250。同じ高さの、ちょうど中間へ。</text><text x="40" y="845" font-size="23" text-anchor="start" fill="#1F3D5B">円と中心間の距離は5倍。合体後の円も同じ縮尺。箱や落下は省略しています。</text></svg>