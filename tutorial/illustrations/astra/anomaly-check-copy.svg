<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc" lang="ja"><title id="title">基準はそのまま。コピーした窓だけ右へ動かす</title><desc id="desc">基準の窓は左上140,110、幅90高さ75。表示用に各物のデータをコピーし、表示の窓のxに30を足して170にする。基準はx140のままで、y110、幅90、高さ75は変わらない。2つを比べると窓の位置が違う。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1F3D5B"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="1000" rx="10" fill="#FFF8E8" stroke="#1F3D5B" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#1F3D5B">基準はそのまま。コピーした窓だけ右へ動かす</text><text x="40" y="110" font-size="27" text-anchor="start" fill="#1F3D5B">各物のデータをコピーしてから、表示側の窓のxだけに30を足す。</text><text x="60" y="175" font-size="30" text-anchor="start" fill="#1F3D5B">基準の部屋</text><text x="660" y="175" font-size="30" text-anchor="start" fill="#1F3D5B">表示用の部屋</text><rect x="60" y="205" width="480" height="300" rx="10" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><path d="M60 445 L540 445" fill="none" stroke="#1F3D5B" stroke-width="3"/><rect x="228.0" y="337.0" width="108" height="90" rx="10" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><path d="M282.0 337.0 L282.0 427.0" fill="none" stroke="#1F3D5B" stroke-width="3"/><path d="M228.0 382.0 L336.0 382.0" fill="none" stroke="#1F3D5B" stroke-width="3"/><text x="300" y="485" font-size="24" text-anchor="middle" fill="#1F3D5B">部屋の一部</text><rect x="660" y="205" width="480" height="300" rx="10" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><path d="M660 445 L1140 445" fill="none" stroke="#1F3D5B" stroke-width="3"/><rect x="828.0" y="337.0" width="108" height="90" rx="10" fill="none" stroke="#1F3D5B" stroke-width="2" stroke-dasharray="7 6"/><rect x="864.0" y="337.0" width="108" height="90" rx="10" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><path d="M918.0 337.0 L918.0 427.0" fill="none" stroke="#1F3D5B" stroke-width="3"/><path d="M864.0 382.0 L972.0 382.0" fill="none" stroke="#1F3D5B" stroke-width="3"/><text x="900" y="485" font-size="24" text-anchor="middle" fill="#1F3D5B">部屋の一部</text><path d="M565 350 L635 350" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="315" font-size="25" text-anchor="middle" fill="#1F3D5B">コピー</text><path d="M828 300 L864 300" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="935" y="280" font-size="27" text-anchor="middle" fill="#1F3D5B">xに＋30</text><rect x="60" y="545" width="480" height="190" rx="10" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="2"/><text x="85" y="595" font-size="29" text-anchor="start" fill="#1F3D5B">基準：x＝140、y＝110</text><text x="85" y="655" font-size="29" text-anchor="start" fill="#1F3D5B">幅90・高さ75</text><text x="85" y="705" font-size="27" text-anchor="start" fill="#1F3D5B">元の値は変えない</text><rect x="660" y="545" width="480" height="190" rx="10" fill="#E7F0DF" stroke="#1F3D5B" stroke-width="2"/><text x="685" y="595" font-size="29" text-anchor="start" fill="#1F3D5B">表示：x＝170、y＝110</text><text x="685" y="655" font-size="29" text-anchor="start" fill="#1F3D5B">幅90・高さ75</text><text x="685" y="705" font-size="27" text-anchor="start" fill="#1F3D5B">xだけ140 → 170</text><text x="40" y="805" font-size="30" text-anchor="start" fill="#1F3D5B">比べる：170 − 140 ＝ 30 → 窓は右へ30動いている</text><text x="40" y="865" font-size="27" text-anchor="start" fill="#1F3D5B">基準のxまで変えると、違いを確かめる元の値がなくなります。</text><text x="40" y="925" font-size="27" text-anchor="start" fill="#1F3D5B">基準と表示は別のデータ。y・幅・高さは同じままです。</text><text x="40" y="980" font-size="23" text-anchor="start" fill="#1F3D5B">窓と移動量は1.2倍。部屋は比較用の一部、点線は動かす前の窓の位置です。</text></svg>