<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">サッカー：近づいてからシュート</title><desc id="desc">サッカー：近づいてからシュート。基本3 ／ ボールの向こう側へ飛ばすイメージ。選手の半径16px・ボールの半径8px・距離30pxを4倍に拡大。矢印は蹴る向きの模式図。飛距離や経過時間を示すものではありません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">サッカー：近づいてからシュート</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ ボールの向こう側へ飛ばすイメージ。</text><rect id="pitch" x="60" y="165" width="880" height="360" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><circle id="player" cx="260" cy="335" r="64" fill="#95c7ed" stroke="#28629e" stroke-width="3"/><circle id="ball" cx="380" cy="335" r="32" fill="#fff" stroke="#34495e" stroke-width="3"/><circle id="pc" cx="260" cy="335" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><circle id="bc" cx="380" cy="335" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M260 335 L380 335" fill="none" stroke="#34495e" stroke-width="3" stroke-dasharray="8 6"/><text x="260" y="445" font-size="28" text-anchor="middle" fill="#20364b">自分</text><text x="380" y="445" font-size="28" text-anchor="middle" fill="#20364b">ボール</text><path d="M260 250 L380 250" fill="none" stroke="#34495e" stroke-width="3"/><path d="M260 240 L260 260 M380 240 L380 260" fill="none" stroke="#34495e" stroke-width="3"/><text x="320" y="225" font-size="26" text-anchor="middle" fill="#20364b">中心の距離 30px</text><path d="M425 335L805 335" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="620" y="300" font-size="26" text-anchor="middle" fill="#20364b">自分 → ボールの方向へ</text><text x="620" y="395" font-size="30" text-anchor="middle" fill="#20364b">Spaceで蹴る</text><text x="90" y="585" font-size="30" text-anchor="start" fill="#20364b">中心どうしが32px以内なら、ボールに届く。</text><text x="90" y="640" font-size="28" text-anchor="start" fill="#20364b">この例は30pxなので成功。蹴る強さは6。</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">選手の半径16px・ボールの半径8px・距離30pxを4倍に拡大。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">矢印は蹴る向きの模式図。飛距離や経過時間を示すものではありません。</text></svg>