<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc" lang="ja"><title id="title">お絵かきロジック：数字は連続する数</title><desc id="desc">お絵かきロジック：数字は連続する数。基本2 ／ 「2 1」は「3」とは違います。間の空きが大切。ヒントの読み方を説明する5マスの例。初期問題の行とは異なります。1マス54pxの盤面を、横110px・縦100pxで模式化。位置は他のヒントと合わせて決めます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="820" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">お絵かきロジック：数字は連続する数</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本2 ／ 「2 1」は「3」とは違います。間の空きが大切。</text><text x="90" y="185" font-size="29" text-anchor="start" fill="#20364b">ヒント「2 1」＝ 2マスのかたまり、次に1マス</text><text x="130" y="300" font-size="38" text-anchor="middle" fill="#20364b">2 1</text><rect id="c00" x="230" y="240" width="110" height="100" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="285" y="300" font-size="28" text-anchor="middle" fill="#20364b">塗</text><rect id="c01" x="340" y="240" width="110" height="100" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="395" y="300" font-size="28" text-anchor="middle" fill="#20364b">塗</text><rect id="c02" x="450" y="240" width="110" height="100" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="505" y="300" font-size="28" text-anchor="middle" fill="#20364b">空</text><rect id="c03" x="560" y="240" width="110" height="100" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="615" y="300" font-size="28" text-anchor="middle" fill="#20364b">塗</text><rect id="c04" x="670" y="240" width="110" height="100" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="725" y="300" font-size="28" text-anchor="middle" fill="#20364b">空</text><text x="340" y="385" font-size="25" text-anchor="middle" fill="#20364b">2マス続く</text><text x="615" y="385" font-size="25" text-anchor="middle" fill="#20364b">1マス</text><text x="130" y="520" font-size="38" text-anchor="middle" fill="#20364b">2 1</text><rect id="c10" x="230" y="460" width="110" height="100" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="285" y="520" font-size="28" text-anchor="middle" fill="#20364b">塗</text><rect id="c11" x="340" y="460" width="110" height="100" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="395" y="520" font-size="28" text-anchor="middle" fill="#20364b">塗</text><rect id="c12" x="450" y="460" width="110" height="100" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="505" y="520" font-size="28" text-anchor="middle" fill="#20364b">空</text><rect id="c13" x="560" y="460" width="110" height="100" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="615" y="520" font-size="28" text-anchor="middle" fill="#20364b">空</text><rect id="c14" x="670" y="460" width="110" height="100" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="725" y="520" font-size="28" text-anchor="middle" fill="#20364b">塗</text><text x="340" y="605" font-size="25" text-anchor="middle" fill="#20364b">2マス続く</text><text x="725" y="605" font-size="25" text-anchor="middle" fill="#20364b">1マス</text><text x="500" y="675" font-size="27" text-anchor="middle" fill="#20364b">かたまりの間には、1マス以上の空きを入れます。</text><text x="40" y="756" font-size="19" text-anchor="start" fill="#20364b">ヒントの読み方を説明する5マスの例。初期問題の行とは異なります。</text><text x="40" y="788" font-size="19" text-anchor="start" fill="#20364b">1マス54pxの盤面を、横110px・縦100pxで模式化。位置は他のヒントと合わせて決めます。</text></svg>