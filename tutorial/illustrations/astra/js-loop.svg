<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc" lang="ja"><title id="title">for：条件を調べてから、1回ずつ実行する</title><desc id="desc">let i=0で始め、i&lt;3の間console.log(i)を実行し、i+=1する。0,1,2を表示し、3ではfalseなので表示せず終了する。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="860" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">for：条件を調べてから、1回ずつ実行する</text><text x="40" y="110" font-size="29" text-anchor="start" fill="#20364b">for (let i = 0; i &lt; 3; i += 1) { console.log(i); }</text><text x="70" y="185" font-size="27" text-anchor="start" fill="#20364b">いまの i</text><text x="290" y="185" font-size="27" text-anchor="start" fill="#20364b">条件 i &lt; 3</text><text x="600" y="185" font-size="27" text-anchor="start" fill="#20364b">本体の出力</text><text x="900" y="185" font-size="27" text-anchor="start" fill="#20364b">その後</text><rect x="40" y="220" width="1120" height="105" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="110" y="283" font-size="38" text-anchor="middle" fill="#20364b">0</text><text x="290" y="283" font-size="29" text-anchor="start" fill="#20364b">0 &lt; 3 → true</text><text x="650" y="283" font-size="29" text-anchor="middle" fill="#20364b">0</text><text x="900" y="283" font-size="29" text-anchor="start" fill="#20364b">i = 1</text><path d="M215 272 L260 272" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="345" width="1120" height="105" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="110" y="408" font-size="38" text-anchor="middle" fill="#20364b">1</text><text x="290" y="408" font-size="29" text-anchor="start" fill="#20364b">1 &lt; 3 → true</text><text x="650" y="408" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="900" y="408" font-size="29" text-anchor="start" fill="#20364b">i = 2</text><path d="M215 397 L260 397" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="470" width="1120" height="105" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="110" y="533" font-size="38" text-anchor="middle" fill="#20364b">2</text><text x="290" y="533" font-size="29" text-anchor="start" fill="#20364b">2 &lt; 3 → true</text><text x="650" y="533" font-size="29" text-anchor="middle" fill="#20364b">2</text><text x="900" y="533" font-size="29" text-anchor="start" fill="#20364b">i = 3</text><path d="M215 522 L260 522" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="595" width="1120" height="105" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="110" y="658" font-size="38" text-anchor="middle" fill="#20364b">3</text><text x="290" y="658" font-size="29" text-anchor="start" fill="#20364b">3 &lt; 3 → false</text><text x="650" y="658" font-size="29" text-anchor="middle" fill="#20364b">実行しない</text><text x="900" y="658" font-size="29" text-anchor="start" fill="#20364b">終了</text><text x="40" y="765" font-size="31" text-anchor="start" fill="#20364b">Consoleに並ぶのは 0、1、2。実行回数は3回。</text><text x="40" y="815" font-size="25" text-anchor="start" fill="#20364b">初期化は最初だけ。本体の後でiを増やし、次の条件を調べます。</text></svg>