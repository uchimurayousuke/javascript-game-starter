<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img" aria-labelledby="title desc" lang="ja"><title id="title">止めた目印の「中心」はゾーンの中？</title><desc id="desc">止めた目印の「中心」はゾーンの中？中心が300以上500以下なら成功。目印の幅ではなく、中心の数を調べます。500は境目と同じなので成功。501は500より1大きいので範囲外です。模式図：501と500の差を見分けられるよう、下の図の1の間隔を広げています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="815" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">止めた目印の「中心」はゾーンの中？</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">中心が300以上500以下なら成功。目印の幅ではなく、中心の数を調べます。</text><rect id="case-500" x="40" y="150" width="1120" height="260" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="80" y="194" font-size="29" text-anchor="start" fill="#20364b">境目と同じ</text><path d="M170 282H1040" fill="none" stroke="#93a9bb" stroke-width="5"/><rect id="zone-500" x="380" y="250" width="400" height="64" rx="0" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="580" y="292" font-size="29" text-anchor="middle" fill="#20364b">成功ゾーン</text><rect id="marker-500" x="765" y="230" width="30" height="104" rx="0" fill="#9cc3f0" stroke="#28629e" stroke-width="3"/><path d="M780 230V334" fill="none" stroke="#20364b" stroke-width="3"/><circle id="marker-center-500" cx="780" cy="282" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="780" y="216" font-size="30" text-anchor="middle" fill="#20364b">中心は横500</text><text x="380" y="366" font-size="27" text-anchor="middle" fill="#20364b">始まり300</text><text x="780" y="366" font-size="27" text-anchor="middle" fill="#20364b">終わり500</text><text x="1010" y="293" font-size="35" text-anchor="middle" fill="#18734f">成功！</text><rect id="case-501" x="40" y="435" width="1120" height="260" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="80" y="479" font-size="29" text-anchor="start" fill="#20364b">1だけ外</text><path d="M170 567H1040" fill="none" stroke="#93a9bb" stroke-width="5"/><rect id="zone-501" x="380" y="535" width="400" height="64" rx="0" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="580" y="577" font-size="29" text-anchor="middle" fill="#20364b">成功ゾーン</text><rect id="marker-501" x="791" y="515" width="30" height="104" rx="0" fill="#9cc3f0" stroke="#28629e" stroke-width="3"/><path d="M806 515V619" fill="none" stroke="#20364b" stroke-width="3"/><circle id="marker-center-501" cx="806" cy="567" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="806" y="501" font-size="30" text-anchor="middle" fill="#20364b">中心は横501</text><text x="380" y="651" font-size="27" text-anchor="middle" fill="#20364b">始まり300</text><text x="780" y="651" font-size="27" text-anchor="middle" fill="#20364b">終わり500</text><text x="1010" y="578" font-size="35" text-anchor="middle" fill="#a64e16">範囲外</text><text x="48" y="744" font-size="21" text-anchor="start" fill="#20364b">500は境目と同じなので成功。501は500より1大きいので範囲外です。</text><text x="48" y="780" font-size="21" text-anchor="start" fill="#20364b">模式図：501と500の差を見分けられるよう、下の図の1の間隔を広げています。</text></svg>