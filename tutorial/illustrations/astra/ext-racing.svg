<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="845" viewBox="0 0 1000 845" role="img" aria-labelledby="title desc" lang="ja"><title id="title">1周の記録と、走り始めてからの時間は別</title><desc id="desc">1周の記録と、走り始めてからの時間は別。説明用の記録：1周目は12秒、2周目は10秒です。2周走り終わった時刻は開始から22秒。2周目だけの時間は22 − 12で10秒です。模式図：時間の横幅は12対10。以前に10秒より速い記録がない例です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="845" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">1周の記録と、走り始めてからの時間は別</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">説明用の記録：1周目は12秒、2周目は10秒です。</text><text x="500" y="174" font-size="28" text-anchor="middle" fill="#20364b">スタートからの時間</text><rect id="lap1" x="140" y="240" width="360" height="95" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><rect id="lap2" x="500" y="240" width="300" height="95" rx="0" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="320" y="278" font-size="27" text-anchor="middle" fill="#20364b">1周目</text><text x="320" y="319" font-size="34" text-anchor="middle" fill="#20364b">12秒</text><text x="650" y="278" font-size="27" text-anchor="middle" fill="#20364b">2周目</text><text x="650" y="319" font-size="34" text-anchor="middle" fill="#20364b">10秒</text><path d="M140 340V367" fill="none" stroke="#34495e" stroke-width="3"/><text x="140" y="407" font-size="27" text-anchor="middle" fill="#20364b">0秒</text><path d="M500 340V367" fill="none" stroke="#34495e" stroke-width="3"/><text x="500" y="407" font-size="27" text-anchor="middle" fill="#20364b">12秒</text><path d="M800 340V367" fill="none" stroke="#34495e" stroke-width="3"/><text x="800" y="407" font-size="27" text-anchor="middle" fill="#20364b">22秒</text><text x="650" y="470" font-size="29" text-anchor="middle" fill="#20364b">22 − 12 ＝ 10秒</text><rect id="best" x="170" y="530" width="660" height="170" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="500" y="577" font-size="28" text-anchor="middle" fill="#20364b">1周ごとの記録を比べる</text><text x="500" y="633" font-size="33" text-anchor="middle" fill="#20364b">12秒 と 10秒 → ベスト10秒</text><text x="40" y="781" font-size="19" text-anchor="start" fill="#20364b">2周走り終わった時刻は開始から22秒。2周目だけの時間は22 − 12で10秒です。</text><text x="40" y="813" font-size="19" text-anchor="start" fill="#20364b">模式図：時間の横幅は12対10。以前に10秒より速い記録がない例です。</text></svg>