l="#20364b">＋ 周囲8マス</text><text x="760" y="407" font-size="26" text-anchor="middle" fill="#20364b">この9マスには</text><text x="760" y="452" font-size="28" text-anchor="middle" fill="#20364b">爆弾を置かない</text><text x="760" y="552" font-size="25" text-anchor="middle" fill="#20364b">外側の候補から</text><text x="760" y="595" font-size="29" text-anchor="middle" fill="#20364b">4個を選ぶ</text><text x="40" y="771" font-size="19" text-anchor="start" fill="#20364b">中央と周囲の9マスを除き、残る16マスから爆弾4個を無作為に選びます。</text><text x="40" y="803" font-size="19" text-anchor="start" fill="#20364b">拡大模式図：安全な場所と配置候補を表示。端や角を最初に開く場合は除くマスが減ります。</text></svg>