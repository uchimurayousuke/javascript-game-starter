<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="835" viewBox="0 0 1000 835" role="img" aria-labelledby="title desc" lang="ja"><title id="title">最初に開く場所と、その周りを安全にする</title><desc id="desc">最初に開く場所と、その周りを安全にする。5×5の中央を最初に開く例です。開く場所が決まってから爆弾を置きます。中央と周囲の9マスを除き、残る16マスから爆弾4個を無作為に選びます。拡大模式図：安全な場所と配置候補を表示。端や角を最初に開く場合は除くマスが減ります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="835" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">最初に開く場所と、その周りを安全にする</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">5×5の中央を最初に開く例です。開く場所が決まってから爆弾を置きます。</text><rect id="safe-0-0" x="100" y="200" width="95" height="95" rx="0" fill="#eef1f4" stroke="#7b91aa" stroke-width="3"/><text x="147.5" y="257" font-size="24" text-anchor="middle" fill="#20364b">候補</text><rect id="safe-1-0" x="195" y="200" width="95" height="95" rx="0" fill="#eef1f4" stroke="#7b91aa" stroke-width="3"/><text x="242.5" y="257" font-size="24" text-anchor="middle" fill="#20364b">候補</text><rect id="safe-2-0" x="290" y="200" width="95" height="95" rx="0" fill="#eef1f4" stroke="#7b91aa" stroke-width="3"/><text x="337.5" y="257" font-size="24" text-anchor="middle" fill="#20364b">候補</text><rect id="safe-3-0" x="385" y="200" width="95" height="95" rx="0" fill="#eef1f4" stroke="#7b91aa" stroke-width="3"/><text x="432.5" y="257" font-size="24" text-anchor="middle" fill="#20364b">候補</text><rect id="safe-4-0" x="480" y="200" width="95" height="95" rx="0" fill="#eef1f4" stroke="#7b91aa" stroke-width="3"/><text x="527.5" y="257" font-size="24" text-anchor="middle" fill="#20364b">候補</text><rect id="safe-0-1" x="100" y="295" width="95" height="95" rx="0" fill="#eef1f4" stroke="#7b91aa" stroke-width="3"/><text x="147.5" y="352" font-siz