<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc" lang="ja"><title id="title">加点の直し方：1回の接触で1点にする</title><desc id="desc">加点の直し方：1回の接触で1点にする。調査「得点」修正版 ／ SpaceでcoinYを300にして接触させます。コイン半径14・受け皿100×18と高さの差は等倍。表示位置は図用に移動しています。中央は処理途中の説明です。実際は同じupdate内で加点と位置のリセットを行います。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="830" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">加点の直し方：1回の接触で1点にする</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">調査「得点」修正版 ／ SpaceでcoinYを300にして接触させます。</text><rect id="s0" x="50" y="210" width="280" height="405" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="190" y="180" font-size="25" text-anchor="middle" fill="#20364b">接触前</text><circle id="coin0" cx="190" cy="280" r="14" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="222" y="288" font-size="23" text-anchor="start" fill="#20364b">y＝80</text><rect id="paddle0" x="140" y="514" width="100" height="18" rx="0" fill="#95c7ed" stroke="#28629e" stroke-width="3"/><rect id="score0" x="110" y="550" width="160" height="45" rx="5" fill="#fff" stroke="#708391" stroke-width="3"/><text x="190" y="582" font-size="29" text-anchor="middle" fill="#20364b">0点</text><path d="M335 410L355 410" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="s1" x="360" y="210" width="280" height="405" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="500" y="180" font-size="25" text-anchor="middle" fill="#20364b">接触して加点</text><circle id="coin1" cx="500" cy="500" r="14" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="532" y="508" font-size="23" text-anchor="start" fill="#20364b">y＝300</text><rect id="paddle1" x="450" y="514" width="100" height="18" rx="0" fill="#95c7ed" stroke="#28629e" stroke-width="3"/><rect id="score1" x="420" y="550" width="160" height="45" rx="5" fill="#fff" stroke="#708391" stroke-width="3"/><text x="500" y="582" font-size="29" text-anchor="middle" fill="#20364b">1点</text><path d="M645 410L665 410" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="s2" x="670" y="210" width="280" height="405" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="810" y="180" font-size="25" text-anchor="middle" fill="#20364b">離れた位置へ戻す</text><circle id="coin2" cx="810" cy="280" r="14" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="842" y="288" font-size="23" text-anchor="start" fill="#20364b">y＝80</text><rect id="paddle2" x="760" y="514" width="100" height="18" rx="0" fill="#95c7ed" stroke="#28629e" stroke-width="3"/><rect id="score2" x="730" y="550" width="160" height="45" rx="5" fill="#fff" stroke="#708391" stroke-width="3"/><text x="810" y="582" font-size="29" text-anchor="middle" fill="#20364b">1点</text><text x="500" y="670" font-size="27" text-anchor="middle" fill="#20364b">1点足したら coinY を80へ戻す。次の更新では増えない。</text><text x="40" y="766" font-size="19" text-anchor="start" fill="#20364b">コイン半径14・受け皿100×18と高さの差は等倍。表示位置は図用に移動しています。</text><text x="40" y="798" font-size="19" text-anchor="start" fill="#20364b">中央は処理途中の説明です。実際は同じupdate内で加点と位置のリセットを行います。</text></svg>