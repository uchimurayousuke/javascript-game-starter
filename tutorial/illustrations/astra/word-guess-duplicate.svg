<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc" lang="ja"><title id="title">答えの文字を1個ずつ使う。位置が合う文字から決める</title><desc id="desc">答えMOON、入力NOON。位置1から4を比べ、先に位置2と3のO、位置4のNを確定する。答えの文字の残りの数はM1・O2・N1からM1・O0・N0になる。先頭のNには残ったNを使えないため灰色で、残りにはないと判定。最終結果は先頭Nが灰、O・O・Nが緑。Nは答えの4番で使い切った。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1F3D5B"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="1130" rx="12" fill="#FFF8E8" stroke="#FFF8E8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#1F3D5B">答えの文字を1個ずつ使う。位置が合う文字から決める</text><text x="40" y="120" font-size="30" text-anchor="start" fill="#1F3D5B">① 同じ位置の文字を先に確定する</text><text x="335" y="175" font-size="26" text-anchor="middle" fill="#1F3D5B">位置1</text><rect x="240" y="200" width="190" height="90" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="335" y="263" font-size="49" text-anchor="middle" fill="#1F3D5B">M</text><rect x="240" y="340" width="190" height="90" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="335" y="402" font-size="49" text-anchor="middle" fill="#1F3D5B">N</text><text x="335" y="470" font-size="25" text-anchor="middle" fill="#1F3D5B">まだ決めない</text><text x="565" y="175" font-size="26" text-anchor="middle" fill="#1F3D5B">位置2</text><rect x="470" y="200" width="190" height="90" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="565" y="263" font-size="49" text-anchor="middle" fill="#1F3D5B">O</text><path d="M565 300 L565 326" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><rect x="470" y="340" width="190" height="90" rx="12" fill="#DCEFD9" stroke="#1F3D5B" stroke-width="2"/><text x="565" y="402" font-size="49" text-anchor="middle" fill="#1F3D5B">O</text><text x="565" y="470" font-size="25" text-anchor="middle" fill="#1F3D5B">位置も合う</text><text x="795" y="175" font-size="26" text-anchor="middle" fill="#1F3D5B">位置3</text><rect x="700" y="200" width="190" height="90" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="795" y="263" font-size="49" text-anchor="middle" fill="#1F3D5B">O</text><path d="M795 300 L795 326" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><rect x="700" y="340" width="190" height="90" rx="12" fill="#DCEFD9" stroke="#1F3D5B" stroke-width="2"/><text x="795" y="402" font-size="49" text-anchor="middle" fill="#1F3D5B">O</text><text x="795" y="470" font-size="25" text-anchor="middle" fill="#1F3D5B">位置も合う</text><text x="1025" y="175" font-size="26" text-anchor="middle" fill="#1F3D5B">位置4</text><rect x="930" y="200" width="190" height="90" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="1025" y="263" font-size="49" text-anchor="middle" fill="#1F3D5B">N</text><path d="M1025 300 L1025 326" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><rect x="930" y="340" width="190" height="90" rx="12" fill="#DCEFD9" stroke="#1F3D5B" stroke-width="2"/><text x="1025" y="402" font-size="49" text-anchor="middle" fill="#1F3D5B">N</text><text x="1025" y="470" font-size="25" text-anchor="middle" fill="#1F3D5B">位置も合う</text><text x="65" y="255" font-size="31" text-anchor="start" fill="#1F3D5B">答え</text><text x="65" y="395" font-size="31" text-anchor="start" fill="#1F3D5B">入力</text><text x="40" y="535" font-size="29" text-anchor="start" fill="#1F3D5B">答えの文字の残りの数：Oを2個、Nを1個使う</text><rect x="40" y="565" width="350" height="115" rx="12" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="2"/><text x="70" y="610" font-size="32" text-anchor="start" fill="#1F3D5B">M</text><text x="220" y="610" font-size="25" text-anchor="middle" fill="#1F3D5B">確定前 → 確定後</text><text x="220" y="657" font-size="32" text-anchor="middle" fill="#1F3D5B">1個 → 1個</text><rect x="425" y="565" width="350" height="115" rx="12" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="2"/><text x="455" y="610" font-size="32" text-anchor="start" fill="#1F3D5B">O</text><text x="605" y="610" font-size="25" text-anchor="middle" fill="#1F3D5B">確定前 → 確定後</text><text x="605" y="657" font-size="32" text-anchor="middle" fill="#1F3D5B">2個 → 0個</text><rect x="810" y="565" width="350" height="115" rx="12" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="2"/><text x="840" y="610" font-size="32" text-anchor="start" fill="#1F3D5B">N</text><text x="990" y="610" font-size="25" text-anchor="middle" fill="#1F3D5B">確定前 → 確定後</text><text x="990" y="657" font-size="32" text-anchor="middle" fill="#1F3D5B">1個 → 0個</text><text x="40" y="740" font-size="29" text-anchor="start" fill="#1F3D5B">② まだ決めていない位置1のNを、残った文字で調べる</text><text x="40" y="795" font-size="28" text-anchor="start" fill="#1F3D5B">残りはMが1個だけ。Nは0個なので、先頭のNは灰色。</text><text x="65" y="920" font-size="30" text-anchor="start" fill="#1F3D5B">最終結果</text><text x="335" y="842" font-size="25" text-anchor="middle" fill="#1F3D5B">位置1</text><rect x="240" y="860" width="190" height="145" rx="12" fill="#E0E5EA" stroke="#1F3D5B" stroke-width="2"/><text x="335" y="922" font-size="49" text-anchor="middle" fill="#1F3D5B">N</text><text x="335" y="978" font-size="25" text-anchor="middle" fill="#1F3D5B">残りにはない</text><text x="565" y="842" font-size="25" text-anchor="middle" fill="#1F3D5B">位置2</text><rect x="470" y="860" width="190" height="145" rx="12" fill="#DCEFD9" stroke="#1F3D5B" stroke-width="2"/><text x="565" y="922" font-size="49" text-anchor="middle" fill="#1F3D5B">O</text><text x="565" y="978" font-size="25" text-anchor="middle" fill="#1F3D5B">位置も合う</text><text x="795" y="842" font-size="25" text-anchor="middle" fill="#1F3D5B">位置3</text><rect x="700" y="860" width="190" height="145" rx="12" fill="#DCEFD9" stroke="#1F3D5B" stroke-width="2"/><text x="795" y="922" font-size="49" text-anchor="middle" fill="#1F3D5B">O</text><text x="795" y="978" font-size="25" text-anchor="middle" fill="#1F3D5B">位置も合う</text><text x="1025" y="842" font-size="25" text-anchor="middle" fill="#1F3D5B">位置4</text><rect x="930" y="860" width="190" height="145" rx="12" fill="#DCEFD9" stroke="#1F3D5B" stroke-width="2"/><text x="1025" y="922" font-size="49" text-anchor="middle" fill="#1F3D5B">N</text><text x="1025" y="978" font-size="25" text-anchor="middle" fill="#1F3D5B">位置も合う</text><text x="40" y="1060" font-size="27" text-anchor="start" fill="#1F3D5B">答えのNは4番で使い切ったため、1番のNにはもう使えません。</text><text x="40" y="1105" font-size="24" text-anchor="start" fill="#1F3D5B">黄色にするのは「別の場所に残っている」とき。今回の入力では黄色はありません。</text></svg>