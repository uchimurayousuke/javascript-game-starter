<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">中間地点：安全な戻り先を記録する</title><desc id="desc">中間地点：安全な戻り先を記録する。基本3 ／ x＝400を左から右へ通過すると、戻り先を420に更新。横の座標差は等倍。縦の位置と矢印は説明用です。記録するのは位置だけ。Rは最新の戻り先へ。Nは最初からやり直し、位置も記録も80に戻します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">中間地点：安全な戻り先を記録する</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ x＝400を左から右へ通過すると、戻り先を420に更新。</text><rect id="track" x="100" y="310" width="750" height="80" rx="0" fill="#e3edf5" stroke="#a9bdcf" stroke-width="3"/><rect id="player" x="135" y="335" width="30" height="30" rx="0" fill="#95c7ed" stroke="#28629e" stroke-width="3"/><text x="150" y="270" font-size="26" text-anchor="middle" fill="#20364b">開始 x＝80</text><path d="M470 285 L470 415" fill="none" stroke="#498765" stroke-width="5"/><text x="470" y="235" font-size="27" text-anchor="middle" fill="#20364b">右へ通過：x＝400</text><rect id="danger" x="690" y="310" width="60" height="80" rx="0" fill="#edb19e" stroke="#b4593b" stroke-width="3"/><text x="720" y="360" font-size="24" text-anchor="middle" fill="#20364b">危険</text><text x="720" y="270" font-size="26" text-anchor="middle" fill="#20364b">x＝620〜680</text><path d="M180 350L450 350" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M515 350L675 350" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><circle id="respawn" cx="490" cy="400" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M490 405 L490 440" fill="none" stroke="#34495e" stroke-width="3"/><text x="490" y="480" font-size="28" text-anchor="middle" fill="#20364b">記録する戻り先：x＝420</text><path d="M720 395 L720 555 L490 555 L490 495" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="630" font-size="27" text-anchor="middle" fill="#20364b">危険に入ったら、開始位置ではなく記録した位置へ。</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">横の座標差は等倍。縦の位置と矢印は説明用です。記録するのは位置だけ。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">Rは最新の戻り先へ。Nは最初からやり直し、位置も記録も80に戻します。</text></svg>