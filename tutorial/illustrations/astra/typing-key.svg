<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img" aria-labelledby="title desc" lang="ja"><title id="title">合っているキーなら、次の文字へ進む</title><desc id="desc">合っているキーなら、次の文字へ進む。最初に待っている文字は c。押したキーが同じかどうかで比べよう。cなら入力済みが0から1へ。xなら入力済みは0のまま、引き続きcを待ちます。模式図：どちらも入力前の同じ状態から試した、別々の例です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="765" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">合っているキーなら、次の文字へ進む</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">最初に待っている文字は c。押したキーが同じかどうかで比べよう。</text><rect id="key-case-c" x="40" y="150" width="550" height="480" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="315" y="202" font-size="26" text-anchor="middle" fill="#20364b">はじめ：入力済み0文字</text><text x="315" y="249" font-size="31" text-anchor="middle" fill="#20364b">次の文字は c</text><rect id="pressed-key-c" x="90" y="302" width="100" height="88" rx="12" fill="#fff0be" stroke="#aa7a20" stroke-width="3"/><text x="140" y="363" font-size="48" text-anchor="middle" fill="#20364b">c</text><text x="140" y="426" font-size="25" text-anchor="middle" fill="#20364b">押す</text><path d="M210 348L275 348" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="after-c-c" x="300" y="304" width="72" height="88" rx="0" fill="#dcefd5" stroke="#7b91aa" stroke-width="3"/><text x="336" y="364" font-size="47" text-anchor="middle" fill="#20364b">c</text><rect id="after-c-a" x="383" y="304" width="72" height="88" rx="0" fill="#fff0be" stroke="#7b91aa" stroke-width="3"/><text x="419" y="364" font-size="47" text-anchor="middle" fill="#20364b">a</text><rect id="after-c-t" x="466" y="304" width="72" height="88" rx="0" fill="#f0f3f7" stroke="#7b91aa" stroke-width="3"/><text x="502" y="364" font-size="47" text-anchor="middle" fill="#20364b">t</text><text x="421" y="433" font-size="25" text-anchor="middle" fill="#20364b">入力済み 1文字</text><text x="315" y="500" font-size="34" text-anchor="middle" fill="#20364b">1文字進む</text><text x="315" y="556" font-size="28" text-anchor="middle" fill="#20364b">次は a</text><rect id="key-case-x" x="640" y="150" width="550" height="480" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="915" y="202" font-size="26" text-anchor="middle" fill="#20364b">はじめ：入力済み0文字</text><text x="915" y="249" font-size="31" text-anchor="middle" fill="#20364b">次の文字は c</text><rect id="pressed-key-x" x="690" y="302" width="100" height="88" rx="12" fill="#fff0be" stroke="#aa7a20" stroke-width="3"/><text x="740" y="363" font-size="48" text-anchor="middle" fill="#20364b">x</text><text x="740" y="426" font-size="25" text-anchor="middle" fill="#20364b">押す</text><path d="M810 348L875 348" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="after-x-c" x="900" y="304" width="72" height="88" rx="0" fill="#fff0be" stroke="#7b91aa" stroke-width="3"/><text x="936" y="364" font-size="47" text-anchor="middle" fill="#20364b">c</text><rect id="after-x-a" x="983" y="304" width="72" height="88" rx="0" fill="#f0f3f7" stroke="#7b91aa" stroke-width="3"/><text x="1019" y="364" font-size="47" text-anchor="middle" fill="#20364b">a</text><rect id="after-x-t" x="1066" y="304" width="72" height="88" rx="0" fill="#f0f3f7" stroke="#7b91aa" stroke-width="3"/><text x="1102" y="364" font-size="47" text-anchor="middle" fill="#20364b">t</text><text x="1021" y="433" font-size="25" text-anchor="middle" fill="#20364b">入力済み 0文字</text><text x="915" y="500" font-size="34" text-anchor="middle" fill="#20364b">進まない</text><text x="915" y="556" font-size="28" text-anchor="middle" fill="#20364b">次は c のまま</text><text x="48" y="694" font-size="21" text-anchor="start" fill="#20364b">cなら入力済みが0から1へ。xなら入力済みは0のまま、引き続きcを待ちます。</text><text x="48" y="730" font-size="21" text-anchor="start" fill="#20364b">模式図：どちらも入力前の同じ状態から試した、別々の例です。</text></svg>