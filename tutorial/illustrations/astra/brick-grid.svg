<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc" lang="ja"><title id="title">ブロックの場所は「行」と「列」で決まる</title><desc id="desc">ブロックの場所は「行」と「列」で決まる。右へ1列で横に80、下へ1行で縦に30ずつ進む。ブロック1個は幅70・高さ20。すき間は横10・縦10です。模式図：実際の3行8列から2行3列を抜き出し、行間を広げています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="790" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">ブロックの場所は「行」と「列」で決まる</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">右へ1列で横に80、下へ1行で縦に30ずつ進む。</text><text x="70" y="168" font-size="27" text-anchor="start" fill="#20364b">列は右へ →（0から数える）</text><text x="355" y="218" font-size="29" text-anchor="middle" fill="#20364b">列0</text><text x="250" y="256" font-size="25" text-anchor="start" fill="#20364b">横80</text><rect id="brick-r0-c0" x="250" y="285" width="210" height="60" rx="0" fill="#ffe3c9" stroke="#aa6226" stroke-width="3"/><text x="355" y="325" font-size="25" text-anchor="middle" fill="#20364b">行0・列0</text><rect id="brick-r1-c0" x="250" y="435" width="210" height="60" rx="0" fill="#ffe3c9" stroke="#aa6226" stroke-width="3"/><text x="355" y="475" font-size="25" text-anchor="middle" fill="#20364b">行1・列0</text><text x="595" y="218" font-size="29" text-anchor="middle" fill="#20364b">列1</text><text x="490" y="256" font-size="25" text-anchor="start" fill="#20364b">横160</text><rect id="brick-r0-c1" x="490" y="285" width="210" height="60" rx="0" fill="#ffe3c9" stroke="#aa6226" stroke-width="3"/><text x="595" y="325" font-size="25" text-anchor="middle" fill="#20364b">行0・列1</text><rect id="brick-r1-c1" x="490" y="435" width="210" height="60" rx="0" fill="#ffe3c9" stroke="#aa6226" stroke-width="3"/><text x="595" y="475" font-size="25" text-anchor="middle" fill="#20364b">行1・列1</text><text x="835" y="218" font-size="29" text-anchor="middle" fill="#20364b">列2</text><text x="730" y="256" font-size="25" text-anchor="start" fill="#20364b">横240</text><rect id="brick-r0-c2" x="730" y="285" width="210" height="60" rx="0" fill="#ffe3c9" stroke="#aa6226" stroke-width="3"/><text x="835" y="325" font-size="25" text-anchor="middle" fill="#20364b">行0・列2</text><rect id="brick-r1-c2" x="730" y="435" width="210" height="60" rx="0" fill="#ffbe78" stroke="#aa6226" stroke-width="3"/><text x="835" y="475" font-size="25" text-anchor="middle" fill="#20364b">行1・列2</text><text x="65" y="318" font-size="29" text-anchor="start" fill="#20364b">行0</text><text x="65" y="353" font-size="25" text-anchor="start" fill="#20364b">縦55</text><text x="65" y="468" font-size="29" text-anchor="start" fill="#20364b">行1</text><text x="65" y="503" font-size="25" text-anchor="start" fill="#20364b">縦85</text><text x="600" y="560" font-size="31" text-anchor="middle" fill="#20364b">注目：行1・列2の左上は、横240・縦85</text><text x="600" y="610" font-size="29" text-anchor="middle" fill="#20364b">横：80 ＋ 2 × 80 ＝ 240</text><text x="600" y="655" font-size="29" text-anchor="middle" fill="#20364b">縦：55 ＋ 1 × 30 ＝ 85</text><text x="48" y="719" font-size="21" text-anchor="start" fill="#20364b">ブロック1個は幅70・高さ20。すき間は横10・縦10です。</text><text x="48" y="755" font-size="21" text-anchor="start" fill="#20364b">模式図：実際の3行8列から2行3列を抜き出し、行間を広げています。</text></svg>