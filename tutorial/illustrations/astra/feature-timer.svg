<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" lang="ja"><title id="title">10秒から経過時間を引いて残り時間を求める</title><desc id="desc">開始から2.5秒では残り7.5秒、画面には切り上げて8。経過10秒ちょうどで残り0、時間切れ。10秒を超えても残りは0。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="850" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">10秒から経過時間を引いて残り時間を求める</text><text x="40" y="110" font-size="31" text-anchor="start" fill="#20364b">残り ＝ max(0, 10 − 経過した秒数)</text><rect x="40" y="165" width="340" height="295" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="210" y="210" font-size="29" text-anchor="middle" fill="#20364b">開始</text><text x="65" y="270" font-size="29" text-anchor="start" fill="#20364b">経過 0秒</text><text x="65" y="335" font-size="31" text-anchor="start" fill="#20364b">残り 10秒</text><text x="65" y="415" font-size="29" text-anchor="start" fill="#20364b">画面の表示：10</text><rect x="430" y="165" width="340" height="295" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="600" y="210" font-size="29" text-anchor="middle" fill="#20364b">途中</text><text x="455" y="270" font-size="29" text-anchor="start" fill="#20364b">経過 2.5秒</text><text x="455" y="335" font-size="31" text-anchor="start" fill="#20364b">残り 7.5秒</text><text x="455" y="415" font-size="29" text-anchor="start" fill="#20364b">画面の表示：8</text><rect x="820" y="165" width="340" height="295" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="990" y="210" font-size="29" text-anchor="middle" fill="#20364b">期限ちょうど</text><text x="845" y="270" font-size="29" text-anchor="start" fill="#20364b">経過 10秒</text><text x="845" y="335" font-size="31" text-anchor="start" fill="#20364b">残り 0秒</text><text x="845" y="415" font-size="29" text-anchor="start" fill="#20364b">画面の表示：0</text><path d="M60 535 L1140 535" fill="none" stroke="#20364b" stroke-width="3"/><path d="M60 520 L60 550" fill="none" stroke="#20364b" stroke-width="3"/><text x="60" y="590" font-size="26" text-anchor="middle" fill="#20364b">0秒</text><path d="M330 520 L330 550" fill="none" stroke="#20364b" stroke-width="3"/><text x="330" y="590" font-size="26" text-anchor="middle" fill="#20364b">2.5秒</text><path d="M1140 520 L1140 550" fill="none" stroke="#20364b" stroke-width="3"/><text x="1140" y="590" font-size="26" text-anchor="middle" fill="#20364b">10秒</text><text x="650" y="505" font-size="27" text-anchor="middle" fill="#20364b">開始からの経過時間</text><text x="40" y="655" font-size="25" text-anchor="start" fill="#20364b">7.5秒は切り上げて8と表示。時間切れの判定には残り時間を使います。</text><text x="40" y="710" font-size="27" text-anchor="start" fill="#20364b">10秒で0になり終了。10秒を超えてもマイナスにはしません。</text><text x="40" y="765" font-size="25" text-anchor="start" fill="#20364b">別タブにいる間も経過を含め、戻った次の更新で時計から計算します。</text><text x="40" y="820" font-size="23" text-anchor="start" fill="#20364b">Rは開始時刻を記録し直し、残り10秒へ。時間軸は同じ縮尺です。</text></svg>