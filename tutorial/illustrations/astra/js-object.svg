<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc" lang="ja"><title id="title">オブジェクト：名前を指定して、中の値を変える</title><desc id="desc">const player={x:100,hp:3}にplayer.x+=20を実行する。xは120、hpは3。const変数playerを別の値へ再代入せず、同じオブジェクトの中身を変更する。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="810" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">オブジェクト：名前を指定して、中の値を変える</text><text x="40" y="110" font-size="31" text-anchor="start" fill="#20364b">const player = { x: 100, hp: 3 };</text><rect x="60" y="160" width="430" height="300" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="85" y="205" font-size="29" text-anchor="start" fill="#20364b">player：変更前</text><rect x="85" y="235" width="380" height="80" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="110" y="287" font-size="31" text-anchor="start" fill="#20364b">x</text><text x="355" y="287" font-size="34" text-anchor="middle" fill="#20364b">100</text><rect x="85" y="340" width="380" height="80" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="110" y="392" font-size="31" text-anchor="start" fill="#20364b">hp</text><text x="355" y="392" font-size="34" text-anchor="middle" fill="#20364b">3</text><rect x="710" y="160" width="430" height="300" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="735" y="205" font-size="29" text-anchor="start" fill="#20364b">player：変更後</text><rect x="735" y="235" width="380" height="80" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="760" y="287" font-size="31" text-anchor="start" fill="#20364b">x</text><text x="1005" y="287" font-size="34" text-anchor="middle" fill="#20364b">120</text><rect x="735" y="340" width="380" height="80" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="760" y="392" font-size="31" text-anchor="start" fill="#20364b">hp</text><text x="1005" y="392" font-size="34" text-anchor="middle" fill="#20364b">3</text><path d="M510 300 L690 300" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="265" font-size="26" text-anchor="middle" fill="#20364b">xに＋20</text><rect x="60" y="505" width="1080" height="115" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="85" y="550" font-size="31" text-anchor="start" fill="#20364b">player.x += 20 → 100 + 20 = 120</text><text x="85" y="595" font-size="27" text-anchor="start" fill="#20364b">player.hp は変更していないので3のまま。</text><text x="40" y="680" font-size="30" text-anchor="start" fill="#20364b">console.log(player.x, player.hp) → 120  3</text><text x="40" y="750" font-size="24" text-anchor="start" fill="#20364b">constでも中身は変更できます。player自体を別の値へ再代入していません。</text></svg>