<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">タクティクス：番を交代しよう</title><desc id="desc">タクティクス：番を交代しよう。基本5 ／ 味方の操作が終わったら Enter。操作と処理の順番を表した模式図です。移動と攻撃の順番は自由。敵を全員倒せば勝利。味方が全員倒されるとゲームオーバー。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">タクティクス：番を交代しよう</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本5 ／ 味方の操作が終わったら Enter。</text><rect id="ally" x="70" y="155" width="860" height="150" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="100" y="205" font-size="30" text-anchor="start" fill="#20364b">1 味方の番</text><text x="100" y="252" font-size="28" text-anchor="start" fill="#20364b">各味方は「移動1回」と「攻撃1回」ができる</text><text x="100" y="287" font-size="24" text-anchor="start" fill="#20364b">隣の敵への攻撃：HPを2減らす</text><path d="M500 310L500 365" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="345" font-size="26" text-anchor="start" fill="#20364b">Enter</text><rect id="enemy" x="70" y="375" width="860" height="125" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="100" y="420" font-size="30" text-anchor="start" fill="#20364b">2 敵の番</text><text x="100" y="465" font-size="28" text-anchor="start" fill="#20364b">各敵が近づき、隣の味方がいれば攻撃する</text><path d="M500 505L500 560" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="reset" x="70" y="570" width="860" height="100" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="100" y="610" font-size="30" text-anchor="start" fill="#20364b">3 次の味方の番</text><text x="100" y="650" font-size="26" text-anchor="start" fill="#20364b">移動・攻撃が再び可能に。味方を選び直そう。</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">操作と処理の順番を表した模式図です。移動と攻撃の順番は自由。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">敵を全員倒せば勝利。味方が全員倒されるとゲームオーバー。</text></svg>