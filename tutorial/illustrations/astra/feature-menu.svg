<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">メニュー：選んだ画面に切り替える</title><desc id="desc">メニュー：選んだ画面に切り替える。基本3 ／ メニューにいるときだけ、項目を選べます。画面と状態の関係を示す模式図。実際のボタン位置・大きさとは異なります。「はじめる」はゲームへ、「遊び方」は説明へ。Escで同じメニューへ戻ります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">メニュー：選んだ画面に切り替える</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ メニューにいるときだけ、項目を選べます。</text><rect id="menu" x="60" y="270" width="330" height="200" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="225.0" y="315" font-size="29" text-anchor="middle" fill="#20364b">メニュー</text><text x="225.0" y="358" font-size="23" text-anchor="middle" fill="#20364b">↑↓で選び Enter</text><text x="225" y="405" font-size="23" text-anchor="middle" fill="#20364b">または項目をクリック</text><rect id="game" x="620" y="170" width="320" height="125" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="780.0" y="215" font-size="29" text-anchor="middle" fill="#20364b">ゲーム</text><text x="780.0" y="258" font-size="23" text-anchor="middle" fill="#20364b">state = game</text><rect id="help" x="620" y="465" width="320" height="125" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="780.0" y="510" font-size="29" text-anchor="middle" fill="#20364b">遊び方</text><text x="780.0" y="553" font-size="23" text-anchor="middle" fill="#20364b">state = help</text><path d="M390 305 L480 305 L480 230 L615 230" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="485" y="205" font-size="24" text-anchor="start" fill="#20364b">はじめる</text><path d="M390 435 L480 435 L480 525 L615 525" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="485" y="565" font-size="24" text-anchor="start" fill="#20364b">遊び方</text><path d="M780 300 L780 365 L395 365" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="345" font-size="24" text-anchor="middle" fill="#20364b">Escで戻る</text><path d="M780 590 L780 640 L225 640 L225 475" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="625" font-size="24" text-anchor="middle" fill="#20364b">Escで戻る</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">画面と状態の関係を示す模式図。実際のボタン位置・大きさとは異なります。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">「はじめる」はゲームへ、「遊び方」は説明へ。Escで同じメニューへ戻ります。</text></svg>