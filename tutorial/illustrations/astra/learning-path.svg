<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" role="img" aria-labelledby="title desc" lang="ja"><title id="title">学ぶ順番：作りたいものへ進もう</title><desc id="desc">学ぶ順番：作りたいものへ進もう。まずは1本作る。そのあとは、興味と必要に合わせて選びます。学習経路を表す模式図です。A・B・Cは作例の選択肢を表す記号です。すべての作例・共通機能を、順番に読む必要はありません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="860" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">学ぶ順番：作りたいものへ進もう</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">まずは1本作る。そのあとは、興味と必要に合わせて選びます。</text><rect id="entry" x="55" y="165" width="240" height="220" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="175.0" y="210" font-size="29" text-anchor="middle" fill="#20364b">学びの入口</text><text x="175.0" y="253" font-size="23" text-anchor="middle" fill="#20364b">準備・操作を確認</text><path d="M120 290 L175 305 L175 355 L120 340 Z M175 305 L230 290 L230 340 L175 355" fill="none" stroke="#28629e" stroke-width="3"/><rect id="coin" x="365" y="165" width="270" height="220" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="500.0" y="210" font-size="29" text-anchor="middle" fill="#20364b">コインキャッチ</text><text x="500.0" y="253" font-size="23" text-anchor="middle" fill="#20364b">一緒に作ってみる</text><circle id="coin-icon" cx="500" cy="310" r="19" fill="#ffe29a" stroke="#936315" stroke-width="3"/><rect id="paddle-icon" x="455" y="350" width="90" height="12" rx="0" fill="#95c7ed" stroke="#28629e" stroke-width="3"/><rect id="choice" x="705" y="165" width="240" height="220" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="825.0" y="210" font-size="29" text-anchor="middle" fill="#20364b">興味ある作例</text><text x="825.0" y="253" font-size="23" text-anchor="middle" fill="#20364b">好きなものを選ぶ</text><rect id="example0" x="735" y="295" width="50" height="55" rx="5" fill="#d6e9ff" stroke="#708391" stroke-width="3"/><text x="760" y="332" font-size="27" text-anchor="middle" fill="#20364b">A</text><rect id="example1" x="800" y="295" width="50" height="55" rx="5" fill="#d4efde" stroke="#708391" stroke-width="3"/><text x="825" y="332" font-size="27" text-anchor="middle" fill="#20364b">B</text><rect id="example2" x="865" y="295" width="50" height="55" rx="5" fill="#ffe29a" stroke="#708391" stroke-width="3"/><text x="890" y="332" font-size="27" text-anchor="middle" fill="#20364b">C</text><path d="M300 260L360 260" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 260L700 260" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="own" x="625" y="495" width="320" height="220" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="785.0" y="540" font-size="29" text-anchor="middle" fill="#20364b">自分のゲーム</text><text x="785.0" y="583" font-size="23" text-anchor="middle" fill="#20364b">小さく作って育てる</text><rect id="own-screen" x="735" y="610" width="100" height="60" rx="5" fill="#fff" stroke="#28629e" stroke-width="3"/><circle id="own-ball" cx="785" cy="635" r="9" fill="#ffe29a" stroke="#936315" stroke-width="3"/><rect id="own-paddle" x="765" y="655" width="40" height="7" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><path d="M825 390L825 490" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="features" x="55" y="495" width="320" height="220" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="215.0" y="540" font-size="29" text-anchor="middle" fill="#20364b">共通機能を参照</text><text x="215.0" y="583" font-size="23" text-anchor="middle" fill="#20364b">必要なものだけ選ぶ</text><rect id="feature0" x="78" y="615" width="80" height="55" rx="5" fill="#fff" stroke="#708391" stroke-width="3"/><text x="118" y="650" font-size="24" text-anchor="middle" fill="#20364b">画像</text><rect id="feature1" x="168" y="615" width="80" height="55" rx="5" fill="#fff" stroke="#708391" stroke-width="3"/><text x="208" y="650" font-size="24" text-anchor="middle" fill="#20364b">音</text><rect id="feature2" x="258" y="615" width="80" height="55" rx="5" fill="#fff" stroke="#708391" stroke-width="3"/><text x="298" y="650" font-size="24" text-anchor="middle" fill="#20364b">保存</text><path d="M615 565L385 565" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="540" font-size="23" text-anchor="middle" fill="#20364b">必要なときに見る</text><path d="M385 665L615 665" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="640" font-size="23" text-anchor="middle" fill="#20364b">自作に組み込む</text><text x="40" y="796" font-size="19" text-anchor="start" fill="#20364b">学習経路を表す模式図です。A・B・Cは作例の選択肢を表す記号です。</text><text x="40" y="828" font-size="19" text-anchor="start" fill="#20364b">すべての作例・共通機能を、順番に読む必要はありません。</text></svg>