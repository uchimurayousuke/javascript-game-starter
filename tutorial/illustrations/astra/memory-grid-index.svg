<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc" lang="ja"><title id="title">番号5のカード：行と列から、左上の場所を決める</title><desc id="desc">神経衰弱基本1の8枚を4列2行に並べる。番号5は5を4で割った余り1が列、商を切り捨てた1が行。カード左上はx280、y220。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="840" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#20364b">番号5のカード：行と列から、左上の場所を決める</text><text x="40" y="105" font-size="25" text-anchor="start" fill="#20364b">神経衰弱 基本1 ／ 番号・行・列は0から。カードはまだ操作しません。</text><text x="55" y="240" font-size="24" text-anchor="start" fill="#20364b">行0</text><text x="170" y="160" font-size="24" text-anchor="middle" fill="#20364b">列0</text><rect x="105" y="180" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="170" y="245" font-size="27" text-anchor="middle" fill="#20364b">番号0</text><text x="320" y="160" font-size="24" text-anchor="middle" fill="#20364b">列1</text><rect x="255" y="180" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="320" y="245" font-size="27" text-anchor="middle" fill="#20364b">番号1</text><text x="470" y="160" font-size="24" text-anchor="middle" fill="#20364b">列2</text><rect x="405" y="180" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="470" y="245" font-size="27" text-anchor="middle" fill="#20364b">番号2</text><text x="620" y="160" font-size="24" text-anchor="middle" fill="#20364b">列3</text><rect x="555" y="180" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="620" y="245" font-size="27" text-anchor="middle" fill="#20364b">番号3</text><text x="55" y="385" font-size="24" text-anchor="start" fill="#20364b">行1</text><rect x="105" y="325" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="170" y="390" font-size="27" text-anchor="middle" fill="#20364b">番号4</text><rect x="255" y="325" width="130" height="125" rx="12" fill="#ffdfac" stroke="#657e91" stroke-width="2"/><text x="320" y="390" font-size="27" text-anchor="middle" fill="#20364b">番号5</text><rect x="405" y="325" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="470" y="390" font-size="27" text-anchor="middle" fill="#20364b">番号6</text><rect x="555" y="325" width="130" height="125" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><text x="620" y="390" font-size="27" text-anchor="middle" fill="#20364b">番号7</text><rect x="750" y="175" width="410" height="285" rx="12" fill="#e9f3e9" stroke="#657e91" stroke-width="2"/><text x="775" y="220" font-size="28" text-anchor="start" fill="#20364b">番号5を調べる</text><text x="775" y="270" font-size="25" text-anchor="start" fill="#20364b">5 ÷ 4＝1 あまり1</text><text x="775" y="320" font-size="27" text-anchor="start" fill="#20364b">列：5 % 4＝1</text><text x="775" y="370" font-size="25" text-anchor="start" fill="#20364b">行：floor(5 / 4)＝1</text><text x="775" y="425" font-size="25" text-anchor="start" fill="#20364b">2行目・左から2枚目</text><rect x="40" y="500" width="1120" height="250" rx="12" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><rect x="80" y="545" width="130" height="143" rx="12" fill="#ffdfac" stroke="#657e91" stroke-width="2"/><circle cx="80" cy="545" r="6" fill="#20364b"/><path d="M85 540 L260 540" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="285" y="550" font-size="29" text-anchor="start" fill="#20364b">左上の点が (x,y)＝(280,220)</text><text x="285" y="610" font-size="26" text-anchor="start" fill="#20364b">x＝左の余白160 ＋ 列1 × 間隔120＝280</text><text x="285" y="670" font-size="26" text-anchor="start" fill="#20364b">y＝上の余白90 ＋ 行1 × 間隔130＝220</text><text x="95" y="610" font-size="26" text-anchor="start" fill="#20364b">番号5</text><text x="65" y="725" font-size="22" text-anchor="start" fill="#20364b">幅100・高さ110</text><text x="40" y="800" font-size="22" text-anchor="start" fill="#20364b">上段は番号の配置図。下段の1枚は1.3倍。数字は実ゲームの座標と寸法です。</text></svg>