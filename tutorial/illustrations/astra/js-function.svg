<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc" lang="ja"><title id="title">関数：渡した2と3から、5を返す</title><desc id="desc">add(2,3)の2と3が仮引数aとbへ入り、return a+bが5を返す。戻り値5がresultに入り、Consoleに5が出る。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="830" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">関数：渡した2と3から、5を返す</text><text x="40" y="110" font-size="31" text-anchor="start" fill="#20364b">const result = add(2, 3);</text><rect x="60" y="160" width="330" height="125" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="82" y="202" font-size="26" text-anchor="start" fill="#20364b">呼び出しで渡す値</text><text x="82" y="255" font-size="30" text-anchor="start" fill="#20364b">2 と 3</text><path d="M410 225 L470 225" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="490" y="150" width="650" height="345" rx="12" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="520" y="200" font-size="31" text-anchor="start" fill="#20364b">function add(a, b)</text><rect x="520" y="235" width="260" height="110" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="542" y="277" font-size="26" text-anchor="start" fill="#20364b">a に入る</text><text x="542" y="330" font-size="30" text-anchor="start" fill="#20364b">2</text><rect x="840" y="235" width="260" height="110" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="862" y="277" font-size="26" text-anchor="start" fill="#20364b">b に入る</text><text x="862" y="330" font-size="30" text-anchor="start" fill="#20364b">3</text><text x="520" y="415" font-size="31" text-anchor="start" fill="#20364b">return a + b;</text><text x="840" y="415" font-size="29" text-anchor="start" fill="#20364b">2 + 3 = 5</text><text x="520" y="465" font-size="25" text-anchor="start" fill="#20364b">return で、呼び出した場所へ返す</text><path d="M815 510 L815 560" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="580" width="490" height="125" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="672" y="622" font-size="26" text-anchor="start" fill="#20364b">result が受け取る戻り値</text><text x="672" y="675" font-size="30" text-anchor="start" fill="#20364b">5</text><rect x="60" y="580" width="490" height="125" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="82" y="622" font-size="26" text-anchor="start" fill="#20364b">console.log(result)</text><text x="82" y="675" font-size="30" text-anchor="start" fill="#20364b">出力：5</text><path d="M635 640 L570 640" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="775" font-size="24" text-anchor="start" fill="#20364b">2はaへ、3はbへ。同じ関数でも、渡す値によって計算する値が変わります。</text></svg>