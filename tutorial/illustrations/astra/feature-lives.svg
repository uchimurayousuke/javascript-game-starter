<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">残り0で終了。回復できるのはプレイ中だけ</title><desc id="desc">残り3からXを3回押すと2、1、0。0で終了しHやXは無視。プレイ中のHは1回復し最大3。終了後はRで3に戻る。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="800" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">残り0で終了。回復できるのはプレイ中だけ</text><text x="40" y="110" font-size="28" text-anchor="start" fill="#20364b">Xで1減らす。Hで1回復。ただし最大3回まで。</text><rect x="55" y="180" width="220" height="220" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="165" y="225" font-size="27" text-anchor="middle" fill="#20364b">残り回数</text><text x="165" y="315" font-size="57" text-anchor="middle" fill="#20364b">3</text><text x="165" y="370" font-size="27" text-anchor="middle" fill="#20364b">プレイ中</text><text x="310" y="215" font-size="28" text-anchor="middle" fill="#20364b">X</text><path d="M285 290 L335 290" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="345" y="180" width="220" height="220" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="455" y="225" font-size="27" text-anchor="middle" fill="#20364b">残り回数</text><text x="455" y="315" font-size="57" text-anchor="middle" fill="#20364b">2</text><text x="455" y="370" font-size="27" text-anchor="middle" fill="#20364b">プレイ中</text><text x="600" y="215" font-size="28" text-anchor="middle" fill="#20364b">X</text><path d="M575 290 L625 290" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="635" y="180" width="220" height="220" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="745" y="225" font-size="27" text-anchor="middle" fill="#20364b">残り回数</text><text x="745" y="315" font-size="57" text-anchor="middle" fill="#20364b">1</text><text x="745" y="370" font-size="27" text-anchor="middle" fill="#20364b">プレイ中</text><text x="890" y="215" font-size="28" text-anchor="middle" fill="#20364b">X</text><path d="M865 290 L915 290" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="925" y="180" width="220" height="220" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="1035" y="225" font-size="27" text-anchor="middle" fill="#20364b">残り回数</text><text x="1035" y="315" font-size="57" text-anchor="middle" fill="#20364b">0</text><text x="1035" y="370" font-size="27" text-anchor="middle" fill="#20364b">終了</text><rect x="55" y="455" width="500" height="165" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="80" y="505" font-size="29" text-anchor="start" fill="#20364b">プレイ中にH</text><text x="80" y="565" font-size="34" text-anchor="start" fill="#20364b">2 → 3 ／ 3 → 3</text><rect x="620" y="455" width="515" height="165" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="645" y="505" font-size="29" text-anchor="start" fill="#20364b">終了後にHやX</text><text x="645" y="565" font-size="29" text-anchor="start" fill="#20364b">0のまま。再開しない。</text><text x="40" y="685" font-size="30" text-anchor="start" fill="#20364b">Rで最初から：残り3、状態playingに戻す。</text><text x="40" y="750" font-size="25" text-anchor="start" fill="#20364b">回数を0未満にせず、プレイ中の回復でも3を超えません。</text></svg>