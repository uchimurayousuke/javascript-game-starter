<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="895" viewBox="0 0 1200 895" role="img" aria-labelledby="title desc" lang="ja"><title id="title">チェックポイントを順番に通って、1周する</title><desc id="desc">チェックポイントを順番に通って、1周する。説明用の四隅です。横660・縦110から、右下 → 左下 → 左上の順に通ります。番号は通過順です。途中の点を飛ばし、ゴールの近くを往復するだけでは周回は増えません。模式図：数字は各点の中心。次の点の中心から45以内に入ると通過し、2周で終了します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="895" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">チェックポイントを順番に通って、1周する</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">説明用の四隅です。横660・縦110から、右下 → 左下 → 左上の順に通ります。</text><path d="M260 280H940V590H260Z" fill="none" stroke="#d7e1e9" stroke-width="65"/><path d="M260 280H940V590H260Z" fill="none" stroke="#93a9bb" stroke-width="3" stroke-dasharray="8 6"/><circle id="checkpoint-1" cx="940" cy="280" r="27" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="940" y="290" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="1015" y="205" font-size="27" text-anchor="middle" fill="#20364b">通る順 1</text><text x="1015" y="242" font-size="24" text-anchor="middle" fill="#20364b">横660・縦110</text><circle id="checkpoint-2" cx="940" cy="590" r="27" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="940" y="600" font-size="29" text-anchor="middle" fill="#20364b">2</text><text x="1015" y="690" font-size="27" text-anchor="middle" fill="#20364b">通る順 2</text><text x="1015" y="727" font-size="24" text-anchor="middle" fill="#20364b">横660・縦350</text><circle id="checkpoint-3" cx="260" cy="590" r="27" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="260" y="600" font-size="29" text-anchor="middle" fill="#20364b">3</text><text x="185" y="690" font-size="27" text-anchor="middle" fill="#20364b">通る順 3</text><text x="185" y="727" font-size="24" text-anchor="middle" fill="#20364b">横140・縦350</text><circle id="checkpoint-4" cx="260" cy="280" r="27" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="260" y="290" font-size="29" text-anchor="middle" fill="#20364b">4</text><text x="185" y="205" font-size="27" text-anchor="middle" fill="#20364b">通る順 4</text><text x="185" y="242" font-size="24" text-anchor="middle" fill="#20364b">横140・縦110</text><path d="M480 280L690 280" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M940 375L940 475" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M710 590L500 590" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M260 485L260 385" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="race-car" x="370" y="255" width="80" height="50" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><rect id="race-car-window" x="415" y="263" width="18" height="34" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><path d="M385 248H403 M430 248H445 M385 312H403 M430 312H445" fill="none" stroke="#34495e" stroke-width="6"/><circle id="race-car-center" cx="410" cy="280" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="600" y="397" font-size="35" text-anchor="middle" fill="#20364b">1 → 2 → 3 → 4</text><text x="600" y="447" font-size="31" text-anchor="middle" fill="#20364b">順番どおりに通る</text><text x="600" y="500" font-size="25" text-anchor="middle" fill="#20364b">ゴール付近だけの往復では ×</text><text x="48" y="824" font-size="21" text-anchor="start" fill="#20364b">番号は通過順です。途中の点を飛ばし、ゴールの近くを往復するだけでは周回は増えません。</text><text x="48" y="860" font-size="21" text-anchor="start" fill="#20364b">模式図：数字は各点の中心。次の点の中心から45以内に入ると通過し、2周で終了します。</text></svg>