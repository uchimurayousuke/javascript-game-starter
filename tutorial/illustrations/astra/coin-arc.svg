<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" role="img" aria-labelledby="title desc" lang="ja"><title id="title">円は、右から時計回りに描く</title><desc id="desc">円は、右から時計回りに描く。Canvas の円：右がスタート。下 → 左 → 上 → 右へ。π（パイ）は角度を表すときにも使う数。半周がπ、1周が2π。模式図：矢印で円を描く向きを示しています。下端では左、左端では上、上端では右、右端では下へ進みます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="745" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">円は、右から時計回りに描く</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">Canvas の円：右がスタート。下 → 左 → 上 → 右へ。</text><rect id="half-panel" x="40" y="145" width="540" height="485" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="full-panel" x="620" y="145" width="540" height="485" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><circle id="半周-circle" cx="310" cy="360" r="135" fill="#fff7dc" stroke="#d2b66e" stroke-width="3"/><path d="M175 360H445 M310 225V495" fill="none" stroke="#a6b5c3" stroke-width="2" stroke-dasharray="8 6"/><circle id="半周-center" cx="310" cy="360" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="310" y="200" font-size="30" text-anchor="middle" fill="#20364b">半周</text><text x="465" y="351" font-size="24" text-anchor="start" fill="#20364b">0</text><text x="155" y="350" font-size="26" text-anchor="end" fill="#20364b">π</text><text x="310" y="535" font-size="25" text-anchor="middle" fill="#20364b">π/2 ＝ 90度</text><circle id="1周-circle" cx="890" cy="360" r="135" fill="#fff7dc" stroke="#d2b66e" stroke-width="3"/><path d="M755 360H1025 M890 225V495" fill="none" stroke="#a6b5c3" stroke-width="2" stroke-dasharray="8 6"/><circle id="1周-center" cx="890" cy="360" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="890" y="200" font-size="30" text-anchor="middle" fill="#20364b">1周</text><text x="1045" y="351" font-size="24" text-anchor="start" fill="#20364b">0</text><text x="735" y="350" font-size="26" text-anchor="end" fill="#20364b">π</text><text x="890" y="535" font-size="25" text-anchor="middle" fill="#20364b">π/2 ＝ 90度</text><path d="M445 360 A135 135 0 0 1 175 360" fill="none" stroke="#9a6200" stroke-width="7"/><text x="310" y="410" font-size="25" text-anchor="middle" fill="#20364b">下を通る</text><text x="310" y="589" font-size="34" text-anchor="middle" fill="#20364b">180度 ＝ π</text><path d="M1025 360 A135 135 0 0 1 755 360 A135 135 0 0 1 1025 360" fill="none" stroke="#9a6200" stroke-width="7"/><text x="890" y="295" font-size="24" text-anchor="middle" fill="#20364b">上も通って</text><text x="890" y="330" font-size="24" text-anchor="middle" fill="#20364b">右へ戻る</text><text x="1045" y="391" font-size="25" text-anchor="start" fill="#20364b">2π</text><text x="890" y="589" font-size="34" text-anchor="middle" fill="#20364b">360度 ＝ 2π</text><text x="48" y="674" font-size="21" text-anchor="start" fill="#20364b">π（パイ）は角度を表すときにも使う数。半周がπ、1周が2π。</text><text x="48" y="710" font-size="21" text-anchor="start" fill="#20364b">模式図：矢印で円を描く向きを示しています。</text><g fill="#9a6200" stroke="none" aria-label="円周上の進行方向"><path id="half-bottom-left-arrow" d="M295 495 L318 483 L318 507 Z"/><path id="half-left-up-arrow" d="M175 350 L163 373 L187 373 Z"/><path id="full-bottom-left-arrow" d="M875 495 L898 483 L898 507 Z"/><path id="full-top-right-arrow" d="M905 225 L882 213 L882 237 Z"/><path id="full-right-down-arrow" d="M1025 375 L1013 352 L1037 352 Z"/></g></svg>