<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">ステージ選択：クリアで次を開く</title><desc id="desc">ステージ選択：クリアで次を開く。基本3 ／ ←→で選び、開いているステージをEnterで開始。ステージ1を初めてクリアした前後の模式図。選択枠は省略しています。鍵のステージも選べますが、Enterを押しても開始しません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">ステージ選択：クリアで次を開く</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ ←→で選び、開いているステージをEnterで開始。</text><text x="80" y="180" font-size="29" text-anchor="start" fill="#20364b">最初：ステージ1だけ遊べる</text><rect id="before0" x="70" y="210" width="270" height="130" rx="16" fill="#d4efde" stroke="#a9bdcf" stroke-width="3"/><text x="205.0" y="255" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="205.0" y="298" font-size="23" text-anchor="middle" fill="#20364b">遊べる</text><rect id="before1" x="380" y="210" width="270" height="130" rx="16" fill="#e4e7ec" stroke="#a9bdcf" stroke-width="3"/><text x="515.0" y="255" font-size="29" text-anchor="middle" fill="#20364b">2</text><text x="515.0" y="298" font-size="23" text-anchor="middle" fill="#20364b">鍵：まだ遊べない</text><rect id="before2" x="690" y="210" width="270" height="130" rx="16" fill="#e4e7ec" stroke="#a9bdcf" stroke-width="3"/><text x="825.0" y="255" font-size="29" text-anchor="middle" fill="#20364b">3</text><text x="825.0" y="298" font-size="23" text-anchor="middle" fill="#20364b">鍵：まだ遊べない</text><path d="M500 350L500 440" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="535" y="405" font-size="26" text-anchor="start" fill="#20364b">1をSpaceでクリア</text><text x="80" y="480" font-size="29" text-anchor="start" fill="#20364b">Escで選択画面へ戻ったあと</text><rect id="after0" x="70" y="510" width="270" height="130" rx="16" fill="#d4efde" stroke="#a9bdcf" stroke-width="3"/><text x="205.0" y="555" font-size="29" text-anchor="middle" fill="#20364b">1</text><text x="205.0" y="598" font-size="23" text-anchor="middle" fill="#20364b">遊べる</text><rect id="after1" x="380" y="510" width="270" height="130" rx="16" fill="#d4efde" stroke="#a9bdcf" stroke-width="3"/><text x="515.0" y="555" font-size="29" text-anchor="middle" fill="#20364b">2</text><text x="515.0" y="598" font-size="23" text-anchor="middle" fill="#20364b">遊べる</text><rect id="after2" x="690" y="510" width="270" height="130" rx="16" fill="#e4e7ec" stroke="#a9bdcf" stroke-width="3"/><text x="825.0" y="555" font-size="29" text-anchor="middle" fill="#20364b">3</text><text x="825.0" y="598" font-size="23" text-anchor="middle" fill="#20364b">鍵：まだ遊べない</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">ステージ1を初めてクリアした前後の模式図。選択枠は省略しています。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">鍵のステージも選べますが、Enterを押しても開始しません。</text></svg>