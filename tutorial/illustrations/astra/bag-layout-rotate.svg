<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1190" viewBox="0 0 1200 1190" role="img" aria-labelledby="title desc" lang="ja"><title id="title">L字を右へ90度回す。負の座標を0始まりに直す</title><desc id="desc">元の相対座標は1が0,0、2が0,1、3が1,1。画面でx右、y下のためx,yを-y,xに変えると時計回り90度。結果は1が0,0、2が-1,0、3が-1,1。最小x=-1と最小y=0を引くと1が1,0、2が0,0、3が0,1になる。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1F3D5B"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="1190" rx="12" fill="#FFF8E8" stroke="#1F3D5B" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#1F3D5B">L字を右へ90度回す。負の座標を0始まりに直す</text><text x="40" y="110" font-size="27" text-anchor="start" fill="#1F3D5B">番号1・2・3は同じマスを追う印。座標の単位はマスです。</text><text x="40" y="165" font-size="29" text-anchor="start" fill="#1F3D5B">① 元の形</text><text x="440" y="165" font-size="29" text-anchor="start" fill="#1F3D5B">② 時計回り90度</text><text x="840" y="165" font-size="29" text-anchor="start" fill="#1F3D5B">③ 0始まりに直す</text><text x="157.5" y="230" font-size="23" text-anchor="middle" fill="#1F3D5B">x=0</text><text x="272.5" y="230" font-size="23" text-anchor="middle" fill="#1F3D5B">x=1</text><text x="85" y="320" font-size="22" text-anchor="end" fill="#1F3D5B">y=0</text><rect x="100" y="255" width="115" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><rect x="215" y="255" width="115" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="85" y="435" font-size="22" text-anchor="end" fill="#1F3D5B">y=1</text><rect x="100" y="370" width="115" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><rect x="215" y="370" width="115" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><rect x="100" y="255" width="115" height="115" rx="0" fill="#FFD35A" stroke="#1F3D5B" stroke-width="2"/><text x="157.5" y="300" font-size="33" text-anchor="middle" fill="#1F3D5B">1</text><text x="157.5" y="343" font-size="24" text-anchor="middle" fill="#1F3D5B">(0,0)</text><rect x="100" y="370" width="115" height="115" rx="0" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><text x="157.5" y="415" font-size="33" text-anchor="middle" fill="#1F3D5B">2</text><text x="157.5" y="458" font-size="24" text-anchor="middle" fill="#1F3D5B">(0,1)</text><rect x="215" y="370" width="115" height="115" rx="0" fill="#E7F0DF" stroke="#1F3D5B" stroke-width="2"/><text x="272.5" y="415" font-size="33" text-anchor="middle" fill="#1F3D5B">3</text><text x="272.5" y="458" font-size="24" text-anchor="middle" fill="#1F3D5B">(1,1)</text><circle cx="100" cy="255" r="6" fill="#1F3D5B"/><text x="557.5" y="230" font-size="23" text-anchor="middle" fill="#1F3D5B">x=-1</text><text x="672.5" y="230" font-size="23" text-anchor="middle" fill="#1F3D5B">x=0</text><text x="485" y="320" font-size="22" text-anchor="end" fill="#1F3D5B">y=0</text><rect x="500" y="255" width="115" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><rect x="615" y="255" width="115" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="485" y="435" font-size="22" text-anchor="end" fill="#1F3D5B">y=1</text><rect x="500" y="370" width="115" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><rect x="615" y="370" width="115" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><rect x="615" y="255" width="115" height="115" rx="0" fill="#FFD35A" stroke="#1F3D5B" stroke-width="2"/><text x="672.5" y="300" font-size="33" text-anchor="middle" fill="#1F3D5B">1</text><text x="672.5" y="343" font-size="24" text-anchor="middle" fill="#1F3D5B">(0,0)</text><rect x="500" y="255" width="115" height="115" rx="0" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><text x="557.5" y="300" font-size="33" text-anchor="middle" fill="#1F3D5B">2</text><text x="557.5" y="343" font-size="24" text-anchor="middle" fill="#1F3D5B">(-1,0)</text><rect x="500" y="370" width="115" height="115" rx="0" fill="#E7F0DF" stroke="#1F3D5B" stroke-width="2"/><text x="557.5" y="415" font-size="33" text-anchor="middle" fill="#1F3D5B">3</text><text x="557.5" y="458" font-size="24" text-anchor="middle" fill="#1F3D5B">(-1,1)</text><circle cx="615" cy="255" r="6" fill="#1F3D5B"/><text x="957.5" y="230" font-size="23" text-anchor="middle" fill="#1F3D5B">x=0</text><text x="1072.5" y="230" font-size="23" text-anchor="middle" fill="#1F3D5B">x=1</text><text x="885" y="320" font-size="22" text-anchor="end" fill="#1F3D5B">y=0</text><rect x="900" y="255" width="115" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><rect x="1015" y="255" width="115" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="885" y="435" font-size="22" text-anchor="end" fill="#1F3D5B">y=1</text><rect x="900" y="370" width="115" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><rect x="1015" y="370" width="115" height="115" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><rect x="1015" y="255" width="115" height="115" rx="0" fill="#FFD35A" stroke="#1F3D5B" stroke-width="2"/><text x="1072.5" y="300" font-size="33" text-anchor="middle" fill="#1F3D5B">1</text><text x="1072.5" y="343" font-size="24" text-anchor="middle" fill="#1F3D5B">(1,0)</text><rect x="900" y="255" width="115" height="115" rx="0" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><text x="957.5" y="300" font-size="33" text-anchor="middle" fill="#1F3D5B">2</text><text x="957.5" y="343" font-size="24" text-anchor="middle" fill="#1F3D5B">(0,0)</text><rect x="900" y="370" width="115" height="115" rx="0" fill="#E7F0DF" stroke="#1F3D5B" stroke-width="2"/><text x="957.5" y="415" font-size="33" text-anchor="middle" fill="#1F3D5B">3</text><text x="957.5" y="458" font-size="24" text-anchor="middle" fill="#1F3D5B">(0,1)</text><circle cx="900" cy="255" r="6" fill="#1F3D5B"/><path d="M352 375 L415 375" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><path d="M752 375 L815 375" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="540" font-size="27" text-anchor="start" fill="#1F3D5B">黒い点は原点 (0,0)。xは右へ、yは下へ増えます。</text><path d="M100 590 L225 590" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="250" y="599" font-size="25" text-anchor="start" fill="#1F3D5B">x：右</text><path d="M490 565 L490 625" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="515" y="605" font-size="25" text-anchor="start" fill="#1F3D5B">y：下</text><rect x="40" y="675" width="535" height="340" rx="12" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="2"/><text x="65" y="720" font-size="29" text-anchor="start" fill="#1F3D5B">回転の式：(x,y) → (−y,x)</text><text x="65" y="790" font-size="28" text-anchor="start" fill="#1F3D5B">1  (0,0) → (0,0)</text><text x="65" y="850" font-size="28" text-anchor="start" fill="#1F3D5B">2  (0,1) → (−1,0)</text><text x="65" y="910" font-size="28" text-anchor="start" fill="#1F3D5B">3  (1,1) → (−1,1)</text><text x="65" y="980" font-size="25" text-anchor="start" fill="#1F3D5B">負のxも途中の正しい座標です。</text><rect x="605" y="675" width="555" height="340" rx="12" fill="#FFF0CE" stroke="#1F3D5B" stroke-width="2"/><text x="630" y="720" font-size="27" text-anchor="start" fill="#1F3D5B">最小値：minX＝−1、minY＝0</text><text x="630" y="775" font-size="27" text-anchor="start" fill="#1F3D5B">(x−minX, y−minY) にする</text><text x="630" y="835" font-size="28" text-anchor="start" fill="#1F3D5B">1  (0,0) → (1,0)</text><text x="630" y="895" font-size="28" text-anchor="start" fill="#1F3D5B">2  (−1,0) → (0,0)</text><text x="630" y="955" font-size="28" text-anchor="start" fill="#1F3D5B">3  (−1,1) → (0,1)</text><text x="40" y="1080" font-size="26" text-anchor="start" fill="#1F3D5B">−1を引くことは、xに1を足すこと。形は変えず、右へ1マスずらします。</text><text x="40" y="1145" font-size="24" text-anchor="start" fill="#1F3D5B">3つの形は同じ縮尺。色と番号を合わせて、同じマスの移り方を比べます。</text></svg>