<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" lang="ja"><title id="title">パンの名前・価格・在庫を、まとめて持つ</title><desc id="desc">パンの名前・価格・在庫を、まとめて持つ。説明用の例：3個仕入れた後のパンの商品情報です。1つの商品に、名前「パン」・仕入れ20・売値35・在庫3がまとまっています。在庫が変わるときは、このパンの商品情報の在庫を更新します。模式図：外側の枠が商品の配列、その中の大きい枠が1つの商品を表します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="900" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">パンの名前・価格・在庫を、まとめて持つ</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">説明用の例：3個仕入れた後のパンの商品情報です。</text><rect id="products-array" x="60" y="165" width="1080" height="570" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="100" y="211" font-size="30" text-anchor="start" fill="#20364b">商品を入れる配列</text><rect id="bread-product" x="180" y="250" width="840" height="400" rx="22" fill="#fff5dc" stroke="#aa7a20" stroke-width="3"/><text x="600" y="297" font-size="29" text-anchor="middle" fill="#20364b">1つの商品（オブジェクト）</text><g id="product-bread-icon"><path d="M325 354 Q325 330 347 330 H368 Q390 330 390 354 V384 H325 Z" fill="#f4ce88" stroke="#936315" stroke-width="3"/><text x="357.5" y="368" font-size="21" text-anchor="middle" fill="#20364b">パン</text></g><text x="610" y="374" font-size="40" text-anchor="middle" fill="#20364b">名前：パン</text><text x="415" y="446" font-size="34" text-anchor="middle" fill="#20364b">仕入れ 20</text><text x="795" y="446" font-size="34" text-anchor="middle" fill="#20364b">売値 35</text><text x="330" y="557" font-size="31" text-anchor="middle" fill="#20364b">在庫 3個</text><g id="product-stock-0"><path d="M525 537 Q525 513 547 513 H568 Q590 513 590 537 V567 H525 Z" fill="#f4ce88" stroke="#936315" stroke-width="3"/><text x="557.5" y="551" font-size="21" text-anchor="middle" fill="#20364b">パン</text></g><g id="product-stock-1"><path d="M630 537 Q630 513 652 513 H673 Q695 513 695 537 V567 H630 Z" fill="#f4ce88" stroke="#936315" stroke-width="3"/><text x="662.5" y="551" font-size="21" text-anchor="middle" fill="#20364b">パン</text></g><g id="product-stock-2"><path d="M735 537 Q735 513 757 513 H778 Q800 513 800 537 V567 H735 Z" fill="#f4ce88" stroke="#936315" stroke-width="3"/><text x="767.5" y="551" font-size="21" text-anchor="middle" fill="#20364b">パン</text></g><text x="600" y="614" font-size="27" text-anchor="middle" fill="#20364b">パンの情報を、ひとまとまりにする</text><text x="600" y="695" font-size="27" text-anchor="middle" fill="#20364b">配列の中には、この「商品のまとまり」を入れる</text><text x="48" y="793" font-size="21" text-anchor="start" fill="#20364b">1つの商品に、名前「パン」・仕入れ20・売値35・在庫3がまとまっています。</text><text x="48" y="829" font-size="21" text-anchor="start" fill="#20364b">在庫が変わるときは、このパンの商品情報の在庫を更新します。</text><text x="48" y="865" font-size="21" text-anchor="start" fill="#20364b">模式図：外側の枠が商品の配列、その中の大きい枠が1つの商品を表します。</text></svg>