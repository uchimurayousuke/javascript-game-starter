<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc" lang="ja"><title id="title">道路の判定：外側の四角に入り、中央には入らない</title><desc id="desc">レース基本3の道路は外側x90から710,y60から400の範囲から、内側x190より大きく610未満,y160より大きく300未満を除いた領域。車の中心で判定する。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="840" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#20364b">道路の判定：外側の四角に入り、中央には入らない</text><text x="40" y="105" font-size="25" text-anchor="start" fill="#20364b">レース 基本3 ／ outer ＆＆ !inside：車の「中心の点」を調べます。</text><rect x="80" y="170" width="620" height="340" rx="0" fill="#d2e0ea" stroke="#365b75" stroke-width="2"/><rect x="180" y="270" width="420" height="140" rx="0" fill="#e6efcf" stroke="#566d36" stroke-width="2"/><text x="80" y="150" font-size="23" text-anchor="start" fill="#20364b">左90</text><text x="610" y="150" font-size="23" text-anchor="start" fill="#20364b">右710</text><text x="715" y="185" font-size="23" text-anchor="start" fill="#20364b">上60</text><text x="715" y="510" font-size="23" text-anchor="start" fill="#20364b">下400</text><text x="180" y="250" font-size="23" text-anchor="start" fill="#20364b">左190</text><text x="505" y="250" font-size="23" text-anchor="start" fill="#20364b">右610</text><text x="330" y="300" font-size="23" text-anchor="start" fill="#20364b">上160</text><text x="330" y="395" font-size="23" text-anchor="start" fill="#20364b">下300</text><circle cx="130" cy="220" r="6" fill="#20364b"/><text x="150" y="222" font-size="24" text-anchor="start" fill="#20364b">A (140,110)</text><circle cx="390" cy="340" r="6" fill="#20364b"/><text x="410" y="345" font-size="23" text-anchor="start" fill="#20364b">B (400,230)</text><circle cx="50" cy="220" r="6" fill="#20364b"/><text x="40" y="560" font-size="24" text-anchor="start" fill="#20364b">C (60,110)：外側の四角にも入らない</text><text x="260" y="465" font-size="30" text-anchor="start" fill="#20364b">道路</text><rect x="825" y="170" width="335" height="395" rx="12" fill="#f4f7fa" stroke="#657e91" stroke-width="2"/><text x="845" y="220" font-size="24" text-anchor="start" fill="#20364b">A：外枠○／中央×</text><text x="845" y="265" font-size="28" text-anchor="start" fill="#20364b">道路 → 進む</text><text x="845" y="330" font-size="24" text-anchor="start" fill="#20364b">B：外枠○／中央○</text><text x="845" y="375" font-size="26" text-anchor="start" fill="#20364b">中央 → 進まない</text><text x="845" y="440" font-size="24" text-anchor="start" fill="#20364b">C：外枠×／中央×</text><text x="845" y="485" font-size="26" text-anchor="start" fill="#20364b">外側 → 進まない</text><text x="845" y="540" font-size="23" text-anchor="start" fill="#20364b">○＝その範囲に入る</text><text x="40" y="635" font-size="28" text-anchor="start" fill="#20364b">道路外へ進みそうなら、今の座標を残して speed＝0。</text><text x="40" y="685" font-size="25" text-anchor="start" fill="#20364b">外側の境界を含む。中央の境界も道路として扱います。</text><text x="40" y="735" font-size="24" text-anchor="start" fill="#20364b">車の絵全体が道路に収まるかは調べません。判定は中心だけです。</text><text x="40" y="795" font-size="22" text-anchor="start" fill="#20364b">道路は実寸と同じ比率。図の位置は移動しています。点は説明用の3例です。</text></svg>