<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc" lang="ja"><title id="title">爆弾迷路：2個の爆弾を別々に数える</title><desc id="desc">爆弾迷路：2個の爆弾を別々に数える。発展2 ／ Aを0ms、Bを1000msに、別のマスへ設置した例。時間軸は1000msを200pxで表示。位置関係は省略し、被弾せず進めた例です。爆発は期限以上の更新で処理。火は「爆発の期限＋500ms」未満の間だけ残ります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="850" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">爆弾迷路：2個の爆弾を別々に数える</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">発展2 ／ Aを0ms、Bを1000msに、別のマスへ設置した例。</text><text x="80" y="175" font-size="28" text-anchor="start" fill="#20364b">同時に置けるのは2個。期限はそれぞれ別です。</text><path d="M200 205 L200 600" fill="none" stroke="#c9d3dd" stroke-width="3" stroke-dasharray="8 6"/><text x="200" y="650" font-size="24" text-anchor="middle" fill="#20364b">0ms</text><path d="M400 205 L400 600" fill="none" stroke="#c9d3dd" stroke-width="3" stroke-dasharray="8 6"/><text x="400" y="650" font-size="24" text-anchor="middle" fill="#20364b">1000ms</text><path d="M600 205 L600 600" fill="none" stroke="#c9d3dd" stroke-width="3" stroke-dasharray="8 6"/><text x="600" y="650" font-size="24" text-anchor="middle" fill="#20364b">2000ms</text><path d="M800 205 L800 600" fill="none" stroke="#c9d3dd" stroke-width="3" stroke-dasharray="8 6"/><text x="800" y="650" font-size="24" text-anchor="middle" fill="#20364b">3000ms</text><text x="90" y="305" font-size="26" text-anchor="middle" fill="#20364b">爆弾A</text><rect id="waitA" x="200" y="260" width="400" height="70" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="400" y="305" font-size="27" text-anchor="middle" fill="#20364b">待つ：2000ms</text><rect id="fireA" x="600" y="260" width="100" height="70" rx="0" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="650" y="305" font-size="28" text-anchor="middle" fill="#20364b">火</text><text x="600" y="240" font-size="25" text-anchor="middle" fill="#20364b">爆発</text><text x="700" y="375" font-size="23" text-anchor="middle" fill="#20364b">火が消える</text><text x="90" y="515" font-size="26" text-anchor="middle" fill="#20364b">爆弾B</text><rect id="waitB" x="400" y="470" width="400" height="70" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><text x="600" y="515" font-size="27" text-anchor="middle" fill="#20364b">待つ：2000ms</text><rect id="fireB" x="800" y="470" width="100" height="70" rx="0" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="850" y="515" font-size="28" text-anchor="middle" fill="#20364b">火</text><text x="800" y="450" font-size="25" text-anchor="middle" fill="#20364b">爆発</text><text x="900" y="585" font-size="23" text-anchor="middle" fill="#20364b">火が消える</text><text x="500" y="705" font-size="25" text-anchor="middle" fill="#20364b">火の時間は各500ms。Aが消えても、Bの期限は変わりません。</text><text x="40" y="786" font-size="19" text-anchor="start" fill="#20364b">時間軸は1000msを200pxで表示。位置関係は省略し、被弾せず進めた例です。</text><text x="40" y="818" font-size="19" text-anchor="start" fill="#20364b">爆発は期限以上の更新で処理。火は「爆発の期限＋500ms」未満の間だけ残ります。</text><text x="700" y="405" font-size="23" text-anchor="middle" fill="#20364b">2500ms</text><text x="900" y="615" font-size="23" text-anchor="middle" fill="#20364b">3500ms</text></svg>