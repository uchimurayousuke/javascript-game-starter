<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc" lang="ja"><title id="title">弾は上へ、敵は下へ進む</title><desc id="desc">弾は上へ、敵は下へ進む。1回の更新で動く量を比べよう。破線は動く前の場所。弾は幅6・高さ12。敵は幅30・高さ30。数字は左上の縦の位置です。模式図：形は読みやすく拡大。移動量8と2は同じ縮尺で示しています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="750" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">弾は上へ、敵は下へ進む</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">1回の更新で動く量を比べよう。破線は動く前の場所。</text><rect id="bullet-motion" x="40" y="150" width="540" height="480" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="enemy-motion" x="620" y="150" width="540" height="480" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="310" y="202" font-size="31" text-anchor="middle" fill="#20364b">弾は上へ8</text><text x="890" y="202" font-size="31" text-anchor="middle" fill="#20364b">敵は下へ2</text><rect id="bullet-before" x="200" y="392" width="60" height="120" rx="0" fill="none" stroke="#aa7a20" stroke-width="3" stroke-dasharray="9 6"/><rect id="bullet-after" x="200" y="312" width="60" height="120" rx="0" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="230" y="370" font-size="28" text-anchor="middle" fill="#20364b">弾</text><text x="315" y="330" font-size="28" text-anchor="start" fill="#20364b">後：縦100</text><text x="315" y="502" font-size="28" text-anchor="start" fill="#20364b">前：縦108</text><path d="M140 470L140 300" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="105" y="270" font-size="29" text-anchor="start" fill="#20364b">−8</text><rect id="enemy-before" x="740" y="292" width="200" height="200" rx="0" fill="none" stroke="#ad334b" stroke-width="3" stroke-dasharray="9 6"/><rect id="enemy-after" x="740" y="312" width="200" height="200" rx="0" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><text x="840" y="420" font-size="34" text-anchor="middle" fill="#20364b">敵</text><path d="M1010 300L1010 440" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="1030" y="380" font-size="29" text-anchor="start" fill="#20364b">＋2</text><text x="840" y="270" font-size="28" text-anchor="middle" fill="#20364b">前：縦103</text><text x="840" y="558" font-size="28" text-anchor="middle" fill="#20364b">後：縦105</text><text x="310" y="586" font-size="29" text-anchor="middle" fill="#20364b">108 − 8 ＝ 100</text><text x="48" y="679" font-size="21" text-anchor="start" fill="#20364b">弾は幅6・高さ12。敵は幅30・高さ30。数字は左上の縦の位置です。</text><text x="48" y="715" font-size="21" text-anchor="start" fill="#20364b">模式図：形は読みやすく拡大。移動量8と2は同じ縮尺で示しています。</text></svg>