<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="755" viewBox="0 0 1000 755" role="img" aria-labelledby="title desc" lang="ja"><title id="title">当たった直後は、続けてダメージを受けない</title><desc id="desc">当たった直後は、続けてダメージを受けない。残機3で敵弾に当たり、残機2になる例です。更新ごとに90 → 89 → … → 0。0になると、また被弾します。秒数ではありません。模式図：同じ自機の変化です。無敵中の弾との重なりを大きく示しています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="755" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">当たった直後は、続けてダメージを受けない</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">残機3で敵弾に当たり、残機2になる例です。</text><rect id="hit" x="40" y="160" width="280" height="390" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="safe" x="360" y="160" width="280" height="390" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="again" x="680" y="160" width="280" height="390" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="180" y="207" font-size="28" text-anchor="middle" fill="#20364b">被弾前</text><rect id="player-0" x="120" y="280" width="120" height="80" rx="0" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="180" y="331" font-size="28" text-anchor="middle" fill="#20364b">自機</text><text x="180" y="421" font-size="34" text-anchor="middle" fill="#20364b">残機3</text><text x="500" y="207" font-size="28" text-anchor="middle" fill="#20364b">被弾した直後</text><rect id="player-1" x="440" y="280" width="120" height="80" rx="0" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="500" y="331" font-size="28" text-anchor="middle" fill="#20364b">自機</text><text x="500" y="421" font-size="34" text-anchor="middle" fill="#20364b">残機2</text><text x="820" y="207" font-size="28" text-anchor="middle" fill="#20364b">無敵の間</text><rect id="player-2" x="760" y="280" width="120" height="80" rx="0" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="820" y="331" font-size="28" text-anchor="middle" fill="#20364b">自機</text><text x="820" y="421" font-size="34" text-anchor="middle" fill="#20364b">残機2</text><path d="M325 320L350 320" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="497" font-size="24" text-anchor="middle" fill="#20364b">無敵時間を開始</text><circle id="bullet" cx="870" cy="300" r="12" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><path d="M745 265Q820 220 895 265" fill="none" stroke="#528852" stroke-width="6"/><text x="820" y="497" font-size="22" text-anchor="middle" fill="#20364b">重なっても減らない</text><text x="500" y="613" font-size="31" text-anchor="middle" fill="#20364b">被弾で無敵の残りを90にする</text><text x="40" y="691" font-size="19" text-anchor="start" fill="#20364b">更新ごとに90 → 89 → … → 0。0になると、また被弾します。秒数ではありません。</text><text x="40" y="723" font-size="19" text-anchor="start" fill="#20364b">模式図：同じ自機の変化です。無敵中の弾との重なりを大きく示しています。</text></svg>