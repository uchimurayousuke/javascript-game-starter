<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">タッチ操作：指ごとに押下を覚える</title><desc id="desc">タッチ操作：指ごとに押下を覚える。基本3 ／ pointerIdを使い、離した指だけを解除します。2本の指を使う模式図。ID10・20は説明用の例で、実際の番号は環境で変わります。キーボード入力なしの例。画面から離れたとき（blur）は、すべての入力を解除。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">タッチ操作：指ごとに押下を覚える</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ pointerIdを使い、離した指だけを解除します。</text><rect id="touch0" x="60" y="175" width="390" height="420" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="255" y="225" font-size="27" text-anchor="middle" fill="#20364b">2本とも押している</text><rect id="btn00" x="90" y="340" width="150" height="90" rx="12" fill="#d6e9ff" stroke="#708391" stroke-width="3"/><text x="165" y="395" font-size="32" text-anchor="middle" fill="#20364b">左</text><circle id="finger00" cx="165" cy="300" r="25" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="165" y="272" font-size="23" text-anchor="middle" fill="#20364b">指ID 10</text><rect id="btn01" x="270" y="340" width="150" height="90" rx="12" fill="#d6e9ff" stroke="#708391" stroke-width="3"/><text x="345" y="395" font-size="32" text-anchor="middle" fill="#20364b">右</text><circle id="finger01" cx="345" cy="300" r="25" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="345" y="272" font-size="23" text-anchor="middle" fill="#20364b">指ID 20</text><text x="255" y="485" font-size="27" text-anchor="middle" fill="#20364b">左＋右＝停止</text><text x="255" y="540" font-size="24" text-anchor="middle" fill="#20364b">ID10とID20を記録</text><rect id="touch1" x="550" y="175" width="390" height="420" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="745" y="225" font-size="27" text-anchor="middle" fill="#20364b">左の指だけ離す</text><rect id="btn10" x="580" y="340" width="150" height="90" rx="12" fill="#e4e7ec" stroke="#708391" stroke-width="3"/><text x="655" y="395" font-size="32" text-anchor="middle" fill="#20364b">左</text><text x="655" y="300" font-size="26" text-anchor="middle" fill="#20364b">解除</text><rect id="btn11" x="760" y="340" width="150" height="90" rx="12" fill="#d6e9ff" stroke="#708391" stroke-width="3"/><text x="835" y="395" font-size="32" text-anchor="middle" fill="#20364b">右</text><circle id="finger11" cx="835" cy="300" r="25" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="835" y="272" font-size="23" text-anchor="middle" fill="#20364b">指ID 20</text><text x="745" y="485" font-size="27" text-anchor="middle" fill="#20364b">右だけ＝右へ進む</text><text x="745" y="540" font-size="24" text-anchor="middle" fill="#20364b">ID10だけ削除</text><path d="M460 385L540 385" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="655" font-size="29" text-anchor="middle" fill="#20364b">指を1本離しても、もう1本の入力は残る。</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">2本の指を使う模式図。ID10・20は説明用の例で、実際の番号は環境で変わります。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">キーボード入力なしの例。画面から離れたとき（blur）は、すべての入力を解除。</text></svg>