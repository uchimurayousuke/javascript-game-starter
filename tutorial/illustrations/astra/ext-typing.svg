<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" role="img" aria-labelledby="title desc" lang="ja"><title id="title">まちがえたら、残り時間が2秒減る</title><desc id="desc">まちがえたら、残り時間が2秒減る。次の文字と違う英字を入力したときの、時間の変化です。説明用の例です。ミスの前後で普通に経過する時間は省略しています。残り時間が0以下になったら終了。正しい文字を落ち着いて打とう。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="770" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">まちがえたら、残り時間が2秒減る</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">次の文字と違う英字を入力したときの、時間の変化です。</text><rect id="time-10" x="70" y="165" width="330" height="400" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="235" y="211" font-size="28" text-anchor="middle" fill="#20364b">ミスする前</text><circle id="clock-10" cx="235" cy="366" r="120" fill="#eef5fb" stroke="#28629e" stroke-width="3"/><text x="235" y="338" font-size="27" text-anchor="middle" fill="#20364b">残り</text><text x="235" y="406" font-size="52" text-anchor="middle" fill="#20364b">10秒</text><rect id="time-8" x="600" y="165" width="330" height="400" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="765" y="211" font-size="28" text-anchor="middle" fill="#20364b">ミスした直後</text><circle id="clock-8" cx="765" cy="366" r="120" fill="#eef5fb" stroke="#28629e" stroke-width="3"/><text x="765" y="338" font-size="27" text-anchor="middle" fill="#20364b">残り</text><text x="765" y="406" font-size="52" text-anchor="middle" fill="#20364b">8秒</text><path d="M420 360L580 360" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="290" font-size="29" text-anchor="middle" fill="#20364b">ミス1回</text><text x="500" y="421" font-size="33" text-anchor="middle" fill="#20364b">−2秒</text><text x="500" y="634" font-size="34" text-anchor="middle" fill="#20364b">10秒 − 2秒 ＝ 8秒</text><text x="40" y="706" font-size="19" text-anchor="start" fill="#20364b">説明用の例です。ミスの前後で普通に経過する時間は省略しています。</text><text x="40" y="738" font-size="19" text-anchor="start" fill="#20364b">残り時間が0以下になったら終了。正しい文字を落ち着いて打とう。</text></svg>