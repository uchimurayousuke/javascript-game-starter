<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc" lang="ja"><title id="title">リズム：時刻差でノートの位置が決まる</title><desc id="desc">リズム：時刻差でノートの位置が決まる。基本2 ／ y ＝ 320 −（予定時刻 − 経過時間）× 0.12。同じノートを3時刻で比較。レーンとノートは1.5倍、横の配置は説明用です。黒線はゲーム内y＝320の判定線。基本2は移動表示までで、押す判定は基本3。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="850" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">リズム：時刻差でノートの位置が決まる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本2 ／ y ＝ 320 −（予定時刻 − 経過時間）× 0.12</text><text x="190" y="180" font-size="27" text-anchor="middle" fill="#20364b">経過 1000ms</text><rect id="lane0" x="122.5" y="210" width="135" height="405" rx="0" fill="#e2ecf3" stroke="#a9bdcf" stroke-width="3"/><rect id="note0" x="152.5" y="390.0" width="75" height="30" rx="0" fill="#4389bc" stroke="#28629e" stroke-width="3"/><path d="M90 585 L290 585" fill="none" stroke="#34495e" stroke-width="4"/><text x="190" y="665" font-size="27" text-anchor="middle" fill="#20364b">中心 y＝200</text><text x="500" y="180" font-size="27" text-anchor="middle" fill="#20364b">経過 1500ms</text><rect id="lane1" x="432.5" y="210" width="135" height="405" rx="0" fill="#e2ecf3" stroke="#a9bdcf" stroke-width="3"/><rect id="note1" x="462.5" y="480.0" width="75" height="30" rx="0" fill="#4389bc" stroke="#28629e" stroke-width="3"/><path d="M400 585 L600 585" fill="none" stroke="#34495e" stroke-width="4"/><text x="500" y="665" font-size="27" text-anchor="middle" fill="#20364b">中心 y＝260</text><text x="810" y="180" font-size="27" text-anchor="middle" fill="#20364b">経過 2000ms</text><rect id="lane2" x="742.5" y="210" width="135" height="405" rx="0" fill="#e2ecf3" stroke="#a9bdcf" stroke-width="3"/><rect id="note2" x="772.5" y="570.0" width="75" height="30" rx="0" fill="#4389bc" stroke="#28629e" stroke-width="3"/><path d="M710 585 L910 585" fill="none" stroke="#34495e" stroke-width="4"/><text x="810" y="665" font-size="27" text-anchor="middle" fill="#20364b">中心 y＝320</text><text x="500" y="710" font-size="26" text-anchor="middle" fill="#20364b">このノートの予定時刻は2000ms。近づくほど下へ。</text><text x="40" y="786" font-size="19" text-anchor="start" fill="#20364b">同じノートを3時刻で比較。レーンとノートは1.5倍、横の配置は説明用です。</text><text x="40" y="818" font-size="19" text-anchor="start" fill="#20364b">黒線はゲーム内y＝320の判定線。基本2は移動表示までで、押す判定は基本3。</text></svg>