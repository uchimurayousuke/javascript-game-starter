<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">お絵かきロジック：1手前に戻す</title><desc id="desc">お絵かきロジック：1手前に戻す。発展1 ／ マスを変える前に、盤面全体を保存します。5×5のうち上の1行だけを模式化。保存・復元するのは盤面全体です。Uは最後のコピーを取り出して復元し、状態をplayingへ戻します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">お絵かきロジック：1手前に戻す</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">発展1 ／ マスを変える前に、盤面全体を保存します。</text><rect id="before" x="60" y="180" width="390" height="125" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="255.0" y="225" font-size="29" text-anchor="middle" fill="#20364b">変更前をコピーして保存</text><text x="255.0" y="268" font-size="23" text-anchor="middle" fill="#20364b">上の1行だけを拡大</text><rect id="after" x="550" y="180" width="390" height="125" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="745.0" y="225" font-size="29" text-anchor="middle" fill="#20364b">右クリックで×を付けた</text><text x="745.0" y="268" font-size="23" text-anchor="middle" fill="#20364b">元のコピーは変わらない</text><rect id="h00" x="85" y="350" width="68" height="80" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="119" y="402" font-size="27" text-anchor="middle" fill="#20364b"></text><rect id="h01" x="153" y="350" width="68" height="80" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="187" y="402" font-size="27" text-anchor="middle" fill="#20364b"></text><rect id="h02" x="221" y="350" width="68" height="80" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="255" y="402" font-size="27" text-anchor="middle" fill="#20364b">塗</text><rect id="h03" x="289" y="350" width="68" height="80" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="323" y="402" font-size="27" text-anchor="middle" fill="#20364b"></text><rect id="h04" x="357" y="350" width="68" height="80" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="391" y="402" font-size="27" text-anchor="middle" fill="#20364b"></text><rect id="h10" x="575" y="350" width="68" height="80" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="609" y="402" font-size="27" text-anchor="middle" fill="#20364b">×</text><rect id="h11" x="643" y="350" width="68" height="80" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="677" y="402" font-size="27" text-anchor="middle" fill="#20364b"></text><rect id="h12" x="711" y="350" width="68" height="80" rx="0" fill="#95c7ed" stroke="#708391" stroke-width="3"/><text x="745" y="402" font-size="27" text-anchor="middle" fill="#20364b">塗</text><rect id="h13" x="779" y="350" width="68" height="80" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="813" y="402" font-size="27" text-anchor="middle" fill="#20364b"></text><rect id="h14" x="847" y="350" width="68" height="80" rx="0" fill="#fff" stroke="#708391" stroke-width="3"/><text x="881" y="402" font-size="27" text-anchor="middle" fill="#20364b"></text><path d="M460 390L540 390" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 445 L745 550 L255 550 L255 445" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="525" font-size="27" text-anchor="middle" fill="#20364b">U：保存した盤面を取り出す</text><text x="500" y="640" font-size="28" text-anchor="middle" fill="#20364b">行ごとにコピーするので、前の盤面を残せます。</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">5×5のうち上の1行だけを模式化。保存・復元するのは盤面全体です。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">Uは最後のコピーを取り出して復元し、状態をplayingへ戻します。</text></svg>