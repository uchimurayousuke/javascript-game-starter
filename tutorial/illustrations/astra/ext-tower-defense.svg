<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">強化すると、攻撃が届く範囲が広がる</title><desc id="desc">強化すると、攻撃が届く範囲が広がる。タワーと敵の中心どうしの距離が130の例です。射程120では外、強化後の140なら内。所持金20以上のときだけ強化できます。円の半径と距離は同じ縮尺。タワーと敵の形は見やすくした模式図です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">強化すると、攻撃が届く範囲が広がる</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">タワーと敵の中心どうしの距離が130の例です。</text><rect id="range-0" x="40" y="160" width="420" height="430" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="250" y="205" font-size="30" text-anchor="middle" fill="#20364b">強化前</text><circle id="range-circle-0" cx="250" cy="370" r="120" fill="#e5f2df" stroke="#528852" stroke-width="3"/><rect id="tower-0" x="225" y="345" width="50" height="50" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><circle id="tower-center-0" cx="250" cy="370" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="250" y="315" font-size="24" text-anchor="middle" fill="#20364b">タワー</text><path d="M250 370H380" fill="none" stroke="#34495e" stroke-width="3"/><circle id="enemy-0" cx="380" cy="370" r="20" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><circle id="enemy-center-0" cx="380" cy="370" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="380" y="332" font-size="25" text-anchor="middle" fill="#20364b">敵</text><text x="315" y="421" font-size="23" text-anchor="middle" fill="#20364b">距離130</text><text x="250" y="479" font-size="28" text-anchor="middle" fill="#20364b">射程120</text><text x="250" y="551" font-size="30" text-anchor="middle" fill="#20364b">範囲外</text><rect id="range-1" x="540" y="160" width="420" height="430" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="750" y="205" font-size="30" text-anchor="middle" fill="#20364b">強化後</text><circle id="range-circle-1" cx="750" cy="370" r="140" fill="#e5f2df" stroke="#528852" stroke-width="3"/><rect id="tower-1" x="725" y="345" width="50" height="50" rx="0" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><circle id="tower-center-1" cx="750" cy="370" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="750" y="315" font-size="24" text-anchor="middle" fill="#20364b">タワー</text><path d="M750 370H880" fill="none" stroke="#34495e" stroke-width="3"/><circle id="enemy-1" cx="880" cy="370" r="20" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><circle id="enemy-center-1" cx="880" cy="370" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="880" y="332" font-size="25" text-anchor="middle" fill="#20364b">敵</text><text x="815" y="421" font-size="23" text-anchor="middle" fill="#20364b">距離130</text><text x="750" y="479" font-size="28" text-anchor="middle" fill="#20364b">射程140</text><text x="750" y="551" font-size="30" text-anchor="middle" fill="#20364b">範囲内！</text><text x="500" y="655" font-size="28" text-anchor="middle" fill="#20364b">20を払って強化 → 同じ場所の敵に届く</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">射程120では外、強化後の140なら内。所持金20以上のときだけ強化できます。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">円の半径と距離は同じ縮尺。タワーと敵の形は見やすくした模式図です。</text></svg>