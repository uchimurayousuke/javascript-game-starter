<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" lang="ja"><title id="title">ボールを囲む四角で、ブロックと比べる</title><desc id="desc">ボールを囲む四角で、ブロックと比べる。左上が横240・縦85のブロックに、中心が横241・縦95のボール。左右：ボールの右251 ≥ ブロックの左240 ／ ボールの左231 ≤ 右310。上下：ボールの下105 ≥ ブロックの上85 ／ ボールの上85 ≤ 下105。7倍の拡大図。残っているブロックが対象で、境界が等しくても当たりです。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="820" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">ボールを囲む四角で、ブロックと比べる</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">左上が横240・縦85のブロックに、中心が横241・縦95のボール。</text><rect id="brick" x="300" y="290" width="490" height="140" rx="0" fill="#ffe3c9" stroke="#aa6226" stroke-width="3"/><circle id="ball" cx="307" cy="360" r="70" fill="#d6e9ff" stroke="#28629e" stroke-width="3"/><rect id="ball-bounds" x="237" y="290" width="140" height="140" rx="0" fill="none" stroke="#28629e" stroke-width="3" stroke-dasharray="9 6"/><circle id="ball-center" cx="307" cy="360" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="580" y="347" font-size="30" text-anchor="middle" fill="#20364b">ブロック</text><text x="580" y="390" font-size="27" text-anchor="middle" fill="#20364b">幅70・高さ20</text><text x="300" y="245" font-size="28" text-anchor="start" fill="#20364b">左240</text><text x="790" y="245" font-size="28" text-anchor="end" fill="#20364b">右310</text><text x="865" y="302" font-size="30" text-anchor="start" fill="#20364b">上85</text><path d="M800 290H850" fill="none" stroke="#34495e" stroke-width="3"/><text x="865" y="441" font-size="30" text-anchor="start" fill="#20364b">下105</text><path d="M800 430H850" fill="none" stroke="#34495e" stroke-width="3"/><text x="120" y="275" font-size="25" text-anchor="middle" fill="#20364b">上85</text><path d="M120 290H229" fill="none" stroke="#34495e" stroke-width="3"/><text x="100" y="400" font-size="25" text-anchor="start" fill="#20364b">左231</text><path d="M195 390 237 360" fill="none" stroke="#34495e" stroke-width="3"/><text x="307" y="500" font-size="27" text-anchor="middle" fill="#20364b">中心：横241・縦95</text><path d="M307 370V462" fill="none" stroke="#34495e" stroke-width="3"/><text x="480" y="480" font-size="25" text-anchor="start" fill="#20364b">右251</text><path d="M377 430 460 468" fill="none" stroke="#34495e" stroke-width="3"/><text x="150" y="555" font-size="26" text-anchor="start" fill="#20364b">ボール：半径10 ／ 下105</text><text x="600" y="622" font-size="32" text-anchor="middle" fill="#20364b">四角どうしが重なる → 当たり！</text><text x="48" y="713" font-size="21" text-anchor="start" fill="#20364b">左右：ボールの右251 ≥ ブロックの左240 ／ ボールの左231 ≤ 右310</text><text x="48" y="749" font-size="21" text-anchor="start" fill="#20364b">上下：ボールの下105 ≥ ブロックの上85 ／ ボールの上85 ≤ 下105</text><text x="48" y="785" font-size="21" text-anchor="start" fill="#20364b">7倍の拡大図。残っているブロックが対象で、境界が等しくても当たりです。</text></svg>