<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="885" viewBox="0 0 1000 885" role="img" aria-labelledby="title desc" lang="ja"><title id="title">前に戻るときは、持ち物も一緒に戻す</title><desc id="desc">前に戻るときは、持ち物も一緒に戻す。鍵を拾った後でBを押すと、拾う前の場面と持ち物に戻ります。履歴には場面・持ち物のコピー・文章を保存します。戻ると持ち物の鍵もなくなります。模式図：保存と復元を並べています。履歴の持ち物は、現在の持ち物とは別のコピーです。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="885" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">前に戻るときは、持ち物も一緒に戻す</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">鍵を拾った後でBを押すと、拾う前の場面と持ち物に戻ります。</text><rect id="before-choice" x="40" y="165" width="420" height="250" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="after-choice" x="540" y="165" width="420" height="250" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="250" y="213" font-size="30" text-anchor="middle" fill="#20364b">鍵がある場面</text><text x="250" y="270" font-size="29" text-anchor="middle" fill="#20364b">持ち物：なし</text><text x="250" y="364" font-size="25" text-anchor="middle" fill="#20364b">1：鍵を拾って戻る</text><text x="750" y="213" font-size="30" text-anchor="middle" fill="#20364b">広場に戻った</text><text x="750" y="270" font-size="29" text-anchor="middle" fill="#20364b">持ち物：鍵</text><circle id="key-ring" cx="720" cy="337" r="19" fill="none" stroke="#aa7a20" stroke-width="3"/><path d="M740 337H800V355 M780 337V355" fill="none" stroke="#aa7a20" stroke-width="7"/><path d="M470 290L530 290" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M250 430V485" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="470" font-size="23" text-anchor="middle" fill="#20364b">選ぶ前を保存</text><rect id="saved-history" x="70" y="510" width="390" height="160" rx="14" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="265" y="553" font-size="28" text-anchor="middle" fill="#20364b">履歴のコピー</text><text x="265" y="598" font-size="25" text-anchor="middle" fill="#20364b">場面：鍵がある場所</text><text x="265" y="639" font-size="25" text-anchor="middle" fill="#20364b">持ち物：なし</text><rect id="back-key" x="670" y="505" width="160" height="95" rx="14" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="750" y="566" font-size="44" text-anchor="middle" fill="#20364b">B</text><path d="M750 415V490" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 575H480" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="742" font-size="29" text-anchor="middle" fill="#20364b">場面と持ち物を、保存した状態へ戻す</text><text x="40" y="821" font-size="19" text-anchor="start" fill="#20364b">履歴には場面・持ち物のコピー・文章を保存します。戻ると持ち物の鍵もなくなります。</text><text x="40" y="853" font-size="19" text-anchor="start" fill="#20364b">模式図：保存と復元を並べています。履歴の持ち物は、現在の持ち物とは別のコピーです。</text></svg>