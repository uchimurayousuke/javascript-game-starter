<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" lang="ja"><title id="title">横の距離100なら追跡。101なら巡回する</title><desc id="desc">敵x200を説明例として、プレイヤーx300なら距離100で追跡、x301なら距離101で巡回。巡回範囲は160から320、速度は更新ごと2。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="900" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">横の距離100なら追跡。101なら巡回する</text><text x="40" y="110" font-size="30" text-anchor="start" fill="#20364b">判定：|プレイヤーのx − 敵のx| ≦ 100</text><rect x="40" y="170" width="1120" height="185" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><rect x="85" y="225" width="170" height="75" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="170" y="273" font-size="26" text-anchor="middle" fill="#20364b">敵 x＝200</text><rect x="815" y="225" width="290" height="75" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="960" y="273" font-size="26" text-anchor="middle" fill="#20364b">人 x＝300</text><path d="M265 260 L805 260" fill="none" stroke="#20364b" stroke-width="3"/><text x="535" y="230" font-size="28" text-anchor="middle" fill="#20364b">横の差 100</text><text x="535" y="325" font-size="31" text-anchor="middle" fill="#20364b">追跡する</text><rect x="40" y="400" width="1120" height="185" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><rect x="85" y="455" width="170" height="75" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="170" y="503" font-size="26" text-anchor="middle" fill="#20364b">敵 x＝200</text><rect x="820" y="455" width="290" height="75" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="965" y="503" font-size="26" text-anchor="middle" fill="#20364b">人 x＝301</text><path d="M265 490 L810 490" fill="none" stroke="#20364b" stroke-width="3"/><text x="535" y="460" font-size="28" text-anchor="middle" fill="#20364b">横の差 101</text><text x="535" y="555" font-size="31" text-anchor="middle" fill="#20364b">巡回する</text><text x="40" y="650" font-size="28" text-anchor="start" fill="#20364b">巡回はx＝160〜320。端で向きを変え、1更新で2進む。</text><path d="M190 715 L990 715" fill="none" stroke="#20364b" stroke-width="3"/><path d="M190 700 L190 730" fill="none" stroke="#20364b" stroke-width="3"/><path d="M990 700 L990 730" fill="none" stroke="#20364b" stroke-width="3"/><text x="190" y="775" font-size="28" text-anchor="middle" fill="#20364b">160</text><text x="990" y="775" font-size="28" text-anchor="middle" fill="#20364b">320</text><path d="M420 690 L590 690" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 740 L590 740" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="835" font-size="23" text-anchor="start" fill="#20364b">Rは敵160・プレイヤー480へ。上2例の敵200は判定を比べる説明用です。</text><text x="40" y="880" font-size="22" text-anchor="start" fill="#20364b">上下の箱は別々の場面。線は横の差を示し、キャラクターの大きさは模式化。</text></svg>