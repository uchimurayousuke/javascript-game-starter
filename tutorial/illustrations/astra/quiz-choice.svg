<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc" lang="ja"><title id="title">問題に、3つの答えの候補を付ける</title><desc id="desc">問題に、3つの答えの候補を付ける。基本2では、まず問題と3つの選択肢を表示します。答え7は画面では選択肢2、配列の中では番号1の場所にあります。模式図：基本2の最初の問題です。この段階は表示だけで、回答操作は次に加えます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="790" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">問題に、3つの答えの候補を付ける</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本2では、まず問題と3つの選択肢を表示します。</text><rect id="question" x="180" y="155" width="640" height="105" rx="14" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="500" y="223" font-size="42" text-anchor="middle" fill="#20364b">3 ＋ 4 は？</text><rect id="choice-0" x="45" y="340" width="250" height="180" rx="16" fill="#eef5fb" stroke="#28629e" stroke-width="3"/><text x="170" y="390" font-size="28" text-anchor="middle" fill="#20364b">選択肢 1</text><text x="170" y="468" font-size="55" text-anchor="middle" fill="#20364b">6</text><text x="170" y="574" font-size="25" text-anchor="middle" fill="#20364b">配列の番号 0</text><rect id="choice-1" x="375" y="340" width="250" height="180" rx="16" fill="#dcefd5" stroke="#528852" stroke-width="3"/><text x="500" y="390" font-size="28" text-anchor="middle" fill="#20364b">選択肢 2</text><text x="500" y="468" font-size="55" text-anchor="middle" fill="#20364b">7</text><text x="500" y="574" font-size="25" text-anchor="middle" fill="#20364b">配列の番号 1</text><rect id="choice-2" x="705" y="340" width="250" height="180" rx="16" fill="#eef5fb" stroke="#28629e" stroke-width="3"/><text x="830" y="390" font-size="28" text-anchor="middle" fill="#20364b">選択肢 3</text><text x="830" y="468" font-size="55" text-anchor="middle" fill="#20364b">8</text><text x="830" y="574" font-size="25" text-anchor="middle" fill="#20364b">配列の番号 2</text><text x="500" y="648" font-size="30" text-anchor="middle" fill="#20364b">画面は1から、配列は0から数える</text><text x="40" y="726" font-size="19" text-anchor="start" fill="#20364b">答え7は画面では選択肢2、配列の中では番号1の場所にあります。</text><text x="40" y="758" font-size="19" text-anchor="start" fill="#20364b">模式図：基本2の最初の問題です。この段階は表示だけで、回答操作は次に加えます。</text></svg>