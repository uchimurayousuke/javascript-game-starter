<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">爆弾迷路：置いた時刻から2秒を数える</title><desc id="desc">爆弾迷路：置いた時刻から2秒を数える。基本2 ／ ボタンを押した回数ではなく、時刻で期限を決める。時刻の比較を示す模式図。設置時刻を0msとした例です。2000ms＝2秒。十字の爆風は基本3で追加し、基本2ではまだ表示しません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">爆弾迷路：置いた時刻から2秒を数える</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本2 ／ ボタンを押した回数ではなく、時刻で期限を決める。</text><rect id="plant" x="60" y="220" width="260" height="190" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="190.0" y="265" font-size="29" text-anchor="middle" fill="#20364b">Bで設置</text><text x="190.0" y="308" font-size="23" text-anchor="middle" fill="#20364b">設置時刻 0ms</text><rect id="wait" x="370" y="220" width="260" height="190" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="500.0" y="265" font-size="29" text-anchor="middle" fill="#20364b">まだ残る</text><text x="500.0" y="308" font-size="23" text-anchor="middle" fill="#20364b">経過 1999ms</text><rect id="due" x="680" y="220" width="260" height="190" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="810.0" y="265" font-size="29" text-anchor="middle" fill="#20364b">期限に到達</text><text x="810.0" y="308" font-size="23" text-anchor="middle" fill="#20364b">経過 2000ms</text><path d="M325 315L365 315" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><path d="M635 315L675 315" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="485" font-size="32" text-anchor="middle" fill="#20364b">期限 ＝ 設置した時刻 ＋ 2000ms</text><rect id="update" x="150" y="545" width="700" height="125" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="500.0" y="590" font-size="29" text-anchor="middle" fill="#20364b">更新で「今の時刻 ≧ 期限」を確認</text><text x="500.0" y="633" font-size="23" text-anchor="middle" fill="#20364b">基本2では爆弾を取り除くところまで</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">時刻の比較を示す模式図。設置時刻を0msとした例です。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">2000ms＝2秒。十字の爆風は基本3で追加し、基本2ではまだ表示しません。</text></svg>