<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc" lang="ja"><title id="title">押し始めは1回。押している間は何度も更新</title><desc id="desc">Spaceを押し続けてもcountは1。離して押し直すと2。右キーは更新ごとxに3を足し、初期400から3更新で409。左右同時なら移動0。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="870" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">押し始めは1回。押している間は何度も更新</text><text x="40" y="110" font-size="27" text-anchor="start" fill="#20364b">Spaceの回数 count と、左右移動の位置 x は別々に記録します。</text><rect x="40" y="150" width="1120" height="240" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="65" y="195" font-size="29" text-anchor="start" fill="#20364b">Space：押し始めだけ数える</text><text x="65" y="255" font-size="27" text-anchor="start" fill="#20364b">押す</text><text x="65" y="325" font-size="33" text-anchor="start" fill="#20364b">count＝1</text><text x="405" y="255" font-size="27" text-anchor="start" fill="#20364b">押したまま</text><text x="405" y="325" font-size="33" text-anchor="start" fill="#20364b">count＝1</text><text x="815" y="255" font-size="27" text-anchor="start" fill="#20364b">放して押し直す</text><text x="815" y="325" font-size="33" text-anchor="start" fill="#20364b">count＝2</text><path d="M300 295 L375 295" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M690 295 L785 295" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="435" width="1120" height="250" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="65" y="480" font-size="29" text-anchor="start" fill="#20364b">右キー：押している間、更新ごとに＋3</text><text x="175" y="535" font-size="25" text-anchor="middle" fill="#20364b">最初</text><rect x="75" y="565" width="200" height="80" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="175" y="620" font-size="33" text-anchor="middle" fill="#20364b">x＝400</text><path d="M290 605 L340 605" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="535" font-size="25" text-anchor="middle" fill="#20364b">1回更新後</text><rect x="355" y="565" width="200" height="80" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="455" y="620" font-size="33" text-anchor="middle" fill="#20364b">x＝403</text><path d="M570 605 L620 605" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="735" y="535" font-size="25" text-anchor="middle" fill="#20364b">2回更新後</text><rect x="635" y="565" width="200" height="80" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="735" y="620" font-size="33" text-anchor="middle" fill="#20364b">x＝406</text><path d="M850 605 L900 605" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="1015" y="535" font-size="25" text-anchor="middle" fill="#20364b">3回更新後</text><rect x="915" y="565" width="200" height="80" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="1015" y="620" font-size="33" text-anchor="middle" fill="#20364b">x＝409</text><text x="40" y="745" font-size="29" text-anchor="start" fill="#20364b">左右同時： (1 − 1) × 3 ＝ 0。移動しません。</text><text x="40" y="820" font-size="24" text-anchor="start" fill="#20364b">キーを放す・画面を離れると入力解除。Rはcount＝0、x＝400へ。</text></svg>