<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc" lang="ja"><title id="title">右端が壁800に届いたら、向きを変える</title><desc id="desc">右端が壁800に届いたら、向きを変える。中心は右へ4進んで786から790へ。半径10なので、壁にぴったり。2つの絵は拡大図。中心から壁までの距離は、左14・右10です。反射では横の速さの符号を反転します。右向きの＋4 → 左向きの−4。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="790" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">右端が壁800に届いたら、向きを変える</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">中心は右へ4進んで786から790へ。半径10なので、壁にぴったり。</text><rect id="wall-panel-0" x="40" y="150" width="560" height="440" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="75" y="196" font-size="30" text-anchor="start" fill="#20364b">動く前</text><rect id="wall-0" x="466" y="235" width="16" height="280" rx="0" fill="#8a9eb0" stroke="#536c86" stroke-width="3"/><text x="466" y="221" font-size="24" text-anchor="middle" fill="#20364b">壁800</text><circle id="ball-0" cx="270" cy="375" r="140" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="270" y="308" font-size="24" text-anchor="middle" fill="#20364b">ボールの中心</text><text x="270" y="349" font-size="32" text-anchor="middle" fill="#20364b">横786</text><circle id="center-0" cx="270" cy="375" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M278 375H405" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="332" y="413" font-size="23" text-anchor="middle" fill="#20364b">半径10</text><path d="M190 548L350 548" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="270" y="580" font-size="25" text-anchor="middle" fill="#20364b">右へ4（dx = 4）</text><rect id="wall-panel-1" x="630" y="150" width="560" height="440" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="665" y="196" font-size="30" text-anchor="start" fill="#20364b">動いた後</text><rect id="wall-1" x="1000" y="235" width="16" height="280" rx="0" fill="#8a9eb0" stroke="#536c86" stroke-width="3"/><text x="1000" y="221" font-size="24" text-anchor="middle" fill="#20364b">壁800</text><circle id="ball-1" cx="860" cy="375" r="140" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="860" y="308" font-size="24" text-anchor="middle" fill="#20364b">ボールの中心</text><text x="860" y="349" font-size="32" text-anchor="middle" fill="#20364b">横790</text><circle id="center-1" cx="860" cy="375" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M868 375H995" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="922" y="413" font-size="23" text-anchor="middle" fill="#20364b">半径10</text><path d="M940 548L780 548" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="860" y="580" font-size="25" text-anchor="middle" fill="#20364b">次は左へ（dx = −4）</text><text x="600" y="652" font-size="30" text-anchor="middle" fill="#20364b">786 ＋ 4 ＝ 790　→　右端は790 ＋ 10 ＝ 800</text><text x="48" y="719" font-size="21" text-anchor="start" fill="#20364b">2つの絵は拡大図。中心から壁までの距離は、左14・右10です。</text><text x="48" y="755" font-size="21" text-anchor="start" fill="#20364b">反射では横の速さの符号を反転します。右向きの＋4 → 左向きの−4。</text></svg>