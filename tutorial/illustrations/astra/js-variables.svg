<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">変数：右辺を計算して、新しい値を入れる</title><desc id="desc">let hp10、const maxHp10からhp-=3を実行するとhp7、maxHp10。console.logは7と10を出力する。constは変数への再代入を禁止するが、配列やオブジェクトの中身の変更とは別。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="800" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">変数：右辺を計算して、新しい値を入れる</text><text x="40" y="110" font-size="29" text-anchor="start" fill="#20364b">let hp = 10;    const maxHp = 10;    hp -= 3;</text><rect x="60" y="170" width="290" height="150" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="82" y="212" font-size="26" text-anchor="start" fill="#20364b">実行前の hp</text><text x="82" y="265" font-size="30" text-anchor="start" fill="#20364b">10</text><rect x="455" y="170" width="290" height="150" rx="12" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="477" y="212" font-size="26" text-anchor="start" fill="#20364b">右辺の計算</text><text x="477" y="265" font-size="30" text-anchor="start" fill="#20364b">10 − 3 ＝ 7</text><rect x="850" y="170" width="290" height="150" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="872" y="212" font-size="26" text-anchor="start" fill="#20364b">実行後の hp</text><text x="872" y="265" font-size="30" text-anchor="start" fill="#20364b">7</text><path d="M365 245 L435 245" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 245 L830 245" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="365" width="1080" height="115" rx="12" fill="#ffffff" stroke="#607a90" stroke-width="2"/><text x="85" y="410" font-size="30" text-anchor="start" fill="#20364b">hp -= 3 は hp = hp - 3 と同じ</text><text x="85" y="455" font-size="26" text-anchor="start" fill="#20364b">「=」は、右の結果を左の変数に入れる記号。</text><rect x="60" y="525" width="500" height="125" rx="12" fill="#edf3f8" stroke="#607a90" stroke-width="2"/><text x="82" y="567" font-size="26" text-anchor="start" fill="#20364b">maxHp は変更しない</text><text x="82" y="620" font-size="30" text-anchor="start" fill="#20364b">10 → 10</text><rect x="610" y="525" width="530" height="125" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="632" y="567" font-size="26" text-anchor="start" fill="#20364b">console.log(hp, maxHp)</text><text x="632" y="620" font-size="30" text-anchor="start" fill="#20364b">出力：7  10</text><text x="40" y="710" font-size="27" text-anchor="start" fill="#20364b">constで宣言した変数には、別の値を再代入できません。</text><text x="40" y="760" font-size="23" text-anchor="start" fill="#20364b">配列・オブジェクトの「中身を変える」ことは別です。後の図で確認します。</text></svg>