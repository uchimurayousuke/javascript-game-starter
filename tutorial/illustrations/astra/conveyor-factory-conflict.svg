<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc" lang="ja"><title id="title">同じ空きマスへ進みたいときは、順番を決める</title><desc id="desc">Aは1,1から右へ、Bは2,0から下へ進みたい。どちらも空き2,1が行き先。移動元の行yが小さいBが優先され、Bは2,1へ進み、Aは1,1に残る。材料は開始も結果も2個。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1F3D5B"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="1110" rx="12" fill="#FFF8E8" stroke="#1F3D5B" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#1F3D5B">同じ空きマスへ進みたいときは、順番を決める</text><text x="40" y="110" font-size="26" text-anchor="start" fill="#1F3D5B">行き先は共通の (2,1)。移動元の行 y が小さい材料を優先します。</text><text x="90" y="185" font-size="29" text-anchor="start" fill="#1F3D5B">開始：材料2個</text><text x="85" y="337" font-size="25" text-anchor="end" fill="#1F3D5B">y=0</text><text x="170" y="235" font-size="25" text-anchor="middle" fill="#1F3D5B">x=1</text><rect x="100" y="260" width="140" height="140" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="170" y="312" font-size="34" text-anchor="middle" fill="#1F3D5B">空</text><text x="170" y="367" font-size="25" text-anchor="middle" fill="#1F3D5B">(1,0)</text><text x="310" y="235" font-size="25" text-anchor="middle" fill="#1F3D5B">x=2</text><rect x="240" y="260" width="140" height="140" rx="0" fill="#FFD35A" stroke="#1F3D5B" stroke-width="2"/><text x="310" y="312" font-size="34" text-anchor="middle" fill="#1F3D5B">B</text><text x="310" y="367" font-size="25" text-anchor="middle" fill="#1F3D5B">(2,0)</text><text x="85" y="477" font-size="25" text-anchor="end" fill="#1F3D5B">y=1</text><rect x="100" y="400" width="140" height="140" rx="0" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><text x="170" y="452" font-size="34" text-anchor="middle" fill="#1F3D5B">A</text><text x="170" y="507" font-size="25" text-anchor="middle" fill="#1F3D5B">(1,1)</text><rect x="240" y="400" width="140" height="140" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="310" y="452" font-size="34" text-anchor="middle" fill="#1F3D5B">空</text><text x="310" y="507" font-size="25" text-anchor="middle" fill="#1F3D5B">(2,1)</text><text x="800" y="185" font-size="29" text-anchor="start" fill="#1F3D5B">結果：材料2個</text><text x="805" y="337" font-size="25" text-anchor="end" fill="#1F3D5B">y=0</text><text x="890" y="235" font-size="25" text-anchor="middle" fill="#1F3D5B">x=1</text><rect x="820" y="260" width="140" height="140" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="890" y="312" font-size="34" text-anchor="middle" fill="#1F3D5B">空</text><text x="890" y="367" font-size="25" text-anchor="middle" fill="#1F3D5B">(1,0)</text><text x="1030" y="235" font-size="25" text-anchor="middle" fill="#1F3D5B">x=2</text><rect x="960" y="260" width="140" height="140" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="1030" y="312" font-size="34" text-anchor="middle" fill="#1F3D5B">空</text><text x="1030" y="367" font-size="25" text-anchor="middle" fill="#1F3D5B">(2,0)</text><text x="805" y="477" font-size="25" text-anchor="end" fill="#1F3D5B">y=1</text><rect x="820" y="400" width="140" height="140" rx="0" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><text x="890" y="452" font-size="34" text-anchor="middle" fill="#1F3D5B">A</text><text x="890" y="507" font-size="25" text-anchor="middle" fill="#1F3D5B">(1,1)</text><rect x="960" y="400" width="140" height="140" rx="0" fill="#FFD35A" stroke="#1F3D5B" stroke-width="2"/><text x="1030" y="452" font-size="34" text-anchor="middle" fill="#1F3D5B">B</text><text x="1030" y="507" font-size="25" text-anchor="middle" fill="#1F3D5B">(2,1)</text><text x="445" y="270" font-size="27" text-anchor="start" fill="#1F3D5B">進みたい場所</text><rect x="445" y="305" width="270" height="95" rx="12" fill="#FFF0CE" stroke="#1F3D5B" stroke-width="2"/><text x="580" y="366" font-size="39" text-anchor="middle" fill="#1F3D5B">(2,1)</text><path d="M205 475 L275 475" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><path d="M355 350 L355 445" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="445" y="460" font-size="26" text-anchor="start" fill="#1F3D5B">A：右へ希望</text><text x="445" y="515" font-size="26" text-anchor="start" fill="#1F3D5B">B：下へ希望</text><path d="M730 350 L795 350" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="610" width="1120" height="230" rx="12" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="2"/><text x="65" y="660" font-size="30" text-anchor="start" fill="#1F3D5B">Bの移動元は y＝0、Aの移動元は y＝1</text><text x="65" y="720" font-size="29" text-anchor="start" fill="#1F3D5B">0 ＜ 1 なのでBが先。Bだけが (2,1) に進みます。</text><text x="65" y="780" font-size="25" text-anchor="start" fill="#1F3D5B">Aは (1,1) に残る。材料は2個のまま、増えたり消えたりしません。</text><text x="40" y="915" font-size="28" text-anchor="start" fill="#1F3D5B">移動元のyが同じなら、列xが小さい材料を優先します。</text><text x="40" y="975" font-size="25" text-anchor="start" fill="#1F3D5B">矢印は移動の希望。2本の希望を出しても、進めるのは1個だけです。</text><text x="40" y="1035" font-size="23" text-anchor="start" fill="#1F3D5B">図は経路の一部。行き先のマスは刻みの開始時には空いています。</text><text x="40" y="1080" font-size="23" text-anchor="start" fill="#1F3D5B">この工場の簡略ルールでは、材料で埋まった輪の経路は止まります。</text></svg>