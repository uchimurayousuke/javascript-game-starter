<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">画像の比率：形を保って中央に収める</title><desc id="desc">画像の比率：形を保って中央に収める。基本3 ／ Bで「比率を保つ」表示に切り替えた場合。図の枠・画像領域は1.5倍。数値はゲーム内座標・寸法です。赤い十字は中心。枠の左上は(250,120)。余った高さ20pxを上下10pxずつ分けます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">画像の比率：形を保って中央に収める</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ Bで「比率を保つ」表示に切り替えた場合。</text><text x="310" y="180" font-size="29" text-anchor="middle" fill="#20364b">枠：240 × 180px</text><rect id="frame" x="130" y="230" width="360" height="270" rx="0" fill="#fff0c7" stroke="#34495e" stroke-width="3"/><rect id="image-area" x="130" y="245" width="360" height="240" rx="0" fill="#edf8f1" stroke="#28629e" stroke-width="3" stroke-dasharray="8 6"/><g transform="translate(130 245) scale(3.75)" ><rect x="35" y="44" width="10" height="12" rx="3" fill="#315d56"/><rect x="51" y="44" width="10" height="12" rx="3" fill="#315d56"/><rect x="10" y="33" width="25" height="10" rx="5" fill="#77c5a0"/><rect x="61" y="33" width="25" height="10" rx="5" fill="#77c5a0"/><circle cx="12" cy="38" r="4" fill="#315d56"/><circle cx="84" cy="38" r="4" fill="#315d56"/><rect x="32" y="30" width="32" height="20" rx="6" fill="#46a77e"/><circle cx="48" cy="39" r="4" fill="#ffcf64"/><rect x="30" y="9" width="36" height="25" rx="7" fill="#77c5a0"/><rect x="35" y="15" width="26" height="13" rx="4" fill="#e4fff4"/><rect x="39" y="19" width="5" height="5" rx="1" fill="#315d56"/><rect x="52" y="19" width="5" height="5" rx="1" fill="#315d56"/></g><path d="M300 365 L320 365 M310 355 L310 375" fill="none" stroke="#a02f42" stroke-width="3"/><path d="M490 237.5 L590 237.5" fill="none" stroke="#34495e" stroke-width="3"/><text x="610" y="247" font-size="27" text-anchor="start" fill="#20364b">上に10px</text><text x="610" y="330" font-size="26" text-anchor="start" fill="#20364b">画像：240 × 160px</text><text x="610" y="390" font-size="29" text-anchor="start" fill="#20364b">96：64 ＝ 3：2</text><path d="M490 492.5 L590 492.5" fill="none" stroke="#34495e" stroke-width="3"/><text x="610" y="502" font-size="27" text-anchor="start" fill="#20364b">下に10px</text><text x="500" y="610" font-size="27" text-anchor="middle" fill="#20364b">画像の左上は (250, 130)。枠の中心にそろいます。</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">図の枠・画像領域は1.5倍。数値はゲーム内座標・寸法です。赤い十字は中心。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">枠の左上は(250,120)。余った高さ20pxを上下10pxずつ分けます。</text></svg>