<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img" aria-labelledby="title desc" lang="ja"><title id="title">車の向きで、横と縦の増え方が変わる</title><desc id="desc">車の向きで、横と縦の増え方が変わる。説明用の例：車の中心は横140・縦110。この1回に進む距離を2とします。右へ進むと横＋2、下へ進むと縦＋2、左へ進むと横−2です。画面では下へ行くほど縦が増えます。0・Math.PI/2・Math.PIはそれぞれの向きの値です。模式図：移動を見分けやすく拡大しています。実際の時間あたりの速さを示す図ではありません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="815" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">車の向きで、横と縦の増え方が変わる</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">説明用の例：車の中心は横140・縦110。この1回に進む距離を2とします。</text><rect id="direction-0" x="40" y="155" width="350" height="460" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="215" y="202" font-size="29" text-anchor="middle" fill="#20364b">右向き 0度</text><text x="215" y="243" font-size="27" text-anchor="middle" fill="#20364b">0</text><text x="215" y="505" font-size="24" text-anchor="middle" fill="#20364b">出発 横140・縦110</text><text x="215" y="553" font-size="24" text-anchor="middle" fill="#20364b">到着 横142・縦110</text><rect id="direction-1" x="435" y="155" width="350" height="460" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="610" y="202" font-size="29" text-anchor="middle" fill="#20364b">下向き 90度</text><text x="610" y="243" font-size="27" text-anchor="middle" fill="#20364b">Math.PI/2</text><text x="610" y="505" font-size="24" text-anchor="middle" fill="#20364b">出発 横140・縦110</text><text x="610" y="553" font-size="24" text-anchor="middle" fill="#20364b">到着 横140・縦112</text><rect id="direction-2" x="830" y="155" width="350" height="460" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><text x="1005" y="202" font-size="29" text-anchor="middle" fill="#20364b">左向き 180度</text><text x="1005" y="243" font-size="27" text-anchor="middle" fill="#20364b">Math.PI</text><text x="1005" y="505" font-size="24" text-anchor="middle" fill="#20364b">出発 横140・縦110</text><text x="1005" y="553" font-size="24" text-anchor="middle" fill="#20364b">到着 横138・縦110</text><circle id="right-start" cx="115" cy="350" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M135 350L220 350" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="car-right" x="235" y="325" width="80" height="50" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><rect id="car-right-window" x="280" y="333" width="18" height="34" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><path d="M250 318H268 M295 318H310 M250 382H268 M295 382H310" fill="none" stroke="#34495e" stroke-width="6"/><circle id="car-right-center" cx="275" cy="350" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="180" y="307" font-size="26" text-anchor="middle" fill="#20364b">距離2</text><circle id="down-start" cx="610" cy="285" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M610 306L610 353" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="car-down" x="585" y="367" width="50" height="80" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><rect id="car-down-window" x="593" y="412" width="34" height="18" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><path d="M578 382V400 M642 382V400 M578 427V442 M642 427V442" fill="none" stroke="#34495e" stroke-width="6"/><circle id="car-down-center" cx="610" cy="407" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="702" y="351" font-size="26" text-anchor="middle" fill="#20364b">距離2</text><circle id="left-start" cx="1110" cy="350" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M1090 350L1005 350" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="car-left" x="915" y="325" width="80" height="50" rx="10" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><rect id="car-left-window" x="932" y="333" width="18" height="34" rx="0" fill="#fff" stroke="#28629e" stroke-width="3"/><path d="M930 318H948 M975 318H990 M930 382H948 M975 382H990" fill="none" stroke="#34495e" stroke-width="6"/><circle id="car-left-center" cx="955" cy="350" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><text x="1045" y="307" font-size="26" text-anchor="middle" fill="#20364b">距離2</text><text x="48" y="708" font-size="21" text-anchor="start" fill="#20364b">右へ進むと横＋2、下へ進むと縦＋2、左へ進むと横−2です。</text><text x="48" y="744" font-size="21" text-anchor="start" fill="#20364b">画面では下へ行くほど縦が増えます。0・Math.PI/2・Math.PIはそれぞれの向きの値です。</text><text x="48" y="780" font-size="21" text-anchor="start" fill="#20364b">模式図：移動を見分けやすく拡大しています。実際の時間あたりの速さを示す図ではありません。</text></svg>