<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc" lang="ja"><title id="title">背景：余白を作る？ はみ出しを切る？</title><desc id="desc">背景：余白を作る？ はみ出しを切る？基本3 ／ 比率を保ったまま、中央をそろえる2つの方法。図はゲーム内の寸法の半分。左右100・上下75の単位はpxです。右図の薄い上下部分はCanvas外を説明するために表示。実画面では見えません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="830" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">背景：余白を作る？ はみ出しを切る？</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 比率を保ったまま、中央をそろえる2つの方法。</text><text x="260" y="185" font-size="28" text-anchor="middle" fill="#20364b">contain：全部を収める</text><text x="740" y="185" font-size="28" text-anchor="middle" fill="#20364b">cover：画面を埋める</text><rect id="contain-frame" x="60" y="300" width="400" height="225" rx="0" fill="#e4eaf0" stroke="#34495e" stroke-width="3"/><g transform="translate(110 300) scale(0.375)" ><rect width="800" height="600" fill="#b9e5f5"/><circle cx="665" cy="62" r="38" fill="#ffdb73"/><g fill="#fff8ed"><ellipse cx="95" cy="65" rx="55" ry="23"/><ellipse cx="140" cy="70" rx="50" ry="19"/><circle cx="105" cy="55" r="25"/></g><g fill="#fff8ed"><ellipse cx="365" cy="130" rx="55" ry="23"/><ellipse cx="410" cy="135" rx="50" ry="19"/><circle cx="375" cy="120" r="25"/></g><path d="M0 360Q120 205 280 365Q420 225 590 365Q700 270 800 340V600H0Z" fill="#91c597"/><path d="M0 415Q180 300 380 420Q580 315 800 420V600H0Z" fill="#64aa7d"/><path d="M0 475Q200 455 400 475Q620 495 800 470V600H0Z" fill="#e7cd94"/><path d="M0 480Q200 460 400 480Q620 500 800 475" fill="none" stroke="#477b54" stroke-width="10"/><path d="M90 565v-20" stroke="#477b54" stroke-width="4"/><circle cx="83" cy="540" r="7" fill="#f49685"/><circle cx="97" cy="540" r="7" fill="#f49685"/><circle cx="90" cy="533" r="7" fill="#f49685"/><circle cx="90" cy="542" r="5" fill="#ffdc72"/><path d="M240 595v-20" stroke="#477b54" stroke-width="4"/><circle cx="233" cy="570" r="7" fill="#f49685"/><circle cx="247" cy="570" r="7" fill="#f49685"/><circle cx="240" cy="563" r="7" fill="#f49685"/><circle cx="240" cy="572" r="5" fill="#ffdc72"/><path d="M540 575v-20" stroke="#477b54" stroke-width="4"/><circle cx="533" cy="550" r="7" fill="#f49685"/><circle cx="547" cy="550" r="7" fill="#f49685"/><circle cx="540" cy="543" r="7" fill="#f49685"/><circle cx="540" cy="552" r="5" fill="#ffdc72"/><path d="M715 590v-20" stroke="#477b54" stroke-width="4"/><circle cx="708" cy="565" r="7" fill="#f49685"/><circle cx="722" cy="565" r="7" fill="#f49685"/><circle cx="715" cy="558" r="7" fill="#f49685"/><circle cx="715" cy="567" r="5" fill="#ffdc72"/></g><g transform="translate(540 262.5) scale(0.5)" opacity="0.25"><rect width="800" height="600" fill="#b9e5f5"/><circle cx="665" cy="62" r="38" fill="#ffdb73"/><g fill="#fff8ed"><ellipse cx="95" cy="65" rx="55" ry="23"/><ellipse cx="140" cy="70" rx="50" ry="19"/><circle cx="105" cy="55" r="25"/></g><g fill="#fff8ed"><ellipse cx="365" cy="130" rx="55" ry="23"/><ellipse cx="410" cy="135" rx="50" ry="19"/><circle cx="375" cy="120" r="25"/></g><path d="M0 360Q120 205 280 365Q420 225 590 365Q700 270 800 340V600H0Z" fill="#91c597"/><path d="M0 415Q180 300 380 420Q580 315 800 420V600H0Z" fill="#64aa7d"/><path d="M0 475Q200 455 400 475Q620 495 800 470V600H0Z" fill="#e7cd94"/><path d="M0 480Q200 460 400 480Q620 500 800 475" fill="none" stroke="#477b54" stroke-width="10"/><path d="M90 565v-20" stroke="#477b54" stroke-width="4"/><circle cx="83" cy="540" r="7" fill="#f49685"/><circle cx="97" cy="540" r="7" fill="#f49685"/><circle cx="90" cy="533" r="7" fill="#f49685"/><circle cx="90" cy="542" r="5" fill="#ffdc72"/><path d="M240 595v-20" stroke="#477b54" stroke-width="4"/><circle cx="233" cy="570" r="7" fill