 cx="240" cy="572" r="5" fill="#ffdc72"/><path d="M540 575v-20" stroke="#477b54" stroke-width="4"/><circle cx="533" cy="550" r="7" fill="#f49685"/><circle cx="547" cy="550" r="7" fill="#f49685"/><circle cx="540" cy="543" r="7" fill="#f49685"/><circle cx="540" cy="552" r="5" fill="#ffdc72"/><path d="M715 590v-20" stroke="#477b54" stroke-width="4"/><circle cx="708" cy="565" r="7" fill="#f49685"/><circle cx="722" cy="565" r="7" fill="#f49685"/><circle cx="715" cy="558" r="7" fill="#f49685"/><circle cx="715" cy="567" r="5" fill="#ffdc72"/></g></g><rect id="cover-frame" x="540" y="300" width="400" height="225" rx="0" fill="none" stroke="#34495e" stroke-width="3"/><text x="260" y="270" font-size="25" text-anchor="middle" fill="#20364b">表示サイズ 600 × 450</text><text x="740" y="245" font-size="25" text-anchor="middle" fill="#20364b">表示サイズ 800 × 600</text><text x="85" y="575" font-size="23" text-anchor="middle" fill="#20364b">左100</text><text x="435" y="575" font-size="23" text-anchor="middle" fill="#20364b">右100</text><text x="740" y="600" font-size="27" text-anchor="middle" fill="#20364b">上75・下75を切り取る</text><text x="500" y="675" font-size="27" text-anchor="middle" fill="#20364b">元画像800×600 → Canvas 800×450。Cで切り替え。</text><text x="40" y="766" font-size="19" text-anchor="start" fill="#20364b">図はゲーム内の寸法の半分。左右100・上下75の単位はpxです。</text><text x="40" y="798" font-size="19" text-anchor="start" fill="#20364b">右図の薄い上下部分はCanvas外を説明するために表示。実画面では見えません。</text></svg>