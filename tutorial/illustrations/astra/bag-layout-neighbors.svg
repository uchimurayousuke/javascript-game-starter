<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc" lang="ja"><title id="title">2辺で接しても、AとBの組は1組だけ</title><desc id="desc">L字の道具Aは0,0と0,1と1,1、道具Bは1,0。AとBは2辺を共有するが隣接は1組。道具Cは2,2で斜めに近いだけ。道具3個で6点、隣接1組で3点、合計9点。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1F3D5B"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="1040" rx="12" fill="#FFF8E8" stroke="#1F3D5B" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#1F3D5B">2辺で接しても、AとBの組は1組だけ</text><text x="40" y="110" font-size="27" text-anchor="start" fill="#1F3D5B">A・B・Cは道具の名前。Aは3マスで1個の道具です。</text><text x="82" y="300" font-size="23" text-anchor="end" fill="#1F3D5B">y=0</text><text x="165" y="200" font-size="24" text-anchor="middle" fill="#1F3D5B">x=0</text><rect x="100" y="225" width="130" height="130" rx="0" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><text x="165" y="275" font-size="32" text-anchor="middle" fill="#1F3D5B">A</text><text x="165" y="325" font-size="25" text-anchor="middle" fill="#1F3D5B">(0,0)</text><text x="295" y="200" font-size="24" text-anchor="middle" fill="#1F3D5B">x=1</text><rect x="230" y="225" width="130" height="130" rx="0" fill="#FFD35A" stroke="#1F3D5B" stroke-width="2"/><text x="295" y="275" font-size="32" text-anchor="middle" fill="#1F3D5B">B</text><text x="295" y="325" font-size="25" text-anchor="middle" fill="#1F3D5B">(1,0)</text><text x="425" y="200" font-size="24" text-anchor="middle" fill="#1F3D5B">x=2</text><rect x="360" y="225" width="130" height="130" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="425" y="275" font-size="32" text-anchor="middle" fill="#1F3D5B">空</text><text x="425" y="325" font-size="25" text-anchor="middle" fill="#1F3D5B">(2,0)</text><text x="82" y="430" font-size="23" text-anchor="end" fill="#1F3D5B">y=1</text><rect x="100" y="355" width="130" height="130" rx="0" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><text x="165" y="405" font-size="32" text-anchor="middle" fill="#1F3D5B">A</text><text x="165" y="455" font-size="25" text-anchor="middle" fill="#1F3D5B">(0,1)</text><rect x="230" y="355" width="130" height="130" rx="0" fill="#B6D8F2" stroke="#1F3D5B" stroke-width="2"/><text x="295" y="405" font-size="32" text-anchor="middle" fill="#1F3D5B">A</text><text x="295" y="455" font-size="25" text-anchor="middle" fill="#1F3D5B">(1,1)</text><rect x="360" y="355" width="130" height="130" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="425" y="405" font-size="32" text-anchor="middle" fill="#1F3D5B">空</text><text x="425" y="455" font-size="25" text-anchor="middle" fill="#1F3D5B">(2,1)</text><text x="82" y="560" font-size="23" text-anchor="end" fill="#1F3D5B">y=2</text><rect x="100" y="485" width="130" height="130" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="165" y="535" font-size="32" text-anchor="middle" fill="#1F3D5B">空</text><text x="165" y="585" font-size="25" text-anchor="middle" fill="#1F3D5B">(0,2)</text><rect x="230" y="485" width="130" height="130" rx="0" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="295" y="535" font-size="32" text-anchor="middle" fill="#1F3D5B">空</text><text x="295" y="585" font-size="25" text-anchor="middle" fill="#1F3D5B">(1,2)</text><rect x="360" y="485" width="130" height="130" rx="0" fill="#E7F0DF" stroke="#1F3D5B" stroke-width="2"/><text x="425" y="535" font-size="32" text-anchor="middle" fill="#1F3D5B">C</text><text x="425" y="585" font-size="25" text-anchor="middle" fill="#1F3D5B">(2,2)</text><path d="M230 225V355H360" fill="none" stroke="#146BB5" stroke-width="9"/><path d="M340 465 L380 505" fill="none" stroke="#1F3D5B" stroke-width="3" stroke-dasharray="7 6"/><path d="M350 475L370 495M370 475L350 495" fill="none" stroke="#1F3D5B" stroke-width="4"/><text x="600" y="210" font-size="27" text-anchor="start" fill="#1F3D5B">AとB：太い青線の2辺で接する</text><rect x="600" y="245" width="550" height="135" rx="12" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="2"/><text x="625" y="290" font-size="29" text-anchor="start" fill="#1F3D5B">道具の組は A−B の1組</text><text x="625" y="345" font-size="29" text-anchor="start" fill="#1F3D5B">隣接の加点：1 × 3 ＝ 3点</text><text x="600" y="445" font-size="28" text-anchor="start" fill="#1F3D5B">AとC：斜めだけ → 隣接なし</text><text x="600" y="500" font-size="28" text-anchor="start" fill="#1F3D5B">BとC：辺を共有しない</text><text x="600" y="555" font-size="25" text-anchor="start" fill="#1F3D5B">Cを置いても隣接の加点は増えない</text><rect x="40" y="685" width="1120" height="205" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="65" y="735" font-size="31" text-anchor="start" fill="#1F3D5B">道具3個 × 2点 ＝ 6点</text><text x="65" y="795" font-size="31" text-anchor="start" fill="#1F3D5B">隣接1組 × 3点 ＝ 3点</text><text x="815" y="790" font-size="43" text-anchor="middle" fill="#1F3D5B">合計9点</text><text x="65" y="855" font-size="26" text-anchor="start" fill="#1F3D5B">マスの数ではなく、道具の個数と、接する組数を数えます。</text><text x="40" y="950" font-size="24" text-anchor="start" fill="#1F3D5B">太い青線＝辺で接する場所。点線と×＝斜めだけで、隣接には数えない。</text><text x="40" y="1000" font-size="23" text-anchor="start" fill="#1F3D5B">6列×4行の盤面のうち、列0〜2・行0〜2を抜粋。番号は0からです。</text></svg>