<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc" lang="ja"><title id="title">イベント：関数を渡しておき、クリックの後で動かす</title><desc id="desc">登録時のpointsは0。click用の関数を渡しておく。1回目のクリックでpoints1と表示1、2回目でpoints2と表示2になる。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="880" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">イベント：関数を渡しておき、クリックの後で動かす</text><text x="40" y="110" font-size="29" text-anchor="start" fill="#20364b">button.addEventListener(&quot;click&quot;, () =&gt; { … });</text><rect x="60" y="150" width="1080" height="120" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="82" y="192" font-size="26" text-anchor="start" fill="#20364b">① ページを開く：関数を登録する</text><text x="82" y="245" font-size="30" text-anchor="start" fill="#20364b">points = 0 ／ 登録だけでは得点を増やさない</text><path d="M600 285 L600 330" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="315" font-size="25" text-anchor="start" fill="#20364b">クリックを待つ</text><rect x="60" y="350" width="350" height="155" rx="12" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="82" y="392" font-size="26" text-anchor="start" fill="#20364b">② 1回目のクリック</text><text x="82" y="445" font-size="30" text-anchor="start" fill="#20364b">ボタン #add</text><rect x="470" y="350" width="670" height="155" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="492" y="392" font-size="26" text-anchor="start" fill="#20364b">渡しておいた関数を実行</text><text x="492" y="445" font-size="30" text-anchor="start" fill="#20364b">points += 1 → 0 + 1 = 1</text><path d="M425 425 L455 425" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="495" y="480" font-size="25" text-anchor="start" fill="#20364b">score.textContent = points → 表示1</text><path d="M600 520 L600 575" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="555" font-size="25" text-anchor="start" fill="#20364b">次のクリック</text><rect x="60" y="595" width="350" height="155" rx="12" fill="#ffedcc" stroke="#607a90" stroke-width="2"/><text x="82" y="637" font-size="26" text-anchor="start" fill="#20364b">③ 2回目のクリック</text><text x="82" y="690" font-size="30" text-anchor="start" fill="#20364b">ボタン #add</text><rect x="470" y="595" width="670" height="155" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="492" y="637" font-size="26" text-anchor="start" fill="#20364b">もう一度、同じ関数を実行</text><text x="492" y="690" font-size="30" text-anchor="start" fill="#20364b">points += 1 → 1 + 1 = 2</text><path d="M425 670 L455 670" fill="none" stroke="#20364b" stroke-width="3" marker-end="url(#arrow)"/><text x="495" y="725" font-size="25" text-anchor="start" fill="#20364b">score.textContent = points → 表示2</text><text x="40" y="820" font-size="24" text-anchor="start" fill="#20364b">#addはボタン、#scoreは得点を表示するp。矢印は出来事の順番です。</text></svg>