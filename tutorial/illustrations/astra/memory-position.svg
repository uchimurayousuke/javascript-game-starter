<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="895" viewBox="0 0 1200 895" role="img" aria-labelledby="title desc" lang="ja"><title id="title">クリックした場所は、何番のカード？</title><desc id="desc">クリックした場所は、何番のカード？行・列・配列の番号は、どれも0から数えます。カード内の数字は説明用です。左上は横160・縦90。カードは幅100・高さ110、横へ120・縦へ130ずつ並びます。クリックした横410・縦245は、列2・行1にある番号6のカードの中です。1.5倍の拡大図です。カード間のすき間はカードに含めず、クリックしても選びません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="895" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">クリックした場所は、何番のカード？</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">行・列・配列の番号は、どれも0から数えます。カード内の数字は説明用です。</text><text x="180" y="173" font-size="27" text-anchor="start" fill="#20364b">横の列番号 →</text><text x="255" y="218" font-size="27" text-anchor="middle" fill="#20364b">列0</text><text x="435" y="218" font-size="27" text-anchor="middle" fill="#20364b">列1</text><text x="615" y="218" font-size="27" text-anchor="middle" fill="#20364b">列2</text><text x="795" y="218" font-size="27" text-anchor="middle" fill="#20364b">列3</text><text x="100" y="320" font-size="29" text-anchor="middle" fill="#20364b">行0</text><rect id="card-0" x="180" y="250" width="150" height="165" rx="9" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="255" y="351" font-size="47" text-anchor="middle" fill="#20364b">0</text><rect id="card-1" x="360" y="250" width="150" height="165" rx="9" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="435" y="351" font-size="47" text-anchor="middle" fill="#20364b">1</text><rect id="card-2" x="540" y="250" width="150" height="165" rx="9" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="615" y="351" font-size="47" text-anchor="middle" fill="#20364b">2</text><rect id="card-3" x="720" y="250" width="150" height="165" rx="9" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="795" y="351" font-size="47" text-anchor="middle" fill="#20364b">3</text><text x="100" y="515" font-size="29" text-anchor="middle" fill="#20364b">行1</text><rect id="card-4" x="180" y="445" width="150" height="165" rx="9" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="255" y="546" font-size="47" text-anchor="middle" fill="#20364b">4</text><rect id="card-5" x="360" y="445" width="150" height="165" rx="9" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="435" y="546" font-size="47" text-anchor="middle" fill="#20364b">5</text><rect id="card-6" x="540" y="445" width="150" height="165" rx="9" fill="#fff3cf" stroke="#aa7a20" stroke-width="3"/><text x="615" y="546" font-size="47" text-anchor="middle" fill="#20364b">6</text><rect id="card-7" x="720" y="445" width="150" height="165" rx="9" fill="#c9dff5" stroke="#28629e" stroke-width="3"/><text x="795" y="546" font-size="47" text-anchor="middle" fill="#20364b">7</text><circle id="click-point" cx="555" cy="482.5" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><path d="M555 475V430H850V400H900" fill="none" stroke="#34495e" stroke-width="3"/><text x="915" y="388" font-size="27" text-anchor="start" fill="#20364b">クリック</text><text x="915" y="435" font-size="29" text-anchor="start" fill="#20364b">横410</text><text x="915" y="480" font-size="29" text-anchor="start" fill="#20364b">縦245</text><text x="600" y="665" font-size="32" text-anchor="middle" fill="#20364b">列2・行1のカード → 配列の番号6</text><text x="600" y="716" font-size="27" text-anchor="middle" fill="#20364b">1行に4枚。先に1行ぶんの4枚 ＋ 横に2枚 ＝ 6</text><text x="48" y="788" font-size="21" text-anchor="start" fill="#20364b">左上は横160・縦90。カードは幅100・高さ110、横へ120・縦へ130ずつ並びます。</text><text x="48" y="824" font-size="21" text-anchor="start" fill="#20364b">クリックした横410・縦245は、列2・行1にある番号6のカードの中です。</text><text x="48" y="860" font-size="21" text-anchor="start" fill="#20364b">1.5倍の拡大図です。カード間のすき間はカードに含めず、クリックしても選びません。</text></svg>