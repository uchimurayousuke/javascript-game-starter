<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc" lang="ja"><title id="title">入力済みの数で「次の文字」が分かる</title><desc id="desc">入力済みの数で「次の文字」が分かる。単語は cat。文字の番号は0・1・2、入力済みの数は0から3へ。緑の文字は入力済み。黄色の文字が次に入力する文字です。入力済みが3になったら終わり。「番号3の文字」を探す必要はありません。模式図：同じ単語を、入力が進む4つの場面に分けています。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="980" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">入力済みの数で「次の文字」が分かる</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">単語は cat。文字の番号は0・1・2、入力済みの数は0から3へ。</text><text x="72" y="227" font-size="28" text-anchor="start" fill="#20364b">入力済み 0文字</text><rect id="row-0-letter-0" x="415" y="175" width="110" height="88" rx="0" fill="#fff0be" stroke="#7b91aa" stroke-width="3"/><text x="470" y="237" font-size="52" text-anchor="middle" fill="#20364b">c</text><text x="470" y="293" font-size="22" text-anchor="middle" fill="#20364b">番号0</text><rect id="row-0-letter-1" x="555" y="175" width="110" height="88" rx="0" fill="#f0f3f7" stroke="#7b91aa" stroke-width="3"/><text x="610" y="237" font-size="52" text-anchor="middle" fill="#20364b">a</text><text x="610" y="293" font-size="22" text-anchor="middle" fill="#20364b">番号1</text><rect id="row-0-letter-2" x="695" y="175" width="110" height="88" rx="0" fill="#f0f3f7" stroke="#7b91aa" stroke-width="3"/><text x="750" y="237" font-size="52" text-anchor="middle" fill="#20364b">t</text><text x="750" y="293" font-size="22" text-anchor="middle" fill="#20364b">番号2</text><text x="955" y="233" font-size="30" text-anchor="middle" fill="#20364b">次は c</text><path d="M285 260L285 310" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="72" y=