<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" lang="ja"><title id="title">無敵の期限まで待つ。1000msなら再び被弾できる</title><desc id="desc">最初の被弾時刻を0msとするとHP3から2、無敵期限1000ms。999msでXを押してもHP2。1000msにXを押すとHP1になり、新たな無敵期限は2000ms。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="850" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="33" text-anchor="start" fill="#20364b">無敵の期限まで待つ。1000msなら再び被弾できる</text><text x="40" y="110" font-size="27" text-anchor="start" fill="#20364b">最初の被弾を0msとした例。無敵の長さは1000ms＝1秒。</text><rect x="40" y="165" width="340" height="330" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="210" y="215" font-size="34" text-anchor="middle" fill="#20364b">0ms</text><text x="65" y="280" font-size="34" text-anchor="start" fill="#20364b">HP 3 → 2</text><text x="65" y="345" font-size="25" text-anchor="start" fill="#20364b">X：ダメージを受ける</text><text x="65" y="415" font-size="26" text-anchor="start" fill="#20364b">期限1000ms</text><text x="65" y="465" font-size="25" text-anchor="start" fill="#20364b">無敵を開始</text><rect x="430" y="165" width="340" height="330" rx="12" fill="#e7efff" stroke="#607a90" stroke-width="2"/><text x="600" y="215" font-size="34" text-anchor="middle" fill="#20364b">999ms</text><text x="455" y="280" font-size="34" text-anchor="start" fill="#20364b">HP 2 → 2</text><text x="455" y="345" font-size="25" text-anchor="start" fill="#20364b">X：ダメージなし</text><text x="455" y="415" font-size="26" text-anchor="start" fill="#20364b">期限1000ms</text><text x="455" y="465" font-size="25" text-anchor="start" fill="#20364b">まだ期限前</text><rect x="820" y="165" width="340" height="330" rx="12" fill="#fff0e7" stroke="#607a90" stroke-width="2"/><text x="990" y="215" font-size="34" text-anchor="middle" fill="#20364b">1000ms</text><text x="845" y="280" font-size="34" text-anchor="start" fill="#20364b">HP 2 → 1</text><text x="845" y="345" font-size="25" text-anchor="start" fill="#20364b">X：再び受ける</text><text x="845" y="415" font-size="26" text-anchor="start" fill="#20364b">次の期限2000ms</text><text x="845" y="465" font-size="25" text-anchor="start" fill="#20364b">新たに無敵を開始</text><rect x="40" y="545" width="1120" height="125" rx="12" fill="#e9f3e9" stroke="#607a90" stroke-width="2"/><text x="65" y="590" font-size="29" text-anchor="start" fill="#20364b">now ≧ immuneUntil のときだけ受ける。</text><text x="65" y="640" font-size="27" text-anchor="start" fill="#20364b">999 ＜ 1000 は期限前。1000 ≧ 1000 は期限に到達。</text><text x="40" y="730" font-size="25" text-anchor="start" fill="#20364b">無敵中は200msごとに点滅。見え方が変わってもHPは減りません。</text><text x="40" y="795" font-size="23" text-anchor="start" fill="#20364b">RはHP3・無敵期限0へ。3つの箱は境界の比較で、時間幅を表しません。</text></svg>