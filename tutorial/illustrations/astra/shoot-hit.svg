<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc" lang="ja"><title id="title">シューティングは「端だけ」では当たらない</title><desc id="desc">シューティングは「端だけ」では当たらない。更新した後の位置で比較。弾の右が、敵の左105を越えたかな？8倍の拡大図。左の重なりは1、右の重なりは0です。弾の下112は敵の上105より下。ほかの3つの位置条件も満たします。まだ当たっていない弾と敵が対象です。端が等しいだけでは &gt; は成立しません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1200" height="880" rx="24" fill="#fffdf8"/><text x="48" y="62" font-size="36" text-anchor="start" fill="#20364b">シューティングは「端だけ」では当たらない</text><text x="48" y="108" font-size="25" text-anchor="start" fill="#20364b">更新した後の位置で比較。弾の右が、敵の左105を越えたかな？</text><rect id="case-100" x="40" y="150" width="550" height="520" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="enemy-100" x="230" y="330" width="240" height="240" rx="0" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><rect id="bullet-100" x="190" y="290" width="48" height="96" rx="0" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="350" y="439" font-size="32" text-anchor="middle" fill="#20364b">敵</text><text x="350" y="478" font-size="25" text-anchor="middle" fill="#20364b">左105・上105</text><text x="350" y="518" font-size="24" text-anchor="middle" fill="#20364b">幅30・高さ30</text><text x="90" y="204" font-size="27" text-anchor="start" fill="#20364b">弾の左100・上100</text><path d="M190 290V220" fill="none" stroke="#34495e" stroke-width="3"/><text x="340" y="258" font-size="29" text-anchor="middle" fill="#20364b">弾の右106</text><path d="M238 290V268H310" fill="none" stroke="#34495e" stroke-width="3"/><text x="90" y="429" font-size="27" text-anchor="start" fill="#20364b">弾</text><path d="M190 374 150 416" fill="none" stroke="#34495e" stroke-width="3"/><text x="90" y="469" font-size="23" text-anchor="start" fill="#20364b">幅6</text><text x="90" y="507" font-size="23" text-anchor="start" fill="#20364b">高さ12</text><text x="315" y="617" font-size="28" text-anchor="middle" fill="#20364b">1だけ重なる → 当たり！</text><text x="315" y="721" font-size="30" text-anchor="middle" fill="#20364b">106 &gt; 105 は ○</text><rect id="case-99" x="640" y="150" width="550" height="520" rx="18" fill="#f0f7fc" stroke="#cedce8" stroke-width="3"/><rect id="enemy-99" x="830" y="330" width="240" height="240" rx="0" fill="#ffe0e5" stroke="#ad334b" stroke-width="3"/><rect id="bullet-99" x="782" y="290" width="48" height="96" rx="0" fill="#ffe29a" stroke="#936315" stroke-width="3"/><text x="950" y="439" font-size="32" text-anchor="middle" fill="#20364b">敵</text><text x="950" y="478" font-size="25" text-anchor="middle" fill="#20364b">左105・上105</text><text x="950" y="518" font-size="24" text-anchor="middle" fill="#20364b">幅30・高さ30</text><text x="690" y="204" font-size="27" text-anchor="start" fill="#20364b">弾の左99・上100</text><path d="M782 290V220" fill="none" stroke="#34495e" stroke-width="3"/><text x="940" y="258" font-size="29" text-anchor="middle" fill="#20364b">弾の右105</text><path d="M830 290V268H910" fill="none" stroke="#34495e" stroke-width="3"/><text x="690" y="429" font-size="27" text-anchor="start" fill="#20364b">弾</text><path d="M782 374 750 416" fill="none" stroke="#34495e" stroke-width="3"/><text x="690" y="469" font-size="23" text-anchor="start" fill="#20364b">幅6</text><text x="690" y="507" font-size="23" text-anchor="start" fill="#20364b">高さ12</text><text x="915" y="617" font-size="28" text-anchor="middle" fill="#20364b">端だけ触れる → 当たらない</text><text x="915" y="721" font-size="30" text-anchor="middle" fill="#20364b">105 &gt; 105 は ×</text><text x="48" y="773" font-size="21" text-anchor="start" fill="#20364b">8倍の拡大図。左の重なりは1、右の重なりは0です。</text><text x="48" y="809" font-size="21" text-anchor="start" fill="#20364b">弾の下112は敵の上105より下。ほかの3つの位置条件も満たします。</text><text x="48" y="845" font-size="21" text-anchor="start" fill="#20364b">まだ当たっていない弾と敵が対象です。端が等しいだけでは &gt; は成立しません。</text></svg>