<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc" lang="ja"><title id="title">暗転：真っ暗になってから場面を替える</title><desc id="desc">暗転：真っ暗になってから場面を替える。基本3 ／ 黒い幕の不透明度を 0 → 1 → 0 に変えます。3つの代表状態を並べた模式図。実際には更新ごとに少しずつ暗さが変わります。不透明度1で場面を切り替え、その次の更新から明るくしていきます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="800" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">暗転：真っ暗になってから場面を替える</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 黒い幕の不透明度を 0 → 1 → 0 に変えます。</text><rect id="scene0" x="60" y="230" width="270" height="200" rx="14" fill="#dcecca" stroke="#708391" stroke-width="3"/><text x="195" y="300" font-size="32" text-anchor="middle" fill="#20364b">画面A</text><text x="195" y="365" font-size="27" text-anchor="middle" fill="#20364b">不透明度 0</text><text x="195" y="475" font-size="26" text-anchor="middle" fill="#20364b">見えている</text><path d="M335 330L365 330" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="scene1" x="370" y="230" width="270" height="200" rx="14" fill="#26334a" stroke="#708391" stroke-width="3"/><text x="505" y="300" font-size="32" text-anchor="middle" fill="#fff">真っ暗</text><text x="505" y="365" font-size="27" text-anchor="middle" fill="#fff">不透明度 1</text><text x="505" y="475" font-size="26" text-anchor="middle" fill="#20364b">この瞬間にBへ</text><path d="M645 330L675 330" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><rect id="scene2" x="680" y="230" width="270" height="200" rx="14" fill="#dce8ef" stroke="#708391" stroke-width="3"/><text x="815" y="300" font-size="32" text-anchor="middle" fill="#20364b">画面B</text><text x="815" y="365" font-size="27" text-anchor="middle" fill="#20364b">不透明度 0</text><text x="815" y="475" font-size="26" text-anchor="middle" fill="#20364b">見えている</text><text x="350" y="205" font-size="24" text-anchor="middle" fill="#20364b">＋0.05ずつ</text><text x="660" y="205" font-size="24" text-anchor="middle" fill="#20364b">−0.05ずつ</text><rect id="guard" x="150" y="555" width="700" height="110" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="500.0" y="600" font-size="29" text-anchor="middle" fill="#20364b">Enterで暗転を始める</text><text x="500.0" y="643" font-size="23" text-anchor="middle" fill="#20364b">切り替え中のEnterは受け付けない</text><text x="40" y="736" font-size="19" text-anchor="start" fill="#20364b">3つの代表状態を並べた模式図。実際には更新ごとに少しずつ暗さが変わります。</text><text x="40" y="768" font-size="19" text-anchor="start" fill="#20364b">不透明度1で場面を切り替え、その次の更新から明るくしていきます。</text></svg>