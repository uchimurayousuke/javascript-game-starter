<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc" lang="ja"><title id="title">画像の差し替え：読めてから表示する</title><desc id="desc">画像の差し替え：読めてから表示する。基本3 ／ 選んだ画像の状態を調べて、表示を切り替えます。読み込み状態の模式図です。矢印は非同期で届く成功・失敗の通知を表します。onload・onerrorを先に設定してからsrcを指定。準備できていない画像は描きません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="830" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">画像の差し替え：読めてから表示する</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 選んだ画像の状態を調べて、表示を切り替えます。</text><rect id="load" x="60" y="240" width="330" height="145" rx="16" fill="#f0f7fc" stroke="#a9bdcf" stroke-width="3"/><text x="225.0" y="285" font-size="29" text-anchor="middle" fill="#20364b">読み込み中</text><text x="225.0" y="328" font-size="23" text-anchor="middle" fill="#20364b">status = loading</text><text x="225" y="430" font-size="26" text-anchor="middle" fill="#20364b">画像はまだ描かない</text><rect id="ready" x="600" y="160" width="340" height="145" rx="16" fill="#d4efde" stroke="#a9bdcf" stroke-width="3"/><text x="770.0" y="205" font-size="29" text-anchor="middle" fill="#20364b">読み込み成功</text><text x="770.0" y="248" font-size="23" text-anchor="middle" fill="#20364b">status = ready</text><text x="770" y="350" font-size="25" text-anchor="middle" fill="#20364b">元の大きさで表示する</text><rect id="error" x="600" y="490" width="340" height="145" rx="16" fill="#ffe3d9" stroke="#a9bdcf" stroke-width="3"/><text x="770.0" y="535" font-size="29" text-anchor="middle" fill="#20364b">読み込み失敗</text><text x="770.0" y="578" font-size="23" text-anchor="middle" fill="#20364b">status = error</text><text x="770" y="680" font-size="25" text-anchor="middle" fill="#20364b">名前と場所を確認する</text><path d="M395 280 L480 280 L480 230 L595 230" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="490" y="205" font-size="23" text-anchor="start" fill="#20364b">onload</text><path d="M395 345 L480 345 L480 560 L595 560" fill="none" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/><text x="485" y="600" font-size="23" text-anchor="start" fill="#20364b">onerror</text><text x="225" y="535" font-size="23" text-anchor="middle" fill="#20364b">Spaceで画像を切り替え</text><text x="225" y="580" font-size="26" text-anchor="middle" fill="#20364b">Rで読み直す</text><text x="40" y="766" font-size="19" text-anchor="start" fill="#20364b">読み込み状態の模式図です。矢印は非同期で届く成功・失敗の通知を表します。</text><text x="40" y="798" font-size="19" text-anchor="start" fill="#20364b">onload・onerrorを先に設定してからsrcを指定。準備できていない画像は描きません。</text></svg>