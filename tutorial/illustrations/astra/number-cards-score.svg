<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc" lang="ja"><title id="title">カードの合計は同じ。道具の順番で倍率が変わる</title><desc id="desc">3枚の2,2,5は合計9。2つ同じ数字なので基本倍率2、得点18。発展の道具で倍率に1を足してから2倍すると倍率6で54点。2倍してから1を足すと倍率5で45点。どちらも数字の合計9は変わらない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1F3D5B"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="1260" rx="12" fill="#FFF8E8" stroke="#1F3D5B" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#1F3D5B">カードの合計は同じ。道具の順番で倍率が変わる</text><text x="40" y="115" font-size="29" text-anchor="start" fill="#1F3D5B">① 基本：カードの合計 × そろい方の倍率 ＝ 得点</text><rect x="80" y="160" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="145" y="255" font-size="61" text-anchor="middle" fill="#1F3D5B">2</text><rect x="250" y="160" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="315" y="255" font-size="61" text-anchor="middle" fill="#1F3D5B">2</text><rect x="420" y="160" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="485" y="255" font-size="61" text-anchor="middle" fill="#1F3D5B">5</text><path d="M90 340 L370 340" fill="none" stroke="#1F3D5B" stroke-width="3"/><path d="M90 328 L90 352" fill="none" stroke="#1F3D5B" stroke-width="3"/><path d="M370 328 L370 352" fill="none" stroke="#1F3D5B" stroke-width="3"/><text x="230" y="390" font-size="27" text-anchor="middle" fill="#1F3D5B">2つ同じ → 倍率2</text><rect x="650" y="160" width="500" height="230" rx="12" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="2"/><text x="675" y="205" font-size="28" text-anchor="start" fill="#1F3D5B">数字の合計</text><text x="900" y="275" font-size="37" text-anchor="middle" fill="#1F3D5B">2＋2＋5＝9</text><text x="675" y="345" font-size="25" text-anchor="start" fill="#1F3D5B">道具を使っても、この9は同じ</text><rect x="40" y="435" width="1120" height="105" rx="12" fill="#E7F0DF" stroke="#1F3D5B" stroke-width="2"/><text x="600" y="502" font-size="36" text-anchor="middle" fill="#1F3D5B">合計9 × 倍率2 ＝ 18点</text><text x="40" y="610" font-size="29" text-anchor="start" fill="#1F3D5B">② 発展：2つの道具の順番を比べる</text><text x="40" y="660" font-size="27" text-anchor="start" fill="#1F3D5B">どちらも倍率2から始め、変えるのは倍率だけです。</text><rect x="40" y="705" width="530" height="370" rx="12" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="2"/><rect x="610" y="705" width="550" height="370" rx="12" fill="#FFF0CE" stroke="#1F3D5B" stroke-width="2"/><text x="65" y="750" font-size="31" text-anchor="start" fill="#1F3D5B">先に＋1 → 次に×2</text><rect x="65" y="790" width="105" height="75" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="117" y="842" font-size="36" text-anchor="middle" fill="#1F3D5B">2</text><path d="M185 827 L230 827" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="207" y="895" font-size="25" text-anchor="middle" fill="#1F3D5B">＋1</text><rect x="245" y="790" width="105" height="75" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="297" y="842" font-size="36" text-anchor="middle" fill="#1F3D5B">3</text><path d="M365 827 L410 827" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="387" y="895" font-size="25" text-anchor="middle" fill="#1F3D5B">×2</text><rect x="425" y="790" width="105" height="75" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="477" y="842" font-size="36" text-anchor="middle" fill="#1F3D5B">6</text><text x="65" y="955" font-size="30" text-anchor="start" fill="#1F3D5B">倍率：(2＋1)×2＝6</text><text x="65" y="1030" font-size="30" text-anchor="start" fill="#1F3D5B">合計9 × 倍率6 ＝ 54点</text><text x="635" y="750" font-size="31" text-anchor="start" fill="#1F3D5B">先に×2 → 次に＋1</text><rect x="635" y="790" width="105" height="75" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="687" y="842" font-size="36" text-anchor="middle" fill="#1F3D5B">2</text><path d="M755 827 L800 827" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="777" y="895" font-size="25" text-anchor="middle" fill="#1F3D5B">×2</text><rect x="815" y="790" width="105" height="75" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="867" y="842" font-size="36" text-anchor="middle" fill="#1F3D5B">4</text><path d="M935 827 L980 827" fill="none" stroke="#1F3D5B" stroke-width="3" marker-end="url(#arrow)"/><text x="957" y="895" font-size="25" text-anchor="middle" fill="#1F3D5B">＋1</text><rect x="995" y="790" width="105" height="75" rx="12" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><text x="1047" y="842" font-size="36" text-anchor="middle" fill="#1F3D5B">5</text><text x="635" y="955" font-size="30" text-anchor="start" fill="#1F3D5B">倍率：2×2＋1＝5</text><text x="635" y="1030" font-size="30" text-anchor="start" fill="#1F3D5B">合計9 × 倍率5 ＝ 45点</text><text x="40" y="1150" font-size="27" text-anchor="start" fill="#1F3D5B">道具の順番が変わると倍率は6と5。得点は54点と45点になります。</text><text x="40" y="1215" font-size="23" text-anchor="start" fill="#1F3D5B">下の白い箱は倍率の変化です。カードの数字を書き換えているわけではありません。</text></svg>