<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" lang="ja"><title id="title">ZIPは2種類：教材を読む場所と、ゲームを作る場所</title><desc id="desc">教材一式のZIPを展開すると教材を開く.htmlと教材フォルダーがある。ひな型my-game.zipを展開すると作業用のmy-gameフォルダーにindex.html,style.css,script.jsがある。教材を読みながら作業用script.jsを編集しindex.htmlで確認する。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#20364b"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect x="0" y="0" width="1200" height="850" rx="24" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/><text x="40" y="58" font-size="32" text-anchor="start" fill="#20364b">ZIPは2種類：教材を読む場所と、ゲームを作る場所</text><rect x="40" y="115" width="540" height="635" rx="12" fill="#edf3f8" stroke="#657e91" stroke-width="2"/><rect x="620" y="115" width="540" height="635" rx="12" fill="#f0f5e6" stroke="#657e91" stroke-width="2"/><text x="65" y="165" font-size="30" text-anchor="start" fill="#20364b">① 教材を読む</text><text x="645" y="165" font-size="30" text-anchor="start" fill="#20364b">② 自分のゲームを作る</text><rect x="70" y="200" width="480" height="70" rx="12" fill="#ffffff" stroke="#657e91" stroke-width="2"/><text x="95" y="245" font-size="28" text-anchor="start" fill="#20364b">教材一式のZIP</text><text x="300" y="310" font-size="25" text-anchor="middle" fill="#20364b">展開する ↓</text><rect x="70" y="335" width="480" height="270" rx="12" fill="#ffffff" stroke="#657e91" stroke-width="2"/><text x="95" y="380" font-size="27" text-anchor="start" fill="#20364b">教材のフォルダー</text><text x="115" y="430" font-size="29" text-anchor="start" fill="#20364b">教材を開く.html</text><text x="115" y="480" font-size="25" text-anchor="start" fill="#20364b">tutorial / examples</text><text x="115" y="525" font-size="25" text-anchor="start" fill="#20364b">features / learning</text><text x="115" y="570" font-size="25" text-anchor="start" fill="#20364b">template など</text><text x="65" y="655" font-size="27" text-anchor="start" fill="#20364b">教材を開く.html を開く</text><text x="65" y="705" font-size="25" text-anchor="start" fill="#20364b">手順や見本をブラウザーで読む</text><rect x="650" y="200" width="480" height="70" rx="12" fill="#ffffff" stroke="#657e91" stroke-width="2"/><text x="675" y="245" font-size="28" text-anchor="start" fill="#20364b">ひな型 my-game.zip</text><text x="890" y="310" font-size="25" text-anchor="middle" fill="#20364b">展開する ↓</text><rect x="650" y="335" width="480" height="270" rx="12" fill="#ffffff" stroke="#657e91" stroke-width="2"/><text x="675" y="380" font-size="27" text-anchor="start" fill="#20364b">my-game フォルダー</text><text x="695" y="430" font-size="29" text-anchor="start" fill="#20364b">index.html</text><text x="695" y="480" font-size="29" text-anchor="start" fill="#20364b">style.css</text><text x="695" y="530" font-size="29" text-anchor="start" fill="#20364b">script.js</text><text x="675" y="580" font-size="24" text-anchor="start" fill="#20364b">3ファイルを同じ場所に置く</text><text x="645" y="655" font-size="27" text-anchor="start" fill="#20364b">script.js を編集して保存</text><text x="645" y="705" font-size="25" text-anchor="start" fill="#20364b">index.html を開いて動きを確認</text><text x="40" y="795" font-size="23" text-anchor="start" fill="#20364b">どちらもZIPを展開してから使います。フォルダー構成を示す模式図です。</text><text x="40" y="830" font-size="22" text-anchor="start" fill="#20364b">ひな型ZIPを使わない場合は、templateの3ファイルを作業用へコピーします。</text></svg>