<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc" lang="ja"><title id="title">Web教材からZIPをダウンロードして使う</title><desc id="desc">1、制作例や共通機能のページからひな型のZIPを保存する。2、ZIPを展開して作業用フォルダーを開く。3、同じ場所のindex.html、style.css、script.jsを使う。script.jsなどを編集して保存し、index.htmlをブラウザーで開いて再読み込みする。画像を使う教材ではassetsフォルダーも3ファイルと同じ場所に置く。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1F3D5B"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700;fill:#1F3D5B}.title{font-size:34px}.heading{font-size:29px}.body{font-size:27px}.note{font-size:24px}.number{font-size:30px;text-anchor:middle}.file{font-size:30px}</style></defs><rect width="1200" height="1000" rx="24" fill="#FFF8E8"/><text x="40" y="60" class="title">Web教材からZIPをダウンロードして使う</text><rect x="40" y="110" width="500" height="220" rx="18" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="2"/><circle cx="83" cy="156" r="25" fill="#FFD35A"/><text x="83" y="167" class="number">1</text><text x="125" y="167" class="heading">Web教材でダウンロード</text><text x="65" y="225" class="body">制作例や共通機能のページ</text><rect x="65" y="250" width="450" height="55" rx="10" fill="#FFFFFF" stroke="#146BB5" stroke-width="2"/><text x="290" y="288" class="body" text-anchor="middle">ひな型のZIPを保存する</text><path d="M558 220H622" fill="none" stroke="#1F3D5B" stroke-width="4" marker-end="url(#arrow)"/><rect x="650" y="110" width="510" height="220" rx="18" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="2"/><circle cx="693" cy="156" r="25" fill="#FFD35A"/><text x="693" y="167" class="number">2</text><text x="735" y="167" class="heading">ZIPを展開する</text><text x="675" y="225" class="body">展開した作業用フォルダーを開く</text><text x="675" y="286" class="note">ZIPの中では直接編集しません。</text><path d="M905 345V380H600V417" fill="none" stroke="#1F3D5B" stroke-width="4" marker-end="url(#arrow)"/><rect x="40" y="440" width="1120" height="485" rx="18" fill="#FFFFFF" stroke="#1F3D5B" stroke-width="2"/><circle cx="83" cy="486" r="25" fill="#FFD35A"/><text x="83" y="497" class="number">3</text><text x="125" y="497" class="heading">同じフォルダーの3ファイルを使う</text><rect x="65" y="530" width="330" height="145" rx="12" fill="#EAF5FB" stroke="#146BB5" stroke-width="2"/><text x="230" y="581" class="file" text-anchor="middle">index.html</text><text x="230" y="638" class="body" text-anchor="middle">ページの土台</text><rect x="435" y="530" width="330" height="145" rx="12" fill="#FFF8E8" stroke="#146BB5" stroke-width="2"/><text x="600" y="581" class="file" text-anchor="middle">style.css</text><text x="600" y="638" class="body" text-anchor="middle">色や配置などの見た目</text><rect x="805" y="530" width="330" height="145" rx="12" fill="#EAF5FB" stroke="#146BB5" stroke-width="2"/><text x="970" y="581" class="file" text-anchor="middle">script.js</text><text x="970" y="638" class="body" text-anchor="middle">ゲームの動きや描画</text><rect x="65" y="720" width="440" height="160" rx="12" fill="#EAF5FB" stroke="#1F3D5B" stroke-width="2"/><text x="90" y="765" class="heading">エディターで編集</text><text x="90" y="815" class="body">教材に合わせてコードを変える</text><text x="90" y="860" class="body">変更したら保存する</text><path d="M525 800H595" fill="none" stroke="#1F3D5B" stroke-width="4" marker-end="url(#arrow)"/><rect x="625" y="720" width="510" height="160" rx="12" fill="#FFF8E8" stroke="#1F3D5B" stroke-width="2"/><text x="650" y="765" class="heading">ブラウザーで動きを確認</text><text x="650" y="815" class="body">同じフォルダーのindex.htmlを開く</text><text x="650" y="860" class="body">保存後は再読み込みする</text><text x="40" y="975" class="note">画像を使う教材では、assetsフォルダーも3ファイルと同じ場所に置きます。</text></svg>
