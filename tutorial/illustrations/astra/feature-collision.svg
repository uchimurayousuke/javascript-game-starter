<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc" lang="ja"><title id="title">円と四角：最も近い点までの距離を見る</title><desc id="desc">円と四角：最も近い点までの距離を見る。基本3 ／ 円の中心が(370,225)まで右へ動いた場面。円・四角・距離を3倍に拡大。数値はゲーム内の座標と寸法です。四角の範囲へ中心座標を収めた点を求め、その点までの距離を半径と比べます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#34495e"/></marker><style>text{font-family:"Yu Gothic","Meiryo",sans-serif;font-weight:700}</style></defs><rect width="1000" height="830" fill="#fffdf8" rx="24"/><text x="40" y="60" font-size="32" text-anchor="start" fill="#20364b">円と四角：最も近い点までの距離を見る</text><text x="40" y="104" font-size="23" text-anchor="start" fill="#20364b">基本3 ／ 円の中心が(370,225)まで右へ動いた場面。</text><rect id="box" x="390" y="165" width="480" height="450" rx="0" fill="#e3edf5" stroke="#708391" stroke-width="3"/><text x="630" y="215" font-size="25" text-anchor="middle" fill="#20364b">四角の左上 (400,150)</text><circle id="ball" cx="300" cy="390" r="90" fill="#95c7ed" stroke="#28629e" stroke-width="3"/><circle id="center" cx="300" cy="390" r="5" fill="#20364b" stroke="#20364b" stroke-width="3"/><circle id="nearest" cx="390" cy="390" r="7" fill="#d14f37" stroke="#d14f37" stroke-width="3"/><path d="M300 390 L390 390" fill="none" stroke="#34495e" stroke-width="3"/><text x="345" y="365" font-size="25" text-anchor="middle" fill="#20364b">30px</text><text x="220" y="270" font-size="27" text-anchor="middle" fill="#20364b">円の中心</text><text x="220" y="310" font-size="27" text-anchor="middle" fill="#20364b">(370,225)</text><path d="M397 390 L490 390" fill="none" stroke="#34495e" stroke-width="3"/><text x="520" y="390" font-size="27" text-anchor="start" fill="#20364b">最も近い点</text><text x="520" y="435" font-size="27" text-anchor="start" fill="#20364b">(400,225)</text><text x="630" y="555" font-size="26" text-anchor="middle" fill="#20364b">四角：160 × 150px</text><text x="250" y="540" font-size="28" text-anchor="middle" fill="#20364b">半径30px</text><text x="500" y="680" font-size="28" text-anchor="middle" fill="#20364b">距離30px ≦ 半径30px なので「接触している」。</text><text x="40" y="766" font-size="19" text-anchor="start" fill="#20364b">円・四角・距離を3倍に拡大。数値はゲーム内の座標と寸法です。</text><text x="40" y="798" font-size="19" text-anchor="start" fill="#20364b">四角の範囲へ中心座標を収めた点を求め、その点までの距離を半径と比べます。</text></svg>